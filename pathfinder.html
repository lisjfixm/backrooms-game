// 構建鄰接表
function buildGraph() {
  const graph = {};
  for (const c of CONNECTIONS) {
    if (!graph[c.from]) graph[c.from] = [];
    if (!graph[c.to]) graph[c.to] = [];
    graph[c.from].push({ to:c.to, method:c.method, rare:!!c.rare });
  }
  return graph;
}

const GRAPH = buildGraph();

// 填充 datalist
function initLevelList() {
  const dl = document.getElementById('level-list');
  const levels = Object.keys(GRAPH).sort((a,b) => {
    if (a === 'hub') return 1;
    if (b === 'hub') return -1;
    return parseInt(a) - parseInt(b);
  });
  dl.innerHTML = levels.map(l => `<option value="${l}">Level ${l}${LEVEL_INFO[l]?' — '+LEVEL_INFO[l].name:''}</option>`).join('');
}
initLevelList();

// 取得層級的危險權重（用於最安全路線）
function getDanger(level) {
  const info = LEVEL_INFO[level];
  if (!info) return 3;
  const c = info.class;
  if (typeof c === 'number') return c;
  const map = { 'habitable':0, '宜居':0, 'deadzone':5, '死區':5, 'unknown':3, '未知':3, 'pending':3, '等待分級':3, 'n/a':4, '不適用':4, 'amended':4, '修正':4, 'omega':5, '終結':5 };
  return map[c] !== undefined ? map[c] : 3;
}

// 取得兩層級之間所有的跳轉方式
function getAllMethods(from, to) {
  const methods = [];
  for (const c of CONNECTIONS) {
    if (c.from === from && c.to === to) methods.push(c.method);
    if (c.from === to && c.to === from) methods.push('（反向）' + c.method);
  }
  return methods;
}

// BFS 最快路線（最少跳轉），avoidRare=true 時跳過稀有通道
function bfs(from, to, avoidRare) {
  if (!GRAPH[from] || !GRAPH[to]) return null;
  if (from === to) return [{ level:from, method:null }];
  const visited = { [from]:true };
  const queue = [{ level:from, path:[{ level:from, method:null }] }];
  while (queue.length > 0) {
    const { level, path } = queue.shift();
    for (const edge of GRAPH[level]) {
      if (visited[edge.to]) continue;
      if (avoidRare && edge.rare) continue;
      visited[edge.to] = true;
      const newPath = [...path, { level:edge.to, method:edge.method, rare:edge.rare }];
      if (edge.to === to) return newPath;
      queue.push({ level:edge.to, path:newPath });
    }
  }
  return null;
}

// Dijkstra 最安全路線（避開高危險層級），avoidRare=true 時跳過稀有通道
function dijkstra(from, to, avoidRare) {
  if (!GRAPH[from] || !GRAPH[to]) return null;
  if (from === to) return [{ level:from, method:null }];
  const dist = {};
  const prev = {};
  const pq = [{ level:from, cost:0 }];
  dist[from] = 0;
  while (pq.length > 0) {
    pq.sort((a,b) => a.cost - b.cost);
    const { level, cost } = pq.shift();
    if (level === to) break;
    if (cost > (dist[level] || Infinity)) continue;
    for (const edge of GRAPH[level]) {
      if (avoidRare && edge.rare) continue;
      const w = getDanger(edge.to) + 0.1;
      const newCost = cost + w;
      if (newCost < (dist[edge.to] || Infinity)) {
        dist[edge.to] = newCost;
        prev[edge.to] = { from:level, method:edge.method, rare:edge.rare };
        pq.push({ level:edge.to, cost:newCost });
      }
    }
  }
  if (dist[to] === undefined) return null;
  const path = [];
  let cur = to;
  while (cur) {
    const p = prev[cur];
    path.unshift({ level:cur, method: p ? p.method : null, rare: p ? p.rare : false });
    cur = p ? p.from : null;
  }
  return path;
}

function findPath() {
  const from = document.getElementById('from-level').value.trim();
  const to = document.getElementById('to-level').value.trim();
  const routeEl = document.querySelector('input[name="route-type"]:checked');
  const routeType = routeEl ? routeEl.value : 'fastest';
  const resultArea = document.getElementById('result-area');
  const resultTitle = document.getElementById('result-title');
  const pathSteps = document.getElementById('path-steps');

  if (!from || !to) { alert('請輸入當前層級和目標層級'); return; }
  if (!GRAPH[from]) { alert('Level ' + from + ' 尚未收錄或不存在'); return; }
  if (!GRAPH[to]) { alert('Level ' + to + ' 尚未收錄或不存在'); return; }

  const algo = routeType === 'safest' ? dijkstra : bfs;

  // 方法一：正常路線（跳過稀有通道）
  const normalPath = algo(from, to, true);
  // 方法二：包含稀有通道的最短路線
  const rarePath = algo(from, to, false);

  pathSteps.innerHTML = '';

  if (!normalPath && !rarePath) {
    resultTitle.textContent = '找不到路徑';
    pathSteps.innerHTML = '<div class="no-path">目前資料中沒有從 Level ' + from + ' 到 Level ' + to + ' 的已知路徑。</div>';
    resultArea.classList.add('show');
    return;
  }

  const routeLabel = routeType === 'safest' ? '最安全路線' : '最快路線';
  resultTitle.textContent = 'Level ' + from + ' → Level ' + to + '（' + routeLabel + '）';

  // Helper: render a single path
  function renderPath(path, label, isRare) {
    const header = document.createElement('div');
    header.className = 'method-header' + (isRare ? ' rare' : '');
    const jumps = path.length - 1;
    const totalDanger = path.reduce((s, p) => s + getDanger(p.level), 0);
    header.innerHTML = '<span class="method-tag">' + label + '</span> ' + jumps + ' 次跳轉，危險度 ' + totalDanger + (isRare ? '（含稀有通道）' : '');
    pathSteps.appendChild(header);

    path.forEach((step, i) => {
      const info = LEVEL_INFO[step.level] || { name:'未知', class:'?' };
      const isLast = (i === path.length - 1);
      const nextLevel = isLast ? null : path[i + 1].level;
      const nextInfo = nextLevel ? (LEVEL_INFO[nextLevel] || { name:'未知' }) : null;
      const wikiUrl = 'https://backrooms-wiki-cn.wikidot.com/level-' + step.level;

      const card = document.createElement('div');
      card.className = 'path-card';
      card.innerHTML =
        '<div class="path-card-header">' +
          '<div class="step-num">' + (i + 1) + '</div>' +
          '<div class="step-header-info">' +
            '<div class="step-level"><span class="level-badge">Level ' + step.level + '</span>' + info.name + (step.rare ? ' <span class="rare-badge">稀有</span>' : '') + '</div>' +
            '<div class="step-name">生存難度等級 ' + info.class + (isLast ? ' · 終點' : '') + '</div>' +
          '</div>' +
          '<a class="step-wiki-link" href="' + wikiUrl + '" target="_blank">維基頁面</a>' +
        '</div>';
      pathSteps.appendChild(card);

      if (!isLast) {
        const allMethods = getAllMethods(step.level, nextLevel);
        let methodsHtml = '';
        if (allMethods.length > 0) {
          methodsHtml = '<ul class="method-list">' +
            allMethods.map(m => '<li>' + m + '</li>').join('') +
            '</ul>';
        } else {
          methodsHtml = '<div class="transition-method">' + (step.method || '未知方式') + '</div>';
        }
        const fromName = info.name;
        const toName = nextInfo ? nextInfo.name : '';
        const intro = '從「' + fromName + '」前往「' + toName + '」，共有 ' + allMethods.length + ' 種已知方式：';

        const trans = document.createElement('div');
        trans.className = 'transition-connector';
        trans.innerHTML =
          '<div class="transition-arrow">▼ ▼</div>' +
          '<div class="transition-box">' +
            '<div class="transition-label">Level ' + step.level + ' → Level ' + nextLevel + (step.rare ? ' ⚠ 稀有通道' : '') + '</div>' +
            '<div class="transition-intro">' + intro + '</div>' +
            methodsHtml +
          '</div>';
        pathSteps.appendChild(trans);
      } else {
        const end = document.createElement('div');
        end.className = 'transition-connector';
        end.innerHTML = '<div class="transition-end">✓ 已到達目標 Level ' + step.level + '</div>';
        pathSteps.appendChild(end);
      }
    });
  }

  // 方法一：正常路線
  if (normalPath) {
    renderPath(normalPath, '方法一：正常路線', false);
  }

  // 方法二：稀有路線（如果與正常路線不同）
  if (rarePath) {
    const normalStr = normalPath ? normalPath.map(p => p.level).join(',') : '';
    const rareStr = rarePath.map(p => p.level).join(',');
    if (rareStr !== normalStr) {
      const divider = document.createElement('div');
      divider.className = 'path-divider';
      divider.textContent = '— 或 —';
      pathSteps.appendChild(divider);
      renderPath(rarePath, '方法二：困難路線（含稀有通道）', true);
    }
  }

  resultArea.classList.add('show');
  resultArea.scrollIntoView({ behavior:'smooth', block:'start' });
}

// 回車鍵查詢
document.getElementById('to-level').addEventListener('keydown', e => {
  if (e.key === 'Enter') findPath();
});
document.getElementById('from-level').addEventListener('keydown', e => {
  if (e.key === 'Enter') findPath();
});
