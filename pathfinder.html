<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後室路徑查詢 — Backrooms Pathfinder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; min-height:100%; background:#0d0b08; color:#e0d8c8;
    font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif; }
  body { background:radial-gradient(ellipse at 20% 0%, rgba(60,45,20,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(40,30,15,0.2) 0%, transparent 50%), #0d0b08;
    padding:30px 15px; }
  .container { max-width:760px; margin:0 auto; }
  h1 { text-align:center; font-size:28px; letter-spacing:6px; color:#c9a84c; margin-bottom:6px;
    text-shadow:0 0 20px rgba(201,168,76,0.5), 0 0 40px rgba(201,168,76,0.2); }
  .subtitle { text-align:center; font-size:12px; color:#7a7060; letter-spacing:3px; margin-bottom:30px; }
  .input-area { background:rgba(20,16,10,0.8); border:1px solid rgba(201,168,76,0.2);
    border-radius:6px; padding:24px; margin-bottom:24px; }
  .input-row { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .input-group { flex:1; min-width:200px; }
  label { display:block; font-size:13px; color:#a09080; margin-bottom:6px; letter-spacing:1px; }
  input, select { width:100%; padding:10px 14px; background:rgba(10,8,5,0.8);
    border:1px solid rgba(201,168,76,0.25); border-radius:4px; color:#e0d8c8;
    font-size:15px; font-family:inherit; outline:none;
    transition:border-color 0.3s, box-shadow 0.3s; }
  input:focus, select:focus { border-color:#c9a84c; box-shadow:0 0 10px rgba(201,168,76,0.2); }
  button { width:100%; padding:14px;
    background:linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border:1px solid rgba(201,168,76,0.4); border-radius:4px; color:#c9a84c;
    font-size:16px; font-family:inherit; letter-spacing:4px; cursor:pointer; transition:all 0.3s; }
  button:hover { background:linear-gradient(135deg, rgba(201,168,76,0.3), rgba(201,168,76,0.1));
    border-color:#c9a84c; box-shadow:0 0 15px rgba(201,168,76,0.3); }
  .result-area { display:none; }
  .result-area.show { display:block; }
  .result-title { font-size:18px; color:#c9a84c; margin-bottom:16px; letter-spacing:2px;
    text-align:center; text-shadow:0 0 10px rgba(201,168,76,0.3); }
  .path-steps { list-style:none; }
  .method-header { padding:12px 16px; margin:16px 0 8px 0;
    background:rgba(201,168,76,0.08); border:1px solid rgba(201,168,76,0.2);
    border-radius:4px; font-size:14px; color:#c9a84c; font-weight:bold; }
  .method-header.rare { background:rgba(180,80,80,0.08); border-color:rgba(180,80,80,0.25); color:#d49090; }
  .method-tag { display:inline-block; padding:2px 10px; background:rgba(201,168,76,0.2);
    border-radius:3px; margin-right:8px; font-size:12px; }
  .method-header.rare .method-tag { background:rgba(180,80,80,0.2); }
  .rare-badge { display:inline-block; padding:1px 6px; background:rgba(180,80,80,0.2);
    color:#d49090; border-radius:3px; font-size:10px; margin-left:6px; }
  .path-divider { text-align:center; padding:16px; color:rgba(201,168,76,0.4);
    font-size:14px; letter-spacing:4px; }
  .path-card { background:rgba(20,16,10,0.7); border:1px solid rgba(201,168,76,0.2);
    border-radius:6px; margin-bottom:0; overflow:hidden;
    transition:border-color 0.3s, box-shadow 0.3s; }
  .path-card:hover { border-color:#c9a84c; box-shadow:0 0 15px rgba(201,168,76,0.3); }
  .path-card-header { display:flex; align-items:center; gap:12px; padding:14px 16px;
    cursor:pointer; user-select:none; transition:background 0.2s; }
  .path-card-header:hover { background:rgba(201,168,76,0.05); }
  .step-num { flex:none; width:36px; height:36px; border-radius:50%;
    background:rgba(201,168,76,0.1); border:2px solid rgba(201,168,76,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#c9a84c; font-weight:bold;
    box-shadow:0 0 8px rgba(201,168,76,0.15); }
  .step-header-info { flex:1; min-width:0; }
  .step-level { font-size:16px; font-weight:bold; color:#e0d8c8; margin-bottom:2px; }
  .step-name { font-size:12px; color:#a09080; }
  .step-wiki-link { font-size:11px; color:#7a9ac0; text-decoration:none;
    padding:4px 10px; border:1px solid rgba(122,154,192,0.3);
    border-radius:3px; white-space:nowrap; transition:all 0.2s; }
  .step-wiki-link:hover { background:rgba(122,154,192,0.15); box-shadow:0 0 8px rgba(122,154,192,0.3); }
  .transition-box { background:rgba(201,168,76,0.06); border:1px solid rgba(201,168,76,0.15);
    border-radius:4px; padding:14px 16px;
    box-shadow:inset 0 0 10px rgba(201,168,76,0.05); }
  .transition-label { font-size:13px; color:#c9a84c; letter-spacing:1px;
    margin-bottom:6px; font-weight:bold; text-shadow:0 0 8px rgba(201,168,76,0.3); }
  .transition-intro { font-size:12px; color:#8a8070; line-height:1.6;
    margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed rgba(201,168,76,0.15); }
  .method-list { margin:0; padding-left:18px; }
  .method-list li { font-size:13px; color:#c0b8a8; line-height:1.7; margin-bottom:4px; }
  .transition-arrow { text-align:center; color:#c9a84c; font-size:22px; padding:4px 0;
    letter-spacing:4px;
    text-shadow:0 0 10px rgba(201,168,76,0.6), 0 0 20px rgba(201,168,76,0.3); }
  .transition-connector { padding:6px 0 6px 50px; }
  .transition-end { text-align:center; padding:14px; color:#7ab87a; font-size:14px;
    background:rgba(122,184,122,0.06); border:1px solid rgba(122,184,122,0.2);
    border-radius:4px; margin-top:4px; text-shadow:0 0 8px rgba(122,184,122,0.4); }
  .no-path { text-align:center; padding:30px; color:#a06060; font-size:15px; }
  .info-box { margin-top:24px; padding:16px; background:rgba(20,16,10,0.6);
    border:1px solid rgba(201,168,76,0.15); border-radius:4px;
    font-size:12px; color:#7a7060; line-height:1.8; }
  .info-box strong { color:#a09080; }
  .level-badge { display:inline-block; padding:2px 8px; background:rgba(201,168,76,0.15);
    border-radius:3px; font-size:12px; color:#c9a84c; margin-right:6px; }
  .class-dot { display:inline-block; width:10px; height:10px; border-radius:50%;
    margin:0 4px; vertical-align:middle; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:#1a1510; border:1px solid rgba(201,168,76,0.4); border-radius:8px;
    max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:24px;
    box-shadow:0 0 30px rgba(201,168,76,0.2); position:relative; }
  .modal-close { position:absolute; top:12px; right:16px; cursor:pointer; color:#7a7060;
    font-size:24px; line-height:1; }
  .modal-close:hover { color:#c9a84c; }
  .modal h2 { color:#c9a84c; font-size:20px; margin-bottom:4px; letter-spacing:2px; }
  .modal .modal-sub { font-size:13px; color:#a09080; margin-bottom:16px; }
  .modal .class-row { margin-bottom:16px; padding:10px 14px;
    background:rgba(0,0,0,0.3); border-radius:4px; font-size:14px; }
  .modal .section { margin-bottom:16px; }
  .modal .section-title { font-size:13px; color:#c9a84c; letter-spacing:2px;
    margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid rgba(201,168,76,0.15); }
  .modal .summary-text { font-size:13px; color:#c0b8a8; line-height:1.7; }
  .modal ul { padding-left:18px; }
  .modal ul li { font-size:13px; color:#c0b8a8; line-height:1.7; margin-bottom:4px; }
  .modal .wiki-link { display:inline-block; margin-top:8px; color:#7a9ac0;
    text-decoration:none; font-size:13px; padding:6px 12px;
    border:1px solid rgba(122,154,192,0.3); border-radius:4px; }
  .modal .wiki-link:hover { background:rgba(122,154,192,0.1); box-shadow:0 0 10px rgba(122,154,192,0.3); }

  /* Connection Library */
  .conn-library { margin-top:30px; background:rgba(20,16,10,0.6);
    border:1px solid rgba(201,168,76,0.2); border-radius:6px; overflow:hidden; }
  .conn-library-header { padding:16px 20px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    font-size:16px; color:#c9a84c; letter-spacing:2px;
    background:rgba(201,168,76,0.05); user-select:none; }
  .conn-library-header:hover { background:rgba(201,168,76,0.1); }
  .conn-library-body { display:none; padding:16px 20px; max-height:600px; overflow-y:auto; }
  .conn-library-body.show { display:block; }
  .conn-level-block { margin-bottom:20px; padding-bottom:16px;
    border-bottom:1px solid rgba(201,168,76,0.1); }
  .conn-level-block:last-child { border-bottom:none; }
  .conn-level-title { font-size:15px; color:#c9a84c; font-weight:bold; margin-bottom:8px; }
  .conn-direction { font-size:12px; color:#8a8070; margin:8px 0 4px 0; letter-spacing:1px; }
  .conn-item { font-size:12px; color:#c0b8a8; line-height:1.6;
    padding:3px 0 3px 12px; border-left:2px solid rgba(201,168,76,0.15); margin-bottom:3px; }
  .conn-item.rare { border-left-color:#d05050; color:#d49090; }
  .conn-item .conn-level-num { color:#c9a84c; font-weight:bold; }
  .conn-item.rare .conn-level-num { color:#d49090; }
</style>
</head>
<body>
<div class="container">
  <h1>後室路徑查詢</h1>
  <div class="subtitle">BACKROOMS PATHFINDER · 依據 Wikidot 中文維基</div>

  <div class="input-area">
    <div class="input-row">
      <div class="input-group">
        <label>當前層級</label>
        <input type="text" id="from-level" value="0" list="level-list">
      </div>
      <div class="input-group">
        <label>目標層級</label>
        <input type="text" id="to-level" placeholder="例如：5" list="level-list">
      </div>
    </div>
    <datalist id="level-list"></datalist>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
      <label style="flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#a09080;min-width:140px;"><input type="radio" name="route-type" value="fastest" checked style="width:auto;"> 最快路線（最少跳轉）</label>
      <label style="flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#a09080;min-width:140px;"><input type="radio" name="route-type" value="safest" style="width:auto;"> 最安全路線（避開危險層級）</label>
    </div>
    <button onclick="findPath()">查詢路徑</button>
  </div>

  <div class="result-area" id="result-area">
    <div class="result-title" id="result-title"></div>
    <ol class="path-steps" id="path-steps"></ol>
  </div>

  <div class="conn-library">
    <div class="conn-library-header" onclick="toggleConnLib()">
      <span>📚 連接庫（507 層級 · 1437 條連接）</span>
      <span id="conn-lib-arrow">▶ 展開</span>
    </div>
    <div class="conn-library-body" id="conn-library-body"></div>
  </div>

  <div class="info-box">
    <strong>目前收錄層級：</strong>507 個層級（Level 0 至 Level 999）<br>
    <strong>連接總數：</strong>1437 條有向連接<br>
    <strong>路徑計算：</strong>BFS 最短路徑 / Dijkstra 最安全路徑<br>
    <strong>資料來源：</strong>The Backrooms 中文維基（Wikidot）<br>
    <strong>注意：</strong>後室的入口/出口具有隨機性，此工具僅提供已知最可能的路線。點擊層級卡片可查看詳情。
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalBg(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const LEVEL_INFO = {"0": {"name": "教學關卡", "class": 1, "summary": "Level 0 是後室的第一層，表現為一個龐大、零散的空間，由發黃的潮濕地毯、單調黃色牆壁和嗡嗡作響的日光燈組成。迷宮般的房間與走廊不規則排列，非歐幾里得空間使流浪者難以導航。這裡是空的，沒有實體出沒，但長期待在這裡會導致幻覺和迷失方向。杏仁水是重要的補給品。", "entrances": ["從前館切入後的預設抵達層", "在後室中隨機切入可能抵達"], "exits": ["深入探索後可找到通往 Level 1 的出口門", "切出可抵達各種不同層級"]}, "1": {"name": "宜居區", "class": 1, "summary": "Level 1 是一個龐大的倉庫般空間，有混凝土地面和牆壁、天花板上的管子。這裡比 Level 0 更危險，開始有實體出現。M.E.G. 的基地「探險者基地」位於此層。可以找到杏仁水和其他補給品。燈光不穩定，偶爾會熄滅。", "entrances": ["從 Level 0 找到出口門進入"], "exits": ["找到通往 Level 2 的管道門", "沿走廊前進可抵達各種不同層級"]}, "2": {"name": "管道夢境", "class": 2, "summary": "Level 2 是一系列混凝土走廊和管道系統，溫暖潮濕。牆壁佈滿管道，空氣中有蒸汽和金屬味。這層有大量實體出沒，包括屍鼠和竊皮者。某些區域有危險的高溫管道。", "entrances": ["從 Level 1 找到管道門進入"], "exits": ["找到通往 Level 3 的金屬門", "某些管道可通往其他層級"]}, "3": {"name": "辦公工廠", "class": 4, "summary": "Level 3 是一個由電氣迷宮組成的工廠設施，有高壓電纜和危險的電氣設備。這層非常危險，有大量敵對實體。電擊是常見的死亡原因。Wi-Fi 訊號很強。", "entrances": ["從 Level 2 深入管道系統進入"], "exits": ["找到金屬門可通往 Level 4 或其他層級"]}, "4": {"name": "廢棄辦公室", "class": 1, "summary": "Level 4 是一個現代化辦公大樓，有熒光燈、辦公桌椅和窗戶。這層相對安全，是流浪者的中轉站。窗戶外面是白色虛空。可以找到杏仁水和辦公用品。B.N.T.G. 在這裡有前哨站。", "entrances": ["從 Level 3 找到辦公室門進入"], "exits": ["走出辦公大樓可抵達 Level 11", "找到特定門可通往其他層級"]}, "5": {"name": "恐怖旅館", "class": 4, "summary": "Level 5 是一個豪華但詭異的旅館，有紅色地毯、華麗裝飾和賭場。這層非常危險，有大量敵對實體出沒。鍋爐房區域特別危險。燈光昏暗，氣壓異常。", "entrances": ["從 Level 4 找到旅館門進入"], "exits": ["找到特定門可通往 Level 6 或其他層級"]}, "6": {"name": "燈滅", "class": 4, "summary": "Level 6 是一個完全黑暗的空間，沒有任何光源。牆壁光滑，觸感粘稠。這層極度危險，笑魘在黑暗中出沒。流浪者必須依靠觸覺導航。燈光完全消失，任何光源都會被吸收。", "entrances": ["從 Level 5 深入旅館進入"], "exits": ["在黑暗中找到出口可抵達 Level 7 或其他層級"]}, "7": {"name": "深淵水域", "class": 4, "summary": "Level 7 是一個巨大的水下空間，充滿了深不見底的水。水溫冰冷，有危險的水生生物。需要水下呼吸裝備才能生存。從水面進入後會迅速下沉。", "entrances": ["從 Level 6 找到水洞進入"], "exits": ["下潛到特定深度可抵達 Level 8 或 Level 83"]}, "8": {"name": "巖洞系統", "class": 4, "summary": "Level 8 是一個巨大的洞穴系統，有鐘乳石和地下河流。洞穴潮濕陰暗，有蝙蝠狀實體出沒。可以找到水晶和礦物。某些區域有地下湖。", "entrances": ["從 Level 7 水下洞穴進入"], "exits": ["深入洞穴可抵達 Level 93 或其他層級"]}, "9": {"name": "無人小鎮", "class": 3, "summary": "Level 9 是一個永遠處於夜晚的郊區小鎮，有住宅、樹木和空曠的街道。燈光昏暗，有敵對實體在黑暗中出沒。房子內部可能有詭異的事物。永遠是夜晚，沒有黎明。", "entrances": ["從 Level 8 洞穴出口進入", "從各種不同層級切入進入"], "exits": ["探索城鎮可找到通往 Level 10 或其他層級的門"]}, "10": {"name": "草原牧場", "class": 1, "summary": "Level 10 是一片廣闊的草原牧場，有金黃色的麥田和藍天白雲。相對安全，可以找到食物和水。有無面靈在遠處遊蕩但不敵對。天空真實，有正常的天氣循環。", "entrances": ["從 Level 9 找到鄉間小路進入"], "exits": ["沿著小路前進可抵達 Level 11 或其他層級"]}, "11": {"name": "繁華都市", "class": 1, "summary": "Level 11 是一個無限延伸的現代化城市，有高樓大廈、街道和車輛。這層相對安全，有「11效應」使實體表現得像正常人。是後室中最重要的貿易和居住中心。有各種商店、餐廳和建築。", "entrances": ["從 Level 4 走出辦公大樓進入", "從多個層級切入抵達"], "exits": ["找到特定門可通往幾乎所有層級"]}, "12": {"name": "死寂影院", "class": 2, "summary": "Level 12 是一個電影院空間，圖像會被屏蔽。拍照和攝像都無法正常工作。氣氛壓抑，有幻聽現象。", "entrances": ["從 Level 11 找到電影院進入"], "exits": ["找到出口門可抵達其他層級"]}, "13": {"name": "無盡公寓", "class": 4, "summary": "Level 13 是一個無限延伸的高層公寓大樓，電梯和樓梯連接著無數樓層。公寓佈局各異，有些安全有些危險。高樓層有特殊的異常現象。", "entrances": ["從 Level 11 找到公寓大樓進入"], "exits": ["乘坐電梯或樓梯可抵達不同層級"]}, "14": {"name": "永恆天堂", "class": 0, "summary": "Level 14 是一個美麗的天堂般空間，有藍天白雲、花園和噴泉。這層完全安全，沒有實體。會讓人產生催眠般的舒適感，讓人不想離開。", "entrances": ["從多個層級的危險區域切出抵達"], "exits": ["主動離開可抵達各種安全層級"]}, "15": {"name": "工廠區", "class": 3, "summary": "Level 15 是一個巨大的工廠設施，有機器轟鳴聲和工業設備。煙霧瀰漫，空氣渾濁。有危險的實體出沒。", "entrances": ["從 Level 11 找到工廠入口進入"], "exits": ["找到工廠出口可抵達其他層級"]}, "16": {"name": "都市變遷", "class": 3, "summary": "Level 16 是一個不斷變化的城市景觀，建築會隨機出現和消失。空間不穩定，容易迷路。", "entrances": ["從 Level 11 隨機切出抵達"], "exits": ["隨著城市變遷可切出到其他層級"]}, "17": {"name": "豪華郵輪", "class": 2, "summary": "Level 17 是一艘無限長的豪華郵輪，有客房、餐廳和甲板。郵輪航行在看不見的海面上。相對安全，但某些區域有實體出沒。", "entrances": ["從 Level 11 找到郵輪入口進入"], "exits": ["找到特定門可抵達其他層級"]}, "18": {"name": "童年書屋", "class": 1, "summary": "Level 18 是一個讓人想起童年的房間，會根據流浪者的記憶改變佈置。有強烈的懷舊感。相對安全。", "entrances": ["從多個層級隨機切入抵達"], "exits": ["離開房間可抵達其他層級"]}, "19": {"name": "廢棄辦公室", "class": 3, "summary": "Level 19 是一個破舊的辦公室空間，地板脆弱，隨時可能坍塌。有大量辦公桌椅和文件。", "entrances": ["從 Level 11 找到辦公樓進入"], "exits": ["找到出口可抵達其他層級"]}, "20": {"name": "儲存設施", "class": 2, "summary": "Level 20 是一個巨大的儲存倉庫，有高大的貨架和叉車。可以找到各種物資。燈光昏暗。", "entrances": ["從 Level 11 找到儲存設施進入"], "exits": ["找到出口門可抵達其他層級"]}, "21": {"name": "無盡長廊", "class": 2, "summary": "Level 21 是無數英里長的走廊，兩側有上鎖的門。桌子上有鑰匙和補給品。時間異常，可能遇見過去或未來的自己。", "entrances": ["從 Level 11 找到走廊門進入"], "exits": ["用鑰匙打開特定門可抵達其他層級"]}, "22": {"name": "後室地鐵", "class": 3, "summary": "Level 22 是一個地鐵系統，有列車在無盡的軌道上行駛。車站和列車連接著不同層級。列車上有實體出沒。", "entrances": ["從多個層級找到地鐵站入口進入"], "exits": ["乘坐列車到特定車站可抵達其他層級"]}, "23": {"name": "叢林洞穴", "class": 3, "summary": "Level 23 是一個熱帶叢林覆蓋的洞穴系統，有樹木和泉水。濕熱難耐。有野生動物出沒。", "entrances": ["從多個叢林層級切入抵達"], "exits": ["找到洞穴出口可抵達其他層級"]}, "24": {"name": "天空迷霧", "class": 2, "summary": "Level 24 是一個漂浮在雲海中的空間，窗外是模糊的天空景色。有建築物和窗戶。", "entrances": ["從高層建築層級切入抵達"], "exits": ["找到窗戶出口可抵達其他層級"]}, "25": {"name": "遊樂場", "class": 2, "summary": "Level 25 是一個巨大的室內遊樂場，有街機遊戲和娛樂設施。燈光繽紛，音樂響亮。某些遊戲機可以正常運作。", "entrances": ["從 Level 11 找到遊樂場入口進入"], "exits": ["找到出口可抵達其他層級"]}, "26": {"name": "迷宮", "class": 3, "summary": "Level 26 是一個不斷變化的迷宮，有隨機出現的樓梯和門。容易迷失方向。", "entrances": ["從多個層級隨機切入抵達"], "exits": ["找到迷宮出口可抵達其他層級"]}, "27": {"name": "溫泉", "class": 1, "summary": "Level 27 是一個溫泉度假村，有溫泉池和舒適的環境。可以放鬆身心，恢復體力。", "entrances": ["從 Level 23 找到泉水進入"], "exits": ["找到旅館出口可抵達其他層級"]}, "28": {"name": "風暴荒地", "class": 4, "summary": "Level 28 是一個遭受風暴侵襲的荒原，有風暴石和石製遺跡。暴風雨不斷，非常危險。", "entrances": ["從多個戶外層級切入抵達"], "exits": ["找到石製建築出口可抵達其他層級"]}, "29": {"name": "山脈定居點", "class": 3, "summary": "Level 29 是一個扭曲的山脈景觀，有小型定居點。山勢險峻，天氣多變。", "entrances": ["從 Level 28 深入荒地抵達"], "exits": ["找到定居點出口可抵達其他層級"]}, "30": {"name": "虛假島嶼", "class": 3, "summary": "Level 30 是一個漂浮在虛空中的島嶼景觀，有虛假的景觀和原生實體。", "entrances": ["從多個戶外層級切入抵達"], "exits": ["找到島嶼邊緣出口可抵達其他層級"]}, "31": {"name": "匹薩店", "class": 1, "summary": "Level 31 是一個連鎖匹薩店，有匹薩和蘇打水的氣味。相對安全，可以找到食物。", "entrances": ["從 Level 11 找到匹薩店進入"], "exits": ["找到後門出口可抵達其他層級"]}, "32": {"name": "紅樹林", "class": 3, "summary": "Level 32 是一個佈滿骷髏的樹林，樹上掛著人類遺骸。詭異恐怖。", "entrances": ["從多個森林層級切入抵達"], "exits": ["找到森林出口可抵達其他層級"]}, "33": {"name": "腐敗地帶", "class": 4, "summary": "Level 33 是一個被腐化現象侵蝕的區域，環境會逐漸惡化。越深入越危險。", "entrances": ["從多個城市層級深入抵達"], "exits": ["找到腐敗較輕的出口可抵達其他層級"]}, "34": {"name": "下水道", "class": 3, "summary": "Level 34 是一個狹窄的磚石隧道系統，類似下水道。骯髒潮濕，有危險實體。", "entrances": ["從 Level 11 找到下水道入口進入"], "exits": ["找到下水道出口可抵達其他層級"]}, "35": {"name": "荒漠公路", "class": 3, "summary": "Level 35 是一個沙漠公路景觀，有車輛廢墟和軍用悍馬。炎熱乾燥。", "entrances": ["從多個戶外層級切入抵達"], "exits": ["找到公路出口可抵達其他層級"]}, "36": {"name": "食品加工廠", "class": 3, "summary": "Level 36 是一個食品加工廠，有受污染的食物。食物看起來正常但實際上有害。", "entrances": ["從 Level 31 匹薩店深入抵達"], "exits": ["找到工廠出口可抵達其他層級"]}, "37": {"name": "水上樂園", "class": 2, "summary": "Level 37 是一個充滿水的房間，有白色瓷磚地板。水深及腰，涼爽舒適。", "entrances": ["從多個建築層級找到水房進入"], "exits": ["找到水管出口可抵達 Level 58 或其他層級"]}, "38": {"name": "多疊交點", "class": 5, "summary": "Level 38 是 Level 0 到 Level 37 所有層級的集合體，是各層級相互疊加的交點。環境混亂，融合了之前所有層級的特徵。分為「裡界」和「表界」兩個區域。極度危險，實體眾多。", "entrances": ["在 Level 0 到 Level 37 之間任意層級遊蕩，環境變得混亂時抵達"], "exits": ["在層中環境穩定下來時離開，會抵達隨機層級", "乘坐過山車可前往藍色通道"]}, "39": {"name": "魔法森林", "class": 0, "summary": "Level 39 是一片圓形的橡樹林，永遠處於黃昏時段。路徑蜿蜒曲折，容易迷失方向。環境有催眠效果，讓人感到舒適懷念。飲用杏仁水可消除催眠效果。邊境地區有颶風和龍捲風，非常危險。", "entrances": ["從 Level 135 天色變暗時進入", "從 Level 499 森林頂部洞穴爬出", "從 Level 797 牆上洞穴進入"], "exits": ["切出山丘可抵達 Level 63", "邊界下雪時進入可抵達 Level 129", "切出樹木可抵達 Level 170", "切出地面可抵達 Level 192", "進入小屋可抵達 Level 280", "站上木板可抵達 Level 300", "暴風雪時抵達 Level 420", "路徑通向 Level 448", "掉進水坑抵達 Level 466", "邊界橋樑通往 Level 63.3"]}, "40": {"name": "搖滾匹薩", "class": 1, "summary": "Level 40 是一個 1980 年代風格的無限遊戲廳，有各種街機遊戲。燈光繽紛，播放著 80 年代流行音樂。有一個名為 Pat 的友善實體。部分街機遊戲可以正常遊玩。", "entrances": ["在 Level 5 遊玩街機後進入", "在 Level 25 擊碎玻璃後進入", "在 Level 122 觸碰街機海報進入", "在 Level 777 找到街機進入", "在 Level 19 挪動老舊街機進入"], "exits": ["找到旋轉門可抵達 Level 9、10 或 11", "進入職員區可抵達 Level 0", "走進垃圾桶可抵達 Level 98", "在儲藏室坐太久抵達 Level 176", "遊玩動物飼養員街機抵達 Level 81", "鏽蝕樓梯通往 Level 5", "找到標有 Mach+ 的錄像帶抵達 Level 201", "鏽色金屬門通往 Level 1"]}, "41": {"name": "黑湖", "class": "其他", "summary": "Level 41 是一個沸騰的瀝青湖，周圍環繞著炭黑色沙漠。瀝青保持在 95°C 高溫，散發有毒煙霧。接觸瀝青會造成嚴重灼傷。湖中有鰻魚狀實體「膠原利維坦」出沒。只能通過橋樑和島嶼穿越。", "entrances": ["在 Level 5 鍋爐房讓焦油滴落到身上", "在 Level 6 觸感粘稠的牆壁上沾染過多物質", "在 Level 7 接觸半瀝青半水的裂縫", "在 Level 211 瀝青坑中浸入", "在 Level 270 黑色河流中進入", "在 Level 309 切入焦油覆蓋的樹木"], "exits": ["爬進軍艦破窗抵達 Level 500", "進入NASA航天飛機助推器噴嘴抵達 Level 515", "穿過穀倉門抵達 Level 612", "進入被淹沒的燈塔擺弄信標抵達 Level 626"]}, "42": {"name": "引人入勝之地", "class": "不適用", "summary": "Level 42 是一個充滿實驗性描述的層級，包含多種不同環境的描述片段。頁面尚未完成，充滿了碎片化的敘述和存在主義主題。環境包括草原、島嶼、環形坑、黑色液體海洋等多種描述。", "entrances": ["從 Level 41 隨機切出抵達"], "exits": ["找到樓梯入口可抵達 Level 54"]}, "43": {"name": "水世界", "class": 3, "summary": "Level 43 是一個廢棄的水族館主題公園，分為公園區、主樓、員工大廳和最終水世界四個區域。公園空蕩寂靜，有廣播反覆播放維護通知。最終區域完全被水淹沒，極度危險。有「魚」等水生實體出沒。", "entrances": ["帶著水相關物品乘坐後室地鐵抵達", "在 Level 11 乘坐出租車進入", "在 Level 7 深處找到水洞進入", "在 Level 54 找到特定門進入"], "exits": ["在灌木叢中前行抵達 Level 62 或 Level 9", "廢棄設施通往 Level 58", "在主樓行進數週抵達 Level 72 或 Level 33", "電梯通往 Level 65", "遊玩街機進入 Level 40", "穿過員工大廳進入 Level 2 或 Level 4", "找到船上出口抵達 Level 85", "穿過艙門進入 Level 34"]}, "44": {"name": "腐蝕中的零售商店", "class": 3, "summary": "Level 44 是一個荒涼的零售商店空間，非歐幾里得布局。有來源不明的腐蝕性液體在增長，會逐漸溶解牆壁和天花板。窗戶顯示前廳的映像。有神秘的輪廓形象在窗戶後觀察流浪者。M.E.G. 有「除酸者」前哨站。", "entrances": ["在 Level 0 打開金屬門進入"], "exits": ["返回起始處或找到相似門可抵達 Level 11 或 Level 9"]}, "45": {"name": "深淵公司", "class": 1, "summary": "Level 45 是漂浮在虛空中的各種建築，以帝國大廈為中心呈放射狀排列。每棟建築有自己的重力場。物品都是塑膠雕塑無法使用。B.R.C. 總部位於帝國大廈。有受眷鳥和死亡飛蛾出沒。", "entrances": ["從樞紐進入", "在 Level 90 橡樹附近出口抵達"], "exits": ["從帝國大廈正門離開回到樞紐"]}, "46": {"name": "阿拉伯沙漠", "class": 2, "summary": "Level 46 是一片阿拉伯沙漠，有白天、夜晚和黎明三種狀態隨機循環。白天可達 70°C，夜晚可降至 -30°C。沙塵暴中會出現敵對的沙靈實體。有遠古一族的廢墟遺跡。M.E.G. 有「沙漠玫瑰」基地。", "entrances": ["在 Level 80 向沙漠步行 10 英里", "在 Level 0、1 或 21 找到鏽色門", "在 Level 85 進入沙地"], "exits": ["跳進綠洲抵達 Level α", "廢墟中的辦公室門通往 Level 4", "低重力區域進入 Level 149"]}, "47": {"name": "蛇之森林", "class": 3, "summary": "Level 47 是一片古老的溫帶森林，有巨大的樹木和潮濕的霧氣。夜間會出現滿月。森林處於量子疊加狀態，未被觀察時位置不固定。有大量蛇類，傷害任何蛇會觸發「大蟒蛇」追殺。夜間有黑皮狼出沒。有俄菲翁神秘教團居住。", "entrances": ["切入或切出此層更容易，枯樹空樹幹特別容易切出"], "exits": ["通過切入切出離開，抵達隨機層級"]}, "48": {"name": "日落沙灘", "class": "宜居", "summary": "Level 48 是一個無限的沙灘和海洋，永遠處於日落狀態。有熱帶森林、豪宅和酒店。氣候舒適，有豐富的可食用植物。動物都是非敵對的。M.E.G. 認定為宜居層級。有維洛卡農社社區。", "entrances": ["切入 Level 134 的沙子抵達", "游到 Level 121 湖底抵達", "翻過 Level 188 的沙灘窗戶", "進入 Level 21 的紅黃漸變門", "在 Level 11 沙房間睡覺醒來", "在 Level 46 切入棕櫚樹"], "exits": ["酒店通往 Level 581", "游到小湖湖底抵達 Level 121", "在海灘被影子拖入可能抵達 Level 100", "進入森林農舍抵達 Level 10"]}, "49": {"name": "無底冥河", "class": 4, "summary": "Level 49 是一個一戰風格的無盡戰壕系統，寂靜無聲，只有遠處槍聲。離開戰壕會被看不見的狙擊手瞬間射殺。有 Entity 49/1 戰鬥機器人巡邏。戰壕中有杏仁水和補給品。M.E.G. 有「水溝地堡」前哨。", "entrances": ["在 Level 35 進入軍用悍馬", "在 Level 11 觸摸徵兵海報", "在任意層級被活埋醒來"], "exits": ["地堡生鏽門通往 Level 14、65 或 50", "被閃電擊中抵達 Level 3", "水災時鑽進隧洞抵達 Level 6", "殺死流浪者抵達 Level 666"]}, "50": {"name": "邊獄公路", "class": 3, "summary": "Level 50 是一條無盡的沙漠高速公路，佈滿靜止的車輛。所有車輛都有內華達州車牌。極度寂靜，容易逼瘋人。有遊蕩的危險人物。只有房車是安全的。目前沒有已知出口。", "entrances": ["在 Level 35 找到房車進入後離開", "在 Level 176 卡車中坐太久"], "exits": ["據說公路盡頭通往 Level 69，但未證實"]}, "51": {"name": "遺忘之城", "class": 4, "summary": "Level 51 是失落一族的古老地下城市遺址，由迷宮、城市和神殿三部分組成。懸浮在巨大洞穴中。現代科技無法在此運作。迷宮佈局不斷變化。神殿中有神秘符號和雕像。會議室的門通往多個重要層級。", "entrances": ["在 Level 57 切入描繪神殿的畫作進入"], "exits": ["鑽進迷宮天花板的洞抵達 Level 10 或 Level 20", "進入神殿會議室未上鎖的門"]}, "52": {"name": "深淵凝視著你", "class": "unknown", "summary": "Level 52 是一個巨大的洞穴系統，有珍貴金屬和水晶。有火把提供照明但間距很遠。實體已適應環境進化。有強烈的精神影響，讓人感覺被注視。有尼安德特人遺骸。", "entrances": ["在 Level 445 切入大石頭進入", "從 Level 2.1 切出進入"], "exits": "通過標記的小隧道離開，可抵達 Level 11 等隨機層級"}, "53": {"name": "孤獨", "class": "其他", "summary": "Level 53 是一個永遠被困在同一棟房子裡的層級。房子裡食物會自動補給。窗外是美好的社區但無法到達。有無臉靈無害地遊蕩。流浪者 Allen Grady 被困多年後獲救。", "entrances": ["從 Level 9 的房子門進入"], "exits": "打開前門會回到房子裡，實際上很難離開"}, "54": {"name": "螺旋樓梯間", "class": 2, "summary": "Level 54 是無限延伸的螺旋樓梯間，藍色牆壁潮濕剝落。兩側有門通往不同層級。有藍色浮動球體發出海洋聲音。有撞毀的火車。實體罕見。有迷彩爬行者和結殼者出沒。", "entrances": ["在 Level 42 找到樓梯入口進入", "在 Level 17 找到相似走廊進入"], "exits": "通過未上鎖的門可抵達 Level 1、4、5、9、17、21、34、43、53 等層級，觸摸商店標誌進入 Level 33，進入火車抵達 Level 61"}, "55": {"name": "休憩驛站", "class": 0, "summary": "Level 55 是一個無限的鄉村餐館綜合體，作為安全綠洲而聞名。切入此層是罕見事件，通常發生在逃離危險後。食物和飲用水充足。房間布局會隨機變換。沒有傳統出口，一段時間後會自動切回原層級。", "entrances": ["後室中定居超過2年、身攜物品、逃離危險時衝過門會隨機切入", "Level 5 是最常見的切入來源"], "exits": "沒有傳統出口，一段時間後自動切回原層級，平均逗留約3天7小時"}, "56": {"name": "冷凍致傷", "class": "5e", "summary": "Level 56 是一個由藍冰組成的圓形洞穴系統，越靠近中心溫度越低，核心處為絕對零度。冰中有液態氮、氦等元素。有防寒服補給箱。中心有「奇點」圓形房間。M.E.G. 有冰川前哨 A 和 B 兩個研究基地。", "entrances": ["切入 Level 8 較冷的部分", "走進 Level 93、Level -5、Level 420 或 Level 135 的洞穴", "在 Level 55 冰櫃中找到洞穴"], "exits": "通過加寬的洞穴出口抵達 Level 57"}, "57": {"name": "白日美術館", "class": 0, "summary": "Level 57 是一個無限延伸的美術館，有登記處和愜意美術館兩部分。牆上掛滿與後室層級相關的畫作。布局不斷變化。有友善的「畫家」實體和神秘的「壁畫師」。接近畫作會被吸入對應層級。", "entrances": ["從後室各處畫作切入", "用畫筆狀層級鑰匙打開樞紐的門", "在 Level 283 移動小丑畫作"], "exits": "專注凝視畫作會被吸入對應層級，向畫家問路可抵達 Level 21"}, "58": {"name": "水上奇觀", "class": 2, "summary": "Level 58 是一個廢棄的室內水上樂園，分為水上樂園、廊道、咖啡廳和儲藏室四種區域。滑梯破舊，泳池乾涸骯髒。有 B.N.T.G. 防守的蒂根果農場。有實體窗戶需要躲避。", "entrances": ["切入 Level 37 的紅色塑膠管道", "用 Level 58 層級鑰匙解鎖門", "在 Level 9 撕碎水上樂園傳單"], "exits": "切入黑色水滑梯抵達 Level 58.1，打開紅色1號物資箱抵達 Level 1，切入廊道管道抵達辦公區EL3A"}, "59": {"name": "溺之歌", "class": "其他", "summary": "Level 59 是一個以海洋為主題的存在主義層級，充滿詩意的描述和潮汐意象。", "entrances": ["從多個水域層級切入抵達"], "exits": "找到出口可抵達其他水域相關層級"}, "60": {"name": "海灣步道", "class": 5, "summary": "Level 60 是一個海灣旁的混凝土步道，分為上層和下層區域。永遠處於黑暗中。上層有大量笑魘出沒。有「無痛死亡」效應讓人放鬆警惕。下層相對安全，有「英勇者」組織居住。", "entrances": ["在任何有海洋的層級溺死後在海中醒來"], "exits": "跳入狀態二的海可抵達 Level 7，據說在上層睡覺會在 Level 61 醒來"}, "61": {"name": "後室鄉村俱樂部", "class": "其他", "summary": "Level 61 是一個奢華的高爾夫球場鄉村俱樂部，表面上安全舒適實際上是無法逃離的監獄。所有居民都被困在這裡，成為會員意味著永遠無法離開。有 M.E.G. 成員試圖逃脫。", "entrances": ["在 Level 9 被紙片貼到臉上進入"], "exits": "沒有已知出口，按信息亭按鈕會掉進未知區域"}, "62": {"name": "叢林後院", "class": 2, "summary": "Level 62 是一個廢棄房屋的後院，植被肆意生長，被磚牆環繞。穿過牆上的洞口是一片廣袤叢林。卡拉格靈協會在此進行了探索。有死亡飛蛾出沒。", "entrances": ["在 Level 37 走進棚屋面向牆壁站立後轉身"], "exits": "在森林停留一周傳送至 Level 445，用相同方式走出棚屋抵達 Level 4 或 Level 10"}, "63": {"name": "寧靜", "class": 0, "summary": "Level 63 是一片廣闊天空中懸掛著橡木橋樑和平台的空間。完全沒有實體。有巨大的藤蔓牆壁在遠處移動。有冥想點可以放鬆心神。溫度恆定 18°C。是冥想和放鬆的好地方。", "entrances": ["在 Level 797 找到舊橡木門進入", "切入 Level 39 的山丘抵達", "在 Level 11 穿過灌木叢偶爾抵達"], "exits": "掉入虛空會被傳送到安全層級如 Level 797、Level 39 等自然層級"}, "64": {"name": "潛伏的黑暗", "class": 3, "summary": "Level 64 是一個無限的黑暗房屋空間，光線被吸收無法點亮。有「潛伏者」蟲狀人形實體出沒，對光線敏感。房屋結構在無人觀察時會變化。會隨機進入安全階段，此時所有燈光亮起沒有實體。", "entrances": ["任何層級的電梯可能變為入口", "在 Level 98 找到地下室", "在 Level 6 坐沙發上暈倒醒來", "在 Level 2 找到裝潢房間"], "exits": "安全階段找到玻璃門抵達 Level 9，走出前門可回家，找到光亮房間抵達 Level 0，切入油畫抵達 Level 57，牆上的洞通往 Level 8"}, "65": {"name": "血跡花園", "class": 4, "summary": "Level 65 是一個常年霧繚繞的森林，樹葉都是血紅色。有食肉樹木和巨型蜈蚣。血蘋果會讓人變成蜈蚣。有「嘴巴」狀裂縫和神秘的黑色樹樁，樹樁會造成精神影響和燒傷。", "entrances": "通過森林層級中的木門進入，已知連接 Level 32、14、499、23、深紅森林", "exits": "通過木門返回連接的層級，接觸樹樁後會被傳送"}, "66": {"name": "展露無遺", "class": "unknown", "summary": "Level 66 是一個無盡的水族館步行通道，環境不斷扭曲變換。會造成嚴重的精神影響，讓人感到被監視。有幻聽幻視。水族箱中有裝飾但沒有生物。空氣中有強烈鹹味。", "entrances": "走進應急出口標誌的門、切入潮濕區域或在任意層級掉進水坑", "exits": "通過隨機出現的應急出口離開，經常被磚牆堵死或上鎖"}, "67": {"name": "欲望烘焙坊", "class": 2, "summary": "Level 67 是一個 1980 年代風格的烘焙店，會根據探索者喜好改變裝潢。有等候區、櫃檯和用餐區三個區域。無面靈在排隊點餐。某些甜點有特殊效果。建築面積約 213 平方米。", "entrances": ["在 Level 11 順著烤麵包香氣前進", "在 Level 122 遊蕩找到入口", "在 Level 226 把食物放在義大利麵盤裡食用"], "exits": "食用最不喜歡的甜點抵達 Level 11、31、57 或 98，直接離開店面回到 Level 11 或 122，向傑里問出口抵達 Level 98，帶著《起源》書走出抵達 Level 153"}, "68": {"name": "電影院-啖你院", "class": 3, "summary": "Level 68 是一個巨大的電影院，座椅是生物性的，會釋放酶把人體液化吸收。電影有催眠效果。看完電影後觀眾會被抓住消化。不建議進入放映廳。", "entrances": ["在 Level 11 找到電影院進入"], "exits": "切入銀幕抵達 Level 94，拐角處的紅色門通往 Level 74"}, "69": {"name": "苦難之路", "class": 5, "summary": "Level 69 是一條被濃霧籠罩的無盡高速公路，離開車就會死。車輛是唯一安全的地方。霧和實體都會遠離車輛。開車足夠久會找到隧道出口通往 Level 11。", "entrances": ["在 Level 3 找到無標記門進入八角形房間的車輛", "在 Level 6、8、23、33 穿過地板抵達", "喝完杏仁水後偶爾抵達"], "exits": "開車穿過隧道17小時抵達 Level 11，從牆壁切出抵達 Level 22"}, "70": {"name": "霜凍城鎮", "class": 4, "summary": "Level 70 是一個永冬的城鎮，有辦公樓和公寓建築。極度嚴寒，必須在建築內定居。地下辦公室非常危險。有竊皮者和笑魘出沒。宜居地帶的居民友善。", "entrances": ["在 Level 2、3、31、208、729 找到白門", "在 Level 9 找到刻有70的門", "觸碰雪景畫作", "切入 Level 120 機房牆壁", "觀看 Level 149 或 170 天空中的70P"], "exits": "入口門同時作為出口，某些門通往 Level 0、13、37、120、427，在草地板房間睡覺抵達 Level 369，地下員工門通往 Level 410.1"}, "71": {"name": "地下虛空", "class": "unknown", "summary": "Level 71 是一個巨大的未完工地下室空間，極度黑暗寒冷。充滿了碎片化的精神錯亂文字。", "entrances": ["在 Level 4 找到地下室進入"], "exits": "出口不明，頁面充滿精神錯亂的敘述"}, "72": {"name": "落阱", "class": 4, "summary": "Level 72 是從 Level 0 落阱墜落後抵達的洞穴系統，分為入口水池、狹窄通道和泥沼三個區域。洞穴不穩定，隨時可能坍塌。泥沼中有各種生物。是落阱群的第一層。", "entrances": ["從 Level 0 的落阱中墜落很長時間抵達"], "exits": "找到洞穴出口可抵達更深層的落阱層級"}, "73": {"name": "紅壤", "class": 5, "summary": "Level 73 是一個深紅色地面的島嶼，周圍是危險海洋。實體密度極高，每 3.3 平方米就有一隻實體。唯一安全的地方是銀色城堡。Coran 之子組織居住在城堡中。永遠是滿月夜晚。", "entrances": ["在 old:level-9-1 幽暗處停留太久", "從 Level 14 和 Level 6 以未知方式抵達"], "exits": "沒有已知離開方法，所有居民都在尋找出口"}, "74": {"name": "舞台驚魂", "class": "Ψ", "summary": "Level 74 是一個被循環走廊環繞的劇院舞台。座位上有流浪者認識的人的身影。舞台上戴白色面具的人在跳舞。停留越久越危險，會出現幻覺和被監視感。", "entrances": ["在 Level 117 找到紅門進入", "在 Level 68 走廊找到相似紅門"], "exits": "在本層停留2小時後使用舞台活板門抵達絕緣層"}, "75": {"name": "閾限", "class": 0, "summary": "Level 75 又稱沙室，是一個地面覆蓋黃沙的走廊房間綜合體。牆壁有藍色、淡黃色和紅色油漆。乾燥涼爽，有幻覺雨聲。通常是偶然切入，成人很少再遇到，對兒童有特殊吸引力。", "entrances": "穿過任意層級出口時有小概率被頂替到這裡，概率隨年齡增長降低", "exits": "走進沒有沙子的房間門或翻窗戶會回到原本要去的層級"}, "76": {"name": "從查伍德邊緣歸來", "class": "宜居", "summary": "Level 76 是一片亞熱帶高地，有茶園和巍峨山峰，類似中國南部。多雨潮濕，平均氣溫 21°C。有中南大羚雕像。火焰無法持續，會下雨。煙沏農場社區友善貿易。", "entrances": ["在任意層級撲滅火災後抵達", "在 Level 10 深處沿泥土小徑前進"], "exits": "沿礫石小徑前行抵達 Level 10，穿過生鏽金屬拱門抵達 Level 607，觸摸雕像角切出到隨機安全層級"}, "77": {"name": "哦，謝南多厄", "class": 3, "summary": "Level 77 是一片起伏的山丘和山谷，被茂密落葉林環繞。中心區永遠是白天，周圍森林永遠是夜晚。濃霧瀰漫。有大量 Nguithr'xurh 群落和特有的謝南多厄羊。", "entrances": "從 Level 32、48、249、415 等森林區域行進時無縫進入", "exits": "在周圍森林行進超過6公里有65%概率切出到有茂密森林的層級"}, "78": {"name": "空間站", "class": 2, "summary": "Level 78 是一個無重力的國際空間站設施，有各種房間和過道。舷窗外是星空，盯視星星太久會產生幻覺和衝動。水耕農場、臥室、分離倉等區域。有肢團和悲屍出沒。", "entrances": ["在 Level 56 找到氣閘門進入", "在 Level 5 鍋爐房找到相似門"], "exits": "低概率氣閘舷窗顯示 Level 11 街道景象，通過後抵達"}, "79": {"name": "機中幽冥", "class": "死區", "summary": "Level 79 是一個 20 世紀中葉風格的醫學研究所，有7個房間。有一台帶16面鐘的神秘機器，每30分鐘發出敲擊聲和顫動。時間不穩定。", "entrances": "主廊道開端的門理論上會在任意層級隨機出現", "exits": "通過主廊道開端的門離開"}, "80": {"name": "遺思", "class": "unknown", "summary": "Level 80 是一個沼澤地區，有骯髒的泥濘和枯萎的樹木。有一位名為驢曼的友善居民會帶領流浪者找到出口。整個層級是立方體形狀。出口是一扇寫著 Save 的生鏽金屬門。", "entrances": ["切出時意外墜落進入泥濘"], "exits": "爬上山頂通過生鏽金屬門抵達 Level 11"}, "81": {"name": "賦閒結局", "class": "其他", "summary": "Level 81 是一個充滿詩意描述的溫暖舒適空間，有舊毛毯、檸檬清香、畫作和溪流。是一個讓人安心休息的地方。以詩歌形式呈現。", "entrances": ["從多個層級隨機切入抵達"], "exits": "休息滿足後自然離開抵達其他層級"}, "82": {"name": "自選交易集市", "class": "2", "summary": "Level 82 是一個巨大的交易集市，有便利店、購物中心、加油站等各種建築。大多數入口同時也是出口。是後室重要的貿易中轉站。", "entrances": "通過各種建築（便利店、購物中心、加油站等）從多個層級進入", "exits": "通過相同建築返回原層級，旋轉門通往 Level 159，石門通往 Level 241 和 Level 532"}, "83": {"name": "沉沒的潛艇", "class": 0, "summary": "Level 83 是一艘沉沒在 600 米深海的核潛艇「黑桃A號」。食物和水會自動補給。潛艇內部安全舒適。外部有巨大的章魚狀實體「大觀察家」出沒。有船員社區居住。", "entrances": ["從 Level 7 下潛到極深處昏迷醒來"], "exits": "打開逃生艙門游回海中返回 Level 7"}, "84": {"name": "移動迷宮", "class": 3, "summary": "Level 84 是一個巨大的樹籬迷宮，有死路和霧氣。偶爾會出現郊區住宅。夜晚有實體出沒。M.E.G. 在安全區域建立了多個前哨站進行貿易。", "entrances": ["地鐵偶爾停靠", "在 Level 97 剪樹葉", "走進 Level 62 灌木叢洞口", "Level 82 的門"], "exits": "切入樹籬牆壁抵達 Level 10 或 118，困在牆壁中抵達 Level 90，藍色金屬門通往 Level 85，沙漠出口通往 Level 46"}, "85": {"name": "光芒永存", "class": 3, "summary": "Level 85 是一個污染嚴重的荒地，有極端天氣和有毒煙霾。分為草原、丘陵和公路三個區域。塑膠草覆蓋地面。離開幾乎不可能，只有意外切出才能成功。", "entrances": "所有已知流浪者都是從 Level 6 切出抵達", "exits": "幾乎不可能離開，只有無意間的切出才會成功"}, "86": {"name": "水門塔", "class": 0, "summary": "Level 86 是一座 31 層的現代化辦公大樓，分為大廳和上層樓面。有 11 效應使無面靈表現正常。有餐廳、藝術畫廊。14 層有 Britagne 王國敵對組織。頂層有大量資料電腦。", "entrances": ["在 Level 11 找到圓柱形建築進入"], "exits": "從進來的路返回，少數門通往 Level 4"}, "87": {"name": "時間長廊", "class": 1, "summary": "Level 87 是數英里長的走廊，兩側有上鎖的門和桌子上的鑰匙。時間非線性，可能遇見過去或未來的自己。不要與過去未來的自己互動，否則齒輪締造者會介入。", "entrances": ["切過 Level 21 的門進入", "在 Level 9 走進房屋"], "exits": "少數門通往其他層級，據說切門可抵達 Level 119"}, "88": {"name": "默湖", "class": "待定", "summary": "Level 88 是一個冰冷寂靜的湖泊，會吸收聲音。靠近湖邊會導致失語。浸入湖中會聽到無數噪音和尖叫。湖中有血肉團塊實體。M.E.G. 認定為非宜居。", "entrances": "在有茂密黑暗森林的層級中夜間遇到", "exits": "離開湖邊森林返回原層級"}, "89": {"name": "驚懼公園", "class": "unknown", "summary": "Level 89 是一個公園停車場迷宮，有帳篷和奇怪的瓶子。會導致人精神錯亂和失憶。有危險實體追殺。小隊探索後大多失聯。", "entrances": "從 Level 0 或其他層級意外切入抵達", "exits": "找到出口可返回進入的層級"}, "90": {"name": "新房", "class": 0, "summary": "Level 90 是一間全新裝修的兩層住宅，由後室裝修公司翻新。曾經是刑罰迷宮和屍鼠巢穴，現在已經全部整修完畢。有空調。溫馨舒適。", "entrances": "想到「家」之類的概念就可能抵達", "exits": "後院老橡樹周圍有出口"}, "91": {"name": "只是一段回憶", "class": 0, "summary": "Level 91 是大海中央的一座小島，有一間海邊小屋。天氣晴朗涼爽，感覺似曾相識。在沙發上坐下會不知不覺睡著，醒來就到了別的地方。美好而短暫的體驗。", "entrances": "進入方式未知，是罕見的隨機抵達", "exits": "在沙發上睡著後會自然離開到隨機層級"}, "92": {"name": "輻射避難所", "class": 5, "summary": "Level 92 是一系列核掩体和隧道，類似 1980 年代防空洞。有高輻射區域，牆壁會移動封鎖逃生路線。大量突變實體出沒。有異常計算機設備。M.E.G. 有「熱核戰士」哨站。", "entrances": ["Level 9 和 11 的艙門", "Level 17 和 34 的某些門"], "exits": "原路返回，長隧道通往 Level 2 或 3，牆壁開口通往 Level 170"}, "93": {"name": "頂峰", "class": 4, "summary": "Level 93 是一座類似珠穆朗瑪峰的無底大山，極度嚴寒，最低溫可達 -186.94°C。空氣稀薄缺氧。山頂可能爆發。沒有已知出口。首批探索隊全體遇難。", "entrances": "從 Level 8 角落切出，或離開 Level 8 時隨機抵達，在 Level 47、135 把自己埋進雪中，卡入 Level 115 牆壁", "exits": "沒有已知離開方式，據說下山可抵達 Level 135 但未再重現"}, "94": {"name": "動畫", "class": 3, "summary": "Level 94 是一個定格動畫風格的小鎮，有 1930 年代風格的建築和車輛。白天安全，夜晚「動畫」實體出沒。透明山上有懸浮城堡，城堡中有「王」會考驗流浪者。通過考驗可離開。", "entrances": "從終點逃離後在樞紐找到長方形洞口進入", "exits": "通過王的考驗傳送到隨機主要層級，某些房子通往 Level 7、9、53"}, "95": {"name": "向聖愛", "class": "其他", "summary": "Level 95 是一個以機械神為主題的神學層級，正在不斷建設中。新走廊不斷湧現。充滿宗教神秘主義和工業革命美學。", "entrances": ["從 Level 94 深入抵達"], "exits": "層級仍在建設中，出口未知"}, "96": {"name": "慰藉", "class": "其他", "summary": "Level 96 是一個黎凡特風格的房子，俯瞰群山。是遠離戰爭的喘息之地。充滿對童年故鄉的懷念。咖啡香、地毯觸感、山景。是作者對黎巴嫩戰爭記憶的投射。", "entrances": "從戰爭相關或壓力大的層級切入抵達", "exits": "休息夠後自然離開"}, "97": {"name": "燈塔", "class": 3, "summary": "Level 97 是一個被海洋環繞的小島，中心有燈塔。永遠是夜晚，有巨大新月。燈光會殺死被照到的物體。島上有食屍鬼實體。有 18 世紀帆船殘骸作為安全區。M.E.G. 在帆船有哨站。", "entrances": ["在 Level 17 隨機門進入", "穿過 Level 532 走廊"], "exits": "穿過帆船牆壁抵達 Level 100，船上門通往 Level 372，燈塔廢墟艙門通往 Level 522"}, "98": {"name": "城中小館", "class": 1, "summary": "Level 98 是一條不斷循環的磚石街道，中間有一家小餐館。餐館有黃色熒光燈標識。實體看起來像熟悉的人但臉部模糊。小館食客是友善的流浪者社區。", "entrances": ["在 Level 5 或 11 找到金屬門", "在 Level 6 長久徘徊從巷子走出", "從樞紐通過相同門進入"], "exits": "街道盡頭巷道抵達 Level 6，從來時的門離開，餐館洗手間通往 Level 103"}, "99": {"name": "食屍鬼鎮", "class": "綠洲", "summary": "Level 99 是一片紅色金屬沙礫沙漠，永遠是橙色天空。空氣中有 30% 鐵鏽粉塵，需要氧氣罐。有食屍鬼鎮，居民是溫和的類人食屍鬼。入口是懸浮在 Level 4 的門。", "entrances": ["在 Level 4 找到懸浮門上寫著食屍鬼鎮", "在 Level 11 找到懸浮活板門爬入"], "exits": "從進來的門返回，泳池門通往 Level 7，塵土門通往 Level 85，遊戲廳門通往 Level 389"}, "100": {"name": "寂静之声", "class": "unknown", "summary": "Level 100 是一條細長的海灘線，道路兩側被無限寬廣的海洋包圍。沙子光滑，道路不斷延伸，似乎沒有終點和起點。沿著小路前進偶爾會遇到隨機物體，通常是個人物品如手機、照片、衣服等。走得夠遠會見到墓碑，每塊墓碑上刻著一張臉和日期，推測為死亡日期。海洋兩邊都是無限的，水下能見度清晰，海底由沙子組成最終固化成岩石。主要實體是「影子」，只能在周邊視覺中看到，具有精妙偽裝能力。", "entrances": ["在 Level 11 裝死直到影子把人送到 Level 100（目前唯一已知方式）"], "exits": ["擺弄海灘上的物品或墓碑會吸引影子出現，將人送到 Level 0"]}, "101": {"name": "你的梦永无破晓", "class": 2, "summary": "Level 101 是一個近乎完美的地球複製品，進入後會在進入後室前的家中醒來。普遍理論認為流浪者會重歸進入後室前的生活。但存在許多「不一致」：路燈柱太高、杏仁水不存在、聲音與源頭不同步（滯後）、遠處看動物皮膚缺失或過量、新西蘭不在地圖上。頁面以敘事詩歌形式呈現，講述一個流浪者在這個複製地球上與家人團聚的悲傷故事。", "entrances": ["在 Level 2 發現的未上鎖的門（可能性未知，僅7例記錄）"], "exits": ["說出「我準備好回去了」會陷入昏迷，在 Level 0 蘇醒"]}, "102": {"name": "哀境", "class": "unknown", "summary": "Level 102 是一個以詩歌形式呈現的層級，描繪了困在絕望深淵中的人尋找出口的心境歷程。頁面分為四個章節：君安能悟之？（悲傷與接納）、心若安和豈無思辨之能？（憤怒與冷靜）、後之暗夜又當如何？（悲傷與堅忍）、悲戚如是終亦會逝。每個章節對應不同的情緒狀態和房間環境，最終引導流浪者通過接受失去、釋放憤怒、堅忍不拔來離開。", "entrances": ["未知，頁面未明確記載具體入口方式"], "exits": ["通過接受悲傷、釋放憤怒、堅忍不拔的過程最終離開此層級"]}, "103": {"name": "繁花墓窟", "class": 2, "summary": "Level 103 是一片幾乎完全被茂密花卉植被覆蓋的室內空間，呈現為相互連通的房間網狀系統。牆壁、地板和天花板均被未知攀緣藤蔓覆蓋，開滿鮮艷粉紅色繡球狀花朵。花朵釋放微小顆粒物，含有東莨菪鹼與裸蓋菇素，會導致嚴重幻覺和中毒。地板由密集根系網絡構成，下有大量骨骼遺骸。入口不穩定，曾出現在新時代廣場和 Level 3 的 M.E.G. Gamma 基地。", "entrances": ["入口不穩定，曾出現在新時代廣場公寓樓儲物間和 Level 3 的 M.E.G. Gamma 基地"], "exits": ["找到入口門立即離開（強烈建議）"]}, "104": {"name": "尘世之终", "class": "4e", "summary": "Level 104 是一處荒無人煙的濕地，中心有一座15世紀南歐風格的石質堡壘。基岩層由鬆軟陶土狀黑泥組成，空氣腥腐難聞，攜帶翡色腐殖孢子。經常降下酸雨。綠色水晶是翡殖症病患的屍體。堡壘內駐有來自16世紀歐洲的流浪者，他們追尋「塵世之終」。翡殖症是一種真菌感染，從病患體內抽取金屬構造綠色水晶，48小時後皮膚掉色，120小時後完全結晶化。實體「集翠者」尋找病患屍體。", "entrances": ["在 Level 28 內的鐵質牢籠內用麻繩捆紮雙手到達避世所空牢房", "在後室任意地點經歷溺水瀕死之感會在木製小船內醒來"], "exits": ["在避世所內穿過帶有「🜛」標誌的門到達 Level 73 的銀色城堡", "穿過避世所較清潔處到達 Level 183", "沉入沼澤有小概率隨機到達另一個濕地層級"]}, "105": {"name": "祈祷所", "class": 1, "summary": "Level 105 類似一座寬敞的教堂，內部極度簡約無菌。近200張木製條凳整齊排列在兩側，祭壇上無任何宗教符號。裝點區域的是數學符號和幾何形狀（正多面體），而非宗教符號。被稱為「祈禱所」，是一處可禮拜任何宗教的地方。居民「教眾」約350人，是後室孤兒的主要監護人。資源豐富，有醫生和藥劑師社區。有「虔信探險者」外出宣傳邀請流浪者。領導者為「啟明者」。", "entrances": ["在 Level 11 內找到一座大教堂並進入前門", "切入任意層級內的陳舊木製家具有較小機率來到", "找到並攜帶一本封面無符號的宗教書籍會切入", "切入小型噴泉中有可能來到"], "exits": ["穿過主門回到 Level 11", "將手部浸入小型噴泉過深會切入 Level 7", "切入木製家具可能來到含有此類家具的層級", "切入牆中可能來到較為安寧的層級"]}, "106": {"name": "Level 106", "class": "unknown", "summary": "Level 106 是一系列無限延伸的走廊，通往各式家居房間（臥室、客廳、儲物間、廚房）。分三個區段：A段（最安全，無實體，有維存能力）、B段（更破敗，有獵犬、笑魘、肢團）、C段（最危險，植被叢生，無光照，實體四伏）。存在「受人監視」的怪異效應。有「安居者」（8-10人團體，留在A段）和「協濟者」（幫助他人逃離的團體）兩個社區。電視循環播放粘土動畫電影片段。", "entrances": ["切入方式不明，但流浪者到達此處很常見"], "exits": ["在C段底部找到門可到達其他層級（如 Level 0）"]}, "107": {"name": "分裂的现实", "class": 4, "summary": "Level 107 是一個能影響流浪者的異常層級。真實外觀未知——當生物到達時會遭受嚴重精神衰變，並被傳送至被其他流浪者認知的「虛假」區域（描述為破舊污損的房間）。虛假區域中持續發出靜電聲與尖叫聲，暴露超過72小時導致聽力損傷。有悲屍、感染疫疾的蠕靈、鴨典娜、瓷磚陷阱等實體。理論上真實的 Level 107 是一個巨型智慧實體，使用心智扭曲操作將人傳送至虛假空間。", "entrances": ["通過 Level 106 內的特定門來到此處", "進入 Level 135 發現的一口特別的井有極低概率到達"], "exits": ["每經過35個房間，天花板上的洞可爬到其他層級（通常到 Level 68）", "從地板切出到達 Level 108"]}, "108": {"name": "沃土", "class": 4, "summary": "Level 108 被蒼翠原始森林佔據，分為巨坑森林（30萬平方公里溫帶森林，中央有巨坑釋放誘變性霧氣）和出沒森林廣地（「薛定諤的森林」，地形處於空間疊加態）。霧氣含有微生物病原體，會大幅改變宿主DNA導致極端變異。有樹肢體、黑山羊等獨特實體。新赫雷斯研究綜合體由 B.N.T.G. 運作，是最安全地點。F.O.R.E.S.T. 安全協議為生存指南。", "entrances": ["任何有森林的區域最終都可能到達，包括 Level 32、35-ID、39、48、PL-53、77、116、249、415 等"], "exits": ["紫色指示蹤跡標記已知出口，新赫雷斯居民可協助離開"]}, "109": {"name": "霓虹医院", "class": 2, "summary": "Level 109 是無數道長度不同的醫院走廊，平均長度2.9英里。走廊上有大量缺乏標籤的門，通向各種醫院「禮堂」房間（供應室、手術室、ICU、藥房、生物危害室等）。禮堂平均面積900平方米。實體居住在禮堂中，流浪者離開禮堂時必須關門以防實體進入走廊。有「醫生」社區，由前廳醫生組成，提供醫療幫助和用品。", "entrances": ["切入 Level 11 裡醫院中一面錯亂的牆", "在 Level 14 受重傷被擊倒後可能在此醒來（罕見）"], "exits": ["進入走廊中任意一間標有出口記號的門到達 Level 114"]}, "111": {"name": "模型地板", "class": 1, "summary": "Level 111的地板对新来的旅行者来说很显眼，似乎完全由OO/HO比例（分别为1:76和1:87）的模型铁路组成。这些模型建筑在外观和触感上都是用硬纸板制作，尽管它们不可能被摧毁。这同样意味着穿越也许会很困难，因为很多时候你会发现自己被无法穿透的建筑绊倒，或者你可以小心地站在它们的屋顶上，并沿着这条路探索。 Level 111完全在室内，墙壁看起来像是一个空荡荡的高中体育馆墙壁，且为纯白色。学校的“标识”是三个随机的亮橙色字母，字母会根据你所在的房间而变化。体育馆内存在门，但总是通向其他设计完全相同的体育馆。模型铁路总是横跨整个层级。 健身房的墙壁上被挖出了一些小孔，这些小孔都有轨道穿过。墙壁内部被证实有空间，这些空间被称为“中转站”。这里是模型火车进出其他轨道和其他房间的位置。房间里一片漆黑，似乎完全无法进入，因为任何不是火车模型的东西最终都会进入 绝缘层 。 虽然模型建筑不能被摧毁或移动，但模型火车本身可以。火车通常都采用1950-1960年代的火车外形，它们都以半稳定的速度前进，但如果前面有另一列火车或其即将穿过它们附近的一些站点，它们似乎会稍微减速。如果一个人要踩上火车或使", "entrances": ["为了进入层级，你可以在 绝缘层 中找到小孔并进行切出，或者你可以在 Level 52 中进入一扇门，可以通过虽然其没有喋喋不休的声音，但类似于Level 111中声音的模型发动机运转时发出的叽叽喳喳声来寻找这些门。进入Level 111的另一种方式是在 Level 94 的一些房屋内找到一张火车表格，与表格互动将带您到达该层。"], "exits": ["要离开层级，你可以找到通往Level 52的门，或者切出至绝缘层。另一种离开的方式是找到通往 Level 9 的大型门。"]}, "112": {"name": "魔口", "class": "A", "summary": "Level 112 是一个起着极端大雾的大房间（大约有800x800米的大小）。来到过这里的流浪者报告称不可能看到一尺开外的任何东西。 这里的地板是一层由金星捕蝇草组成的地毯，墙壁是典型的石灰墙，而天花板由于雾实在太浓看不到是什么样子。这里仅有的实体是 求思脑 和偶尔会出现的一些 挺进者 ，而且你在这里可以找到一些 杏仁水 和 微笑液 1 。 求思脑 是 Level 112 所独有的实体。这里当下仅有着50个该实体，在前厅中很容易就会被列入“濒危”名单。 求思脑 是被触手布满脑干的人类大脑。 2 它们用这些触手四处走动并攻击流浪者。 如果一个 求思脑 注意到了一个流浪者，它将吸附到他们身上并用它的触手缠住他们。这些触手会造成极大的创伤，如果不加以处理，它将导致流血并且造成大量失血。 求思脑 是一个平均大小的人类大脑，有着所有正常的人脑部分和脑叶。唯一不同的地方是在脑干地方布满了触手。 求思脑 看起来没有眼睛、耳朵，或是其他的感知器官，但是却能轻易地发现流浪者。 求思脑 是在2020年11月1日于 Level 112 发现的。第一个发现这里的流浪者报告说她正“只是看着那个大脑一样的东西，", "entrances": ["杏仁湖。这是你们这么称呼它的？ 不过，里面再没有任何杏仁了。 跳进去吧。 在此与我相遇。 我会一直陪伴在你左右。"], "exits": ["在 Level 112 待太久似乎会触发某种传送机制并把你带到 终点 。", "Aether48 由 shadowednight 翻译"]}, "113": {"name": "真正的机器之地", "class": "unknown", "summary": "Level 113 — 通称 “真正的机器之地” 1 ，旧称 “机器之神” 2 — 是一片城市化的环境，可分为三（3）块特定区域，分别编号为 区域 Aleph（א） 、 区域 Bet（ב） 及 区域 Gimel（ג） 。 区域 א 曾被认定为完整的 Level 113 ，是一结构类似燃油发电站的大型自动化设施； 区域 א 相当残破，沿墙壁散布有缺罅及裂缝，墙上布满污渍。 א 的墙壁主要由混凝土筑成，并用钢筋和钢框架加固，只在有窗户的部分中断。整个 区域 א 的地面均铺有地砖，其材质为某种未确认的陶瓷材料，该材料部分性质与普通砖块相符。 区域 א 的灯光主要由白炽灯提供，这些灯似乎有故障，发光质量参差不齐，有时会在毫无征兆的情况下熄灭。 区域 ב 是一片类似美国大城市的环境。该区域完全由铝、铁、钴和铜等金属材料组成。 区域 ב 在其限辖范围内有数量最多的实体，通常位于大道上和大多数建筑的底层。这些建筑被认定为异常现象，有时被描述为 Level 113 中被忽视的实体物种；之所以如此认定，是因为这些建筑在附近存在可能有害的刺激时可以“装死”，显示其具有原始智能。除堡垒及发电站（见 区域 א", "entrances": ["[应停战协议要求进行编辑处理]"], "exits": ["原 Level 110 - “奇点之后” 当前，自 区域 ב 的边缘处跳下可以抵达原 Level 110 。在原 110 被破坏前，自 Level 113 某幢建筑的屋顶层经一扇门离开便可抵达原 Level 110 。类似于通向 Level 11 的出口，该门也会在有人通过其离开后自动锁死。", "Level 11 - “无限城市” 欲进入 Level 11 ，须在 区域 א 内找到一扇出口门，该门通往 Level 11 中一扇随机的出口门。一旦离开，该门将自动锁死，无法返回。", "目前为止，已知 Level 113 的出口只能通往 Level 11 、 [已编辑] 和原 Level 110 。"]}, "114": {"name": "甜蜜之梦", "class": "怀旧……？", "summary": "Level 114 具有空间不同步性——除去一些个例，每个流浪者在该层级的经历都大不相同，且无法遇见其他人。物理上，这一层级的外形类似于每个流浪者在青春期前（约9-12岁）的童年时代的卧室。 如果流浪者的童年时代有不止一间卧室， Level 114 将会呈现为一空间混乱的建筑，类似于 Level 38 ；其常被描述为“许多房间不稳定地融合在一起”。此外，如果两个或以上曾共用同一个房间的流浪者同时进入 Level 114 ，他们将出现在同一空间。只有在这种条件下，流浪者才能观察到同时位于层级内的其他流浪者。 流浪者刚进入 Level 114 时，通常会发现自己站在门廊中，面向房间；身后的门微微半开，而更远处除了一片漆黑的虚空之外再无他物。 除了虚空之外，该层级不同的表现形式中，另一个关键的相同点便是房间中的床。在所有 Level 114 案例中，流浪者童年的床都会被同一张单人床取代。 1 它的床垫与木制床框紧紧契合着，床单是蓝色的，底面绘有花卉纹样。床虱侵蚀着整张床垫，躺在其上的流浪者通常会发现自己暴露的皮肤遭受叮咬而罹患皮疹。 此外，伴随Level 114显现的大多数电子设备和电器无法", "entrances": ["在 Level 109 的走廊中任何一扇标有出口的门都会进入Level 114。", "远行越过 Level 29 的边界，据推测会进入 Level 114 ；"], "exits": ["用沉闷的声音说“我好无聊……”就会让你到达 Level 25 。", "在这个房间中睡着，你就会在 Level 9 的一条街道上醒来；"]}, "115": {"name": "衰败档案库", "class": "1E-环境危害", "summary": "Level 115表现为一个无尽的档案库，大量金属书架夹着狭窄的过道，书架上摆满了盒子，其中大多装满白纸 1 。由于层级内空气凉爽、湿度极低且实体近乎绝迹，各大团体均利用本层级储存物品和文件。 该层级电力基础设施年久失修，火灾风险大大增加，这威胁到了层级内人类居民和库存档案的安全，然而， M.E.G. 无法改善档案基地内部及周边地区的安全状况，因为维修基础设施会带来实质性风险，人们担心大范围改变层级状况会导致又一次“脱稳事件” 2 的发生。", "entrances": ["Level 115的主入口位于 Level 11 。M.E.G.在此处设置了清晰的标记，此入口可以直接抵达M.E.G.档案基地。", "进入 Level 168 中标有“员工专用”的门可以到达Level 115。", "在多个层级可以找到标有“档案库”的门，进入后会来到Level 115。"], "exits": ["图片名：WikiXDC National Archives Tour Hall - Stierch.jpg 作者：Missvain 授权协议：公共领域 来源链接： https://commons.wikimedia.org/wiki/File:WikiXDC_National_Archives_Tour_Hall_-_Stierch.jpg", "建议流浪者不要在衰败区尝试切出，这样做大概率会来到危险层级，记录中甚至有3次出现流浪者切出后被困在 蓝色通道 中的情况。", "在层级内大部分区域切出通常会抵达 Level 162 。", "层级内可以找到消防通道，它们通向各种不同的层级。", "更多授权相关信息，请查阅 授权指导 。"]}, "116": {"name": "神顶镇", "class": "unknown", "summary": "InspectingCritters 、 scutoid studios 、 PrismaticMoose 古雅的小镇 – 狭隘的卵石街道纵横交错，两旁坐落着形态各异、大小不一静谧的民居。我看到的民居中，最常见的是以木石建成，从简易的房屋，到建筑奇观的杰作应有尽有。在我曾去过的众多地方中，这里的设计算是比较合乎条理的；也许这里的人们的祖先曾亲手建造了这座城镇。在这样的地方，这无论如何都是一项了不起的壮举。 晴朗白日里偶尔会有清新而凉爽的夜晚，神顶镇的天气无可挑剔。我在此停留期间，这里的降雨很少超过一小时，雨势也始终保持在适宜的强度。这样的阵雨实属必要，镇上每栋房屋的阳台都设有小花园，居民们在园中种植粮食与各色花卉。最终，这些作物与鲜花都会被送往镇上的教堂。 若你沿着街道前行，穿过煤烟斑驳的房屋、鹅卵石铺就的小巷与布满青苔的河边石制围墙，一直走到镇中的广场，便能看见一座极为奇特的建筑。这座教堂以纯黑的外观与周围建筑形成鲜明的对比，仿佛在抗拒周遭单调而静谧的景致。这座肃穆的石制建筑歪斜的尖顶，高度远超周边建筑；如果不是有点恐怖，这确实鼓舞人心。 教堂东侧有一座拱门，穿过它便能途经镇上仅有的", "entrances": [], "exits": []}, "117": {"name": "伊莎贝尔峡谷", "class": "unknown", "summary": "肃穆小径 - 当我沿着 神顶镇 那座可怖山峦的南岸疾行时，眼前之景象骤然变幻为一条陡峭狭窄的通路。小径被陡峭的石灰岩绝壁所环绕，向渺茫的远方蜿蜒伸展。此地植被稀疏，仅存的几棵树木仿若草叶尖上将逝的晨露般顽强求生。原本澄澈的天空此刻却被一片阴郁的怒云覆盖，雷霆轰鸣而始终不见暴雨降临。 我沿着平缓的坡路向上攀登，转过山脊最顶端的弯道时，峡谷西侧的峭壁豁然裂开，显露出一座幽深的洞窟。我的好奇心，一如既往，战胜了理智。我当即决定放弃即定的徒步路线，系紧绳索，点亮提灯，迅速开始降落。 啜泣洞窟 - 狼狈的跋涉多少 浇灭了 我的冒险热情——不过并未完全浇灭。我卸下装备，仔细折叠后收入背包。身处的洞窟比来时的山路要冷的多，寒冷的空气丝毫没能驱散寒意。举着提灯环顾四周时，长满青苔的墙壁泛着湿漉漉的光泽。花岗岩质的石笋布满地面，仿佛要从清澈的地下水中挣脱而出。眼前只有一条路可走，我钻过狭窄的入口，进入了一个潮湿的通道——这里将是众多通道的第一站。 此段通道很短，尽头处是一个光线昏暗的洞窟，坑洼不平的地面布满了被侵蚀而成的畸形陷阱。每踏出一步都得小心翼翼，生怕失足跌倒，借着东侧墙壁的指引缓缓穿行。就在此时", "entrances": [], "exits": []}, "118": {"name": "至暗露营地", "class": 2, "summary": "由 owl4513 、 jiaoyanerlan2 、 KkKkK_1234 翻译 部分灵感源自 Bonnie Quinn 所著的 How To Survive Camping 系列作品。 深夜时分，我们走在回家的路上。周遭为何如此漆黑？街边的路灯尽数熄灭。我们抬头望向漆黑一片的夜空。她轻声呢喃：“我都忘了夜色能这般暗沉。”纵然高楼林立，人造太阳遍布，可我们依旧如同老鼠，在亲手搭建的迷宫中急匆匆地跑，慌忙寻找遮蔽以躲避头顶那片永恒的虚空。 闭上眼，暂失视觉——你理所当然地以为，外面的世界依然存在，稳定如常，待你重新睁开眼皮那一刻，它便会如期回返你的感官。可当你关掉灯，陷入一片浓稠得与虚空无异的黑暗时，那份信心或许会动摇，但你仍然知道，并且确信：现实并未因光的缺失而消逝。 ——在这里，事物并非简单地藏匿。它们被带走、被吞噬、被吞没。现实被熔解为虚无，那份优雅与流畅，如同海浪抹平岸边的沙堡。光照不到的地方，便不只是黑暗——它简直像从未存在过。 这片黑暗对它所笼罩的一切，持续施加着无处不在的压迫感。阴影从光线微弱的边缘悄然逼近，耐心地一寸寸蚕食，直到光线渐渐萎靡、暗淡，最终彻底溃散。当它靠得", "entrances": [], "exits": []}, "119": {"name": "Level 119", "class": "unknown", "summary": "Level 119 的頁面內容未在此次抓取中完整取得。", "entrances": [], "exits": []}, "120": {"name": "损毁的服务器", "class": 2, "summary": "Level 120包含有损毁的服务器机房，房内不再光洁的白地板上摊着很多支离破碎的计算机显示块。墙壁木制，已有腐烂，上贴有略脏的黄色墙纸。天花板由普通办公室的房顶铺砖构成，上装有已破碎或有故障的荧光灯。屋内多漆黑一片，光线都来自于第二类更为奇怪的房间之中。服务器机房以15-23个为一组。 Level 120的第二类房间为白色空屋。它们以6-12间个为一组，其中有黑色的门可以通向其他白色房间。 笑魇 往往为房间的空旷所吸引，虽然它们常常沉溺于该房间自然发出的光中，但它们仍然会攻击你。 最后一类房间为漆黑走廊。其狭小且极长，可以连接到不同的服务器机房。虽然此处很少有实体存在，不过由于在这里容易绊倒，故不建议走过这里，如果你被绊倒了，便很有可能伤到你自己，而且会意外产生此处三个实体之一——亚故障干扰体。 寻找白色空屋或漆黑走廊较为容易，只需要找到一个比较完整的计算机显示块。将其启动，便可“载入”漆黑走廊或白色空屋。若想要逃离这些房间，需要一直沿着一个方向走，即可到达该组房间的边缘。在每组房间的边缘都存在有一些窗口，这些窗口通向带你到该子域的计算机显示块。由于这些窗口多已被打碎，所以你平常不需", "entrances": ["若要进入，你可以使用 Level 25 中的一个屏幕破碎的街机。街机的颜色不重要，你也可以通过打碎其他街机的屏幕来开启Level 25的通往本层级的门径。又或者你可以在 Level 4.3 中发现一扇标着“服务器机房”的门，通过该门即可来到此层级。"], "exits": ["若要离开，你可以在服务器机房或漆黑走廊中发现可以把你带回 Level 4.3 的门径，或者从服务器机房的墙壁切出，即可达到 Level 70 。"]}, "121": {"name": "消逝之岛", "class": 2, "summary": "Level 121 是一片由森林岛屿组成的群岛，位于一片可能无边无际的海洋中。Level 121 似乎包含六个大小不一的岛屿（其中三个已命名），其中最大的岛屿艾里希亚（Irisia）有 30 平方英里（77.7 平方千米）。其昼夜周期是地球的两倍。这个周期似乎并未对这些岛屿的宜居性产生影响。气温从未高于 85°F（29°C），也从未低于30°F（-1°C）。 本层级的气候最为符合温带。空气不自然地静止，因为几乎任何时候都无风。然而，这里有极度频繁的 杏仁水 降雨，偶尔还会有暴风雨。这里的实体不会受到杏仁水的负面影响，并饮用它来维生。 岛上的大部分森林都很古老。本层级最著名的实体， 紫眸者 ，已建立小型定居点，并清除了其周围的森林，在边界上创造出新的森林。 约有300名紫眸者居住在这一层级。其中大多数居住在艾里希亚岛一个名为多玛之土（Domum Terra）的定居点，有大约 150 人口。另外两个次大的岛屿，维奥莱塔（Violeta）和韦尔贝纳（Verbena），各有大约 50 人口。在其它较小的岩石岛屿上，还分散着一些孤立的个体。在海上，木船和浮动房屋中，是剩下的 50 名个体，他们共", "entrances": ["Level 121 可由 Level 23 进入，但具有几率性。为此，必须进入该层级的水库，但可能会将流浪者切入其他层级而不是 Level 121。正因如此，M.E.G.认为该入口并不可靠。紫眸者能够始终经由 Level 23 回到 Level 121，但其方式仍未披露。Level 121 也可由潜入 Level 134 海洋的方式进入。从 Level 125 的海岸横渡海洋，也可能带人到达 Level 121 的岛屿。偶尔，尝试从 Level 7 的洞穴入口切入 Level 8 ，反而会带流浪者来到这里。"], "exits": ["Level 121 总是可以通过多玛之土边缘附近的一棵奇怪空心原木离开。紫眸者们总是乐于向流浪者展示该出口。这个出口通向 Level 23 。潜入海洋可能将人切入 Level 85 的船体附近或 Level 97 的岛屿附近。横渡海洋最终将带人来到 Level 125 的海岸。", "照片来源： 原木出口， 蛛网树， 蝶象， 跃鹅， 六角海星， 背景， 针果， 触角花， 层级最高点， 海岸， Logo | 这些文件根据 CC-BY-SA-3.0 协议获得授权。", "本条目的原作者是 Beep Bot 和 Kitty Rika 。", "通往 Level 23 的出口。"]}, "122": {"name": "守门人的明灯商场", "class": "unknown", "summary": "一座商场能承载很多：人、物、记忆。我们很少会停下来去想，商场本身就是一种共同的体验。 但他脸上那副体谅与共情的微笑，却完全看不出这一点。这表情他练过几百次了：眼睛睁大，眉头紧蹙，腮帮微鼓，再加上最点睛的一笔：一个了然于心却点到即止的微笑。 那位中年的母亲继续冲他大吼。她气得涨红的脸几乎贴到凯尔脸上，近到他大概都能猜出她昨晚吃了什么。而与此同时，她的孩子一直在店中央大发脾气。 “这太荒唐了！既然不卖，你们干吗还要把它摆出来？”她说着，在他面前使劲晃了晃那袋 Reese’s 糖果。 凯尔真想朝她吼回去，告诉她那些东西就是莫名其妙切入到货架里的。但他不可能真这么做，除非他想被开除，连住的地方也一块儿丢掉。 “哼，我们不会再来了！走吧，山姆。”说完，那女人带着孩子气冲冲地走出了商店。这一切都不意外，和往常没什么两样：有人发现一件来路不明的商品，抱怨一通，闹上一阵，然后就走人了。 凯尔很快就可以回家了。所以眼下，他得继续上班。加班无所谓，压力也无所谓。只要女儿能有个安稳的家。 明里几乎不敢相信自己的眼睛。Level 122，她终于成功了！她会是第一个成功完成 tgochi.exe 的“商店扒手”", "entrances": [], "exits": []}, "123": {"name": "回溯", "class": 1, "summary": "Level 123 具有变形特性，总是呈现流浪者童年时期存在某种情感联结的地方的样子。试图走到外面去是徒劳的，因为门窗都无法打开，而且如果房子原本没有门，出口会被砖块填实堵死。 由于 Level 123 是为每位访客量身定制的，因此可以得出结论，两个流浪者不可能相遇。有人怀疑这个地方一次只能容纳一位访客，而且访客必须离开，下一位才能进入。 流浪者们报告说，一旦进入这个层级，就会感受到强烈的怀旧与恐惧交织的情绪。目前尚不清楚这种感觉是由层级本身引起的，还是与这个地方相关的记忆所导致的。这个层级里没有食物供应，但这并不需要，因为在那里没有人会挨饿。 Level 123 可通过一扇白色木门从任何层级进入，这扇门便是其入口。据报道，似乎只有那些有着严重童年创伤的流浪者才会遇到 Level 123 。不幸的是，尽管有七名流浪者报告说进入过这个层级并描述了它的样子，但只有一个名叫 JJ 的人，人们通过他拥有的日记，得以描述自身在那里逗留期间发生的事情。由于未知原因，访客们都记不起自己在 Level 123 期间发生过什么。因此，有人推测该层级本身会通过一种名为“选择性失忆”的过程来保护访客的心理健", "entrances": ["遭受严重童年创伤的流浪者可能会发现一扇白色的木门，它将通向 Level 123 。"], "exits": ["据信，原谅自己是离开 Level 123 的唯一方式。逃脱会将流浪者传送至一个安全层级。", "更多授权相关信息，请查阅 授权指导 。"]}, "124": {"name": "神游遗墟", "class": "unknown", "summary": "“那我们的小孩就起个傻气的名字，比如——” “木兰……要不就埃斯梅拉达” “笑死？？？谁会给孩子起名叫埃斯梅拉达啊” “那你可得给世上成千上万个埃斯梅拉达挨个道歉了，阿雅……” 神游遗墟。我之所以如此称呼此地，是因为它正在蚕食我的自我。我正用尽最后的气息，试图与某个并不存在的人对话，隐约期盼这能让我分心，暂时忘却 我终将死去 这无可避免的事实。操，在这里，战争的硝烟刺鼻，草木的气息却分秒滋长。战火曾如野燎原一样，而所有人拼杀的名义，竟是为了某个你甚至不知是否真实存在的人。你大概能由此想见，所有的偏见与恶毒究竟从何而来。此地呈现为一座黎凡特风格建筑林立的城镇，就像我父母相遇的那座城。我们相遇的那座城。屋宇温馨，街道空荡。它仿佛停滞在二十世纪。看来尚未重建。真是 沉闷 。 这地方在侵蚀你。我不会久留，越是前行，便越是迷失。它将那些使你为“人”的部分，从你身上剥离。我确信，待到终点，我将一无所剩。我的听觉已经失常。天知道继续下去还会发生什么，反正我是不会留在这里见证了。你会 被 污染，被吞噬，最终因相信此地灌输给你的病态虚构，相信你属于这里，相信这是你的“家”，而化为乌有。讽刺的是，昔日与你", "entrances": [], "exits": []}, "125": {"name": "记忆中的道路", "class": 1, "summary": "Level 125 是在长度上进行延伸的 66 号公路的一复制品，其路边地带存在大量人类以及 Entity 147 居住。该地带从路边起延伸 20 英里，随后逐渐崩裂，并转为一不可居住地带。人与 Entity 147 1 只能在距离路边 30 英里以内地带生存。Level 125 似乎拥有与地球相似的昼夜变化周期，但其周期时间长为 26 小时，而非 24 小时。由于层级的大小广阔，不同地区的天气可能不同，但总体遵循一月一变的规律，即同一天气每月重复一次。Level 125 的天空中无任何星星被观测到。该层级内也有来自 前厅 的一些动物，例如郊狼，鹿，蚯蚓，蛆，以及短尾猫，它们与只存在于 Level 125 内的其他动物一起栖息于此地。Level 125 独有的植物大多被发现在“道路的尽头”告示牌之外，所以大多数并未记录在案。 在平原地区内有一名为“道路的尽头”的告示牌。由于该告示牌后方更远处的地带的空气中二氧化碳含量随与告示牌距离而增加，其后方地带逐渐变得不可居住。由此，该告示牌被认为标志 Level 125 的宜居地带的边界。尽管如此，二氧化碳似乎并没有渗入标志以内的区域和通往标志的", "entrances": ["Level 125 的第一部分区域，即起点，有几率在行驶于 Level 121 的海上时发现。若流浪者在尝试离开 Level 83 时失败，则会有较大几率将会被海水冲到 Level 125 的岸边。在 Level 4 中可以找到破裂的木门，打开木门后流浪者将会切出至 Level 125 的起始建筑之外。若流浪者想进入 Level 125 ，这是最推荐的进入方法。"], "exits": ["Level 125 可以通过从起点的海上行驶离开，此时流浪者将会遇见 Level 121 或 Level 100 的岛屿。若流浪者在树林中建筑扭曲点之外继续行走太远，其将会切入 level-135 。在”道路的尽头“标志更远处可以发现存在扭曲的农舍，进入农舍后流浪者将会切入 Level 10 。", "（该文章的作者是 Beep Bot ）"]}, "126": {"name": "一图胜过千言", "class": 0, "summary": "Level 126表现为一间画廊，拥有多个展示艺术作品的房间和大厅，其中大部分为文艺复兴时期画作，包括大量当时名家的作品。除少数有显著差异外，这些画作都是对原件的精确复制，甚至使用的颜料和材料都完全相同。 来到Level 126时，进入者会身处一个白色小型房间，房门为木质双开门，其上用蓝色油漆写着“用眼睛去看”。门右侧的墙上为层级平面图，但由于每次进入时层级布局都有所不同，这张平面图总是不准确的。走出门会到达画廊的随机部分。 尽管可以有多人同时进入Level 126，但从每个人的视角看，层级内永远是空无一人的。若两人同时进入层级，走出门后他们就会分开，直至离开层级后才会再次相见。 Level 126中，仅有希罗尼穆斯·博斯的少数作品与现实原件不同 1 ，其中出现了众多原作不存在的人物，除此之外的部分与原作几乎完全一致。发现Level 126时画中多出的人数尚不明确，而随着对本层级效应的测试，画中的人数正在增长。 Level 126本身是绝对安全的，最危险的特性在于记录层级的方式。如果文档的长度超过了999个字词，作者（们）会在写下第1000个字词后突然消失，同时，他（们）的样貌将会出现", "entrances": ["Level 126可以从 Level 11 和 Level 230 进入。在Level 11进入一栋门上方写着“霍洛韦先生的盛大展览”的建筑将会到达Level 126。在Level 230进入一扇写着“哈迪·霍洛的勤勉之厅”的门也可到达Level 126。", "可以通过返回入口来离开Level 126，你会回到进入时的层级。", "更多授权相关信息，请查阅 授权指导 。", "作者： Entro_P 作者页"], "exits": []}, "127": {"name": "头痛", "class": "3e-环境", "summary": "构成 Level 127 的走廊由大型白色粉刷砖块砌成，偶尔配有厚重的钢制大门，这种门常见于 前厅 里的办公楼或校园场景中。该层级部分墙体靠近地面的位置设有电源插座，但仅有极少数插座实际上供电。 Level 127 的天花板是商业建筑中常见的普通吊顶样式，每隔几块吊顶板就配有方形灯具，还装有无法使用的喷淋头与监控摄像头。该层级内每扇门的上方，都悬挂着一块散发红光的出口标识，但这些门通常都无法通往离开本层级的真正出口。 Level 127 的地面由高反光硬质乙烯基地板砖铺设而成，地砖颜色看似随机分布，从白色、米白色到深灰色不等。该楼层墙面与天花板的样貌，连同照明设备发出的米黄色光线，都会不断映照在地面上。 第一眼看上去， Level 127 因不存在实体而显得完全无害。但在该层级停留一段时间后，流浪者会开始感到剧烈且持续的头痛，头痛源于天花板方形灯具散发出的米黄色光线。这类头痛虽不致命，却会造成严重的迷失方向感与意识混乱，停留时间越久，在层级内行进就越发困难。这种头痛往往还会引发极度逼真的幻视与幻听，让流浪者相信有实体正在主动追击自己，而实际上该层级并无任何实体存在。 Level 127", "entrances": ["虽然极其罕见，但可以通过 Level 1.5 切入 Level 127 。", "尽管很少见， Level 4 内的部分门可以通往 Level 127 。", "流浪者可通过 Level 87 切入 Level 127 。"], "exits": ["图像名： RedHallway 图像作者： LightEXE 授权协议： CC-BY-SA-3.0 来源链接： https://backrooms-wiki.wdfiles.com/local--files/level-127/RedHallway", "图像名： Level127 图像作者： LightEXE 授权协议： CC-BY-SA-3.0 来源链接： https://backrooms-wiki.wdfiles.com/local--files/level-127/Level127", "从 Level 127 红色走廊楼层的吊顶天花板坠落，总会随机进入 Level 11 红灯区 内的任意一栋建筑。", "当你猛地转头查看时，目光锁定了一个 黑影 ，它正一动不动地伫立在你所在房间的门口。", "Level 127 内有少量房门可以通往 Level 4 的空置办公室。", "你还没来得及看清周围的其他景象，就听到右边传来一阵无比熟悉的叮咚声。", "你身处的这栋建筑空无一人，装有面向室外的大幅玻璃窗。", "眼前的城市天际线笼罩在一片病态的暗红色之中。", "更多授权相关信息，请查阅 授权指导 。", "唯独这一次，你笃定一件事：", "空气因仇恨与绝望而刺痛。", "你脚下的地面很烫。", "天空没有月亮。", "这是真的。"]}, "128": {"name": "大室外天地", "class": 1, "summary": "Level 128是一片长满了约60厘米高的草的平原，在各个方向上似乎都是无限延伸的。一层持续的雾气使得一公里以外的所有事物都看不见。天空永远是暗蓝色，没有可见的太阳；因为，这里也没有可见的昼夜循环，所以时间以BST 1 为准。风会周期性地席卷整个层级——尽管从来没有过风速大于强风的报道。探索者们注意到，整个层级中都弥漫着一股微弱的臭氧气味，在风吹起时更甚。 层级表现出一种重力异常现象：自由落体的物体在接触地面前会迅速减速，极大减少了因为失控进入此层级造成的损伤。这种异常现象的作用似乎有重量上限，大约在500千克以上的某处。彼时它将无法触发。 层级最重要的性质在于其中出现的结构：房间与立柱。 房间是从貌似随机的层级中截取的一个房间或一段走廊，固定悬浮在空中，离地高度从25米到70米不等。它们的布局、大小或高度都没有明显的模式，而唯一不变的特征是：它们都来自只有室内区域的层级。每个房间的墙壁从外界看都是透明的，从而可以看见房间中的内容。 这些房间并非简单地模仿其它层级中的房间，而实际上会与相应的层级相连，形成Level 128唯一的入口和出口。从内部看，几乎不可能分辨某些房间是否通向Le", "entrances": ["切出层级内出现的任何房间，或通过在这些房间之一中制造的突破都可以进入Level 128。根据已经记录的房间看，Level 128似乎可能连接着每个由人造内部空间组成的层级。进入层级最简单的方法是穿过先前的探索者创造的通道，因为它们不会随时间消失或变动。"], "exits": ["进入Level 128的步骤也可以反过来使用。但是，因为所有房间都悬浮在半空中，因此离开Level 128显然比进入更危险，并且在没有任何补给或准备的情况下几乎是不可能的。"]}, "129": {"name": "白色森林", "class": 4, "summary": "Level 129是一片以深黑色树木为主的被白雪覆盖着的无尽森林。该层非常寒冷，温度恒定在华氏0度（约零下18摄氏度）。地面上覆盖着一层看似无底的雪毯。人们曾尝试向下挖掘来寻找其底部，但除了雪之外，至今仍未发现任何东西。这些树木非常高大，高达近2000英尺。白色的雪和黑色的树使该层有一种“黑白”的感觉。该层似乎停留在无限的白天，没有记录到有昼夜循环。尽管该层十分明亮，但似乎没有观测到太阳的存在。 刚进入该层时，你会在一小片被树包围着的圆形雪地中醒来。当你冒险深入该层时，你会发现只有森林雪地。该层开始时高度稳定，但随着你的进一步深入，它将会逐渐扭曲。你最终会看到树木绕结，部分地区的雪变成黑色、树木变成白色，还会出现大山。该层在最初时非常平坦，但随着逐渐深入，穿越森林时地形变得越来越困难。随着你对该层的深入，山丘会变得非常巨大且陡峭。当你深入森林深处时，该层会变得更加突兀，但由于该并层不那么稳定，所以更容易发生坠落事件。实体的数量也随着你对该层的深入而增加，这可能会使你的行动变得更加困难。 你偶尔可以找到被遗弃的前哨站，这表明曾有一小群人可能在此试图建立营地，但很可能被该层发生的暴雪事件消", "entrances": ["跳入随机出现在 Level 115 或 Level 116 的雪堆中，就会被带到这里。", "在 Level 6 找到一扇罕见的、感觉异常冰冷的大金属门，可通往这里。", "进入 Level 188 上一个看似被雪覆盖的窗口，就可以到达这里。", "如果 Level 39 的边界开始下雪，就有可能在那里简单地切入。", "切入 Level 47 里的一棵被雪覆盖的树，就有可能到达这。", "在 Level 11.1 通过一颗黑树切入。", "Level 21 上的蓝门通向本层。"], "exits": ["唯一已知的安全切出方式是找到一片柔软的黑雪并跳入其中。这会回到 Level 11.1 。", "找到一扇奇怪的黑门可以通向 Level 130 ，但有风险。", "Natedagreat563 作 作者页", "Licensing"]}, "130": {"name": "康育医院", "class": 1, "summary": "Level 130之廊道 Level 130 是一座疑似无尽头的医院，分布着廊道、候诊区与病室。繁多的标志、文件与物品，都醒目地标示出层级的名号：“康育医院”。层级的气温较为凉爽，在20°C 1 上下；手术室中则更为寒冷，仅有15°C 2 。一旦涉足这家医院，病患便将独自一人。在康育医院中，至今无一人报告称与其他人类相遇、互动。 康育医院的环境无菌且几无瑕疵。层级主要遵循20世纪下半叶至21世纪早期的现代医院建筑设计，但同样有病患称部分区域存在其他构造。医疗设备同样如此，均符合制造时期的设计风格。 典型病室。 此类房间构成了康育医院的的主体。病患在进入层级时均位于此处，躺卧于病床上。一切携带物品及穿戴衣物均被替换为病号服及身份手环。入院前携带的衣物及物品一般收纳于同一病室的储物格或箱内。病室的其余部分遵循与医院其他区域相同的怀旧设计，并摆放着各种医用配件与设备。 院中的改造区域。 前文提到，康育医院主要遵循20世纪下半叶的设计风格，但施工中的层级区域并不罕见。这些区域显得简洁而现代，同时四处散落着防水布、梯具、未完工的墙体与裸露线缆。 不建议进入此类区域，因其环境存在风险。曾误入此类区", "entrances": [], "exits": ["离开康育医院完全随缘。人们在医院里会停留一段随机的时间，可能是几个小时，也可能长达数月。时间一到，他们要么死亡，要么切出至入院前所处的地点，身上所有疾病或伤痛都将痊愈。他们也会保留进入该层级前所拥有的所有物品。目击者称，当人们从Level 95 4 返回时，仿佛时间从未流逝。", "通告： 以下是Parker Hudson Thomas的遗言，在Level 130中以同名文件归档。他有关员工的发现，对于揭开康育医院的内部运作与秘密具有重大意义。", "“那是一片模糊，一段混沌，一场永无止境的发烧梦。关于那个地方，我真正能记住的只有缝补过的伤疤和一条写着我名字的腕带。” —— Issac Shore"]}, "131": {"name": "窗帘是蓝色的", "class": "unknown", "summary": "你来到这个地方，眼前是你从未登过的山，无法倚靠的树，以及再也不能遮住你的天空。窗帘是蓝色的，它令你想起高中时代与老师的一场争论，那场争论与写作的意义有关，与用词的意义有关，也与主旨的意义有关。 有时窗帘确实是蓝色，但那并无特别含义。蓝色是白纸上的黑话。窗帘之所以是蓝色，是因为作者想让它们变成蓝色。 有时窗帘就是蓝色，它寓意万千。窗帘是蓝色的，因为蓝色是伤感，是失败，这颜色如江湖河海一般深远，如千愁万绪一般浩渺。窗帘之所以是蓝色，是因为作者需要它们成为蓝色。 你现在孑然一人，可如果其他人来了，窗帘还会是蓝色的吗？换句话说，难道它们之所以是蓝色，是因为有你在这里，它们实际的样子只不过是黑布上的一片虚无，直到有人看见，它们才成了蓝色？ 窗帘是蓝色的，于是你哭了起来，因为蓝色是伤感，是失败，这颜色如江湖河海一般深远，如千愁万绪一般浩渺。为此而哭真是愚蠢。 随着眼泪落下，除了颤抖的呼吸，肿胀的双眼，和正攥在你拳头里的窗帘，什么都没剩下。一阵浅浅的笑划过你的脸颊。就为这流泪真是太蠢了——就为了蓝色的窗帘。 这地方只是一间空房，它只不过有一扇窗户和蓝色的窗帘。除此之外，就没有特殊之处了。这里只不过又", "entrances": [], "exits": []}, "132": {"name": "莫里贡特公国", "class": "unknown", "summary": "Level 132 中的人口合约800名，居住在其中的各个村庄中。公国面积约50平方英里（130平方千米），其外围只见悬崖不断向下延伸，直至白色的虚空；并未发现其外存在其他土地。该层级的异常特性之一是其中存在大量集市、商铺，可为居民提供充足的食物；因此，虽然可耕种的土地众多，居民们只会根据个人喜好选择是否在田园、农场中居住。 Level 132 中的商店并不像中世纪中期的村庄商铺，而像是由现实中各个时空的商店拼接而成。当今地球上已不复存在的商店在该层级中复现，这些商店会不定期补货，兜售古今千年间存在过的各种商品，品牌多样，款式齐全，希腊古瓮甚至能与智能手机并排展示，不必吃惊。 该层级中存在大量古玩珍奇、也有很多科技产品。因此，在这里，购物是人们日常生活的中心，也是广为盛行的消遣，各个村庄中心的店铺都装潢得光彩夺目。所有村庄的经济都完全由贸易商谈支撑，因为该层级中的各个商品都有其独特价值。公国中物品的货币价值不复存在，因为无论商品贵贱，商铺都会以相同的频率补货，且不需要昂贵的采购过程。该层级中的商品价值完全由人们的个人收藏所需决定。比如，倘若某人需要一颗苹果才能完成自己的水果收藏，而另一", "entrances": ["Level 132 的出口位于鲁米利亚。在中心广场可以找到巨大的空心树干，进入其内的流浪者会被送往 Level 10 或 Level 121 的随机地点。此外，在公爵府邸内还有一处出口，但不知道该出口通往何处。抵达这个出口的流浪者们会因为输掉赌约而交出自己的电子设备，所以这些人的下落至今不明。", "在 Level 10 中，进入弓箭手们占领的塔楼时可能会来到 Level 132。也可以通过在 level 302 中的森林中长时间行走抵达 Level 132。"], "exits": []}, "133": {"name": "永恒", "class": "unknown", "summary": "熟悉的地铁隧道向前不断延伸。在 永恒 之中，前进毫无意义。走过几里之后，流浪者们便会发现自己又回到了原点。往好了说，进入这里就像是走进了一场不寻常的梦；往坏了说，此地便是一个人最恐惧的梦魇。昏暗的灯光、碎裂的石柱、废弃的轨道。在这场无尽的旅程之中，它们便是流浪者所见的一切。 没有实体，没有人类。在一段时间之后，就连影子也会抛弃它的主人。然而，一种“被跟踪”的感觉却无时无刻不萦绕在空气中。墙壁上没有眼，却能注视流浪者的一举一动。时间一分一秒流过，我们的界限越来越近，直到填满虚无的空间。呼救，不过是向一片无人的深渊厉声呐喊。流浪者被彻底隔绝其中，任之自生自灭。 道路通向四面八方，使流浪者不知所措。但千万别妄图在其中找到方向——随着时间的流逝，方向感将被彻底剥离。那些路通向哪里？亦或者它们根本没有目的地？越是深入，流浪者对于现实的掌控便越发薄弱。这是真实的吗？当心那些陷阱，它们会引诱你进入一片万物俱寂的世界，唯有抽离的记忆伴你左右。 囚徒们不愿接受自己必然的命运，一次又一次徒劳地尝试反击潮湿的围墙。他们像老鼠一样挣扎着，而砖墙则如鹰隼般环绕着。无助之人的双眼频繁眨动，盼望着自己能从这短暂的梦", "entrances": [], "exits": []}, "134": {"name": "大海的故事", "class": 0, "summary": "一艘倾覆的、老旧的、没有层级的居民的船只的前部。 该层级的主要景观是一片碧蓝色的、一望无际的海洋。在海面上凸起了一些被海水浸湿的沙丘，这些沙丘好似不规则的斑点般从海洋中露出，海面上还散布着一艘艘生锈、腐烂的古代船只。据说这些倾覆的船被安置在一个废弃的海域中。 两艘在该层级干涸区域的船只。 水始终保持浅浅的、平静的样子，由于缺乏自然潮汐，海水的高度始终保持一致，这一层的海洋永远不会涨潮，也不会退潮。尽管具有日月星辰，也有昼夜交替，理论上应该出现海水运动，但实际上依然没有海水运动。 海水深度恒定于 2 英尺（0.61 米），它只有在上升到沙丘和偶尔出现的坑洞时才会出现改变其深度至难以察觉的 2½ 英尺（0.76 米）。水面上倒映着深深的天蓝色和一片片云朵，这使它看起来比真实情况要更深一些。海底是由一片柔软、潮湿且相对坚固的沙子组成的。尽管沙子的硬度足以支撑起流浪者的的身体，同时支撑起那些倾覆的古代海船，使船体不完全浸入海水之中，但是如果流浪者待在同一个地方太久，沙子也会变的松散，使流浪者陷入其中。 1 尽管该层级大部分地区由平静的浅浅的海水所覆盖，但仍有偶尔出现的小沙丘突出于海平面之上，这", "entrances": ["通过 Level 880 的“冷冻室的舱门”跳入大海会将任何这样做的流浪者冲刷到 Level 134 的“海岸”。大多数流浪者会出现在沙丘的边缘。", "与 Level 797 的大多数出口一样，沿着其路径边的岩壁上的洞有时会通向该层。在出现水淹的地方和含有水的洞穴系统中尤其如此。", "在 Level 46 ，流浪者偶尔可以找到埋在沙丘中的活板门。一旦将它们完全暴露出来，它们便可以用于达到 Level 134。"], "exits": ["尽管非常罕见，但 Level 134 内偶尔会看到自动扶梯，尽管可能受到水和沙的干扰，但其功能完全正常。登上这些自动扶梯，顺着它们走，就会把流浪者带到 Level 233 。", "在看似随机的情况下，海床里有可能中途出现开口，并通过这些开口将开口下方的海水输送到 Level 499 的池塘和河流中。", "水中偶尔会升起生锈的、有点奇怪的潜望镜。抓住这些潜望镜，让自己被它们拉到水下面，流浪者将进入 Level 880 。", "如果潜入超过 2 英尺（0.61 米）深的部分的水域，则有可能将流浪者带入 Level 121 。"]}, "135": {"name": "Level 135", "class": "unknown", "summary": "Level 135 的頁面內容未在此次抓取中完整取得。", "entrances": [], "exits": []}, "136": {"name": "难言之隐", "class": 0, "summary": "我该从哪开始呢？看完这个我该怎么办？好吧，好吧，首先，你可能会看到这扇门，我确定你会看到，嗯……在某种程度上其实我认识的人都见过这扇门。我……我都不知道这扇门是层级里的固定设施还是什么。我在三个层级前好像遇到过个人警告过我有关这扇门的事情……然而当时我觉得我并不该相信他。他说这个是他在学校里路过的门，在他……卷入这一切之前。我得跟全世界宣布下这事，如果你没见过这个的话，我相信你之后会看到的。我不知道 编号 是多少，或者说它甚至不应该是个层级……。好吧，它应该是个层级的衍生品，汲取了其他层级的精华。管他呢，当我把这玩意放下的时候，无论如何我都得打开它。 我前面一直在说这扇门，这门是入口。入口和出口，我需要把这些写文档里吗？啊，没事，我会为了被裁员做这件事的。 还有这房间本身，如果这些尸体不是房间本身就有的东西的话，我会说说他们的。如果你 进 这房间里了（我觉得更像是进衣柜里），然后把门关上，并向内 走 去。这简直就像……那什么都没有，你什么都感觉不到，你无法移动你的身体，你看不见，你唯一能做的事就是……思考。你此刻是十分清醒的，你没有睡去，你只是……不能，不能做任何事。这简直能把我逼疯了", "entrances": ["打开门就行，哪都可能有。"], "exits": ["如果你对这里挺了解，请先把信息交给M.E.G.，如果没有办法交给M.E.G.的话就给我，你可以问问， Level 1 的Jared就是我。还有，别犯傻。", "作者还整了张图片 在这 ， 这图片基于CC-BY-SA 2.0协议，虽然不是3.0，但已经够了", "据我目前所知，离开这里的唯一方式就是从这扇门出去，我可不想冒险在这里切来切去。", "Evereds登出。"]}, "137": {"name": "蜂之鸟之蛾", "class": 0, "summary": "Level 137 由一系列研究室组成，以老化痕迹明显的木材建造。 Level 137 的环境非常明亮，每间房间里至少有一盏煤油灯或是一根蜡烛照明。 整个区域覆满了某种粉末，最初被认为是灰尘，但之后发现是褪下的飞蛾鳞片。多个探险者都声称自己听到了窸窣的响动、风铃声、和扇动的声音，但并未发现其来源。 Level 137 的首个房间内，有一张桃花心木桌，四扇门，靠墙有一个标本展示柜，里面有各种蛾类的标本，用翅膀下方的两个螺栓固定在柜子的后部。 这些展示柜填的满满当当，被门闩锁住。 房间正中的办公桌总体上干净，上面摆着各种海报、文件和笔记，字迹难以辨认。而且当这些材料被拿走研究后，办公桌上面也变得满是粉尘。 从这里开始，后面的每个房间都是一样的。每面都有四扇门，每面都有展示柜。这些展柜大多没有上锁，有些的里面空空如也，但其中部分展柜里有死亡的蛾类标本。据称某个房间里有个展示柜被打碎了，但意义不明。 对蛾类标本的研究显示，其腹部下方可见一条裂口，里面完全没有任何器官或是组织物。触摸这些标本的内部会使其短暂地摆动它们的翅膀和附肢，但没有找到令它们长时间复活的方法。M.E.G.所属的特工人员已带走", "entrances": ["只发现了 Level 137 的一个入口，是位于Level 2的一扇陈旧木门。这扇门没有把手，把手所在的空洞周围划痕遍布。由于Level 2的规模之大，通常很难找到这扇门，但很多流浪者都声称自己是被扇动的声音和风铃吸引而来。", "Level 137 中存在各种出口，但目前没有对这些出口的官方描述。据称， Level 137 直通 Level 19 ，但也有至少两位探险者通过 Level 24 抵达了 Level 137 。"], "exits": []}, "138": {"name": "Level 138", "class": "unknown", "summary": "Level 138 的頁面內容未在此次抓取中完整取得。", "entrances": [], "exits": []}, "139": {"name": "勇者的试炼", "class": "无所畏惧", "summary": "好吧，这是我头一次试着用这个，我也不知道自己在干啥。说实话，我从来没有想过自己会如此突然地发现一个层级，也希望一切能保持原样。事实证明我错了，我就这么找到了一个层级。本来我真的以为自己要完蛋了，来到这儿倒也是好事。我在 Level 9 被一大群 Hounds 所包围，如果没有以某种方式来这里的话我可能早死了。我想自己还是蛮走运的。 在数据库里搜了搜，我找到一篇旧的这个层级的拒稿。Level 139……呃。写那篇稿子的肯定不是自己人！这让我毛骨悚然。但我想这是唯一能拿到的参考资料，所以我会在探索的时候继续读完它。 从我所站的位置看，这个层级似乎是某种热带岛屿，坐落在什么荒郊野岭的那种。岛屿顶部有座火山，看起来很小，可能只有几英里的宽度？这里的阳光很炙热，但至少这回有太阳，还能听到海浪的撞击声和轻微的风声，除此之外，我什么都听不到。希望这意味着这里已经完全荒废了。我真心不想遇上写第一份稿子的那人。 我前方的一排树上有一个标志，我要去一探究竟。在此之前我先把它上面的内容写上。 如果你看到这里，你的勇者试炼才刚刚开始。 它看上去如此不详，但又如此诱人…… 编辑日志二 我真是难以置信，一看到那个", "entrances": ["Level 139 基本上只能从生存难度为 3 或更高的层级进入。当流浪者处于危险情况时（如被敌对实体包围，无法逃脱），他们会发现自己被传送到了 Level 139。唯一稳定前往 Level 139 的入口是从 Level 121 向西一路航行。"], "exits": ["唯一可靠的安全离开 Level 139 的方法是完成勇者的试炼并进入休眠火山中心的火山口。这将通向一个安全且很可能有人存在的层级，如 Level 11 或 Level 1 。另一种离开 Level 139 的方法是拒绝勇者的试炼，这时流浪者会被遣返至来时的层级，也仍然处于来时的境地。这很可能致死。所以任何在 Level 139 的流浪者都应尽力去完成勇者的试炼。"]}, "140": {"name": "蜜之爱", "class": "unknown", "summary": "在我和老伴眼中，这个层级堪称小小天堂，尤其适合我们这样的老太太。广袤田野向着天际延展，昼夜更迭自有韵律。每天下午六点前后，总有瑰丽晚霞染红天际；清晨五点左右，又见动人心魄的朝阳跃出地平线。晚上基本都在酣眠，倒是我这不争气的尿意偶尔作祟——起夜时驻足片刻，反倒有幸仰望星空。 知你此刻应是远行在外，但蜜已酿成，需你归来将蜂蜡滤净，分装入那些搁在门厅的空瓶里。 - 对是对，亲爱的。可这么写是不是太不专业了？毕竟这稿子得交给…呃…那些搞科研的专家… - 放心吧，他们不会计较的。不专业又何妨？再严肃的人也该偶尔轻松片刻——尤其是那些成天连轴转的工作狂。” 在这妙不可言的层级中，乔治娅与我于首片向日葵田外不远处觅得蜂巢。此地生态自成天地，若这般形容也算妥帖。而我最在意的，终究是自此可亲手酿蜜的欢欣——蜜糖的醇香将我们与此境紧紧相系。毕竟“蜜”字最得我心，而她即我的寰宇。 今天我去向日葵田左边第二片野地散步，发现一朵奇怪的花旁边长着一株细弱的小苗。刚开始以为是绣球花，却听到它发出嗡嗡声——不是我们熟悉的蜜蜂声音，倒像是机器在低鸣。 希望不是有人在监视我们。要真是这样，他们肯定早看腻了我每天重复的浇花", "entrances": [], "exits": []}, "141": {"name": "锅炉房", "class": 4, "summary": "Level 141 是后室的第142层。于1996年的5月21日被发现，但自2020年6月11日方被正式记录。 该层级为一无限延展的与其在Level 5内的同类相似的锅炉房。但与Level 5内的只含有一个锅炉的锅炉房相比，该层级整体皆为锅炉所构成。 该部分是Level 141内最为常见的一类单元，也是你最有可能切入的一个区域。除此之外，该层级因其高达56°C（132°F）的温度水平而对人体极具危害性。你将因此不得不在切入此层级前携带一些防护用品。如果你反其道而行之，那么你将在没能找到员工休息室内的特制热防护服的情况下因过热而死。 瓦斯泄漏亦成为此层级的家常便饭。因此若你听到了疑似瓦斯泄露的声音，请马上从你听见泄漏声的房间撤退。鉴于已知该气体本质为能使人窒息而亡的丙烷，流浪者应尽快撤离有瓦斯泄漏的房间。 有时你能在该层级内找到铁锹、空杏仁水瓶、短柄斧、便携管道、热防护服和其他工业设备等各色物品。 员工休息室为员工在脱离锅炉工作时休息的场所。某些员工休息室内配有家具，而其他休息室则徒有四壁。这里的员工似乎皆已丧生，因为在休息室内外都可以发现他们的尸体。 在此房间内有时能找到一个管道入口。", "entrances": ["在 Level 25 内游玩一台街机有时能让你切入此处。", "在 Le 地。在开始，最大的困难是真菌。但Effulgentine很快就意识到了M.E.G.的存在，并围攻了这座前哨站。这毁坏了出入口，并阻挠了对该层级的进一步探索和对其他流浪者的援助行动。最终，由于在 Level 144 的驻扎尝试困难重重，并且无法证明在此地建立纯观察哨站的合理性，该前哨站被放弃了。", "我们认为， Level 144 中被毁坏的前哨站都曾拥有出口。但不幸的是，目前只有不到百分之十的前哨站废墟中仍然拥有可用的出口。这意味着，普通流浪者切入 Level 144 的话，为了找到出口，必须探索大约十几个前哨站废墟。由于晴朗天气的少见，这段旅程往往需要数周时间，如果人员准备不足，饥饿和暴露己身都会成为像是Effulgentine一样的生存威胁。"]}, "145": {"name": "永恒隔绝", "class": "unknown", "summary": "Level 145内的场景具有高度重复性，其设计让人能想起21世纪前的监狱建筑，极易引发幽闭恐惧症。 这些房间内部潮湿不堪，处于被弃置的状态，具体表现为管道泄漏，角落遍布霉斑，墙漆起皮，还有能让其余物品与该层级的墙壁相混淆的斑驳墙体。 在Level 145内的囚室大多都不会存在除进入其他囚室的两扇门外的另一扇门，而上述的连接门则能通往其余区域，如此便形成了一个联通了无数囚室的漫长直线廊道。大多数时候这些相同的构造最终会汇集于一处死路，这也意味着流浪者必须倒回去数英里来寻找另一条探索层级的道路。而例外则是一种以第三扇门的形式出现在囚室内的出口，遇见这种出口的可能性微乎其微。 囚室本身以网格状进行线性排列，而这些狭小的囚室则会分别以边长4英尺，6英尺或8英尺的正方形为底的长方体状的形式出现，地面距天花板有8英尺。囚室内的墙壁暗淡肮脏，粉尘四散，充斥着上文所述的潮湿腐臭气味。而每个囚室的墙壁原本应由灰色/白色的砖块或混凝土构成，同时其颜色斑驳陆离的墙面漆则本应统一为冷色调的单纯青灰色。 Level 145本体并非无限延展；但是其狭小的囚室的集中堆叠则使这个层级看起来极为庞大。层级内的囚室数以", "entrances": ["作为备份方案，第二种更为可靠的入口则能在 level-95 内被找到，其入口与层级的地下深处相连接。与Level 448的随机出口不同，在Level 95地下深处区域的囚室内极难找到出口，如有出口，那其便必会通往Level 145。", "Level 145因其难以切入的性质而闻名，究其原因是它的出口少得令人咂舌，其间隔又极为遥远，以至于分布于两个不同层级的入口甚至都无法互相连通。即便如此，我们还是找到了下列的两种入口。", "Level 145的主要切入方式是借道 Level 448 并尝试切入层级内任一监禁室内。特定的监禁室会随机让流浪者被马上送入Level 145内。"], "exits": ["离开Level 145难度极高，部分原因是其庞大的体积与其囚室极其狭小的空间。目前唯一已知的Level 145的出口以一种极为少见的随机木制的门出现，想要找到此类出口流浪者必须在层级尽头游荡足够长的时间并找到内部存在上述木门的囚室。", "目前Level 145唯一已知的出口通向 Level 563 ，而这个出口则会将流浪者带往此层级通道的起始处。"]}, "146": {"name": "感激酒馆", "class": 0, "summary": "你好，流浪者朋友！我叫Johannes Copely，应 M.E.G. 的要求来记录我在Level 146，也就是在所谓的感激旅馆的经历。 他们给了我一种格式和特定的口吻来填这个表，但遗憾的是，我没有能力来写得那么闷。不管怎么说，我更喜欢个人化的口吻。希望他们不介意，但我仍会告诉你你想知道的一切。 来想象一下，一个寒冷的、永恒的冬天，一件破旧皮夹克和上面覆满的冰与浮雪一并被烤化。想象一下老式木桌木椅的嘎吱声和趿拉声，以及温暖的哈气在你面前打旋，与手中热汤上升的蒸汽相混合的景象。我给你讲我如何遇到感激旅馆的故事时，请用舌尖去感受汤汁的风味。 当时是 Level 129 一个大风天。我是无意间切出 Level 39 的边界后到达那里的。这是个意想不到的波折，本来我只想花点时间探索魔法森林以及冥想。更倒霉的是，我没有穿应季的衣服，只有一件简单的风衣外套，里面一件薄T恤，下身是卡其色裤子。 当我在这一层级徘徊时，我发现自己的处境因远处传来的滚滚雷声和天上飘落的雪花而愈发糟糕。掏出手机，却发现Level 129没有任何信号。因此，当雪花演变成冰雹时，我毫无准备，它们在我四周坠落，猛烈地撞碎在地上", "entrances": [], "exits": []}, "147": {"name": "多么熟悉的路啊", "class": 2, "summary": "发件人： 高级军官 Nathan < moc.puorg.rerolpxe.rojam|hcivomarba.nahtan#moc.puorg.rerolpxe.rojam|hcivomarba.nahtan > 收件人： 监督者-A < moc.puorg.rerolpxe.rojam|nitsuj#moc.puorg.rerolpxe.rojam|nitsuj > 日期： 2018 年 5 月 23 日 主题： 新层级发现 下午好，长官。我们再次遭到了那群戴着喜剧与悲剧面具的怪人袭击。不过，这次我们成功了：我们活捉了其中一人，在用了点手段之后，他交代了一个弥漫着紫色雾气的陌生城市型层级。审讯记录附在邮件中。我们的数据库里没有任何关于此类层级的资料。“罗经点”兵团已经开始搜寻这个传说之地。 一有发现，我将立即向您报告。 M.E.G. 审讯员： 行了，我看他准备好了。说出你的名字，你为谁工作，为什么被抓。 嫌疑人： …… M.E.G. 审讯员： 别让我重复第二遍。 嫌疑人： …… M.E.G. 审讯员： 你要是想，我可以叫我的朋友们把刚才的流程再来一遍。 嫌疑人： 好，停下。求你了。我", "entrances": ["在 Level 9 的街道上长时间行走后，你迟早会开始感受到 Level 147 的影响，或只是注意到周围环境的异常。这是到达那里最不安全的方式。", "倘若你在 Level 11 找到“34 路公交车”并登上它，你很有可能会和车上其他人一同到达 Level 147。"], "exits": ["昵称：Foggy City 作者：Psyberartist 授权协议：CC-BY 2.0 来源链接： https://i.ibb.co/pzFTkCT/unknown.jpg", "乘坐公交车时，有机会到达一座由玻璃板建成的摩天大楼。进入它，并穿越内部的过道迷宫，将会使你到达 Level 4 或 Level 0 。", "更多授权相关信息，请查阅 授权指导 。"]}, "148": {"name": "活体层级", "class": "5b", "summary": "在本层级未知地点拍摄的一张照片。 Level 148又被称为“活体层级”，这是因为该层级本身就是一个实体。当它感受到层级内部有物体运动时，就会开始改变自己的环境。即使是行走引起的微小声音也会造成该层级的敌意。研究表明，该层级可以与内部的流浪者交谈，不过这种现象很少发生。这种能力的发现使研究人员认为该层级很可能有活跃的智能，且对人的敌意严重，会有意操纵、摆布其内的流浪者。它能够在自己的墙上写出文字，也可以直接和流浪者对话。不少人形容它的声音低沉沙哑，有时会给人伪造虚假的安全感，有时也会逼人陷入绝望，但这都是为了更方便地杀死猎物。 目前，已记录到该层级内有两种状态。第一种是相对安全的“一般状态”；第二种则是危险的“警戒状态”。在“一般状态”下，该层级的内部结构会随机排布，外形类似其他层级的房间、走廊。多位流浪者报告称在其中看到了巨大的开放式房间、各式各样的楼梯、甚至还有虚空。很多房间和走廊内都有貌似取之不尽的随机物品，其中最有用的东西包括：袋装薯片、垃圾食品、睡袋、例如弹簧刀的自卫武器、可以使用的手机、各种衣物等等。这些房间和走廊内还会出现各种家具，比如三角钢琴、双层床、折叠椅、纸板箱等等", "entrances": [], "exits": ["离开该层级的最主要方法是切入其他任何可被切入的层级。不过，在Level 148中并不能主动完成切出，只有意外切出才能使人离开该层级。这一性质导致其内的流浪者可能会被困数月而无法逃脱。其他已知的出口有：", "感谢各方帮助、批评，尤其感谢 Natedagreat563 的审阅，他在语言组织方面给了我很大的帮助，同时也十分包容我。", "我们仨的个人页： Null0 | F4U5T | momsknife 。", "某个房间中会渗出绿色的水和泥巴，进入其中后会来到 Level 66 。", "在落入虚空一段时间后可能会进入 Level 166 。", "感谢 momsknife 在翻译过程中的帮助、校对。", "切入一面高大的铜镜后会进入 Level 365 。", "抓住一包爆米花后可能会进入 Level 68 。", "某条血肉构成的走廊可以通往 蜂巢 。", "作者： Iamalemon 。"]}, "149": {"name": "椰树岛", "class": "宜居", "summary": "Level 149 是一处在广阔的天空包裹下的空间，其中悬浮着许多岛屿，岛屿上可以找到一些椰子树。这一层级的面积是有限的，据探测这些目前最远的岛屿在400公里（250英里）外。 Level 149 并没有昼夜交替，而是保持在夜晚时分 1 。太阳仍然能被发现，但它似乎被固定在了某一位置。此层级的平均气温为32℃（90℉）。此外，雨水与中等强度的风在此层级也十分常见。 Level 149 的重力十分微弱，仅为前厅或大部分后室层级的15%，大约等于月球表面的重力。在层级底部有一股非常强的风，这使得层级中的岛屿免于坠落。 Level 149 中的椰子果实，可以食用。 这一层级中的岛屿形态各异。有些能达到方圆6公里的规模，有些却只有几平方米的大小。它们以不同的倾角、位置与成分散乱地漂浮在层级各处。目前已经探明的岛屿数量超过2000个，它们由沙子、泥土和岩石组成。在这些小岛的中央总是分布着若干椰子树，数量从一到两百多棵不等，树木的生长和其所在的岛屿大小有关，其分布范围的宽度与岛屿宽度的一半相近。 Level 149 的岛屿形状并不固定，但在大多数情况下，距离层级中心越近，岛屿就越大。这些岛屿上经常", "entrances": ["从 Level 46 中某些重力明显较低的部分可以进入 Level 149 中最大的岛屿。", "目前只有一种可靠的进入方式："], "exits": ["走进屏障深处，有极小概率可切出到 Level 37 或 level-140 。切出到其他层级的可能性仍然存在，但目前仅有这两个层级得到确认。应当注意，这一方法十分困难且不可靠，因此在500年中仅有5人被确认离开了此层级——这意味着绝大多数居民都将在 Level 149 度过余生。", "目前只有一种已知的离开此层级的方法。"]}, "150": {"name": "记忆铸造厂", "class": "Ψ", "summary": "Level 150 是一片具有捕食傾向的、循環往復的狹長地帶，能識別並捕獲流浪者，出於未知原因逐漸侵蝕他們的心智。該層級看似綿延無盡，實則無論朝哪個方向而行，最終都會被拖回空間中的同一個點，製造出無盡的幻覺。時間定格在黃昏，天空中有一顆被稱為「赤瞳」的紅色發光球體。該層級最危險的特徵是記憶篡改（「鑄造」）過程，分為三個階段：短期記憶篡改、長期記憶侵蝕、以及記憶系統性替換。在鑄造廠深處坐落著被稱為「核心」的龐大機械裝置，被認為是記憶篡改現象的源頭。", "entrances": [], "exits": ["通過鑄造廠內標有「緊急出口」的門可通往 Level 3 或 Level 901 的工廠區域。"]}, "151": {"name": "玩偶之家", "class": "其他", "summary": "Level 151 是一個巨大的、真人尺寸的娃娃屋，像英國都鐸時期的宅邸，面積約7500平方英尺。進入時流浪者一般會發現自己處在一個開闊大廳中央。燈光看起來具有時代特色，但實際上都是假的LED燈。窗戶外只有一片白或黑色霧氣。該層級存在晝夜循環：白天宅邸大部分燈不發光，夜晚霧氣變黑、蠟燭和火把發出冰藍色微光，此時「玩偶」實體變得活躍且具有攻擊性。玩偶是真人大小的荷蘭洋娃娃，會在人類移動時以相同速度移動，一旦「鎖定」目標便能得知對方何時移動。", "entrances": ["在 Level 150 的樹木處切出", "通過樞紐中的單向門找到", "穿過 Level 178 的假牆", "在 Level 188 中通過相應窗口進入", "在 Level 98 的餐廳裡點「超級娃娃屋」"], "exits": "唯一已知出口是位於密道盡頭的隱藏活板門，可在書房與第二、三間臥室中找到，通往隨機層級。"}, "152": {"name": "监视游戏", "class": "其他", "summary": "Level 152 是一條狹窄的小巷，牆壁高得不可思議，一道憂鬱的藍光透過天空。巷內堆滿了報廢的舊電腦和電子設備，螢幕上顯示後室其他層級的監控畫面。該層級源於一場「監視遊戲」：50名玩家被綁架至此，目標是在監控攝影頭上發現另一個人。如果找到並喊出Line的名字就能獲釋。流浪者被困其中，無法分辨自己是否還活著，記憶逐漸消失，處於無盡的痛苦之中。", "entrances": ["在 Level 11 中尋找關於「監視遊戲」邀請的海報，抵達星形建築參與遊戲"], "exits": ["未知，頁面未記載已知出口"]}, "153": {"name": "布洛克的书店", "class": 3, "summary": "Level 153 以一間循環的書店形式存在，城市背景下的書店門前。進入後身處1950年代裝潢的書店，有留聲機、綠薄荷與香草芬芳、茶壺和皮椅。書籍翻開後會顯現人們過去的愉悅經歷。通過儲藏室門可以切換不同形態：虛實期（1950年代）、欲障期（1970年代，牆壁面具出現）、幻視期（2000年代，書籍顯示未來事件）、惡壞期（最終形態，書籍變成平板電腦，幻觉極度危險）。每個形態的書籍對流浪者都有不同程度的心理危害。", "entrances": ["通過 level-75 的一個貼著「自傳」標牌的書架切出", "在 Level 67 找到桌上標題為「起源」的書，帶著走出麵包店入口", "在任何一層找到標題為「我的故事」的書", "偶然切出（罕見）"], "exits": ["找到一本含 Blanche 女士簽名的書，用食指掃過簽名前往 Level 906", "嘗試攻擊布洛克維奇會被踢出至 Level 10 前的隨機層級", "從 level-75 切入的同一位置再次切出可返回", "在桌上飲品旁發現金盤子裡的果馅饼，咬一口前往 level-89", "從面對玩偶店的窗戶切出前往 Level 520"]}, "154": {"name": "激光游戏", "class": 5, "summary": "Level 154 是一個極度危險的迷宮，由漆黑石牆組成，黯淡彩色燈光照明。該層級作為神秘「激光遊戲」的地點存在，分為走道與激光房兩區域。每扇門後是一個開闊房間，中央有基座和掛旗，紅色激光布滿房間。目標是在不觸碰激光的前提下取得掛旗。五種房間變體：直線房（60秒計時）、圓圈房（移動激光，最弱）、三角房（稜鏡解謎）、正方房（看似無解）、五角房（極速跑酷）。觸碰激光會造成三到四級燒傷。", "entrances": ["僅可從 Level 1 進入，尋找發著多色熒光燈的走廊，跟隨燈光到達帶符號的門處"], "exits": ["在五個房間變體的任何一個中觸碰並取下掛旗離開，會回到 Level 1 中對應的門前"]}, "155": {"name": "石英构成", "class": 0, "summary": "Level 155 是由精製石英板構成的無限蜿蜒複合體，房間規模宏大，穹頂高達數百公里。石英成分約89-92%石英晶體加7-10%樹脂，耐用且高品質。曾是 B.N.T.G. 的礦業資產「Asset 155」，開採石英資源。後因利潤暴跌、投資虧損而解散，剩餘礦工被遺留。該層級結構安全但缺乏食物和水，無法長期維持生命。", "entrances": ["從 Level 1、2、11 的大型石英門進入，最受歡迎的入口來自 Level 11 新時代廣場"], "exits": "從入口門返回便可離開，每扇出口門上都貼有告示注明會回到哪個層級。"}, "156": {"name": "后台", "class": 2, "summary": "Level 156 是一出高中戲劇演出的後台，由後台、茉爾小姐辦公室、更衣室三部分組成。有戲劇不斷上演，觀眾席有觀眾。流浪者進入一小時後，實體開始說服他們上台。實體包括學生演員、茉爾小姐和艾瑪。進入舞台的探險者從未返回。建議在本層停留不超過一小時。", "entrances": ["找到封面用黑色字印刷著「春季戲劇」的劇本，握在手中進入任何門"], "exits": ["通過建築物出口（更衣室對面帶出口標誌的黑色門）離開，一般到 Level 52，小機率到 Level 117"]}, "157": {"name": "象棋对局", "class": 2, "summary": "Level 157 是一片向各方向無限延伸的巨大平面，地面由黑白相間大理石方格組成，像國際象棋棋盤。被實體分為兩個廣闊「國域」，實體形狀如國際象棋棋子，能與人類流暢溝通。流浪者進入後會參與進行中的象棋對局。需要通過挑戰國域領主「三角」（頭部為彭羅斯三角的奇異實體）獲勝才能自由進出。棋子實體包括步兵、騎士、教皇、刺客皇后、國王戰術家等。", "entrances": ["從 Level 5、13、86 找到有象棋棋盤的房間，碰觸棋盤傳送至此", "完成初等挑戰後，打開三角贈予的黑色封皮書可隨意進入"], "exits": ["初等挑戰落敗會立即被傳送出本層級", "完成初等挑戰後，打開黑色封皮書離開，回到之前所在層級"]}, "158": {"name": "猛攻站", "class": "凶残", "summary": "Level 158 採用12站地鐵的形式與實體作戰，每站以十二星座命名。只有白羊座站和雙魚座站可以上下車。登上火車後，每站會生成隨機武器和三個實體，擊敗實體或十分鐘後到達下一站。火車上的傷勢會痊癒，死亡也會從起點重生。有特殊「活動列車」車廂，包括派對列車、薩克斯決鬥列車等。居民組成「猛攻依賴者聯會」(OJU)，把列車對戰視為競技運動。", "entrances": ["乘坐 Level 11 的地鐵並有意想到 Level 158", "level-59 內有隧道通往白羊站", "level-61 有五個報告進入雙魚站", "Level 2 的走廊小機率通往白羊站", "Level 317 大廳浴室鏡子上畫倒置五角星"], "exits": ["雙魚站樓梯通往 Level 11", "白羊站樓梯通往 level-72 的鐵路", "列車離開後進入白羊站地鐵隧道通往 level-59", "衛生間鏡子上畫鑽石來到 Level 317", "使用信息亭的「聲音測試」訪問 Level 714"]}, "159": {"name": "兽域", "class": 3, "summary": "Level 159 是一個美式小鎮，面積約3000平方千米，建築風格類似80-90年代美國城建。主要地形為平原和枯死灌木，氣候極端，暴風雪肆虐但積雪不超過四厘米。溫度在-19°C到0°C之間波動。實體包括獵犬、笑魘、死亡飛蛾和大量層級特有實體。有獨特地點如加油站、操場、造物堆坑（實體創生地點）、廢棄商場和造物牌匾。有 M.E.G. 前哨「凝城」和 Van Dieria 住區。", "entrances": ["在 Level 1 或 Level 4 中打開冰凍結霜的金屬門", "乘坐開往 level-36 C 航站樓的有軌電車", "小機率進入 Level 11 的商場"], "exits": ["進入甜品店去往 Level 11", "進入「Roller Rockin' Pizza!」拱廊建築去往 Level 40", "10秒內返回進入的門原路返回", "進入沙井進入 Level 34"]}, "160": {"name": "应许记忆之城", "class": "其他", "summary": "Level 160 是一個圍繞記憶、遺憾與救贖的敘事性層級。頁面以充滿誘惑性的第一人稱旁白呈現，講述一個聲音不斷引誘流浪者接受契約，重溫過去的美好記憶。提及 Emma、童年玩伴、母親、跳樓自殺等記憶片段，試圖說服流浪者留在這個「應許記憶之城」。該層級本質上是一個由記憶構成的夢魘，吸引那些心懷遺憾的人。", "entrances": ["未知，頁面未明確記載具體入口方式"], "exits": ["未知，頁面未明確記載出口方式"]}, "161": {"name": "停尸间", "class": "pending", "summary": "Level 161 是一個極度令人不安且與世隔絕的地方，有無盡的房間和樓層，模仿1940年代美國郊區家庭，由彩紙和膠水製成。所有設施都是裝飾品無法使用，食物和水不可食用。房間裡散布著真人大小的塑料人偶「屍體」，每個都有不同的死因。有一個被稱為「修補匠」的實體會在屍體旁做筆記。層級中持續有嗡嗡聲。流浪者若沒有口糧可能在幾天內餓死。", "entrances": ["在 Level 5 主大廳中找到一個充滿人偶的屋子並與之互動"], "exits": ["找到黑暗洗衣房，進入其中一台洗衣機，可能來到 Level 41"]}, "162": {"name": "混凝土墙", "class": "宜居", "summary": "Level 162 是一堵極大極厚的混凝土牆，牆側伸出許多平台，平台上有家具和房間。牆面向各方向無限延伸，無地面。平台隨機出現並被牆吸回，有卧室、廚房、辦公間、浴室等類型。因宜居性和多出入口成為層級間交通樞紐。從任何高度墜落都不會受傷。有 M.E.G.「混凝土騎士」基地和「壁牧者」團體。", "entrances": ["從 Level 20 的地板進入，到達倉庫平台", "穿過 level-81 任何門有概率到達", "Level 170 的二型水泥箱通向此處", "穿過 level-172 入口門有概率到達", "穿過 level-176 浴室區域的洞進入浴室平台", "Level 432 停電期間躲在木樓梯下切入地板"], "exits": ["辦公間平台門隨機進入 Level 0 或 Level 1", "穿過卧室門旁邊有畫的門通往 Level 57", "切入辦公平台次牆直達 Level 81", "切入混凝土牆來到 Level 170 二型水泥箱", "浴室平台門出去到 level-189", "穿過打開的門可能進入 Level 277", "郊外房間平台門出去可能到 Level 111、level-409 或 Level 566", "有霓虹出口標誌的門通向終點"]}, "163": {"name": "置身虚空中", "class": "其他", "summary": "Level 163 表現為一片身在廣闊虛空中的高聳公寓群，浮於厚重濃霧中。各大樓相距甚遠，流浪者被限制在初入的「主樓」內。入口都導向大樓中央電梯，走出後電梯急速下墜不再回升。空氣中有陣陣微風，氣溫很低，無天氣現象。許多流浪者感受到躍下深淵的衝動。墜入虛空者結局未知，有人猜測會進入藍色通道。", "entrances": ["未知，頁面未明確記載具體入口方式"], "exits": ["未知，頁面未明確記載出口方式"]}, "164": {"name": "历史遗存之地", "class": 2, "summary": "Level 164 是一個無盡的博物館，光線昏暗，建築風格從1850年代到1910年代不等。由走廊和展覽廳構成，走廊長而寬，展覽廳擺滿各種物品。成年無面靈穿著碧綠制服打掃，幼年無面靈會惡作劇。觸碰展品會造成銳器傷。展覽廳標籤決定主題，如「戰爭」「廚房用品」等。有神秘的「館長」實體。", "entrances": ["Level 33 的無名當鋪商店有時通向這裡", "進入 Level 11 的一個大的平坦長方形建築"], "exits": ["「一個親善的靈魂所繪」展覽廳內的畫作中切出通往 Level 57", "從走廊角落切出通往 Level 84"]}, "165": {"name": "欺妄极乐", "class": "deadzone", "summary": "Level 165 是一片欺騙性的景致，表面看是廣袤青翠山丘的天堂，實則是垂死植被分泌有毒物質造成的幻覺。遮蓋口鼻才能看到真實的灰黃色枯死草甸。流浪者吸入越多毒氣越想留下，最終成為植物的養料。該分子合成方式不明，即使防毒面具也會逐漸失效。", "entrances": ["切入戶外場域如田野、森林、溫室，聞到不真實的鮮草芳香即已進入"], "exits": "尋找地標如公路或穀倉，景象有所變換即可逃脫。"}, "166": {"name": "天坑街区130号", "class": "2e", "summary": "Level 166 表現為一個懸浮於虛空之上的社區，由住宅和瓷磚街道組成，地形邊緣呈完美圓形。枯萎植被為深棕色，天空保持暮色。唯一安全的「明亮道路」由路燈照亮，離開燈光進入黑暗後人會消失。路燈有時會熄滅，造成致命危險。建築物內部大多被填充物填滿。路徑盡頭有兩棟正常房屋，內有日記和損壞的攝影機。", "entrances": ["在 Level 90 房子內打開後門通主要道路附近房屋後院", "在 Level 69 主要道路出現「分岔」時沿岔路行駛"], "exits": ["檢修孔打開時進入來到 Level 183", "進入有運行中電視（雪花屏）的房屋來到 Level 104", "點燃任何房屋來到蒙黑天空"]}, "167": {"name": "美国最喜欢的消遣", "class": 1, "summary": "Level 167 由小城市大小的地區組成，建築風格類似20世紀末城市郊區。中心是一個棒球場，兩個社區「奶昔隊」和「煙味隊」的粉絲互相敵視。比賽經常以暴力互毆結束。奶昔隊有戰歌，煙味隊有腳步鼓掌儀式。運動員住在棒球场地下，很少關注觀眾。該層級有橙色無雲天空，太陽永不升起落下。超市食物定期補貨。", "entrances": ["在 Level 40 玩「壞消息熊的極限棒球挑戰賽」街機遊戲", "穿過 Level 168 「街區」變種有小概率通向此處", "沿 Level 480 走廊偶爾到達超市", "Level 777 的「黑襪子」專業體育賭場有門通往"], "exits": ["離開棒球场足夠遠會前往隨機層級，最常到 Level 98、132、153、220、648"]}, "168": {"name": "Level 168", "class": 1, "summary": "Level 168 通常位於外觀平常內部巨大的房子內部，或無盡郊區庭院，罕見情況下是巨大城市公園。常見實體是兒童和成人無面靈。兒童無面靈會邀請流浪者玩捉迷藏遊戲，流浪者無法拒絕第一次邀請。遊戲流程：數到30、尋找躲藏的兒童無面靈、找到最後一隻後開始新一輪。無限循環直到死亡或離開。有「搜尋者」團體和「Heidi」個人定居於此。", "entrances": ["在其他層級躲避實體一段時間後有小概率切出進入"], "exits": ["從窗戶離開通常到達 Level 168 的另一形態", "盡可能遠離大本營切出可到達其他層級：內部形態到 Level 18、27、178、282；外部形態到 Level 9、90；公園形態到 Level 10、11、172"]}, "169": {"name": "Level 169", "class": 1, "summary": "Level 169 外觀為北美沙漠荒原，直徑約551公里。一天週期48小時，白天42°C，夜間1°C。所有水（包括杏仁水）都會變成沙子，暴露陽光下6-7小時身體水分也會變成沙子導致死亡。沙漠中心有一口井作為入口，遠處有一棟房子是安全庇護所。唯一實體是「Ferry」——一台有感知力的冰箱，每小時補充食物和杏仁水，對人友好。", "entrances": ["進入方法不明確，報告中共同因素包括：獨自一人、對過去存疑、迷路、危及生命的處境", "切入隱秘層級井中的牆壁（已知穩定入口）"], "exits": ["到達沙漠盡頭跳下懸崖，會在 Level 11 中醒來"]}, "170": {"name": "水泥箱群", "class": 2, "summary": "Level 170 是一處乾燥場地，地面鋪設水泥箱子，約7公里長400米寬，四面圍有稀疏森林。氣候溫暖，25-35°C，時間週期混亂——太陽落山立即升起，無夜晚。水泥箱分三型：一型（約900個，死亡飛蛾繁殖地）、二型（約100個，傳送門功能）、三型（3個，對人思維有益，可能活著）。森林中有地棲怪出沒。", "entrances": ["通過 Level 39 的樹木切出偶爾抵達", "Level 81 的某些水泥牆辦公室通向二型水泥箱", "通過 Level 162 混凝土牆切出前往二型水泥箱", "在 Level 108 走廊中迷失導致通過二型水泥箱到達", "離開 Level 192 的森林可抵達", "通過 Level 797 牆上某個洞抵達"], "exits": ["深入森林可能進入 Level 10", "某些二型水泥箱通向 Level 162", "某個一型水泥箱通向 Level 181 的B類礦洞", "森林中罕見的棕櫚樹，攀爬後到達 Level 204"]}, "171": {"name": "堂皇幻象", "class": 5, "summary": "Level 171 最初表現為1930年代風格中庭，有慢爵士音樂和玫瑰香氣。但繼續穿行後環境會惡化，變成腐爛空殼，燈光被「指示燈」實體取代。「疫病」是由多種實體組成的敵對群體，與指示燈有共生關係。燈光每五分鐘切換：燈亮時看到堂皇幻象，燈滅時看到腐壞外表且實體可見。M.E.G. 已將該層級列為高危，建議勿進入。", "entrances": ["通過 Level 5 中一側廳進入，通常在迷路時出現"], "exits": "未知，目前未找到任何可證實的出口。"}, "172": {"name": "工业区", "class": 3, "summary": "Level 172 是一座位於城市郊區的輕工業區，類似2000年前後的現代工業/辦公區。有大廳、倉庫、辦公樓和街道。濕度高，溫度約10°C，有日夜循環。街道上有無人駕駛的巴士、電車和卡車。事件分為：白晝（安全漫遊）、黑色黎明（光線消失需找庇護）、夜晚（漆黑一片，外出極度危險）。有「電車幫」移動團體定居於此。", "entrances": ["在 Level 11 找到多倫多電車系統軌道，搭上電車並在途中失去知覺"], "exits": ["在任意站台搭乘巴士回到 Level 11", "在電車內等待或搭乘另一班電車通常回到 Level 11，也可能到後室地鐵", "大廳與倉庫入口門有時帶到 Level 20、56，罕見到 Level 522", "搭乘行駛中的卡車到 Level 22", "切出辦公樓天花板通向 Level 171", "切出關閉的辦公室門可能通向 Level 4"]}, "173": {"name": "水之墓穴", "class": 4, "summary": "Level 173 是一個被洪水淹沒的巨大洞穴，全部由混凝土製成，淺黃色燈光照明。水位隨區域變化，從3英尺到60英尺不等。水中有陌生魚類會攻擊落水者。牆壁和地板上刻有神秘英文銘文，如「毋信水」「LEVIATHAN 即將甦醒」。實體包括死亡飛蛾、肢團、獵犬等。有多個瀑布，部分通向其他層級，部分通向深坑。", "entrances": ["在 Level 172 黑色黎明事件發生時出現在這裡", "進入 Level 8 中的瀑布", "小機率在 Level 3 切入一面牆", "冒險進入 Level 300 的某個瀑布"], "exits": ["找到終點來到 Level 174", "進入瀑布到 Level 66、76、140、2、6、994、998", "瀑布後深坑到 Level 666、899、532、6", "瀑布後彩色門參加派對！=)", "找到秘密出口來到終點"]}, "174": {"name": "永恒炽射", "class": "δ", "summary": "Level 174 是一片毫無生氣的荒漠，被致死量輻射污染，輻射來自永久燃燒的核爆蘑菇雲。蘑菇雲高度接近2000英尺，持續拋射碎塊並放射熱能與核能。天空呈亮橙色。廢棄建築遍佈各處，從小木結構到發電廠都有。M.E.G. 曾建立「γ調查員」前哨站，後因輻射病傷亡過多而關閉。", "entrances": ["level-155：切入用火線同種材料築成的牆面", "Level 360：切入生化危害或放射性警告標誌", "Level 368：在房間中部找到洞口", "Level 463：切入亮紅色或亮橙色水泥地面", "Level 170：走入發光的3型水泥箱", "level-187：墜入小片沙子內有時帶至場地內"], "exits": ["level-140、Level 494、Level 648：抵達層級邊界處", "Level 170：3型水泥箱可作為出口", "Level 420：進入中部有核反應堆冷卻塔的水體", "Level 566：進入以枯草為邊界的工廠"]}, "175": {"name": "单色癫狂", "class": "死区", "summary": "Level 175 是一片荒涼貧瘠的城市景觀，從地面到天空都被深褐色調浸染。空氣乾燥靜滯，無天氣與晝夜循環，永處正午。所有物體都帶有極強的抗損抗蝕能力。分三層：地表（城市廢墟）、城市下廊道（迷宮般通道）、底部礦井（鏽跡斑斑的礦道）。停留越久越容易被深褐色慢慢轉變。", "entrances": ["心懷懷舊和閾限相關情緒可能穿越至此", "在後室任意一角觸摸一張深褐色舊時照片可能被送至這裡"], "exits": ["爬進一輛礦車並拉動剎車桿觸發前往 Level 11 的切行"]}, "176": {"name": "Level 176", "class": 1, "summary": "Level 176 是一間無盡的雜貨店，拿走東西後會立即補充原處。偶爾可見 Level 11 的無面靈購物，有時會隨機停電，之後所有無面靈消失、貨架清空。揚聲器中可聽到無線靜電聲。流浪者會突然產生不祥預感或與自身脫節的感覺。有休息室區域，內有沙發和桌子。還有儲藏室，卡車會定期到來補貨。", "entrances": ["在 Level 11 找到新食品店開張的廣告牌並切過它", "在 Level 29 找到一張關於 Level 176 的畫並進入", "在 Level 20 找到一箱食物，吃掉箱中東西", "在 Level 138 進入便利店並在員工室等待幾小時"], "exits": ["洗手間區域找到洞口到 Level 34", "在休息室找到食品運輸清單並閱讀來到 Level 17", "跟隨卡車離開來到 Level 11", "在卡車中待過長時間來到 Level 50", "找到有黑色粘稠物質的門來到 Level 20", "探索100英里後商店不知不覺轉變為 Level 177"]}, "177": {"name": "起立鼓掌", "class": 2, "summary": "Level 177 主要由無限多的紅色天鵝絨劇院座椅構成，類似豪華大型劇院內部。舞台似乎永遠不會接近或遠離。坐在任何座位上都會與座位永恆融合，無法離開。帶入的椅子凳子也會變成劇院座位。被困者經歷高度扭曲的體感時間，生物過程凍結。舞台上有面具人形實體表演音樂劇歌劇。有自稱 Raubritter 勳爵的實體，能幫助人們離開座位但去向不明。", "entrances": ["任何有遮簷的入口都是 Level 177 的入口", "從後室幾乎任何地方切入"], "exits": ["每隔一千行座位有明確標記的出口，通往隨機層級"]}, "178": {"name": "京都梦", "class": 0, "summary": "Level 178 是一棟無限循環的傳統日式町屋，有溫泉，實體絕跡。分為庭院（中央有溫泉）、門廊、廚房、主要活動區、淋浴間、盥洗室和臥室。食物和杏仁水充足。天氣永遠停留在清晨，綠植覆蓋露水。有「大日母神神社」和「天照寮」兩個主要組織定居。", "entrances": ["從 Level 127 被刮牆獸追逐時偶然撞牆進入", "在 Level 7 入睡有小概率在溫泉中醒來", "在 Level 138 進入一棟木製建築", "在 Level 11 尋找一座遠處的町屋"], "exits": ["在溫泉中停留足夠久直到入睡，到 Level 66 或 Level 132", "切入一面看起來更暗的牆壁回到來時層級", "穿行數週找到標有出口標誌的小房間進入 Level 138", "在溫泉中向下遊到 Level 178.1", "通過廚房食品儲藏間到反現實保齡球館"]}, "179": {"name": "失物招领旧货店", "class": 0, "summary": "Level 179 是具有數目不明大型房間的綜合體，內部擠滿二手老舊物品，類似旧货店/慈善店。每個房間形狀各異，但非歐幾里得性質。主要商品是衣物，也有CD、磁帶、玩具、家具等。購買物品後約10分鐘會被類似商品替代。層級內貨幣為白色卡片（標有5-20數值）。商品被認為來自後室流浪者的遺物。有「自貿店」組織定居於此。", "entrances": ["Level 11 內的慈善店", "Level 33 未被腐蝕部分的慈善店", "level-36 內類似英國慈善企業的店面", "Level 82 內的英國慈善企業店面", "Level 102 或 Level 224 內寫有「慈善店」的已打烊商鋪", "Level 167、207、215、990 內的廢棄慈善店店面", "Level 209 主要炸魚薯條店附近的疑似經營慈善店", "Level 420 主輻射湖遠處的寵物店主題慈善店"], "exits": ["通過半普適出口離開，返回來時層級"]}, "180": {"name": "旅者之海", "class": "habitable", "summary": "Level 180 是一片浩瀚海洋，有許多島嶼，島上建築和船隻類似16世紀。海水受不同區域重力影響，部分海平面呈山坡地形。有看不見的「洋流」影響航行。粘稠灰色海水被稱為灰海，據說含有「海洋異形」。「荷蘭人」實體是無人駕駛的幽靈船，對船隻有敵意。流浪者組成「擺渡人」提供島嶼間商業渡輪服務。後室衛隊海軍（第一至第四艦隊）保護航線安全。", "entrances": ["在浸濕的木牆內找到入口，尤其是橡木或松木材質，通向莫提港城鎮廣場"], "exits": "各島嶼上有通往其他層級的出口，詳見《「旅者之海」海圖及參考地圖》。"}, "181": {"name": "私人矿洞", "class": "其他", "summary": "Level 181 由礦區組成，是一個極其龐大的洞穴系統，向周圍延伸數英里。地下相當寒冷，平均高度約8英尺。時間會因礦洞位置而膨脹或收縮。礦洞分類：S（安全）、A（異常）、B（貧瘠）、C（時間收縮）、D（時間膨脹）、W（扭曲）、7（受保護）。開採的綠寶石色晶體有奇異特性，可用於心靈感應和製作武器。由「貝里信眾」組織控制。", "entrances": ["在 Level 4 的地上找到一個滿是泥水的洞", "在 Level 170 內某個水泥箱中找到一扇綠色的門，進入後前往B型礦洞"], "exits": ["停留18小時後被傳送至來時層級", "找到一個水坑跳入其中前往 Level 43"]}, "182": {"name": "馥郁疗法", "class": 2, "summary": "Level 182 是大型溫室穹頂，佔地近150,000平方英尺，由玻璃及鋼材建造，被無限戶外空間包圍。分五區塊：入口區塊、戶外區塊（橡木林+杏仁水河）、花海區塊（各種發光花卉）、熱帶區塊（熱帶雨林）、菌類區塊（生物危害真菌）。有「麥基坦菌」實體，分黃色（營養吸取致死）、藍色（致幻）、紅色（模仿細胞結構，可用於癒合和複製物資）三種變種。", "entrances": ["走進 Level 165 內的一處溫室", "觸摸 Level 23 內的幼苗"], "exits": ["在森林內朝任意方向走夠長距離，被傳送至 Level 32", "走過溫室穹頂出口門切入至 Level 4"]}, "183": {"name": "洁净下水道", "class": 2, "summary": "Level 183 是一個巨大且異常乾淨的下水道設施，完全被泳池瓷磚覆蓋。部分被實體「非水」覆蓋，非水與乾淨淡水相似。分多個樓層，每層約4平方公里，由隧道連接小房間。一樓乾燥，是 I.R.H.B.（巢穴行為獨立研究員）基地所在地。二樓以上被非水淹沒。常見實體有白化屍鼠和死亡飛蛾。", "entrances": ["在任何有洗手間的層級，從乾淨到令人懷疑的座便器切入進入"], "exits": ["在沒被其他流浪者看到的情況下吃任何垃圾會切出地面進入 Level 183.1", "在一樓天花板上切出會帶回原來的地方"]}, "184": {"name": "忘城漠野", "class": 1, "summary": "Level 184 是一片風景秀美卻荒無人煙的鄉野，散布廢棄建築。風景安靜，荒廢建築與生機勃勃的自然形成對比。分為糧田（小麥、大麥、水稻）、油菜花田（生產菜籽油）、蓬亂平原（未開墾土地）。無敵對實體，自然狀況適合建立基地。有 M.E.G. 穀物收割站和油菜花收割站，以及「新藝地」定居點。", "entrances": ["通過其他相似層級無縫進入，如 Level 10、811、205", "在 Level 10 找到麥田中的油菜花進入", "通過 Level 170，找到尤其破舊的混凝土結構進入並轉身"], "exits": ["跟著路標順路走最終前往 Level 11", "進入廢棄建築後試圖離開可能切出到 Level 11、4、10"]}, "185": {"name": "下一班列车自号月台出发", "class": 0, "summary": "Level 185 是一個無盡車站，直接與 Level 90 和 Level 159 相連，被兩層級居民用作公共通勤方式。月台長度和數目無限，每四個月台有拱門分隔。月台用正負數字編號。列車週期性抵達，在月台旁停靠15-30分鐘。指路牌顯示接下來20個月台的抵達和發車信息，包括終點層級名稱。列車內部不會經歷變速物理效應，可前往幾乎任何後室層級。", "entrances": ["從 Level 90 跟隨軌道到邊界圍欄的木旋轉門，走向公用小路", "從 Level 159 找到內部月台與 Level 185 相似的廢棄火車站"], "exits": "列車可理論上在後室任何層級停靠，旅客需記住常用層級綽號以辨認指路牌。或走出出廳大門/切出層級末端牆壁返回 Level 90 或 Level 159。"}, "186": {"name": "无限山谷", "class": "宜居", "summary": "Level 186 是一條被群山環抱的無限長河谷，遍佈草原、雨林與丘陵。兩側是高出河流8000米的巨大山脈。有「援助之手」的未知力量保護，敵對實體無法進入山谷邊界，試圖進入者會被閃電消滅。是「山谷共和國」的居住地，有35422名居民。36小時一天，547天一年，四季分明。土壤肥沃適合耕種。中心有19世紀鋼橋和高架火車站，「山谷快車」蒸汽火車每日停靠一次。", "entrances": ["未犯下重大罪行的人才能來到", "在 Level 5 或 Level 57 中找到一幅畫有被山脈環繞河流的畫，觸摸它"], "exits": ["在火車站乘坐「山谷快車」帶至 Level 60 的火車站", "在 Level 186 犯下不可饒恕的罪行會被驅逐到隨機危險層級"]}, "187": {"name": "无人之盛夏", "class": 3, "summary": "Level 187 處於永久夏季狀態，因標誌性的金黃色田野知名，時而可見乾草垛。悶熱陣風吹拂，太陽光耀灼人，記錄溫度約98°F，太陽落山後反而升至112°F。田野間偶見日式風格房屋，但屋內只有加熱器。因未知原因無法在此入眠。夜間「草-垛」實體活躍，會發出蟬鳴、人聲、煙花聲等各種聲音。流浪者會出現視聽幻覺。", "entrances": ["在 Level 33 內引燃自己", "在 Level 81 內食用蟬蛻殼", "在 Level 130 內引燃格拉奴邏的殘骸", "在 Level 290 內叩擊紅門不打開", "在 Level 480 說出「夏日」一詞"], "exits": "完全吃下層級內任一異常建築，帶至 Level 52 或 level-172。"}, "188": {"name": "Level 188(旧)", "class": "deadzone", "summary": "Level 188 是一顆名為 August-1B 的行星表面，與水星相似但有含氧大氣（10.2%氧氣）。溫度範圍-98°C到221°C。行星潮汐鎖定，一面永遠向著藍超巨星 August-1A，另一面永遠黑暗。明暗交界線的環狀地帶溫度適中可支持生命。有一個年久失修的空間站，所有居民已死亡。可觀測到另外兩顆行星 August-1C 和 August-1D，以及大量流星雨。", "entrances": ["僅有入口是自 Level 3 內的一面窗戶切出"], "exits": "僅有出口同樣是從 Level 3 內的那面窗戶返回。"}, "189": {"name": "后市™", "class": 2, "summary": "Level 189 外觀是一家普通便利店，但比日常便利店大得多。所有物品都有條形碼，店內一切免費。分四區域：收銀區、過道、儲存點、伺服器機房。有「助手」實體提醒流浪者掃碼。違反規則會引發「違規」現象，產生幻覺並向未知實體祈求寬恕。伺服器機房最危險，有致命裸露電線和低溫。有漢克·蒂爾曼團隊管理商店。", "entrances": ["在 Level 11 找到燈光明亮的雙開門通往此處"], "exits": ["穿過前門雙開門離開回到 Level 11", "儲存點的消防出口通向 Level 3 或 Level 141"]}, "190": {"name": "放学留校", "class": 2, "summary": "Level 19
