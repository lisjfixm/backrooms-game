, "714": {"name": "未来放克电台", "class": 0, "summary": "Level 714 是一個地下電台和錄音室，充滿繽紛塗鴉和復古像素風格。設備齊全，有計算機、音頻工作站、話筒、監聽器等，電力無限。層級由休息室、長廊、錄音區和編輯區組成。有一個名為「放克販子」的實體主持電台節目，與流浪者互動友好。", "entrances": ["收聽「未來放克電台」並沉浸在音樂中可進入。"], "exits": ["走入層級盡頭的一扇門可回到進入時的層級。"]}, "718": {"name": "澄澈蓝天", "class": 1, "summary": "Level 718 是一片無垠的蔚藍天空，地面覆蓋薄層透明液體可行走。太陽永不落下，溫度恆定21.1°C，空氣瀰漫甜食氣味。層級中唯一實體是 Entity 440「歷史學家」——高約2.74米的發光類人生物。有「沉默修道院」63名成員居住於此。單人最多停留24小時，超時會被隨機傳送。", "entrances": ["穿過 Level 717 的濃霧是主要入口。", "在 Level 4 跌出窗外有小概率抵達。", "據稱在前廳美索不達米亞地區可能直接切入。"], "exits": ["進入 Entity 440 附近的灰色濃霧前往 Level 719。", "穿過進入時的白霧回到 Level 717。", "要求 Entity 440 傳送至生存難度0或宜居的層級。"]}, "721": {"name": "小事", "class": "其他", "summary": "Level 721 是一篇散文式敘事層級，以主角哈利的視角描述冬日鏟雪、喝熱可可等日常瑣事，最終發現雪是紫色的。層級格式獨特，以文學性散文呈現，沒有標準的描述、基地或入口出口章節內容。", "entrances": [], "exits": []}, "722": {"name": "人心渊恶", "class": "unknown", "summary": "Level 722 是一個極度龐大的宅邸內部，包含多種特殊房間：空白房（使人漠不關心）、內臟房（使人憤怒）、補給室（有武器貴金屬但有陷阱）、陷阱室（中世紀地牢式陷阱）、窺視室（使人跟蹤狂熱）、成就室（使人自我膨脹）、宣傳室（使人偏見）、奴役室（使人被控制操作機器）、嫉妒房（使人貪婪）、悲傷房（使人放棄生存意志）。層級本身可能是多個實體的集合體。", "entrances": ["在 Level 5 中有一個唯一的大門入口，目前被 M.E.G. 監控禁止進入。"], "exits": ["通過進入時的大門離開回到 Level 5。", "在奴役室拉動機器槓桿可能隨機傳送至 Level 3。", "在嫉妒房觸摸畫中畫家伸出的手可傳送至 Level 57。"]}, "725": {"name": "光明与黑暗", "class": "幻象", "summary": "Level 725 是一個六面皆為鏡子的立方體房間，鏡子不斷反射形成無限延伸的錯覺。沒有光源但能看到自己的倒影（實為幻覺）。部分鏡壁非固態可穿過，穿過後會進入有裂縫和血跡的複製房間，倒影會開始獨立行動並引誘流浪者進入陷阱。最終可能墜入永無止境的鏡壁房間循環。", "entrances": ["在 Level 365 中穿過非實心玻璃的鏡子可進入。"], "exits": ["打碎實體鏡壁後穿過破洞可來到公共澡堂的瓷磚牆後方。", "鏡壁後方為虛空時不建議進入。"]}, "726": {"name": "只是一间普通的客厅", "class": 0, "summary": "Level 726 是一個約218平方英尺的小型層級，只有一間房間，有椅子、咖啡桌、毛毯、壁爐和兩扇窗戶，窗外是季節變化的樹林景象。房間有狗盆（刻著「潘達」名字）、一本日記。沒有實體，窗戶有時自行打開，壁爐有時突然燃起，屋內瀰漫食物香氣。M.E.G.設有兩人前哨。", "entrances": ["已知入口位於 Level 1 與 Level 39。"], "exits": ["從相連的其他房間走出回到 Level 1 或 Level 39。", "翻出窗戶會切入 Level 39。"]}, "729": {"name": "星期一", "class": 3, "summary": "Level 729 由無限方形房間組成，每間有一張單桌和純色牆壁。房間中有類似「加菲貓」的實體，它們不承認流浪者存在，不斷重複相同動作。透過 Level 906 中的書籍可將部分房間與加菲貓漫畫配對。一個名為 Jon 的角色曾偷偷遞紙條警告「這裡不安全，牆有耳」。", "entrances": ["從 Level 94 中的房子進入。", "從 Level 177 的出口進入。"], "exits": ["走動時偶爾遇到通往 Level 283 的門。"]}, "730": {"name": "我们一路走来", "class": "其他", "summary": "Level 730 是一條風景如畫的徒步小徑，永遠處於凌晨時分，氣溫24°C，有不知名鳥兒鳴唱。入口是穿過空心巨樹的裂縫。沿途有小溪、瀑布、各種景點。有「導遊」陪伴流浪者，它們能記住每位遊客的故事，是冥想專家。當流浪者心靈平靜時，路會帶領他們到山洞前離開。層級具有療癒性質。", "entrances": ["流浪者在人生轉折點時無意間進入，穿過空心巨樹的裂縫。"], "exits": ["心靈平靜時，路會帶領到山洞前，跟隨洞盡頭的光明離開。"]}, "735": {"name": "寂静海", "class": "unknown", "summary": "Level 735 是一片無邊無際的海洋，散布著不毛島嶼。光線永遠處於航海曙暮光狀態，無風無浪但每兩年會有一次巨大浪潮。海水無鹽略帶甜味。所有進入者會被分隔開，無法重聚。天空中有時可看到上下顛倒的海洋。存在不穩定區域（雷暴、非歐幾里得幾何、冰凍），島上有加密信息的傳單。", "entrances": ["在特定時間段內探索 Level 7 可自然抵達。"], "exits": ["在不穩定區域的島嶼下方進入開口可抵達 Level 8 或 Level 60。"]}, "739": {"name": "（荒漠孤島）", "class": "5E", "summary": "Level 739 是一片無垠白色沙丘，交錯淺池塘與河流，氣候陽光燦爛但天空鉛灰。地面溫度約42°C，水源含鹽分不可飲用。層級會加速流浪者衰老，導致關節僵硬、皮膚乾枯。有流沙（非牛頓流體）陷阱。中心有「孤樹之島」，島上枯樹的石碑刻有咒語，投入寫有問題的紙張可被傳送到任意沙漠或海洋相關層級。", "entrances": ["切入 Level 100 或 Level 63 的白沙。", "躍入 Level 1 中一幅繪有枯樹岩石島的畫作。"], "exits": ["在孤樹之島完成樹之儀式（投入寫有問題的紙張）可通往任意沙漠或海洋相關層級。"]}, "740": {"name": "（废弃核电站）", "class": 4, "summary": "Level 740 是一座1950年代建造的廢棄核電站，溫度約9°C，深入後更冷。由兩座冷卻塔組成：第一座殘破不堪，是實體巢穴；第二座外表嶄新仍在運轉。層級中有笑魇和悲尸（前工作人員轉變而來）。有 B.N.T.G. 基地「能源猎手」。核心有一台巨大的回溯機器，依賴現實清新劑運作。", "entrances": ["在 Level 1 打開比四周牆面稍冷的門。", "在 Level 11 切入正在運轉的發電站牆面。"], "exits": ["跳入殘損高塔內的冰冷池水可到 Level 10.1。", "返回入口可回到 Level 11。"]}, "742": {"name": "枯坐，无终", "class": "Aleph", "summary": "Level 742 是一個無邊無際的等候室，所有方向無限延伸。荧光燈始終照亮空間，發出刺耳嗡嗡聲。層級中佈滿各種椅子，一旦接觸就會被牢牢粘住，坐下者無法掙脫。時間膨脹效應導致流浪者迅速衰老且不可逆轉，最終化為塵埃消散。杏仁水對此無效。", "entrances": ["流浪者在絕望中等待某事物時可能進入，例如在 Level 0 中極度飢餓渴望希望時。"], "exits": ["未知。"]}, "751": {"name": "一切逝在川中之物。", "class": "其他", "summary": "Level 751 是一篇詩意散文式層級，以2003年10月2日楓紅之夜為背景，描繪七歲孩童放學歸家、季節變遷、時光流逝的回憶性場景。層級格式獨特，以日記式時間戳和文學性語言呈現，沒有標準的描述或入口出口章節。", "entrances": [], "exits": []}, "756": {"name": "大岛上只生活着一头牛。", "class": 0, "summary": "Level 756 是八座小島組成的集合，懸浮於彌霧虛空中，由搖晃的木橋連接。中島有一頭牛，島上有青草和橡樹。層級播放重複扭曲的鋼琴旋律，使流浪者感到平靜和憂鬱。觸摸奶牛會加深悲傷情緒。通常只有在抑鬱狀態下的流浪者會意外進入，離開後會感到生活意義感提升。", "entrances": ["進入方式不明，通常發生在有高度抑鬱傾向的流浪者身上，會突然在島上醒來。"], "exits": ["在島上睡著後會在自己床上醒來，感覺休息良好。"]}, "771": {"name": "神圣领域（Paradise 771）", "class": 4, "summary": "Paradise 771 是一個島嶼天堂，有草地、城堡廢墟、東部工廠、海岸線。南部有希臘式古城廢墟和淺藍色宝珠（可在天堂系統間傳送），北部有神廟和紫色宝珠（回到天堂之門）。島上有三尾狐等實體。海底廢墟中有綠色水晶（Object 771-A，可吸引並控制實體）和先驅者設備。", "entrances": ["在循環第二階段使用 Paradise 997 的第一個氣閘進入。", "與 Paradise 770 頂的水晶互動選擇目的地。"], "exits": ["與古廟紫色宝珠互動回到 Paradise 997。", "與古城淺藍色宝珠互動回到 Paradise 770 或其他天堂。", "花園迷宮綠色宝珠前往 Paradise 414。", "切入樹籬前往 Paradise 369。", "潛入海底大洞前往 Paradise 303。", "沿水下白色瓷磚通道前往 Paradise 37。", "聖間彩虹色宝珠通往 Paradise 772。"]}, "772": {"name": "起源（Paradise 772）", "class": "多元难度", "summary": "Paradise 772 分為多個「考驗」階層。階層1「世終孤獨」是永夜平坦場景，有孤獨路燈和黑色人形，生存難度1。階層2「永恆獄」是無邊田野，有倒計時，6分鐘後黑暗中出現有意識的陰影，生存難度4。層級具有信息危害性質，試圖深入探索會導致記憶被抹去。通過全部考驗可抵達神居最後階層。", "entrances": ["與彩虹宝珠互動，同時吟誦 Paradise 771 金色書籍中的詩篇77:2。"], "exits": ["在階層1連續行走數小時遇到閃爍路燈，站在下方可抵達下一階層。"]}, "777": {"name": "机遇游戏", "class": "unknown", "summary": "Level 777 是一個巨大的賭場層級，無法通過常規方式進入，只有富有賭性的流浪者才能找到。層級中有三巨頭賭場：error 101_DELETE（故障輪盤）、名門對決（桃心撲克）、莫甘娜賭場（命定之拋）。莫甘娜理事會由七位強大實體組成，能扭曲現實。有賭徒組織和 M.E.G. 前哨。賭注可以是記憶、關係、器官甚至生命。", "entrances": ["富有賭性的流浪者可隨機找到進入方式。", "在 Level 98 找到戴獨眼罩的男人與其賭博，獲勝後傳送至莫甘娜賭場外圍。"], "exits": ["通過大堂離開傳送至樞紐或 Level 0。", "在中端賭場獲勝可傳送至特定層級。", "在三巨頭賭場獲勝傳送至 Level 4。", "未經允許進入塔羅室有20%機率傳送至 Level 6。", "故障輪盤或撲克遊戲中的故障可隨機傳送至其他層級。"]}, "789": {"name": "为何六害怕七？", "class": "Ψ", "summary": "Level 789 類似一座數學藝術博物館，展覽幾何多面體、分形藝術、數學錯覺等。漂浮的四維物體投影會穿過固體。部分區域是「數學錯誤空間」（MIS），物理法則失效，長期待留會損傷身心。有變異實體（牙齒環繞眼睛的笑魇、融合的肢團等）和名為 Telatrix 的原生實體。", "entrances": ["已知入口在 Level 4、Level 12、Level -1 和後室地鐵。", "Level 256 和 Level √2 據稱可能有入口（未觀察到）。"], "exits": ["撕開大型紙質結構體有機會到 Level 440 或 Level 137。", "特定數字展品送到 Level 522 或 Level 25。", "在 MIS 中離開可能到 Level √2 或 Level -0。"]}, "790": {"name": "在劫难逃", "class": "deadzone", "summary": "Level 790 是一座被雪覆蓋的古典英式城鎮，溫度-2°C，每天有暴風雪。房屋有現代設備但會自動重置。層級會通過各種「意外事件」殺死所有進入者：暴風雪、屋瓦墜落、冰面滑倒、一氧化碳中毒、食物中毒、電氣火災、樹枝折斷、地面開裂。死亡概率隨時間增加直至無法規避。", "entrances": ["從 Level -7 小鎮中接觸工廠散發的白霧。", "在 Level 26 找到一扇橡木门進入。"], "exits": ["目前未發現任何出口。"]}, "797": {"name": "少有人走的路", "class": "unknown", "summary": "Level 797 是一條綿延的林間石路，路邊有可進入的石窟通往其他層級。有類似前廳的晝夜循環，氣溫14-20°C，多雲偶有霧風雨。沿路有廢棄大壩、白色平房前哨站（有物資）、海灣等景點。沒有實體。路邊森林茂密但應避免深入。路似乎會移動，有「子路徑」會出現又消失。", "entrances": ["入口方式不明（頁面顯示「時候未到」）。"], "exits": ["通過牆上眾多石窟離開，可前往 Level 10、Level 39、Level 75、Level 84、Level 134、Level 140、Level 155、Level 170、Level 300、Level 420、Level 480、Level 817 等。"]}, "799": {"name": "赛列妮与她的回忆", "class": 0, "summary": "Level 799 由無限組科研設施房間組成，白色塑膠地板和乾燥白牆，擺放科學儀器，印有 U.E.C. 和後室機器人科技標誌。牆上有生鏽金屬隧洞連接各房間。整個層級迴盪著撕心裂肺的女性尖叫聲，但音頻設備無法錄製。實際上是一個名為賽列妮的女孩被父親 Winston Rosevolt 博士進行人體實驗後，其記憶創造的地獄。", "entrances": ["穿過 Level 172 的一棟辦公樓，任何窗戶或門都會將流浪者送至此層級。"], "exits": ["進入時的入口即是唯一出口，建議不要遠離入口以免永遠迷失。"]}, "800": {"name": "钟表之屋", "class": 1, "summary": "Level 800 是一座迷宮般的大型倉庫，裝飾著各式鐘錶發條零件，空間內瀰漫渾濁昏黃的光線。倉庫內布滿金屬滑輪、管子與機械，機器如太陽般閃爍金光，四處可聽到無數鐘錶的滴答聲。房間大小不一，有些需要攀爬樓梯或低垂的鏈條。鐘錶呈現非歐幾里德幾何形狀，會變換形狀迷惑流浪者，常見變換包括無盡收縮的走廊、擁有九百多個岔路的方形大房間、類似老爺鐘內部的垂直空間，以及以方形窗圍成一圈的走廊。本層出現的實體有錯音玩偶、獵犬與窗戶。層級內沒有已知社區或前哨站。", "entrances": ["爬入 Level 1 的一個開放式通風管道即可進入 Level 800。", "打破 Level 356 中的一道牆會來到 Level 800。"], "exits": ["打開並進入 Level 800 的任何一扇窗戶會回到 Level 0。", "移除任何大型時鐘並爬入其後的洞會來到 Level 808。", "爬上垂直「落地鐘」房間內的吊墜，可發現通往終點的木門。", "沿層級末尾向下攀爬約三英里的鏈條，經過標有「出口」的門可抵達 Level 801。"]}, "807": {"name": "污浸废壤", "class": "habitable", "summary": "Level 807 是後室中最安全的層級之一，面積不足 200 平方公里，遵循 24 小時晝夜循環，天空有一顆類似前廳的太陽。地勢平坦易於建造定居點，土壤肥沃、有天然泉水，植被以松樹與馬利筋為主，幾乎沒有動物，僅有木蟻與蜜蜂。氣候類似溫帶，氣溫約 23.5–27°C，每日降雨 1–3 次，建議攜帶雨具。資源包括木材、蜂蜜、蜂蠟，地下蘊藏鐵、鎳、銅與金等礦脈。M.E.G.、B.N.T.G. 與 U.E.C. 在此建立多個前哨站。需注意高爐排放可能使雨水酸化。", "entrances": ["在雨林狀態的 Level 16 中切入一棵松樹。", "在 Level 182 的熱帶區塊中切入一棵松樹。", "在 Level 149 內切入一棵杉樹。"], "exits": ["切入一棵猴麵包樹會將流浪者送回此前進入的層級；若切入時 Level 16 不在雨林狀態，則會被送到 Level 182。"]}, "811": {"name": "泰坦墓（泰坦的临终之床）", "class": 1, "summary": "Level 811 又稱「泰坦墓」或「泰坦的臨終之床」，是一片廣闊草原，遍布小山、樹木、河流、湖泊、花圃、火山與山脈。大氣成分與地球相同，氣溫 15–19°C，晝夜更替與磁場皆與地球相似。層級內散布著從簡陋石製到扭曲金屬的毀壞建築，最著名的是無數類似盔甲與武器的巨型金屬遺跡，如王者之劍、澤胡蒂頭盔、安喀勒神盾、伊卡洛斯臂甲、阿特拉斯、岡尼爾長矛與巨大的埃癸斯神軀幹，部分遺跡會發出微弱電路般的光。埃癸斯神軀幹內曾發現駕駛艙與終端，探員進入後出現頸部刺痛與昏迷。", "entrances": ["在 Level 2 中沿偶爾發出電路般閃光的管道前行，拉動門上的儀式機械匕首（而非門把）即可進入。", "Level 797 的眾多洞穴中有一個能通往 Level 811。"], "exits": ["在山洞中跟隨鏽蝕的人形金屬雕塑可到達 Level 817 的龍骷峰。", "伊卡洛斯附近的一些坑洞據稱通往 Level 170（待證實）。", "潛入岡尼爾周圍的河流後會在 Level 466 的湖泊中浮出水面。"]}, "813": {"name": "凛冽岛", "class": "other", "summary": "Level 813 是一片廣闊的嚴寒戶外地貌群，全層約 600 多英里，外圍環繞無盡水域，航行者在距岸 20 餘英里後船隻無一例外地沉沒。氣溫常年在冰點以下，暴風雪伴隨閃電。層級由三個環狀區域組成：外圍雲翳海濱（氣候較溫和，可種植格拉普麥，時間流逝與海拔相關）、中間嚴寒密林（冰點以下、暴風雪，有黑焰粉與獨特幻覺現象）、中心伊特福爾山脈（最惡劣，颶風強風與極低氣溫，有礦產與無法到達的古塔）。層級內有大量人類與半影族聚落，包括 M.E.G. Omicron 基地、頓·艾門等。", "entrances": ["在 Level 8 未知城鎮廢墟中、Level 11 塵土小巷、Level 25 櫥櫃間或 Level 54 樓梯間，找到裝飾斷劍與鹿角徽章的霜邊腐木門，踏入即抵達。", "極少數情況下流浪者初次切出後室時會直接進入本層。"], "exits": ["尋找散佈各處、拱門下地面發出橙色微光的古代大理石拱門；靠近 Omicron 基地海岸線的拱門通往 Level 11。", "賽佛德爾飛地附近另有一處難以到達的拱門，通往未知。"]}, "817": {"name": "Level 817（沙漠露天垃圾场）", "class": 1, "summary": "Level 817 是一座沙漠中的大型路邊露天垃圾場，1998 年由 Frederick「鏽蝕朋克」Kaiser 首次發現。大部分地區是布滿巨型沙丘的沙漠，幾乎無植被。著名區域包括：堆放汽車零件、家電、電腦部件等垃圾的露天垃圾場（M.E.G.「喪家之犬」前哨駐紮於此）、被破壞的高速公路（走到盡頭通往 Level 9）、巨大的鹽鹼荒漠，以及位於岩山中、含地下農場與火鹽礦的「龍骷峰」洞穴系統。Kaiser 在此製作各種發明，包括噴氣冰箱、可伸縮電鋸等。「塵暴」團體共 21 人居住於此。", "entrances": ["在 Level 1 的一個裝有碎金屬塊的集裝箱中切出可到達。", "進入 Level 797 大壩邊上的山洞可到達露天垃圾場。"], "exits": ["從層級的任意金屬牆切出可能到達 Level 1。", "走到高速公路的任意末端可到達 Level 9。", "探索龍骷峰洞穴可能到達 Level 797，極少數情況下到達 Level 75。"]}, "822": {"name": "通向地狱之途", "class": "other", "summary": "Level 822 是一個以敘事呈現的雨夜道路層級。故事主角 Faust 在與妹妹爭吵後被神秘力量拉扯，醒來時身處一條兩旁為黑森林的無盡潮濕道路上，空中下著綿綿細雨、雷聲不斷。他沿道路行走，不斷經歷童年記憶與罪惡幻象：路邊的廣告牌、童年故居、浴室中誤傷妹妹的回憶，以及一輛載著死者 Tob 的藍色本田思域。道路兩旁的樹木彷彿在呼吸，四周不斷傳來耳語與抽泣聲。整個層級宛如煉獄，是對流浪者內疚與自責的懲戒之地。", "entrances": [], "exits": ["沿道路前行，在遠方微弱希望之光的盡頭可抵達「一座無垠城市」。"]}, "826": {"name": "骸骨之海", "class": "deadzone", "summary": "Level 826 是一片看似無限的骨頭平原，骨頭大致構成平坦地面，多數為人類遺骨，也有未知實體的頭骨。骨頭常從地面伸出，容易絆倒或扭傷腳踝。天空漆黑無星雲，由無源無色光芒照亮，環境酷熱潮濕，可致中暑死亡。層級內腐敗降解速度極快，食物迅速變質，死亡者數日內化為骷髏，活人逗留超過一週也會開始降解。唯一地標是一個巨大無底坑，坑上有石製巨手雕像，手腕連著伸入坑中的石柱。無法在此建立社區。", "entrances": ["沒有已知的強行進入方式；流浪者極少數會在睡眠／夢境中進入，沉睡的身體會消失 6–8 小時。"], "exits": ["在層級內歷經一段時間（現實中約 6–8 小時）後會在原本睡覺的地方醒來，途中所受傷害與留下的照片、字畫會一併帶回。"]}, "827": {"name": "片刻喘息", "class": 0, "summary": "Level 827 是一條無限延伸的沙灘，兩側皆是無盡海洋，沙灘寬約 30 米，中央排列著無數鐵架床鋪，床單顏色各異，效果不同。藍色床帶來永恆美夢（陷入後無法喚醒）；紅色床將人送至 Level 127、141、187、368、440、854、966 等危險層；紫色床上者全部失蹤；綠色床導致數秒內溶解死亡；黃色床送至 Level 48、72、100、134、149、201、303、436、994，是較安全的出口；橙色床在層級內隨機傳送；白色床無效果；黑色床帶來永恆夢魘。層級會造成嚴重失眠。", "entrances": ["在任何有沙灘的層級中找到一張黃色床，在其上入睡會在 Level 827 的沙灘醒來。", "Level 221 中有一個與本層外觀一致的入口，不慎深入會意外進入。"], "exits": ["在黃色床上入睡可送至 Level 48、72、100、134、149、201、303、436 或 994（有時仍留在本層）。", "在紅色床上入睡可送至 Level 127、141、187、368、440、854 或 966（不建議）。"]}, "828": {"name": "枕头堡", "class": 0, "summary": "Level 828 是一座封閉的建築綜合體，完全由枕頭、毛毯等寢具配件構成，牆壁、地面與天花板皆由枕頭層層堆砌而成。枕頭內可發現杏仁水、幸運豆奶、糖果、彩色鉛筆、毛絨玩偶，甚至乳牙，部分裝有 LED 手電筒的枕頭提供昏暗照明。床上用品之間存在神秘吸引力以維持結構完整。環境無威脅，氣溫 8–12°C，無實體，在此入睡深沉且恢元氣、加速癒合。M.E.G.「心理學」團隊駐紮於此，另有約 50–60 人的流浪者社群。", "entrances": ["目前唯一已知入口是 Level 11 中一個佈滿枕頭的衣櫃。"], "exits": ["從同一衣櫃離開會回到 Level 11。", "強行非自主切出從未發生，但若強行嘗試會被傳送到 Level 18 或 Level 63。"]}, "831": {"name": "被摧毁的实验室", "class": "pending", "summary": "Level 831 形似一間嚴重損毀的生物研究實驗室，可探索區域包括一條三端被瓦礫封堵的十字走廊，以及經破損雙打開門到達的大型實驗室。區域曾遭火災與爆炸破壞。室內可辨認物品包括展示 27 組染色體的人類基因組海報、燒毀的《實用基因增強》書籍、五個破裂玻璃缸（其中一個從內部打破）、無標籤化學容器、兩台約 2064–2068 年製的電腦終端，以及一個帶有無羈探險者聯盟徽標、鎖被折斷的加固容器，內含可運作的終端與一封信。另發現兩具帶 M.E.G. 證件的人類殘骸。", "entrances": ["Level 817 高速公路旁可能出現混凝土地堡入口，鋼門結構扭曲無法上鎖。", "Level 103 中一扇標有「Lab Access」、門把被暴力卸除的門。", "據稱可經由 Level 141 到達（待證實）。"], "exits": ["唯一已知出口是走廊末端靠近瓦礫堆、帶有出口標誌的門，通向流浪者進入本層的入口。"]}, "834": {"name": "螺旋螺旋螺旋螺旋", "class": "deadzone", "summary": "Level 834 是高懸於深淵之上的金屬樓梯迷宮，樓梯在狂風中扭曲搖晃，從未有流浪者找到其最低點與最高點。樓梯質地新舊不一，少數有物理支撐，多數下方空無一物。新樓梯會從迷霧中升起，撞開附近樓梯。層級內陰暗多雲，微風時尚可安全行走，但強風會吹倒樓梯、撕裂金屬；最惡劣時狂風暴雨使整層成為無限大超導體，一道閃電即可擊斃所有行者。在樓梯上跌倒即可能切入本層。", "entrances": ["在有台階的層級（如 Level 54、92、280 等）被台階絆倒、不經意切入即可進入。", "部分入口表現為一扇金屬防火逃生門，進入後門會自動合上。"], "exits": ["在層級內找到另一扇類似的金屬門即可離開；但惡劣天氣會使這些門隨處飄移，看到時須盡快抵達。"]}, "841": {"name": "Planum 841", "class": "unknown", "summary": "Planum 841 平和而靜謐，是光滑大理石殘片的家園。層級中存在低沉的嗡鳴交談聲，匯集成一首無法忽視卻又難以明瞭的合唱。若找到一尊如岩石般靜立的雕塑並與之對話，它會教導你關於起始與終末的恐怖；若雕塑開始破碎或腐化，則應立即離開，因為「蛻變」不需要你。整個層級瀰漫著崇高者低語般的神聖詭異氛圍。", "entrances": ["在其他平面找到一塊「我們的大理石」（血肉）可能會被帶到此處。", "也可從 Planum 18 進入。"], "exits": ["若發出過多嗡鳴交談聲，可能會自然離開。", "關掉開關後可從為黑暗勇士準備的門離開。", "幫助其中一個雕塑完成蛻變可能會提前離開。", "若已看到哭泣者，則無法逃離，會出現在毗鄰平面 Planum 841.1。"]}, "848": {"name": "海阔天空", "class": "unknown", "summary": "Level 848 由無數類似傳統劇院的廳堂與房間組成，後台與儲藏室多為空，部分存放道具、戲服與劇院設備。本層無自然生成實體，但「愁眉苦臉」（掃興客）常遷移至此，利用道具搭建立體模型講述自身故事，並留下文字與洞穴壁畫。2021 年曾發生「紅毯事件」，數百名派對客縱火焚燒多個舞台區域，後由 M.E.G. 與阿麗亞娜集團聯手平息。後室裝修公司誤將一處廢墟改建為電影院，衍生出「掃興派」卡通創作團體。層級內有阿麗亞娜劇團、寂靜劇院公會等社區。", "entrances": ["通過 Level 847 中的一對玻璃門。", "在 Level 849 中爬上粉紅色樓梯。", "在層級編號為 8 的倍數的層級中隨機卡出時有一定機率進入。", "切入一尊威廉·莎士比亞的雕像。"], "exits": ["玻璃門通往 Level 847。", "走下粉紅色樓梯可回到 Level 849。"]}, "852": {"name": "零售疗法", "class": 3, "summary": "Level 852 是無限組垂直堆積的空置百貨商店，由自動扶梯連接，每層約標準百貨大小，溫度約 20°C，瀰漫地板蠟與爆米花氣味。商店類似 90 年代末購物場所，蒼白牆壁與單調日光燈，貨架幾乎全空。可遇電梯，按「1」至默認層、「2」至更危險的暗層（有笑魘與死亡飛蛾）、「ᘔ」至重力反轉的倒置區（有竊皮者、補給與腐蝕性液體）。出口位於罕見的「促銷層」，取下兩瓶杏仁水即離開。", "entrances": ["切行穿過一個空貨架會出現在層級某處的儲藏室。", "走進 Level 33 內的一個空商店有時會被傳送至隨機樓層。"], "exits": ["找到促銷層並取下兩瓶杏仁水會抵達 Level 1。", "切行穿過電梯地板會抵達 Level 853（不建議）。"]}, "853": {"name": "曲折死域", "class": 4, "summary": "Level 853 由無數曲折廊道相接而成，遍布死路與岔道，深綠色地毯與褪色黃色牆面。M.E.G. 推測內部存在某種循環，使實際規模遠大於表面（約 25 平方公尺）。地毯上隨機分佈洗滌液坑，充滿化學氣味與霉味。空間隨機排布、視線移開即改變，任何路徑標記都會消失。層級沒有窗戶卻永遠有狂風，門後多藏有敵意笑魘。燈光僅在人類劇烈活動時亮起，黑暗中笑魘、鈍人、獵犬會圍攻疲憊的流浪者。出口是一扇嵌有「351」壁板的門。", "entrances": ["攻擊一隻微光嚮導，在其逃跑時跟著穿過帶走廊的層級即可進入。", "從 Level 852 的電梯底部切出會掉入本層。"], "exits": ["進入標有「351」的門會即刻送入 Level 854。", "在走廊中跟隨一隻微光嚮導可進入 Level 0。"]}, "854": {"name": "家，甜蜜的家", "class": "deadzone", "summary": "Level 854 形似一間歷經嚴重火災的房屋殘骸，分三層：頂層（相對安全，有燒焦牆壁與兒童衛浴）、中間層（濃煙瀰漫、物品焚毀）、底層（無法撲滅的烈火逆時針蔓延，最危險）。層級核心是一個擅長心理操縱的異常人型實體「女人」，會對戒備低下者施加栩栩如生的幻覺（偽裝成愛人或家人），試圖誘騙流浪者留下。幻境可通過心理覺察、使實體困惑或襲擊實體破除；但激怒實體會引發致命火焰追殺。層級面積約 18,580 平方公尺，玻璃窗戶無法損壞。", "entrances": ["唯一已知入口是 Level 853 中的「351」號門。"], "exits": ["結構前門指向 Level 855。", "從壁爐處切出會去往 Level 902。", "「女人」逃離時緊隨其後會去往 Level 217。"]}, "864": {"name": "嗜暗癖", "class": "unknown", "summary": "Level 864 呈現一片巨大而危機四伏、敵意實體橫行的森林，濃霧瀰漫使視野受限。地表遍布古今廢墟，凡有入口者皆標註「家」「安全」「希望」「生存」以引導流浪者進入地下洞穴——那是真正安全的區域。地下建立了廣闊的洞穴文明，黑暗在此被尊崇，光明被蔑視；除視覺外五感增強（迴聲定位、嗅覺味覺敏銳），並有纜車連接各洞穴。層級獨有「急性嗜暗癖」現象，越深處越令人放鬆，黑暗還會使接觸的實體解體。地表有獨特實體「人虺」。", "entrances": ["在任意森林層級中迷失，讓濃霧漸漸裹挾而來即可能切入。", "從 Level 218 的隧道處離開可能會抵達本層廢墟外。", "在漆黑環境中完全站定一段時間後會來到本層。"], "exits": ["在洞穴內切出會把流浪者帶至 Level 6 或 Level 8。", "極少數情況下切入廢墟會把流浪者帶至 Level 811。", "墜入本層內的深坑會來到「零下」。"]}, "876": {"name": "水淹公园", "class": 0, "summary": "Level 876 是一個由大型野生動物公園內柏油小徑構成的盤虬迷宮，小徑荒廢、雜草叢生、道路開裂，兩旁有長椅與鏽跡健身器材。層級永久處於正午，天氣陰冷潮濕。本層於 2012 年由後網用戶 u/_ssskywing 發現，僅被遇見過一次，因為原入口已難以找尋。層級似乎具備某種自我意識，地面上留有「763 號日誌」，以孤獨的第一人稱記載它一次次看著流浪者到來又離去的渴望與失落。層級內無實體、無基地。", "entrances": ["目前沒有已知可到達本層的方式，因為其原入口已無蹤影。"], "exits": ["在小徑上游蕩過長距離後即可來到 Level 445；目前未知其他出口。"]}, "880": {"name": "Level 880（礁石行者号）", "class": 1, "summary": "Level 880 是一片疑似無窮面積的發光海底環境，唯一宜居區域是一艘自動駕駛、異常構造的潛艇「礁石行者號」，由黃銅、強化玻璃與深藍色未知金屬構成，疑似有 14 條機械長腿驅動。潛艇分四層：星光層（宗教聖地）、上部樓（流浪者主要進入點與村莊）、中部樓（垃圾間與報廢驅動室，有敵對實體）、下部樓（電氣迷宮、冷庫與陳列室）。外部是冷水珊瑚礁深海，有發光浮游生物。層級由宗教組織「海溝歌者」管理，他們對光源敏感，通常不允許非成員停留超過三天。", "entrances": ["抓住從大水體中探出的潛望鏡，會在水下被拖動一段後於入口大廳醒來；潛望鏡常出現在 Level 85、97、134、233，以及 Level 283 的坑洞中。", "在 Level 817 靠近一具錯位的抹香鯨屍體會昏倒，隨後在垃圾間醒來。"], "exits": ["在陳列室沿不同魚類名字滑動手指，可分別送至 Level 37、34、201、45、117、409、8、43。", "從冷庫艙門跳入大海會被沖到 Level 134 海岸或在 Level 119 醒來（傳言也可能到 Level 100）。"]}, "881": {"name": "百窗庭", "class": 5, "summary": "Level 881 又稱百窗庭，是一個各方皆為窗戶包圍、形狀不規則的大型庭院，平均直徑約 45 米、高約 30 米，外圍是純白色混凝土牆，牆上嵌入間距相等的窗戶。氣候精確控制在 13.8°C、濕度 45.2%。中庭時刻有 100–200 扇真實窗戶，其中四分之一至幾近全部被「窗戶」實體替換。層級空間持續流動，每次造訪布局皆不同，可能出現桌子、留聲機、鬧鐘等物什，並帶有超自然視聽神經影響。走廊與樓梯井空間不穩定，有粉裙無面靈、竊皮者等威脅。M.E.G. 探險小隊從未返回。", "entrances": ["通向本層的窗戶可在諸多室內層級處找到，進入後通常在 2–3 分鐘內消失；應避免切入這些窗戶。"], "exits": ["除最初切入的窗戶外，空置窗戶據信可通往 Level 1.5；傳言中的 Level 283、Level 11 捷徑皆未證實。", "若不慎進入，應立即從切入的窗戶離開。"]}, "888": {"name": "无邪", "class": "deadzone", "summary": "Level 888 是一片巨大冰冷地帶，由荒蕪落葉森林與四周山坡組成，溫度 -34°C 至 -5°C，晝夜週期 40 小時。地面白色粉末實際是有毒硅藻土，能形成雲團，伴隨硫酸與未知化合物的持續霧霾，需穿防護服與呼吸設備。森林直徑約 1400 公里。層級存在一套自給自足的生態系統，特徵實體包括：注入麻痺毒素的蜱蚤、吸食記憶的負蚤織工、掩飾傷口的骸布潛行者、會對夥伴產生永恆依戀的阿米卡犬，以及外觀與行為描述完全矛盾、能永久改變人心理的「天外存在」。", "entrances": ["在受到情緒煩擾時，有機率從 Level -4、14、39、47、65、129、135、240、494、797，以及巨植群落、深紅森林、遺忘之森等層級切入。"], "exits": ["擊殺一隻將你作為獵物的負蚤織工或骸布潛行者，可切入 Level 63（死後五小時內吃掉其身體可提升成功率）。", "與天外存在接觸最終會被傳送至 Level 11 或 Level 974。"]}, "890": {"name": "溺护", "class": "pending", "summary": "Level 890 外觀是一個無邊際的廢棄遊樂園「樂世界」，亮色塗裝與主題建築營造出舊時代主題樂園的懷舊感。空氣瀰漫糖香與甜甜圈味，永久白天，氣溫 12–20°C，常有濃霧降低能見度，並有未知電磁干擾使電子設備無法工作。園內有美食街、紀念品店（可找到杏仁水）、自運作的雲霄飛車（乘坐有機率傳送至「暗居」黑帳篷）、以及每 30 分鐘變換位置的小河。層級唯一實體「循塞」藏身濃霧、極度敵視孤獨流浪者，靠近時天空變暗、建築腐壞並化為夢魘形態。", "entrances": ["在 Level 122 中切入一面彩色的牆可抵達。", "在 Level 789 中以相同方式切入彩色牆進入。"], "exits": ["紀念品小店內一扇標有「出口」的門通往 Level 448。", "切入寫有「商場」的彩色牆可回到 Level 122。"]}, "899": {"name": "邈远之终", "class": "pending", "summary": "Level 899 是一座坐落在絕美浮島上的社區，由「心懷遠見之人」創立，作為供人避開外界凶險的港灣。浮島俯瞰虛空中躍動的斑斕色彩，全天候天然光照，有泉水湖泊與可持續種植的蘑菇。這裡的工作人員外形異常（獠牙、多眼多臂），但態度友善。進入代價是永遠留下、失去青春。故事以一名 M.E.G. 探員的第一人稱日誌展開：同事邁克選擇留下，而他自己返回基地，卻在日復一日「現在是上午九點」的機械作息中逐漸崩壞，最終面對是否接受召喚的抉擇。", "entrances": ["前往方式非常規：向本層宣傳冊附上的地址寄一封信（附信鴿），會有代表前來接引。"], "exits": ["層級未提供主動出口；選擇留下者將永遠駐留，離開者則由代表沿原路送回（原文未記錄其他出口）。"]}, "900": {"name": "休息区", "class": 1, "summary": "Level 900 看起来是一个极大但有界的床垫商店。此层级层的宽度与普通前厅床垫店的宽度相似，但是，该层级的长度约为 800 公里（~500 英里）。虽然床垫是该店最常见的家具，但该店还有床上用品、枕头、床架、架子和床头柜。\n商店依靠天花板上的荧光灯照明。偶尔，Level 900 中也会发现夜光灯和动物标本。进入该层级的流浪者报告称空气中有薰衣草和甘菊的香味。这种香味的来源目前尚不清楚。此外，此层级的墙壁上装饰着各种形状，颜色，大小的捕梦网1。\n无论你通过哪个入口进入此层级，你最终都将到达 Level 900 的正中心。换句话说，如果一个流浪者试图从起点走到任一出口，那么将花费他们 3 天的步行时间。人们发现，离 Level 900 的中心越远，带有床上用品、枕头、动物标本、小夜灯和捕梦网的床垫就越少。报告称，靠近层级边缘的床垫看起来非常不舒服或很蓬乱，且明显缺少毯子或枕头。\nLevel 900 中心附近带有正确物品的床垫的例子。\n虽然 Level 900 对流浪者没有任何明显危害，但它似乎具有一种反常效应，这种效应会使流浪者比正常人更嗜睡。然而，一些流浪者坚持认为这是因为 3 天的", "entrances": ["如果一个流浪者由于精疲力竭而睡眠不足并无意中昏倒，那么他有小概率进入 Level 900。此外，在 Level 11 中进入一个床垫商店有更小的可能性进入此层级。"], "exits": ["Level 900 目前只有两个已知出口。第一个位于商店正门外面，可以按照出口标志和墙上的箭头确定其位置。也由于有这些指示，此出口是进入 Level 900 的流浪者最常用的出口。而第二个出口通向商店的后入口，与商店的箭头方向相反。", "此街道的建筑物的门总是无法接近。且试图离开这条的街道会导致流浪者被传送回床垫店的店面。此外，店面本身的外观会变化，但一定能在前厅中找到与之对应的店面。", "流浪者在离开床垫商店时还会闻到一股明显的咖啡味，这会立即使疲惫的流浪者恢复活力。跟随这股香味，你会发现一辆装满咖啡且乎无人管照的手推车。从该手推车中拿出，调制并喝掉一杯咖啡即可切出 Level 900。", "不加任何牛奶（或奶油）：Level 91", "不加咖啡因：回到 Level 900 的起点。", "一勺糖：Level 817", "两勺糖：Level 512", "三勺或更多的糖：Level 6", "一袋奶：Level 153", "两袋奶：Level 6.1", "三袋或更多奶：似乎是随机的。", "一勺奶油：Level 176", "两勺奶油：似乎是随机的。", "三勺或更多奶油：Level 0", "一袋奶，一勺糖：Level 98", "两袋奶，两勺糖：Level 67", "一勺奶油，一勺糖：Level 480", "两勺奶油，两勺糖：似乎是随机的。", "Level 900 的第二个出口。该照片描绘了能使流浪者离开这一层级的床垫。", "离开床垫商店的后出口后，你会发现自己身处一个与普通城市街道十分相似的封闭区域。与此层级的第一个出口不同，该区域非常安静，只能听到远处车辆的声音。到达这个出口的流浪者还报告说他们闻到了微弱的烟味。", "在这个封闭区域内，流浪者可以找到一张看起来十分凌乱的床垫、一盏破灯、两个枕头和一条脏兮兮的毯子。要从这里离开 Level 900，你必须睡在该床垫上，醒来后你会发现自己身处 Level 11。"]}, "901": {"name": "工业供电区", "class": 2, "summary": "Level 901 是一大片可能没有尽头的陆地，含有多种资源，一个独特的生态系统和一片广阔的森林——流浪者初到这一层级时会发现自己身处其中。\n整个层级完全没有颜色，因为 Level 901 的灰色外观是由表面反射或光线缺乏造成的。\n起初，当 7 位探索者在调查 Level 11 内的一间本地仓库时意外发现 Level 901 后，这一层级据信是黯洃銫的一个新入口。\n另一方面，进一步的探索则表明 Level 901 与黯洃銫之间并无联系。\n进入后，流浪者会发现自己身处于一片名为“生命之奥秘”的森林中。此地因位于“这片黑白相间的地狱”中却具有宁静祥和的自然环境和看似优越的美景得名。\n这片森林因敌对实体的缺乏而相对安全。然而，离开上述森林后，流浪者会进入这一层级的主要部分，由广袤的平原，山丘及众多河流组成。\n与森林不同，平原因其中存在的大量实体而危险且充满敌意。\n强烈建议流浪者留在森林的边界以内，因为穿越平原有将自己暴露于敌对实体的风险。许多实体倾向于隐藏在小型灌木或较高的草丛后，并准备捕捉，虐杀视野内毫无防备的流浪者。", "entrances": ["若想进入 Level 901，你必须进入 Level 11 的一间仓库或工厂，并通过墙壁或机器切入。", "通过 Level 937 进入 Level 901 同样可行。要这么做，你必须向北走，直到注意到周围环境的颜色突然变化。一旦颜色的变化稳定到上述灰度，你将进入 Level 901 内。"], "exits": ["若想退出 Level 901，请在森林中部找到一个宽阔的洞穴。这种洞穴可以轻松地进入 Level 11，任何由此进入的流浪者，连同任何资源或货物，都将切入 Level 11 的特定位置，那里建造了一个终端以处理所有的运输和储存事务。"]}, "902": {"name": "Level 902", "class": 5, "summary": "Level 902由疑似无限的正方形隧洞及在地面延伸的传送带组成。这些隧洞的大小各不相同，但一般不会大于15 x 15英尺（4.6 x 4.6米）且不小于5 x 5英尺（1.5 x 1.5米）。大型隧洞内通常会有更多导入其中的传送带。而隧洞内壁则由类似铜质的棕色不明金属制成。墙体似乎无法被破坏。层级内的Wi-Fi信号很强，几乎不会中断或产生波动\nLevel 902的背景温度恒为32°C（90°F）。整个层级被笼罩于全然的黑暗之中，故建议流浪者携带强光源以在其中穿行。整个层级之内的传送带都会在未知节点与其他的隧洞相交。有时它们在与另一传送带相交时会存在不等的落差，故流浪者应在目击到地面出现开口时保持小心谨慎的姿态。这些落差存在着极大区别，自不具威胁到足以致命，千差万别。", "entrances": ["为切入Level 902，流浪者应找到资源丰富之层级内的开口或工业类层级中拥有类Level 902外观隧洞、传送带及其所有的各类事物处。据报道这些隧洞可在Level 1、Level 2、Level 3、Level 5的锅炉房、Level 11（通常在工厂内）、level-20、Level 141、Level 162的仓库平台、level-172、Level 522处被发现，在Level 563、level-800的崭新工厂内走过足够长距离亦可找到它们。这些入口的异常性质会显现在其传送带的运输方向上。在某些入口内，传送带会朝向Level 902，某些则朝向行将离开的层级一侧。在后者入口中，通常可在其周边找到来自 Level 902的板条箱；在前者入口中，尚不能在入口周边找到板条箱。", "此外，在Level 901中一个由B.N.T.G.建造的工厂内可找到怪异而连续的入口。工厂内有着一条自走廊导向本层级的传送带。B.N.T.G.声称他们并未对此入口动过手脚，对出现于他们新建工厂内出现层级入口一事亦感到惊讶。"], "exits": ["为离开Level 902，流浪者可切入一个板条箱并来到Level 230的码头处，或来到如Level 1及Level 3般物资丰富层级内的板条箱旁。流浪者亦可进入板条箱内，并在“管线终结”现象中坠入虚空，最终很可能会来到一个物资丰富的层级。"]}, "903": {"name": "后室地铁", "class": "habitable", "summary": "Object 39，也就是“后室地铁”，是一辆大型地铁列车，人们可以看到它穿过后室的多个不同层级。后室地铁采用了典型的地铁列车的外观，外观偏长方形，有多个车厢，足够的座位，和一个驾驶员车厢。目前，关于它的信息并不多，这份文件中的大部分信息都来自于对目击者的采访以及M.E.G.的一些测试。\n有一种理论认为，后室地铁实际上是多种不同的列车，因为不同的流浪者对它的描述不同。第一次发现它是在Level 7的一次与其不相关的研究任务中。现场的特工描述了一辆蓝色和灰色的列车穿过水域，就像水域是铁轨一样。列车一到特工那里，似乎就放慢了速度，打开了车门，似乎在邀请他们进去。他们等了几分钟，看看还会发生什么事，并尽可能多地记录下列车的情况，然后列车再次关上车门开走了。\n一张在Level 3由一名目击者从后室地铁内部拍摄的关于地铁中一扇被修复过的车窗的照片。\n后室地铁很快又出现在了Level 3，这次是在B.N.T.G.的“存储设施”前面。当天值班的成员描述说，一列黄色的列车突然穿过墙壁，并在基地前面停下。由于Level 3的空间较狭小，列车的一部分实际上被卡在了墙上，这进一步引起了保安人员的震惊。门打开", "entrances": [], "exits": []}, "904": {"name": "Level 904", "class": "Lambda", "summary": "黑暗地铁是一个处于永夜的老旧的工业城镇，同时也是一个奇特的层级，它被大多数人认为是一个“反面层级”——就像是乳白天空与蒙黑天空一样——因此，这个层级也被人们起了一个与后室地铁相似的名字。地铁和黑暗地铁有着许多相似的特点，也有着很多截然相反的特点。其中最明显的有：地铁充满了灯光，而黑暗地铁则几乎是漆黑一片；地铁是室内的空间，而黑暗地铁是室外的空间。两个层级都有着许多被严重误解的、具有异常能力的实体。而“反面层级”这个理论最强有力的证据是，你必须先进入地铁，才能进入到黑暗地铁。记录DM-003中有着关于这些相似特点的详情。\n进入黑暗地铁的方法一直备受争议，因为每个人对它的描述都大相径庭，但这些描述都有着一个共同的特点，那就是都需要经过后室地铁层级。这些描述包括了：意外地切出了一个广告牌、地铁的灯光突然熄灭、在进入黑暗地铁前，环境的噪音突然被令人毛骨悚然的尖叫声所取代、当层级逐渐变成黑暗地铁时，流浪者感到层级的重力开始反转、在流浪者掉进地板之前，整个层级开始回荡起巨大的呼吸声——这些只是许多描述中的一部分。这些进入的方法从未被重现，目前也没有原始事件的目击者记录。观察员Thomas Vern", "entrances": ["如前文所提到的，就目前已知的信息来说，人们只能在后室地铁中通过意外来进入黑暗地铁。其他进入的方式都已被证明是无效的，包括Level 797、在山魔王的宫殿里，尤其是要求通过后室地铁本身来实现到达黑暗地铁的方法。"], "exits": ["就目前的已知的信息来说，离开黑暗地铁的方法是很复杂的。如果一个人想要离开这里，那么他最好的机会将会是在他被抓住之前。如果一个人被抓住，那么离开就会变成一件不可能做到的事。曾经有一个叫做James Clay的探员在献祭日当天，通过向那部列车进入的隧道的深处走去的方法离开了这个层级。他带着轻度的烧伤和各种伤口出现在了Level 0。一个已经被抓住过的特工也尝试了这个方法，但是这没有让他离开那里，并且特工身上的摄像头也瞬间丢失了信号。在那之后，他音讯全无。由于这种方法需要穿过中央广场到达铁路，而中心广场总是人山人海，所以这种离开的方法是非常困难的。Galena也不可思议地带着精神上的问题回到了Level 3，如记录DM-002所示，但她说她失去了关于离开的记忆。这是唯一一个有记录的被抓住后仍然能够逃离的例子。", "目前，被抓住过的人没有已知的离开方法。例如切出和召唤Entity 51的方法都从未成功。关于有人成功离开黑暗地铁的信息应第一时间报告给M.E.G.。Verne甚至亲自提供50个皇家口粮的悬赏来征集能够提供可靠地离开该层级的方法的人。", "在中央广场的停车场中发现的未知来源的信件", "实体描述：黑暗牧师", "实体描述：影子", "记录DM-001", "记录DM-002", "记录DM-003", "日落时，它最终会呼啸着到达目的地。它会带着尖锐的声音穿过天空，而对我们来说就像是死亡天使降临一般。在它着陆时，它的门会打开。骑手会随机地挑选一个手上拿着票的人进入。然后门会关上，然后就结束了。被它带走的人再也没有回来。这是为了我们的安全和它的满足而必须做出的牺牲。这是我们必须忍受的循环，我们害怕不这样做的话会发生什么。", "当他出现在主楼时，它会以切出墙壁的方式出现，或者至少是这么发生的。没有人知道他是从哪来的，在M.E.G.关于同层切出的认识下，他应该是来自于墙的另一边。除此之外，没人见到过他出现在除了教堂内部以外的任何一个地方。Thomas认为他可能有着一个秘密房间或是拥有某种超自然的能力。他的身边总会跟着一些名叫影子的实体，在下一个分页中会详细地介绍它们。", "据Verne分析，影子是黑暗牧师物理上的助手。当牧师向城镇居民们传达黑暗地铁的意志的时候，影子会相应地做出反应。在现有的文档中，符合这个理论的行为有：影子在仪式上负责把祭品带到黑暗地铁上，并且将没有出现在仪式上的人杀死，以及控制住刚刚来到这个层级的人。人们只会一次性看到两个这种实体，但Verne认为在理论上它们会多于这个数量。", "Thomas：是的，你可以离开这个建筑了。接下来，你可以去——", "Thomas：你那里是不是有一把我们之前找到的可以喷射岩浆的枪？", "黑暗牧师：现在离开。（拉丁语）", "黑暗牧师：离开我们！（拉丁语）", "人群中发出了一声尖叫。影子们动了起来，迅速地来到了人群之中，抓出了一个尖叫着，哭泣着的女人。", "Galena：她被选作献祭给神的那个人。她——她再也不会回来了。这只是…呃。我讨厌这种事。我希望我能够尽快找到离开这里的方法。你们在视频里得到照片了吗？", "Thomas：嗯。我觉得你应该要离开了。我不想让你靠近黑暗地铁，好吗。", "Thomas：天…Galena，我觉得你需要立刻离开那——", "后续：Galena的身体在位于Level 3的Gamma基地的数英里外被找到，当时她正处于半清醒和身负重伤的状态。这些伤害包括肋骨断裂、止不住地流血、皮肤大面积地缺失、巨大的咬痕和黑色的斑点。这些斑点最初被认为是淤青，但医生们一直无法确定它们是什么。由于它们与二级烧伤相似，它们从那之后被称为“黑色烧伤”。经Galena同意，下面附上了一张黑色烧伤的图片。在Galena脱离昏迷状态后，她就进入了歇斯底里的状态，并处于悲尸的第二阶段，喊着关于黑暗地铁的话语。值得注意的是，她还一直在大声地重复着一句拉丁语：“今日，救世主将我带来此地”。5她的身体只康复了一部分，因为那些黑色烧伤和咬痕，她的右手臂不得不截肢。她在那之后离开了M.E.G.，并拒绝谈论她在那个层级中度过的时间。目前还不知道Galena看到的东西是因为受到了惊吓而产生的幻觉还是真实存在的。到目前为止，这是唯一一次把黑暗地铁作为实体的直接研究。", "Robert：首先，你可以说说你是怎么来到这里的吗？", "Ariana：‘来到’这里？（Ariana笑了笑）这是一次关于哲学的谈话吗？", "Ariana：好吧，没有人知道实际上我们是怎么来到这里的，我们就是在这里。我——", "Robert：抱歉，我要打断一下，我是说你究竟是怎么来到这里的。到这个层级里。", "Ariana：好吧，我的父亲…他，呃。他承受不了仪式所带来的恐怖，然后他…他永远地离开了我们…"]}, "906": {"name": "天鹅座档案馆", "class": "Blanche", "summary": "Level 906 为一无限大的图书馆，这里广泛地被在前厅中称为哥特式、维多利亚式以及巴洛克风格元素的建筑填充。因为摄影机等记录设备在这一层级会出现不明故障，一切对这一层级进行图像、视频以及音频记录的尝试都失败了。\nLevel 906 的木制书架上堆满了书本、笔记本、文件夹以及以不同语言写下的各式文档，它们中的大多数晦涩难懂。这些书架看上去是整齐排列的，有些时候一些书架会无视重力而漂浮在空中，想要到达这些书架需要用到图书馆内的木制扶梯。图书馆内被烛灯照亮，尽管被悬挂在高到不可思议的天花板上，它们仍能给整个图书馆提供需要的照明。天花板装饰有彩绘玻璃和风景画。到达天花板处是不可能的，越是向上走，天花板看上去就越远。在木地板上铺着具有金色装饰的蓝丝绒地毯。\nLevel 906 一个区域的图片，由 Blanche 本人提供。\n书本、卷轴、文件或笔记的增殖与突然减少在这一层级是常见的事。不论是各种语言的普通书籍，还是用某种失传字母书写的古老卷轴上，都写有 Blanche 的签名。", "entrances": ["进入 Level 906 唯一的已知方法是用食指从左向右划过 Blanche 的签名而后被传送进去，不过有些时候只需要触碰即可，在她散落于后室各处的书籍与文件中可以找到它们。使用签名的图片、复印、打印、以及影印件不会产生任何结果。"], "exits": ["为了离开 Level 906，应当礼貌地向 Blanche 申请离去。她会引领你到一扇出口，它通往你所选择的层级，如果该层级安全的话。表现得十分粗鲁或展现敌对行为也可以离开 Level 906。 在那种情况下，你会被强行传送出这一层，回到你进入时的地方。"]}, "909": {"name": "感官剥夺", "class": 5, "summary": "有关本层级的信息会被粗暴地毁灭。观察者上报了眼睛、耳朵、鼻子、舌头的强制切除；这些举动由不可披露的实体实施。受害者在被残害后仍有意识。\n从受害者处接收的讯息：喘息、湿性波动、刮擦。失去感觉前传达的信息表示，闻到了洫和臭氧的味道，尝到了铜味。牙齿生长被认为芣正常。立尅上蕔。", "entrances": [], "exits": []}, "910": {"name": "Level 910", "class": 4, "summary": "他X的世界的终点是一个由于缺乏补给和敌对实体无处不在而十分危险的层级。\n他X的世界的终点外观类似于被一次核战争摧毁的城市，此层级并未出现核辐射的迹象，且太阳锁定在正午高度处。街道被摧毁并被碎片覆盖，这些碎片一路破散到诸如超市和军事前哨等房屋与特殊设施。\n这座城市里充斥着猎犬、尸鼠、木灵以及人形土匪。它们是这个层级中最危险的实体，因为它们能够使用和挥舞枪支。\n偶尔可以在建筑物内找到尖噬怪的涂鸦。鉴于在目前对于此层级的探索中并未发现此类实体，尚不得知这些涂鸦是为何以及如何出现的。\n当抵达他X的世界的终点的边界时，会出现非欧几何现象。景观将开始向上和向下扩展，经过的区域将重复和循环，如果坚持前进，到达终点所需的时间可能比预期的更长或更短。但是，试图这样做的人将目睹土地开始脱离并慢慢扎入蓝色通道。", "entrances": ["要进入他X的世界的终点，你可以在蓝色通道里找到随机的入口，进入这些入口可以坠入这个层级。另一个进入的方法是在废墟之路里一路向西并跳下公路，这可以让你进入蓝色通道，进入后继续向西就能来到此层级。"], "exits": ["要离开他X的世界的终点，需要前往层级的边缘，然后便可以进入蓝色通道。", "[我们找到了许多进入这个层级的其他方法，为什么我可以从Level 135进入一个废弃的城市？我知道有些层级之间的过渡并不总是讲理的，但我真搞不懂了。也许它与文章有关？我之前没把它算进去，因为这个地方可以进入蓝色通道，而那里是你绝不想让闲杂人等进入的地方。我和其他几个人只是堵住了我们能找到的任何通道，因为我知道一些傻瓜会试图进入这个地方并被困在蓝色通道中。]"]}, "912": {"name": "Level 912", "class": 3, "summary": "Level C-912为一个封闭式房间，尺寸约为3.5米乘以4米，高度为2.5米。房间的四面墙，天花板与地板，皆覆盖着白色的墙纸，没有任何图案或装饰。\n墙纸不应被撕开或破坏。\n房间常设有一些家具，大多为白色。其数量，种类与摆设位置不固定，常见的有沙发、床、桌子等。房间内没有窗户，但有时会出现一扇被锁住的门。\n在任何情况下皆无需强行撬开。", "entrances": [], "exits": []}, "913": {"name": "白也无涯", "class": "unknown", "summary": "目前尚无法证实该地点是否存在尽头，但其非线性特性对验证其真实性无疑构成了阻力。\n在切入本层级后，流浪者将会发现他们躺于地面之上。当他们对地面侧耳细听时，他们将会感知到一种与老电视闪屏，在其屏幕上出现闪点时相似的断断续续的声响。\n流浪者有时可听见自己的回声，其间隔自数毫秒到几十年，不尽相同。相比其原来的声音，这些回声会变得更为扭曲且有时会夹杂生物的嗡嗡声、笑声或是其他无法分辨的杂音。\nLevel 913的墙面纯白，有时会装有诸如空调、电箱或是窗户等的物件。\n窗户之外通常被黑暗所环裹，有时会有一道不明光点闪过黑幕。大多数人报告到该光点会紧随其行动而动，且随时间推移而变得愈发明亮，直到该光源从琥珀色变为暗红色，随后骤然不见踪影。它很快便会在另一扇窗户处再现，并继续跟随着流浪者。\n层级中央有着被单纯排为一条直线的数个方形水泥立柱，其间的空隙足以让约莫一人通过。若流浪者闭上双眼并在水泥立柱间穿梭，则其会在较远的另一个方位处出现。该行为有时会导致切行及以下将会提及的后果。\n抬头看向天花板，流浪者将会发现日光灯管上似乎有黑色虫类在飞舞。一段时间后，它们将逐渐被日光灯渐强的亮度及光热烧为灰烬。与此同时", "entrances": ["可通过自其他地方处下坠以来到本层级，这也是绝大多数流浪者来到此地的方式。", "一些流浪者也会进入任意位于前厅内的房间。倘若他们打开门后发现外部空间是一望无际的洁白，且无论走了多远都不会感到饥饿或是口渴，那便意味着他们切入了Level 913。"], "exits": ["如上所述，通过闭上眼睛并在水泥立柱间穿梭有较小几率可离开本层级，但尚不明确流浪者在离开后会位于何处。这是因为所有成功切出该层级的个体皆有他们自空中坠下，且在数秒之内因不明原因快速失去了联系的报告。", "在此！ 遵循CC0 1.0 通用公共领域贡献宣言协议。"]}, "915": {"name": "幻视髮兆者", "class": "pending", "summary": "有些地方规模宏大却毫不低调，比如那座城市，以其错综复杂的构造令人望而生畏。另些地方虽小，却依然举足轻重。房间不过是广袤空间里微不足道的污渍——这些空间如此贫瘠、静止，如此千篇一律又充满异质感，尽管数量繁多。其中一些奇特之地是人类造就的，但大多数起源仍无从考证。有的充当地点交汇之所，有的则沉浸在自己的静谧中。有的在数十年无人问津的区域里沉寂，有的则凝神观察。有的对人类漠不关心，有的却在等待人类的到来。然而，此地却与上述种种描述都不相符。\n多年以来，我的工作就是终结此地——以及那些盘踞在我们意识深处的空间——所犯下的暴行。如今，连最后一片正常的角落也消逝殆尽，信任何在？最终，那些曾萦绕在这些领域中的熟悉感火花又在哪里？事实是，常态从不独自统治。荒诞是它最忠实的伴侣。它们彼此诠释，互相揣摩着下一次交锋的时机。在这些超现实的疆域里，常态扮演着表象的角色，而荒诞掌控着实质，但二者从未真正分离。\n当深夜出现一座孤寂的沙龙，未曾有人涉足，最好移开目光。若它无处不在，那它就等同于不存在。若它不存在，人的认知与感官也将随之失去意义。\n切勿以表象评判反常之物。两股力量必须保持平衡，否则其后果必将——缓慢却", "entrances": [], "exits": []}, "916": {"name": "圣所育婴堂", "class": 1, "summary": "从 2026 年 5 月 20 日起，后室英文维基开始使用层级等级（后室英文维基），全面替代此组件。最终的结果是，此组件从 component:level-class 变成了 component:old-level-class；而 component:level-class 则被替换成了上述的新组件。\n这导致后室英文维基所有使用了生存难度分级组件的页面，都自动更新成另一版本。中文维基不会跟进这一改动，亦不会重命名此组件。译者可以自由选择在翻译过程中应用新版组件，使之与原文相同；也可以继续使用此组件，即不改动 [[include]] 代码。\n除了外形有所变化，新组件还新增了 1E-5E 的环境危害分级，并稍微扩展了自定义维度；因此部分页面可能有必要更换为新组件，才能正常显示。请译者自行甄别。\n[[include :backrooms-wiki-cn:component:level-class\n|class=等级\n]]\n[[include :backrooms-wiki-cn:component:level-class\n|lang=cn/tr\n|class=等级\n]]\n[[include ", "entrances": ["在Level 2找到带损坏把手的木门（实体会在距门6米处主动避开）。", "从Level 9半埋入土的教堂门切入。"], "exits": ["好想知道他们进入墙壁后去了哪里……", "通过底层木门返回Level 2。", "切入通往外界的门会坠入Level 9（强烈冲击，不推荐）。", "在本层级产生如厕欲望可能进入level-189。", "尝试切入其他墙面将抵达蓝色通道。"]}, "919": {"name": "世界上最孤独的野餐", "class": "unknown", "summary": "细瘦的树木，叶片尽落，朝着隐没的天空伸展着脆弱的枝桠。红棕色的土地上，长着一簇簇枯草。万籁俱寂，一切声响皆被厚毯般的雾霭所吞没。空气微凉而潮湿，仿佛深秋时节，弥漫着一股挥之不去的雨后泥土气息。\n该层级看似无边无际，实则是一个在自身内部循环的小型有限空间：朝任意方向行走十至十二分钟，便会回到起点。由于浓雾与树木单调的轮廓，因而这一点几乎难以察觉。但当你最终沿着某个特定方向行走时，那里的落叶会以依稀可辨的小径形态堆积起来，空地中央一张木制野餐桌便会从雾中浮现。\n你并非孤身一人，那里总会坐着至少另一位流浪者。请放心，他并无恶意。你或许未曾立刻察觉，但从你进入此地的瞬间起，一只野餐篮就已出现在你手中。只需将它带到桌旁即可。这里有足够的食物可以分享，味道极佳，浪费了未免可惜。", "entrances": ["步入雾气中，这雾气对于 Level 9 的夜晚来说异常明亮。", "在 Level 387 雾气弥漫的森林里绕圈行走。", "在 Level 69 被浓雾所吞噬。", "触摸一块红白相间的格子桌布。这种桌布在城镇与户外层级的各处都能见到，如餐桌上、长椅边、草地与田野间、树枝上等等。", "在罕见情况下，门、窗等开口处会被上述格子纹路完全覆盖。"], "exits": ["离开 Level 919 的已知方法仅有一种。可矛盾的是，这个方法的具体做法仍是个谜。", "所有与该层级相关的报告均呈现相互矛盾的数据，致使真相难以判定。此前曾成功离开此处的流浪者，似乎都不记得自己做了什么，也不记得离开的过程。他们往往甚至完全忘记了自己曾到过这里。在任何数据库或出版物中，至今未发现有关出口的线索。越来越明显的是，其中可能涉及反模因特性，但这种特性的影响程度仍不得而知。", "重申一遍：保持头脑冷静，找到那张野餐桌，并仔细听从先你一步到达的那位流浪者。请对即将被告知的一切保持开放的心态。相信他，这是唯一的出路。"]}, "920": {"name": "得克萨斯洛纳", "class": "等待分级", "summary": "Level 920 的已探索区域是一片绵延数公里的乡村小镇，当地居民将其称作 “得克萨斯洛纳”。这里的天空盒呈淡蓝色，被一颗亮度超乎常理的太阳照亮，小镇远方还能看到大片云层。该层级气候干燥炎热，预估接近 35°C。植被分布零散，最常见的是落叶乔木与小片枯草。道路宽阔且布满严重裂痕，两旁设有电线杆、人行道和交通信号灯。\n该层级的入口通向一片城市商业区，内有商铺、餐馆、一家电影院以及各类特色商店。生活在该层级的人们使用运转正常的交通工具出行，包括轿车、货车、摩托车乃至公交车。道路两旁以及多处布满尘土的大型停车场内，随处可见停放和行驶中的车辆。各处标识显示，该层级约有一万两千名居民，城镇外围拥有兴旺的畜牧业。\n住宅区从主街向外延伸，呈松散网格状，渐渐融入绿野之中。这里的住宅是一到两层的小型建筑，与 Level 9 等地相似，但外观样式更为多样。该层级的外围地带至今仍未被探索，不过在远方能够望见一条公路。1", "entrances": [], "exits": []}, "922": {"name": "我终于到了‘真的终点’，然后我所来到的就是这个该死的楼梯间。", "class": "unknown", "summary": "埃舍尔楼梯间仅有一个已知的走向——逐阶而上。该阶梯是一个野兽派式的老旧大型建筑，一簇有头无尾的螺旋阶梯。意志坚定亦可说顽固无比的流浪者都曾尝试拾级而上以抵达一个出现于传言之中的目的地，皆以失败告终，只好折返他们最初的出发点。天顶之处为致盲的亮光所笼盖，但无论流浪者走了多远，其相对天顶的距离却从未缩短。如此匪夷所思的无限在物理学不再适用的地方是司空见惯的。然而在漫无目的的流浪者于此楼梯井中寻路，对黑白相成的单调色彩漠不关心之时，他们可能会觉察到周边环境所弥漫着的死寂——最终听见如雷贯耳的心跳阵阵和汽笛鸣响般的一呼一吸。\n这里并没有什么可怕的。大多数流浪者都能够平静地走过这几段楼梯，在意识到这处蔚为壮观的建筑仅是金玉其外之前——实则败絮其里，埃舍尔阶梯便是核心处那单调乏味的幻景。它并非是有意欺诈来者，亦无给人留下印象之意。 既无恶意，亦没善意。楼梯井存在于一个封闭有限的区域之内，此外别无他物。它之存在也许不同寻常，令人厌烦，亦绝无可令人见景追忆之物。没有加于心智之上的折磨。没有需要抵达的令人费解之终点。阶梯之间并未藏匿着任何重要信息。但最为重要的是，这里不存在危险，也无任何回报。有关该楼梯", "entrances": [], "exits": []}, "923": {"name": "Level 923", "class": "unknown", "summary": "“这是我第几次来到这里？”既视感吞没了你的思维。周围的一切都如此熟悉，又如此陌生。你不由得感到自己陷入了一个永无终日的循环。\n空间欺骗着囚徒们，如同玩弄心理实验里走投无路的豚鼠。闪烁的微光先是带来希望与安全的错觉，随后便蓦地从眼前消失不见，只有陌生的边境取代那原本我们已经熟悉的土地。我们永远不会受到生理上的痛苦，然而，我们永世破碎。阴影在远处注视，时刻准备扑杀它们的猎物——但它们究竟是蓄势待发的实体，还是我们脆弱头脑中仅存的幻象？墙壁亦有眼耳。它们漠视着我们的一举一动，倾听我们脆弱的心跳，精心策划着下一场奇景。万物超越现实。\n末土之上，何为真实？可有真实？我们究竟是在等待长梦醒来，还是在清醒地历经这所有梦魇？前方是否真有终点，还是说我们命定要成为实验的对象？\n在一切混沌的中心，漆黑高耸的方尖碑定格于此。周遭的万物扭曲融解之时，这颗幻痛的心脏却完好无损地险恶矗立。那是我们的出路。我们向它伸手。我们向它渴求。我们与它碰触。\n唯一的配图由以下二图拼接而成：Dark forest canopy by Phoebe Strafford, which is licensed under the U", "entrances": [], "exits": []}, "924": {"name": "核之家", "class": "unknown", "summary": "Level 924是一个充满活力又多彩的大城市，许多人似乎都生活得很快乐。该层共有两个主要区域。郊区与镇子。所有房屋或公寓都住着住在Level 924的一家人。\n这条开始恐怖起来了。至少在SPaG1的部分上就有问题。\n郊区有许多房屋和公园。它们都可以居住而且很安全。所有房子都有全套家具和电力供应。所有厨房都有食物，并由在商店买补给品的人定期补充。可以在很多地方看到水塔。它们都是人们的供水来源。Level 924有许多不同的居民住在一起，他们共同工作来创建一个生态系统。经营商店，饭店或其他工作。所有人都快乐。\n镇区是所有人开车去工作并完成他们的日常任务以养家的地方。工作包含从小收银工作到在核电站工作。本层的科技水平在40年代至60年代之间。这里的货币用来为许多家庭购买补给。这里似乎没有出现实体。只有很多不同的人和宠物在正常生活。\nLevel 924对后室的居民来说非常好，因为它的物资似乎是无限的。这里的一切只是完美的日常生活。", "entrances": ["找到一张50年代的海报，上面画着一个在美丽社区里拥有着美丽家园的佳廷2。把你的手放在上面并希望自己在那里。我们一直在收集这些海报以便尽快能分发给其他人。我们很快就会都安全了。"], "exits": ["我们不需要离开。我们有一切需要的东西。一切都是完美的。", "第一天：出去找海报。从11往Level 4走。应该不会太难。只要找到个能把我送到那里的房子。附注：找到一个通往3的建筑！", "第二天：经过数小时的徒步和一次与猎犬的亲密接触，我感觉我要——刚刚听到了尖叫声。继续前进。我会回来的。", "第四天：刚才去了Gamma基地，他们给了我一些物资并把我带到了一部电梯里。跳了进去。请带我去Level 4…然—后—凭着我的狗屎运我抵达了Level 5！唉…我应该在11层的时候就找个通往Level 4的入口。", "第五天：打开一扇门并发现了大群死亡飞蛾！正是我要的！难怪我没搞到探索工作。我全程一直在抱怨。据说我得找到一个通往Level 4的旧楼梯，但我这辈子从来没在5层看见过什么鬼楼梯，我还得继续前进。", "第八天：找到一个楼梯！我终于抵达Level 4了！除了在Level 5的壁纸上看到一张奇怪的脸外没有发现其他异常现象，不过那应该只是我的想象。", "第九天：好，找到Omega基地了！我找到了一个正返回基地的M.E.G.踪迹制图者小队，我决定跟着他们。现在，是时候问问他们的储藏区里有没有任何描绘幸福家庭的古怪海报了。附注：没有。我翻遍储藏区也没找到任何线索。他们让我去Level 1的Alpha基地找找看。他们给了我一个GPS，我的探险应该更容易了。", "第十一天：已经快过去一个星期了，现在我终于找到了一部电梯。Level 4的条目还没有更新，但据说这层的电梯或楼梯可以通向Level 3。希望它也能通向Level 1。我不会再回到这里的。附注：我还是回来了。", "第十二天：呼！凭运气我在24小时之内找到了一扇通往Level 2的门！我很惊讶。我会把找到的东西放在这里。", "第十三天：我去办公区EL3A简单休息了一下，我已经徘徊好几天了，还好GPS预先标记出了这个地方。我会在休息过后明天再次出发。", "第十四天：重新出发，我找到了另一个入口，正要打开它。猜猜怎么着？我又回到4层了。我最好继续前进，我听到通风管道里有什么东西。", "第十六天：找到通往Level 1的另一扇门！我发现一个肢团正追着我，当我关门挡住它后我发现我已经离我进入的地方跑了相当远的一段路。GPS标记出了Alpha基地和贸易者堡垒。我现在正朝着Alpha基地前进。希望不用在贸易者之窖里再找一遍。", "第十七天：成功抵达Alpha基地！多亏了这个方便的GPS。我听说这是M.E.G.的新发明。但这不是重点，我终于找到了海报！整整四堆！海报的储存量甚至有点吓人。没人知道这些海报为什么没被发出去。好吧，我拿了一张，打算现在在基地外使用它。我会把这个条目和笔记重新发布到层级列表里好让所有人都看见，明天我会告诉你们都发生了什么。", "第十八天：这地方太美了！我必须把这里的一切都记录下来。我现在正在一条房前的街道上。每栋房子的色彩都很鲜艳。黄色，粉色和明亮的蓝色。汽车是条目中提到的40至60年代版本的汽车。这里的人也穿着相同年代的衣物。我不知道这里的居民是实体还是真正的人类，但这地方实在是太神奇了。湛蓝的天空，翠绿且修剪得完美的草坪。所有事都很完美！还有一些提到某些事的旧警报，像是“战争将要结束，一切将重归和平。”，“你不再受战争的威胁。”…等下，有人在向我打招呼。", "第十九天：我不敢相信！我遇到了一个神奇的家庭，一对父母和三个孩子。他们让我住在他们家因为我现在无处可去！昨晚我还和他们一起共进了晚餐！是看起来非常完美的意大利面！尝起来也很完美！虽然我感觉有些头晕。好像我吃了一堆粉末但它的感觉和味道还是非常完美！我们交谈了好几个小时！包括即将结束的战争！我甚至有了自己的房间！有点尴尬的是我的鼻子一直在流血。我平时不怎么容易流鼻血，所以我不知道这是怎么回事，但是我在乎它吗？不！….我的嘴在流血…多么美的地方啊！", "第二十天：我玩的很开心！走过海滩！我的皮肤有点发红。我涂了一些防晒霜但却更痒了也没有恢复正常不过会没事的！我只痉挛了几次而且我感觉良好！我还在流血，我的头发掉光了，但一切都很好！我不想离开！"]}, "925": {"name": "云雾天境", "class": "云端", "summary": "Level 925由一片黄昏之下的无尽云海组成。与现实里的云不同，Level 925中的云朵坚实到足以立于其上，甚至可依流浪者所想进行重塑。首次进入该层级时，层级将会是空无一物的，直到有像是建筑，物体或者环境之类的东西出现在流浪者脑海。云朵会聚拢在一起，化作流浪者脑中想到的模样。大多数流浪者所回想到的都是过去的记忆或他们想拥有的东西。云可以变幻出各种形状，却不能变成人类或者动物那样具有灵魂的事物。这些东西会在形成很久以后，或者流浪者希望它们消失时散去。名为『云之天使』的实体会协助该过程的进行，而他们能在Level 925的各处发现。其通常会在流浪者进入Level 925一段时间后现身，并指导流浪者在层级中能做什么。\n每当Level 925中的云朵移动时，偶尔会有一些孔洞在云层之中形成。尽管流浪者无法进入这些洞，但他们可以站在云洞的边缘朝里望去。虽然时间被永远定格在了日落，但晚霞的颜色却并非一成不变，纷呈的色彩映于天幕之下。Level 925的温度总是温暖宜人，偶有一阵凉爽的清风拂过。", "entrances": ["流浪者可通过让身体浸入粉红色的云团进入Level 925。不过寻找粉红云团并不轻松，它们更容易在诸如Level 10或Level 63等类似田野的地方被发现。"], "exits": ["依据天使所言，每当流浪者想要离开时，他们便会提供出口。他们会制造一个带有三个按钮的电梯，分别写着Level 63，Level 998以及『返回』。他们更希望流浪者能多花点时间留在这里，至少是3个月，但有流浪者请求离开时，即使自身并不情愿，天使们也总是会提供出口的。", "纵然坚信已无法离开后室，生存下去的希望却仍常伴尔身。"]}, "926": {"name": "Level 926", "class": "unknown", "summary": "你对活命的渴望已将你的感知力减至只能看清你的周围：刺人冰冷的水。你还能记得自己身处哪一个层级吗？这个世界有很多海洋，有很多水下的地面，如果你能记得自己在哪的话，你就应该还活着。\n目力之所及没有安全的迹象，脚力之所及没有获救的迹象。你还记得你当初为什么要游到这里来吗？是在搜寻天堂吗？会是level-233的一个机会吗？真蠢，你现在才意识到。\n天色渐暗了。但为什么你要见证自己即将到来的死亡呢？会是什么先来把你杀掉？是水面下潜伏着的某物，还是这水体本身？\n\n\n\n\n……\n\n\n\n\n你开始觉得深海里会有更好的出路。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n你潜下。\n\n\n\n\n\n\n\n\n\n30\n\n\n\n29\n\n\n\n28\n\n\n\n27\n\n\n\n26\n深海终点是为逃脱水体坟墓的人提供的休息点，是一个被生物光照亮的封闭洞穴。没有人知道近乎溺亡的人是如何或是为什么能找到来这里的路，只知道你只能来这里一次。给你多一次重试的机会，给你多一次找到更好地方的机会。\n这里什么都没有，除了洞穴顶部水滴落下的声音、组成洞穴的奇特石质构造，以及温暖的轻轻冲刷着的奢华水体之外。这里无法找到食物，这里的水咸度也过高，带不来什么好处。这里的空气潮", "entrances": [], "exits": []}, "930": {"name": "「HUBRIS」引擎", "class": 2, "summary": "Level 930是一场失败的纪念碑。其可怕的居民的脑海内回荡着那些过往事件的记忆，诉说着那些几近实现却永不可能之事。\n该层级在进行维度迁移前，最初建造于地底深处，将那「机器」隐匿于任何窥探视线之外。本层级的建筑群主要由实验室与机械装置两部分构成，尽管这些设施已被核心的绿色污浊完全侵蚀，但仍持续发出于整个层级中回荡不息尖锐的金属撞击声。设计者意图将Level 930打造成半为实验室半为坟墓的兼具工业感和实用性的场所。然其真正成为墓地，已然是建成数年之后。\n该建筑深深埋葬于众多次级地下室与秘密设施的层层包裹之下，它的深度需要部署多套人工系统才能为其内部的科研人员提供适宜环境。例如实验室内安装了嗡嗡作响的荧光灯，用以照亮每个角落。那时它们尚未泛出放射性绿光，这也不过是激活那日之后发生的众多改变之一。\n除此以外还设置了一些特殊的通风系统以对抗地底深层带来的令人窒息的压抑空气。这些设备至今仍可见于房间顶部，却早已停止运转（污浊的空气助长着腐烂的蔓延）。为其供能的管道线缆仍藏匿于瓷砖墙壁之后、混凝土楼板之下，一同曾经为那「机器」供能的那些管线一样。实际上，整个Level 930就是「机器」本身。", "entrances": [], "exits": []}, "935": {"name": "纷争之殿", "class": "unknown", "summary": "当如今年老的人们还年轻时，他们常讲起一个遥远境域的故事。一座微渺的小岛，不过沧海一粟，在未落泪海的无垠中难以辨认。传说在那岛巅之上，建有一座工艺精湛的宫殿/牢狱，唯有最卓越的君王/异端才配居住。他们称其为纷争之殿，那是一个受诅咒的地方，极少有人能抵达，而能从那里归来的人更是少之又少。\n前往那令人向往之地的旅程艰险万分；试图抵达其海岸而丧命的人数，远远超过成功获得其宫廷接见的人数。据传，没有两个人能经由同一条路找到纷争之殿。无数声称能指引流浪者前往那片遥远土地的地图、小饰品和预兆被秘密售卖交易，全都毫无用处。只有那些心中怀有最真切意图的人，才被允许踏上这段旅程，由纯粹的直觉与忍耐的意志所指引。\n在寻找纷争之殿的过程中，诸多土地被穿越乃至发现。那些炽热/冰冷的沙丘间，仍安放着古代帝王的遗骸；一座未竟思绪的陵墓，不被需要的人被送去那里繁盛或腐烂；还有那云上之城，戴着假面的真相或谎言从天空无尽坠落。但无论路途将你逼向何方，这段旅程终将抵达失落记忆之滨。在那里，若你始终忠于此路，你会被游荡守卫带到迷雾之外，前往你的终点。\n倘若你因故无法说服任何一位向导载你，也不必焦虑。折返重来并非羞耻之事。那些", "entrances": [], "exits": []}, "939": {"name": "湮没渊底", "class": "unknown", "summary": "Level 939与阈界紧密交织，为一座迷宫般的建筑群，令人联想到中世纪城堡的地下室。此层级呈现出高度衰败。裂缝与碎石随处可见，整片区域濒临坍塌，只待最轻微的触碰便会分崩离析。每隔几个房间，墙上便可以找到悬挂的火把，但它们早已熄灭，将本层级笼罩在彻底的黑暗之中。\nLevel 939是死亡与腐化的交汇处，一具抗拒时间流逝的尸骸。空气中弥漫着腐烂的气息，如同久未开启的墓穴；氛围令人窒息，使穿行于其厅堂者更加迷失方向及困惑；其通道潮湿，源于持续不断的渗透——在某些地方，水流侵蚀了路径，甚至以深浅未知的水洼将其阻塞。\n本层级的物理结构并非唯一衰败的元素——Level 939的维度稳定性也已显著下降。在整个层级内，可以观察到构成后室的基底结构被削弱的区域。报告提及，有人目睹整片坍塌的部分恢复至原位，又在一瞬间再次碎裂。这种不稳定的行为构成了本层级大部分的危险源——你可能会突然被困在一间重新生成的房间内，被一块毫无缘由碎裂的墙体碎片击中，亦或者，在最不幸的情况下，被一堵毫无预警重现的墙壁活埋。\n由于其特性，在本层级内穿行是一项极为艰巨的任务，需要坚韧与毅力。任何试图沿其结构铺设路径的努力都将徒劳无", "entrances": [], "exits": []}, "940": {"name": "昏头转向", "class": "unknown", "summary": "Level 940的危险性取决于人员是否遵循本文中的说明。层级由一座30英尺乘30英尺的车库开始，向外无限延伸出停车场。车库具有未完工的木墙、金属板制成的屋顶、以及粗糙的水泥地。外面的停车场则是一片普通的平地，每隔一段距离就竖有一根一模一样的路灯，此地极其危险，不应对其进行深入探索。由于其异常的空间结构遮蔽了大部分天空，目前不清楚该层级内是否存在太阳。", "entrances": ["该层级可经由Level 22切入。"], "exits": ["经由车库中的一扇门可退出到其他层级。"]}, "943": {"name": "家有腐烂", "class": "deadzone", "summary": "从 2026 年 5 月 20 日起，后室英文维基开始使用层级等级（后室英文维基），全面替代此组件。最终的结果是，此组件从 component:level-class 变成了 component:old-level-class；而 component:level-class 则被替换成了上述的新组件。\n这导致后室英文维基所有使用了生存难度分级组件的页面，都自动更新成另一版本。中文维基不会跟进这一改动，亦不会重命名此组件。译者可以自由选择在翻译过程中应用新版组件，使之与原文相同；也可以继续使用此组件，即不改动 [[include]] 代码。\n除了外形有所变化，新组件还新增了 1E-5E 的环境危害分级，并稍微扩展了自定义维度；因此部分页面可能有必要更换为新组件，才能正常显示。请译者自行甄别。\n[[include :backrooms-wiki-cn:component:level-class\n|class=等级\n]]\n[[include :backrooms-wiki-cn:component:level-class\n|lang=cn/tr\n|class=等级\n]]\n[[include ", "entrances": [], "exits": []}, "944": {"name": "洪水猛兽之腹", "class": "unknown", "summary": "想要准确描述这个地方应该蛮难的，因为我怀疑它的样子可能因人而异，但我起码可以告诉你它在我看来的模样。\n我在一艘位于海上的小船上醒来，身边围绕这刮骨寒风和倾盆大雨。狂躁的风和水裹挟着我，偶尔有电闪雷鸣乍起。海浪拍打摇晃我的船舷，随时都可能将其倾覆。我很确信，这样的经历对我来说独一无二，虽然我在风暴中什么都看不见看不清，但我知道自己以前坐过这艘船，区别是这次只有我一个人。\n我已经很久没有坐过船了，实际上我一直竭力避免这样，但过去总会追上来，你跑不远。尽管我中断了航海生涯，但很多技能永远不会生疏。肌肉记忆促使我冲向船舷，扯住船帆，拼命地想要抢回控制权。我把身体全部重量都压在上面，希望自己能够凭借一己之力承受这场风暴。但无论怎么努力都是徒劳，风暴并没有给我多少操作的空间。我也不知道自己坚持了多久。三十分钟？四十分钟？又或者只有十分钟？后来我甚至放弃了去掌控船帆，只是坚持着活下去。\n最后，我的手臂屈服了，我被甩了下去。当我陷入冰冷的深渊时，风雨被汹涌的波涛所取代。我懂水性，但在这样的波浪下完全无计可施。我用力挣扎，心里尽是无助恐慌的感觉。我的脑袋渐渐在水下呆的越来越久，直到再也浮不起来。精疲力尽", "entrances": ["Level 944偶尔可经由Level 18某扇风化的木门进入。"], "exits": []}, "945": {"name": "由 E. Makaraig 发现的缔造海船", "class": "unknown", "summary": "此地孑然一身，但不知怎么，你还是找到了这里。你当时是否在找某人？ 要是有人告诉你，他经历一切，依旧陪伴你到永远，你是否能听得到他？\n你有关他的最早回忆是什么样的呢？你的继父，数不清的医生，都要你想起来呢。\n六岁那年，你问他世界是如何创造出来的。他给你讲了个故事：有只蓝鸟儿，将人类从竹竿里面解救出来。你问鸟儿是否吃了人，父亲笑了。\n后来，你画了张蓝鸟儿给他，虽说粗糙，他还是裱了起来，放在了他的办公桌上。\n你还能找到的。去年你闯入他锁着的办公室，检查过了\nLevel 945 似乎是中心处有岛屿的无垠海洋\nLevel 945 似乎是中心处有岛屿的无垠海洋\nLevel 945 似乎是中心处有岛屿的无垠海洋\nLevel 945 是栋白色外墙年久风化的房子。它有着红色的屋顶，小花园的杂草渗入了混凝土车道1。这栋房子安置了三间卧室，还有个视野极佳的阳台，可以看到不远处的山丘，开车就能过去。而且，这间房子在您的预算之内呢！\n个人觉得，这儿通风挺好的，您说不定就喜欢上了，不必忧心夏日 Elijah? 炎炎。那边有好些商铺，走走就到。水电系统良好，不用担心 Elijah 看我。断水断电哈。\n不错……我买的", "entrances": ["跟着 Level 18 的流水声走，就能来到本层级；", "踏入 Level 200 的某个水坑，有较低概率进入 Level 945。"], "exits": ["在岛上停留一周将进入 Level 62；", "水下屏住呼吸两分钟将进入 Level 944；", "逆该层级洋流行驶将进入 Level 4。"]}, "948": {"name": "由一位过世女子亲手制作", "class": "unknown", "summary": "Level 948是一片极度广袤的室外层级，其地理地貌与安稳平和的现实世界极度相似。这里有着绵延数英里的被褥平原，时高时低，形成了起伏的山丘。这些山丘与地形中庞大的坑洞裂隙形成鲜明对比，仿若沉积岩组成的峡谷峭壁那般。层级中同时还点缀着被褥累叠成的山岭。不同于现实世界，Level 948的地形并不是由合理的板块运动或气候形成，而是被缝制成如此样貌。\n除了将陆地与外界隔开的轻薄气泡外，这一层级皆由柔软且尺寸放大的被褥构成。每一条被褥都是由两条基础布料缝合在一起组成的，其间夹带一层柔软而轻薄的棉花。这些基础被褥层层堆叠到了数十层。被褥色彩斑斓、图案多样，只因针法或基底材质相近而齐整。被褥同时也被直接缝在一起，以防止人们自边角处掀起被褥，抑或是层级内恒常拂过的微风将其吹飞。\n尽管层级的地表上大多缺乏典型特征（部分原因在于层级并未完工），但这里的确存在大片的树干，其亦由精心手作的毛毯构成。这些树干大多出现在与起伏的草原山坡相似的区域，但他们也稀疏地分布在山上，而极少出现在峡谷之中。不幸的是，这些树木既无叶片也无细枝；甚至连稍作艺术加工的仿品也不存在。尽管这些外表枯槁的树木看似病态、凛冽而冰冷，然", "entrances": [], "exits": []}, "950": {"name": "伪构虚空", "class": "deadzone", "summary": "", "entrances": [], "exits": []}, "956": {"name": "McGallagher的欢乐之屋", "class": "pending", "summary": "仅需12.99美元的入场门票，即刻开启McGallagher的欢乐之屋的快乐全家桶模式！踏入这座奇幻庄园的厅堂，一场惊险刺激的视觉盛宴与神秘奇妙景观便扑面而来，瞬间让你沉浸其中。别害怕，快来拥抱这场一生仅有一次的心跳冒险，与众多搞怪角色欢乐相聚，比如：神秘莫测的Glanknar、饥肠辘辘的Harold、风度翩翩的McGallagher先生，还有那冷艳高贵的Marble女王！\n欢迎各位来到独一无二的McGallagher的欢乐之屋！您凭门票获赠的这本小册子，会为您详尽展示园区内所有超惊艳、超酷炫的游乐亮点！在入园之前，可千万别错过售票亭右侧的洗手间哦。1\n神秘迷宫，可是连接我们所在世界与奇幻世界的非凡幽径。它宛如横亘在现实与奇境之间的迷雾深谷，超现实的氛围扑面而来。千万小心，莫要迷失其中，因为这迷宫里，墙壁反光，窗户交错，目光所及之处尽是虚幻，极易让人深陷而无法脱身…2\n在饥肠辘辘的Harold的美食天堂，各种美食应有尽有，均采自众多奇异的境域。漫步在主厅之中，宾客们可以随意挑选，尽情享用。偶尔，饥肠辘辘的Harold本人或许还会亲临现场，为游客和孩子们带来欢乐。3\n可尽情享用以下商家提", "entrances": [], "exits": []}, "957": {"name": "无果镇", "class": 0, "summary": "无果镇是个你绝不会想去的地方。它是个残酷而又毫无生机和关爱的镇子，只会让你恶心难受。你只会在这找到失望。至于其他的事物，你会在宽阔的马路上游荡，经过仓库、如汪洋大海般的停车场、商业园、单调乏味的街区，还有无数沉闷又缺乏同理心的建筑。\n开车经过你的人没有一丝谨慎。至少我偏向于认为他们是人类。我不知道这些车还能怎么开。这镇子没多大危险，除了被这些车和周围随便一个仓库里的巨大半挂车碾压的可能性。这挺黑的，所以如果你真被撞了我能理解。但想到他们的前灯有多亮，你应该不会看不见他们开过来了…\n噢，还有那些建筑要说一说，既然你们所有人都经常提到它们。个人而言，我好像是一个都没进去过？应该吧。信我，我试过几次，尽管每次我来到这里，我都巨想离开。一切都像是被钉在地上了一样，而且牢牢地关着，你懂吗？甚至没法打破窗户或者把门干烂。当然你也不一定会想去试就是了。", "entrances": [], "exits": []}, "964": {"name": "Level 964", "class": "unknown", "summary": "地狱边境。一处死寂的地狱。你发觉自己身在遗忘之境内，光芒碎片的边界中，点点光芒指引着通往至深虚幻的无尽之路。自此你开始了自己真正的坠落，你去往一处为心智、心灵与存在所禁断的彼方。回声之路将赐你以未知的烙印，是否去相信那仅为你而颂唱、由你抉择的歌声。驻留此道，即是抛却所有的念想，并加入它们平静祥和的安息之中，成为那终将转化为他者可闻的回声之歌的无话声语之一。而一往无前，则是要抛却一切过往，并继续着这条流浪之路。断绝往昔，终点可期。\n坠时身为孩童，如今已是成人；于绝望之歌中千锤百炼。入时抱扼腕之憾，绝望萦绕于疲惫不堪的耳畔。于永世纷乱的渊狱中陷得越陷越深，便可在惩戒与自我顿悟中领会刚毅。聆听迷失之言的回音，而不应去细听其永世流浪、永归沉眠的低声呓语。长路漫漫，所致之处并非是对安息的盲信，而是接纳容怀。抹去过往残碎的心灵，而今只需坠落，一而再，再而三地坠落。\n提醒自己：如今你的生活知道已不复往日。别再让回忆折磨你了，此方天地，已再无回头之路。自此你方可领悟这条道路的终结。在此之后，你便发觉自己再也无法听见这绕梁不绝的回声了。\n倘若意志已然因勇气的匮乏而被吞噬，那么仅存的机会便是张大声势，阔步", "entrances": [], "exits": []}, "965": {"name": "无彩缤纷", "class": "unknown", "summary": "本层级所怀有的讽刺之意，在于愚者心灵中对多彩的痴狂，在于寻求无谓中之意义的执念。回头或是向前，无论哪条路都比被那狂热的愚蠢——那是人类的决意——所吞噬来得体面。\n一进入Level 965便是一处黑白景观，其间星布着废弃的风力涡轮机与用途不明的建筑，推测这些建筑是废弃已久的的防洪障。地平线上偶尔能瞥见的灰色平原——过于“阴沉”而难以用相机拍摄——是这片荒地中仅有的两处景致之一。天空是一片凝滞的淡蓝色，上面抹着几乎称不上是云的细缕。除这些性质外，该层级还提供了可供任何个人或团体在此安全居住的适宜生存空间。然而，从未有人决定将哪怕最整洁的建筑作为前哨站或是任何形式的定居点。这些团体的代表或是任何流浪者个体常常评价此地“死气过重而无法开展任何活动”或“简直无聊透顶”。有假说称这些评价均为受该层级精神影响的结果；似乎没有定居者会在这里待一天以上。但是，我与众不同。\n在最初见到的废弃建筑与辽远平原以西，坐落着可观测到却被所有人忽视的第二处景致。它被命名为时光难逾之障；它得名于本层级唯一一张相片中可见的那道防洪障。我享有为此发现定名与留影之荣耀，只因无人注目它。它只在虹色之中无比可察。\n然而，一旦被", "entrances": [], "exits": []}, "966": {"name": "炼狱", "class": "unknown", "summary": "炼狱是后室的玖佰陆拾柒层。一片战火纷飞的土地，从传统及本质而言，炼狱是从金色圣焰所产生的上古余烬熔铸而来的，即其本源之残余，其名万物神光。其状貌为一火球，在本层级曾肥沃丰美的土地上肆虐冲撞，如同铁砧上的落锤，炙烤土地，熔毁千山。是它让土壤变得如此炙热，以致于任何涉足其上的发肤皆会转变为一片深嵌其中的焦炭。但这也让这片土地上充斥着焰火与烟气所为的生灵，举例言之，有热火猎犬、尘烬巨蟒、熔渣蜥怪以及烟霭游鱼。乃至有先前生活于森林中的生物幸存并适应了下来，大多数显然都是蓬蒿之主及他所坐拥的苍植禁军。\n炼狱的居民，寻火者及类似寻火者之种，试图让金色圣焰，或简写作圣焰的残余保持燃烧——而比起使用木材，饲育焰火还会有更好的办法吗？燃木者，炼狱中的猎手，意图将蓬蒿之主及他的古堡还有他的禁军拿下，用以供饲圣焰，但是蓬蒿之主却与燃木者展开了追逐藏匿之戏，相持数百年之久，蔽形于他已青叶不再的王国的残余之中。然而侍奉着圣焰的众人却也并非毫无矛盾，一些寻火者已放弃了老旧的方式，并决了自己将圣焰带走了之，将他们的圣焰所余尊奉为熔渣之主。那些心向圣焰的信众正在减少，而更多的护焰者则宣称要加入到熔渣之主的大业中去，将", "entrances": [], "exits": []}, "967": {"name": "系统后门", "class": 0, "summary": "Level 967是一处广袤无垠的公园2其为规模宏大的户外园林景观，周边被各类建筑环绕。该区域昼夜交替的循环与前厅毫无二致，虽说理论上能够抵达这片区域的边际角落，然其空间规模在实际体验中仿若无限3。 那些车窗呈不透明状的汽车会沿着区域两侧单行道疾驰而过，致使行人穿越马路时险象环生，几无可能安全通过4。\n从该区域中心向北眺望，公园右侧靠右下角建有一座医院与一陈教学楼。车辆于右侧道路向北行驶，路中央有一交通系统处于施工状态，其延展方向朝向右端远处。\n公园左侧区域并无特殊之处5，其特别之处仅在于没有设置障碍物，正常来讲，这理应能让流浪者顺利进入公园北面的商场。然而，由于该区域本身的特殊属性限制，人们无法对公园以外的区域展开探索。\n这公园本是一片广袤无垠的公园6，园内有大片空旷草地，面积大得超乎寻常。通向区域两侧的道路均遭封锁，其间还交错着石板小径，以及三三两两散布各处的树木。偶尔会出现小规模空间异常，致使受影响区域产生轻微扭曲变形，穿越时会有一定风险，不过其危险性即便在最糟情况下也可忽略不计。或许能够安全通过。7\n若妄图对公园及其周边寥寥几栋建筑之外的区域展开探索，便会导致人员穿过地表，或者", "entrances": [], "exits": ["当前，尚未有已被证实的出口信息。 而Level 967确实具备通往其他层级的入口通道。曾有至少一名M.E.G.的档案管理员，在试图对公园之外的区域展开勘查时，不慎从商场停车场的地面失足跌落，而后得以返回此处。", "坠入地下这一行为虽具风险，却能将人们送至蓝色通道20。不过，这种离开方式实在不推荐。", "在学校与医院之中，部分随机出现的门可能会被替换，从而通往随机层级。其中，最为常见的是那些通向枢纽的门。", "谁会忍心离开如此宁静之地？这里像是独属于我们的小世界，静谧又美好… 不要再肆意破坏这个层级了！", "摄影师屏住呼吸，每走一步，摄像机都会摇晃一下，他停在浴室门口。他蹲在其后，可以听到他喃喃自语，说着偏执和愚蠢的想法。\n他幽幽地叹了口气，从门缝里探出头来，带着相机对准了镜子前站着的一个模糊的人影。\n它似乎在对自己做些什么。\n档案员盯着镜子，脸中空乏而无表情。它抬手摸了摸自己的头发，露出一个匀称而有分寸的微笑。\n“可悲。”\n它继续望着镜子，喃喃自语，微微颤抖。\n“那么，你觉得你的朋友们还要等多久，才会发现我已今非昔比？”\n倒影不慌不忙地抠着大理石手指，弹掉手上的灰尘和碎屑。档案员也在模仿她的动作。\n就如同站在镜前的是倒影，而不是反过来。\n而后，她仿佛意识到了什么，目光短暂地停留在相机的倒影上。摄影师躲在了门后，一边喘着粗气，一边将手机拉出来。\n现在已近乎不可见，那倒影狰狞的笑着。“哦，我要好好地享受破坏你们在这里建立的小殖民地…或者说，社区。在一个我隐藏的很好的世界…可惜了。”\n“停手。你不需这么做。”\n档案员开始与自身争吵。\n倒影耸了耸肩，档案员也是一样。“我已走得太远，无法改变。而诚实地说，我也不希望这么干。我很惊讶，在经历了这么多之后，你自己的一些残余竟然还在。”她阴郁地看着镜子里它的脸。“若你我的目标相同，那便绝不能选择停下脚步。我不期望你能理解。你们人类太喜欢自己短暂的凡人生活和执念了，永远理解不了。”\n“我们不是…有意…”\n倒影叹了叹气。“但你确实那么干了。你不应找到此层级的，人类。你不应沾染我那寥寥数片纯粹、未被染指的世界之一。”倒影阴沉地望向一旁。“在这世界中，我、我的兄弟和我的丈夫将永远玩耍…”然后，她仿佛重新振作起来，清了清嗓子，盯着档案员。“…最后，你们人类永远不应在这里定居。他们不应为此做一个在线档案。日复一日，我那未被人类玷污的作品越发减少…我已厌倦。我已厌倦于看着你，你的物种不愿躺下接受我的爱。”\n它将手握成拳头。“你的爱意…正在屠戮我们。你他妈就是傻逼。”\n“那又如何？”她歪着头，档案员的动作也与她同步。她用手托住她的下巴。“你能干什么，你能阻止我吗？你又不是她。当另一种意识不直接成为你身体的一部分时，你就更容易、更容易压制它。”\n“住手…”\n“你是如此…脆弱。简直可怜。”\n档案员浑身颤抖。“离…我的…朋友们…远点。”\n她摇摇头。档案员一动不动。“…我很抱歉。不行。在我看来，我只是在修复系统中的一个顽疾，我不明白为什么要停手。”然后，他们慢慢转向门口，眼睛紧紧盯着摄像机。摄影师一边嘟囔着咒骂，一边站起来开始后退。“这是我对…你们二位的送别。”档案员Medio的声音扭曲了，一个更加女性化的声音压过了它的声音。它蹒跚地走出浴室，慢慢地跟着摄影师走回走廊。“你的观察力和好奇心实在是太强了，反倒害了你自己…”\n突然，档案员停顿了一下，凝视着远方，然后回过头来看着镜头。“我的歉意。”它的声音不再是档案员Medio的了。 “抵御与自己身体融为一体的顽固小害虫有点让人分心。现在，我们人在哪？”\n噪声覆盖了屏幕。\n-\n-\n-\n-\n-", "感谢你，让我进入了你们基地的服务器。我不会让这错误白白浪费的。(^_^)"]}, "974": {"name": "Kitty 之家", "class": "0", "summary": "Level 974 为一间中等规模（约 970 平方英尺）的住宅，而遍及其内的是粉红色调的装潢。本层似乎并无通向外部区域的实体门扉，且层内窗户也仅呈现为：描绘人们通常会在户外所见之景的艺术作品，只不过艺作额外带有一种显著的轻佻风格。倘若流浪者随身携带“可爱”物件，那其便有可能最终在切行时进入本层级。\n对每位进入的流浪者而言，层级的外观各有不同，尽管他们所进入的房屋几乎一模一样，但屋内细节仍会因流浪者而有所差异，这些变化可能包括：挂在墙上的特别厨具与空相框、映射流浪者童年回忆的海报，以及其他一些微不足道的细节。虽说多名流浪者出现在同间住宅的情况并不常见，但若这些人共同拿着那个“可爱”物件，则此类情况便几乎必然发生。流浪者身处本层之时，也许会相比往日，更频繁地回想起童年时的记忆。流浪者在层级内回想到的记忆，比在层级外回忆同样的记忆时，更不清晰也更显“模糊”，而且当流浪者离开本层后，那些记忆相较于进入前的回想，往往会变得更加清晰。\n因该层大小有限，故而层级中仅有少量可供进入的房间，而本层中存在有：一间卧室、一间主卧、两间浴室、一间客厅，以及一间厨房兼餐室，置有家具的房间仅有餐室与卧室。Lev", "entrances": ["如果流浪者在进入新层级时，身上携有任何被视为“可爱”的物品，便有极小概率被送往 Level 974，而非他们正常会到达之处。"], "exits": ["Level 974 的唯一已知出口，便是给 Kitty 一个在你进入本层前就已获得的“可爱”物件。你可在停留的期间的任何时候将此物件给予 Kitty，你会立即入睡并在一个安全层级中醒来。"]}, "977": {"name": "警告！警告！警告！警告！警告！警告！警告！警–", "class": "unknown", "summary": "切勿踏入，否则你的器官将会沦为供奉神之手的祭礼。除非你已决然做好准备，承受那被人将四肢残忍扯离身体的剧痛，用自己心脏泵出的鲜血去涂抹加害者的双手。一旦迈入，你身上的肌肉便会在肌腱撕裂的咔嚓声中被硬生生扯下，骨头也将被重重捶打，直至化为粉末。你的皮肤会从血肉之躯上径直融化，而那身躯本身亦会冻结，进而崩裂开来。除非你为吾辈中人，否则万不可擅入。\n你竟宣称那些警告不足为惧？还肆意呐喊着 “放马过来！” “有胆便来一试！” “有能耐就来擒我😀！” 如此行径倒也颇为有趣，不是吗？！来吧，众人皆可前来！一同沐浴于吾主与救世主那虔诚的荣光之下！他咧着血红色的嘴放声大笑，齿间满是被他残忍蹂躏之人的残痕余迹，仿若在向我们所有人示威。那便让我们投身于这血海，在这天堂之中尽享狂欢吧！\n我等的天堂仅被那些短浅之人冠以Level 977这等草率之名，然此处实乃神之手及其全体追随者的神圣庇护所。其形似一座19世纪的哥特式城邦，街头遍染我们内心深处如红宝石般璀璨的血汗与热泪，战斗的嘶吼响彻云霄；拳拳相击，混战者们互殴换伤，此等暴力行径无休无止，而这些伤痕恰似一类神圣的通货，其珍贵程度几可与我们觉醒之际承蒙恩赐的神之", "entrances": [], "exits": []}, "979": {"name": "奥克斯旅店", "class": "habitable", "summary": "Level 979内可目击到的众多走廊之一。\n据推测，Level 979为一栋无尽旅店，其内包含众多形似迷宫、不遵循任何线性模式的走廊。此层级（亦被称作“奥克斯旅店”）以其20世纪70年代末期的装修风格及众多便利设施而易于辨识，此些特征同样使其成为探索活动的理想层级。此层级目前正处于旅店经理与其员工的管理与维护下，他们自2003年初便据有了酒店。\n起初，此层级不存在工作人员，同时缺乏基础物资。其曾被登记为空酒店，人员可以入住于此，然而不可长期驻留。目前，除少数危险区域及寥寥数条古怪性质外，此层级被认为可宜居。\n此层级由两层构成。一楼有着接待室、一间餐厅以及众多仅限员工进入的房间（例如贮存室或监控室）。二楼则由卧室、经理之寝，与许多专用于娱乐的房间（例如迷你赌场区域）构成。", "entrances": ["Level 979最常见的入口位于Level 11。进入一家外观复古、带有奥克斯旅店字样的广告牌的酒店，就会立刻进入这一层级。", "在任何一个酒店层级，进入一扇刻有奥克斯旅店字样的古董木门，就能到达Level 979。", "在level 40切入任意一台街机会将流浪者带到Level 979内的某家迷你赌场。", "在Level 5内，有极低概率撞见一扇特定的门，门内有一个装着芝士的柜子。触碰柜子可能会将流浪者切入至Level 979。", "切入Level 370内任何一张台球桌都可能导致流浪者进入Level 979内任何一个迷你赌场中，具体而言，赌场内靠近一张台球桌的位置。", "在其他层级中找到并触碰绝望渗流可能会将流浪者带至Level 979内较为危险的区域。故极度不推荐流浪者尝试通过此入口进入Level 979。"], "exits": ["走出此层级的主门会将流浪者带到Level 11。", "切入此层级内的水池可能会将流浪者带到Level 37。", "切入任意一张台球桌会将流浪者带至Level 370。", "尝试切入一池绝望渗流可能会将流浪者带到随机一个表面带有此液体的层级。此类层级可能十分险峻，因此不推荐流浪者通过此出口离开。"]}, "980": {"name": "记忆阁楼", "class": "unknown", "summary": "由 Super-Robot14撰写。\n这篇写得还挺有趣的。我一直想基于这个概念写点什么，尝试过很多次，但总是不尽如人意。不过这次，我觉得效果相当不错。再次感谢ReyDay，没有他们的帮助，我可能无法走到这一步。\n人类正身陷囫囵，同伴迷失，不消多时，便仅剩我们。我们一个接一个地迷失，并非迷途于空间，或迷惘于时间，而是迷茫于人性。令我们为人的，究竟为何？\n一处新层级已被发现，其位于大型办公区Zeta（X） 附近。关于这个层级，我们所知甚少，且其被推测为危险。建议探索此层级之人的WSBC总等级达到25。该层级已被封闭，目前尚未找到出口。可以进行无线电通信。坐标为 (X, -4, -3, 2' -2, 5)。\n这条信息已被张贴在我们在现代型车库区Alpha基地的各个角落。我明白这么做的道理，也能理解，但听一次是一回事，每时每刻都听到则是另一回事。显然，还没有人能够处理这个新层级。这个区甚至连名字都无法敲定。当我陷入沉思时，一段记忆突然浮现。我再次站在这里，在那同一位置。记忆犹新，仿佛就在昨天，而且我觉得我永远都无法释怀。我深吸了一口气，缓慢而平静。我的胸膛挺起，其内逐渐充满空气，而后我慢慢地呼", "entrances": [], "exits": []}, "986": {"name": "怠惰者的噩梦", "class": "deadzone", "summary": "Level 986是一片覆盖着一层薄雾的森林，森林里的树木郁郁葱葱，种类繁多。森林远处的山脉清晰可见，然而，由于某些现象，流浪者无法到达这些山脉。雾很薄，呈淡紫色，对流浪者的视线丝毫不会造成影响。据描述，Level 986看起来如梦似幻，似虚如真。这里的树木偶尔会呈现出奇怪的形状，看上去参差不齐，很不自然。据说树枝上还挂着布料，看起来就像是用木头以外的材料制作而成的。到达本层级时，流浪者会出现在一条泥泞小路的起点上。最初，这条小路长3英里1，但每当有流浪者离开本层级的时候，小路就会延长0.3英里2。\n整个层级中不断传来类似前厅森林里的声音，包括啁啾声、呱呱声和鸟鸣声。不过，这些声音没有已知的来源。这里的泥土就像几小时前下过雨那样潮湿，有点像陶土。整个层级中散布着一滩滩杏仁水，但因为这些水与泥土混合在一起，所以不建议饮用。这里的天空就像前厅春天里的那样，该层级也始终处于白天。据报告，在地面和地面周围的绿化带中，经常会发现气泡和一团团奇形怪状的不明物质。此外，在整个层级里，经常出现废弃物品，如空杏仁水瓶和衣物。该层级可以同时容纳多个流浪者，然而，他们必须一起切入，才能同时到达本层级。\n当你", "entrances": ["枢纽中的一扇绿色的门通往Level 986。", "进入蓝色通道后，找到一片林区，尝试切入可来到本层级。", "如果在Level 18发现一个树懒玩偶，尝试捡起，那么可切入Level 986。", "如果在Level 343找到一幅画有一片森林的画，并跃过这幅画，那么可切入本层级。"], "exits": ["主要的出口位于小路的尽头。作为探索完本层级的奖赏，该出口只会将流浪者传送到安全层级，并予以杏仁水作为补给。目前尚不清楚其原因。", "如果找到一棵与其他树相比有区别、有异样的树，并跑进其内部，那么可切出本层级，来到任意森林层级，森林层级包括但不限于：\n\nLevel 14\nLevel 32\nLevel 129\nLevel 166\nLevel 266\nLevel 345", "Level 14", "Level 32", "Level 129", "Level 166", "Level 266", "Level 345", "精神危害", "人身安全隐患", "极不稳定"]}, "988": {"name": "静止之火", "class": 0, "summary": "Level 988类似于木头小屋中的厨房。这所小屋坐落于一边是松树的大平原中心。厨房有一个正对着后墙的U型灶台，灶台上方还固定着一排橱柜。灶台里装着一个炉子，一个水槽和一台洗碗机。台面左边是一台单开门冰箱，冰箱右侧还有一个小了很多的台子。台面边上是一堵装着电话的墙，也同时挂着火焰的图片还固定着橱柜。墙上还开了一扇门以供出入平原。房间中间放着一张圆形小餐桌，边上还有4把椅子，右边是一扇窗户。桌子后面是一个左侧开门的白色小间，里面用柜子放着餐具和上好的瓷器。\n倘若一个人决定打开餐桌后的那扇门，所通向的房间几乎和第一个房间一模一样，只有少量的不同，例如椅子被动了，橱柜开了，桌上有食物了以及其他可能的变化。每一个房间及其室外的平原被称为一张“快照”。如果继续进入第二个房间，还会看到一个几乎相同的房间，只是变化变得更大了，这种现象会随着流浪者的深入而不断增强，并且似乎有无穷无尽的房间数。每个房间的食物和家居物品的组合都不同，例如汽车钥匙或者是玩具。这些物品可以被带离房间，但是如果去向物品原本所在的房门关上了，并且那个房间里没人的话，这个房间会重置所有物品、家具和其他东西的摆放，并把它们恢复到最初", "entrances": ["在Level 131切出。", "在Level 205切出。", "在任何一个森林里笔直走5小时有小概率会让流浪者在穿过一些树后到达Level 988。"], "exits": ["在雪天前哨站附近地上有一个沙子埋着的洞，它通向Level 149。", "吃在快照87里找到的汉堡会把你切出到Level 213。", "进入快照672的小货车会把你带到Level 69。"]}, "989": {"name": "哦，天穹大人", "class": "unknown", "summary": "我们当时正在寻找一个安全、宜居、空旷的层级来建立基地，而这地方在灾难发生前正是如此。这里不过是一片无垠的草地，偶见几簇蓬松的橡树，肥沃的原野上繁花遍地，连一座小丘都不曾隆起于这片平坦的原野之上。这是建立基地的绝佳之地——芳草葱茏，细雨时落，为我们奉上洁净的水源。\n天穹大人那时心满意足，望着我们在田野上安营扎寨，如此安宁地俯瞰着一切……我们在沃土中播下作物，用从地面收集的石头和其他材料，建造了一座实用的大本营。在约一年时光里，我们在这个层级平静地生活，不断寻找逃离后室的方法。不像那些 M.E.G. 的人，我们可不是在安逸度日、建起成百上千个前哨站，我们实际上是在积极努力地寻找出口——寻找逃离整个后室的出口！我们每个人都只在绝对需要补给时才返回基地，难得在途中偶尔相遇，才彼此一叙。\n然而，尽管我们进行了成千上万次探险，却却连一个新层级甚至一丝出口的线索都未曾找到；而那些 M.E.G. 的人却频频发现它们，并且大多数时候还是他妈的误打误撞！（请恕我说脏话。）\n一年过去了，我们决定召开一次全员会议。说实话，我们的领袖打算解散这个团队；他那双曾星辰般闪耀而满怀希望的眼睛，如今已黯淡无光。我一直是", "entrances": [], "exits": []}, "990": {"name": "芊蔚之都", "class": "unknown", "summary": "Level 990由一座巨型城市组成，该城市的建筑和其他混凝土结构上生长着相当数量的植被，这使得该级别后来被探险者称为“芊蔚之都”。城市下方迷宫般的下水道网络也是它的组成部分。\n在柔和的风中，薄雾的环流遍及整个层级的地表，为其提供了恒定的湿度状态。薄雾上方是淡蓝色的天空，在夜晚会变暗为紫黑色，这确认了Level 990中存在昼夜循环。研究人员表示，该层级在走廊或下水道中呈现出非欧几里得空间。由于一些未知的变化因素，旅行者在该层级相遇是不可能的;有假说称这是类似于Level 0上出现的孤立效应所导致的。\n地表城市的建筑与现实世界中的建筑相似，但有一定的变化。这些变化可能包括用未知语言书写的标志或不合常理的建筑元素。另一个已知的环境异常是两种天气状态间的不稳定过渡：无风的天空或倾盆大雨。\n层级中会随机出现物品。它们通常出现在自动售货机或垃圾桶中，几乎总是毫无价值。然而，瓶装水和袋装食品等有用物资也可以随机出现，这使得在Level 990生存成为可能。\n该层级主要分为两部分：地表与下水道。需要着重注意的是，下水道的危险性更高; 这种风险来源于自然光源的缺乏、下水道水蛭的存在以及风暴期间洪水的", "entrances": ["该层最常见的入口是深入Level 11中罕见的植被丛生的建筑。", "在Level 21中进入一扇罕见的标有“43”的门，会带你来到Level 990中一间随机的植被丛生的公寓。"], "exits": ["与进入时非常类似，Level 990可以通过探索罕见的建筑退出，这些建筑似乎未被严重的植被过度生长所影响，这会带你来到Level 11。", "长期待在下水道内有可能会将你传送到Level 34。", "在洪水事件期间待在下水道中有机会在溺水前被传送到Level 76。"]}, "991": {"name": "天使之证圣殿", "class": "4", "summary": "在其最初被发现时，在 Level 991 的范围内共发现了 48 具可辨认的1人类尸体，每具尸体都有被勒死的迹象，脖子上环绕着绳索勒痕。他们被发现时的状态尤其令人不安，因为它们是被一种由外力摆布成嘲弄般栩栩如生的姿态排列起来的，仿佛在生活中活动时被时间冻结了一样。在这令人不安的场景中，人们发现几具尸体被摆成跪着的姿势，而还有一具尸体则站立着，手里紧握着一个花环，似乎正在给他们戴上。人们发现它们处于不同的腐烂状态，其中大多数已经严重腐烂，2接触它们会有很高的染病风险。3\n它们的退化以及在整个区域内的分布是该层级最明显的异常特征，除此之外，该层级看起来与普通环境并无二致。Level 991 包含一片森林区域，其面积大致限制在 20 平方英里；在区域中心，有一座破败的建筑，从外部看，它的大小不超过大多数郊区房屋。在这座建筑之外，整个空间内始终能感觉到微风，微风吹动着树木，使得该层级内从未有过片刻的宁静。树叶的茂密程度加剧了这里固有的不适感；在该层级的这一区域行走超过 15 分钟，人就会被划出一些小擦伤，身上也会沾满绿叶。这些虽然不会真正对流浪者造成伤害，但足以影响人的心理。\n森林永远是静止的", "entrances": [], "exits": []}, "993": {"name": "冬悦", "class": "habitable", "summary": "（图1.0）Level 993林区在晴朗天气下的照片\nLevel 993以寒冷、积雪的生物群落为特征，展现出环境与生态的稳定性，动植物在此和谐共存，达到一种平衡状态：一处真正的安全避难所。\n气候条件以雪天为主，环境温度通常约为-5°C。然而，这一基线每周会被打断一次，持续1至2天，期间温度可能升至15°C。在此间，天气转晴，阳光得以穿透云层，照耀在纯白的积雪之上，并融化湖面冰层。\nLevel 993分为四个不同的地理区域：1\nLevel 993被一条广阔的山脉所环绕，在其南部、西部，以及东部边界形成天然屏障。因此，北方成为层级内唯一可行的前进方向。西部与东部山脉之间距离——即该层级的宽度——约为30公里。\n前往山脉本身是不可能的，唯一的入口是在你进入Level 993时所经过的洞穴。其原因在于大山脉由极高海拔的山峰构成，估计约10,000米。因其高度惊人，山脚呈现为陡峭的石壁，既阻碍了徒手攀登的尝试，也使UAV2无法进行空中侦察，致使大山脉之外的地带无法进入且大多未知。\n离开作为Level 993入口的洞穴后，流浪者首先遇见的便是雪林。\n这一区域栖息着种类繁多的被动“实体”，即表型与前", "entrances": ["常规入口", "已知进入Level 993的唯一入口位于Level 8的洞穴内部。一条温度约为零下5摄氏度的通道总会通往此处。然而，该通道的位置并不固定，常在层级内变动。"], "exits": ["常规出口", "异常出口", "运气出口", "切入树木或大型岩石，会分别将你送至Level 260或Level 557。", "离开村庄后，这块放射性警示标志将矗立在道路的北侧。", "环境恶劣.", "极端辐射危害.", "极端精神危害.", "该环境可能在隔离与威慑中发挥作用。", "有理论认为其具有象征性或惩罚性意义，可能与好奇心和傲慢等心理行为相契合。", "推测涉及“阈界反响”及其作为警示碑的作用，以铭记人类对我们自己家园所犯下的罪孽。5"]}, "994": {"name": "Level 994", "class": "unknown", "summary": "Level C-155是一处东面向海的海滩，其余三面环山。沙滩上没有植物，没有可观测的建筑，没有可用肉眼观测的动物。故而确定此地不存在实体。\n沙滩所面向的海洋会无规则涨落潮。有记录以来，在退潮时可抵达的最大海滩面积约为二十平方千米，涨潮后可抵达的海滩面积不确定，没有相关记录。\nLevel C-155的气候与生存条件都适宜居住，但并没有任何组织在此设立定居点。考虑到此情况，M.E.G.决定在本层级建立一个基地，目前已派出施工者进行作业，施工日期为2022/4/12至2022/7/26，期间禁止人员进入。\n除涨落潮规律不稳定，Level C-155内无任何特异之处。\n2022年5月12日，M.E.G.下属施工人员施隽扬通过Level C-155的入口原路返回M.E.G.总部。以下内容是蒋天宇博士对他的访谈记录。\n下面的记录于M.E.G.数据库中发现，根据内容推测为M.E.G.特工黎齐探索Level C-155的记录，然而人员档案库中查无此人。相关人员根据录音内容对蒋天宇博士进行了询问，后者表示虽然有意向派遣特工探查Level C-155，但尚未付诸实行。因此，本音频内容仅为参考，不保证真实", "entrances": [], "exits": []}, "995": {"name": "现实一致居所", "class": 4, "summary": "Level 995外观类似于一条无尽延伸的直道，两侧的住宅内部塞满了家具和功能紊乱的电器。归咎于层级边界处具有的超自然几何形状，使得试图通过在道路外围徘徊来逃离的尝试，都无功而返。离开道路会使人员再次回到初始的位置，因此认为Level 995的空间结构是圆筒形的。\n由于缺乏重要组件，停在路边的大量车辆都无法启动。但常常可以在汽车内部的某处找到一些用品，但这些用品的功效令人生疑。据称其中发现的许多配件或是组件都让人难以理解。大部分找到的东西要么都是碎的，要么和其他什么不相干的物品以未知方式组合在一起。各类物品的组合体总能构成某种具备超常单一功能的装置，这些功能很少能对我们有所助益。Level 995的许多住宅同样也存在各种材料的融合。这种融合现象的成因未知，但目前普遍认为它们是该层级特有的一种空间扭曲现象的原因。\n目前已证明，与Level 995中和其他住宅存在明显不同的房屋互动，会导致某种短时性的环境或空间的扭曲现象发生。我们认为这种影响的程度大概与人员互动后唤起的怀旧情绪程度成正比。许多受害者报告称在受到影响的过程中，目击了错位的建筑和大量扭曲的、超自然的墙壁结构的出现。大气折射的光", "entrances": ["要进入该层级，人员须突破Level 9中某个上锁的房间。"], "exits": ["若流浪者能找到到一栋蓝色涂装的、构造与Level 995的其他住宅相似的房子，进入后可抵达Level 63。"]}, "996": {"name": "地平线上行", "class": 2, "summary": "Level 996是一大片仿照前厅中九龙城寨延绵而建的城市区域。\nLevel 996被视作一个最高点，该术语来自流浪者对Level 998的称呼，特指一个远离枢纽且自身是或导向“终点”的层级。其位置难以准确估计，因为从已知入口进入Level 996的概率非常低。目前预估的最短路线距枢纽至少有85个层级。\nLevel 996整体相对于水平轴倾斜超过70度。因此，该层级内的行进通常被称为“上行”。\n尽管Level 996与前厅的九龙城寨极度相似，但二者间仍存在一些显著差异：", "entrances": ["许多地点均可能通向Level 996，比如：", "level-36，尽管Level 996内并无机场出现的报告。尚未发现哪些大门可以通往Level 996，因为相关流浪者刚一到达就因疲劳而陷入昏迷。", "离开Level 444后进入的level-176。在层级中发现了一片区域，与可通向Level 996内部建筑的仓库极为相似。", "立刻离开Level 666后进入的Level 165。目前推测该途径仅能通过利用“山魔王仪式”实现。找到一个被污染的水池能提供一个通向Level 996下水道系统的入口。不建议这么做，因为阴影搬运工可能将你带入一间上锁的下水道，导致你的溺亡。", "Level 282。在特定条件下昏倒可能会将你带入Level 996，但这并非普遍事件。", "Level 996的入口似乎随机出现。但下列规则被发现可以增大进入几率：", "远离枢纽。", "注意路径，经过流浪者已经去过的相同层级可能会降低几率。", "层级困难与否，危险或难以辨别方向的层级更有可能到达Level 996。", "记忆，与记忆或怀旧现象紧密相关的层级通常能够直达Level 996。"], "exits": ["最可靠的返回方式就是从原出口离开。 怀疑Level 996的顶部边界有一个出口（如果其确有边界），但这点尚未确定……？", "P: 我们又找到了一些用品。顺便说一句，我觉得这个地方不是是无限的。在斜坡的左侧，有很长一面墙，都是没有入口的房屋。我不知道如果能去另一边会发生什么，但我们找不到任何东西抵达。", "P: 在Level 996的第62天我们还有相当充足的补给。仍在攀登；我们应该就快到观察点C了，但问题在于，有很多谣言说，大部分人到达C观察点后就立马消失了。 悲伤的是我们别无选择。M.E.G.知道这儿能找到什么东西，然后我们就必须这么执行……至少对他们来说正是如此。", "P: 我有点担心Evelyn。她好像……完全不在状态。我怕她已经被这个地方的偏僻隔绝影响了……我感觉我们离开Level 11已经有好几百天了。 她就是我的全部啊，我也不想孤身一人呆在这儿……"]}, "997": {"name": "Level 997", "class": "omega", "summary": "看似坚不可摧的窗户外是永恒的暗紫色虚空。在远处可以看到尚未记录的层级的外部，如同蓝色通道一样。\n空间站大约有 20 英里长，因为从这个距离看你基本上会遇到死胡同。更重要的是，你进入空间站越深，它就越安全，状态也越适宜。\n关于 LevelParadise 997 997 有一个值得注意的地方。尽管此层级主要是一系列迷宫般空间的走廊，带有着类似于科幻宇宙飞船风格的房间，但有几个地方似乎不适合作为空间站。有关更多详细信息，请参阅探索日志。\n在醒来后，你会发现自己在一个只有一扇窗户的卧室里，窗户里是呈一片虚幻的紫色虚空。当你最终打开半掩的门时，你会发现自己在一个阴暗、破败的走廊里，走廊尽头是一扇失效的滑动金属门。事实上，你甚至会发现门在发出电火花。一旦你到达走廊的尽头，恐惧便会爬上你的心头，仿佛即将发生什么不好的事情……\n第一区如同一个荒废而阴郁的空间站内部，这些走廊会向数个方向延伸，偶尔会有一些隔间通过这些狭窄的走廊连接在一起。但只有一个方向允许你进一步深入该层级。显示广告和信息的显示屏有时会出现故障效果。而灯具和舱门几乎全都失效，这使得在此处的探索变得更加困难。\n大多数时候，可以听到破碎而", "entrances": ["唯一可确认的入口是进入 Level 217 一个有标记的舱室。你会失去知觉，醒来时发现自己在区域一的一间卧室里。", "可能有其他入口，因为流浪者留下的笔记表明他们是从 Level 78 进入此层级的，但我们仍在试图从那里找到相应的入口。"], "exits": []}, "998": {"name": "此路向死，或向远方", "class": "变化", "summary": "Level 998是一片空旷、平坦的平面，由状似云层的物质构成。这些云被压印在地表，就如同3D纹理或是全息投影一般。随着流浪者位置与视线的变化，云会发生相应的移动，并给人以立体的错觉；但实质上，该层级的地面为坚硬平坦的固体表面，带有羊毛般的纹理。这些地面上的纹理会给人一种发自内心的感觉，仿佛其正是记忆中虚幻而熟悉的云。\nLevel 998入口处的楼梯，可以看到拍摄时已经从底层登上了数段台阶。\n虽然这些二维平面云层构成了Level 998的主体，但流浪者们抵达该层级时，并不会直接出现在云层之上。Level 998不像大部分层级一样具有多个入口，无论从哪个层级进入该层级，似乎都会抵达同一位置。所有Level 998的入口都将通向一栋写字楼楼梯间的最底层。\n在走过八段台阶之后，流浪者将抵达一个小而空1的房间。最近，这个房间里出现了一堆彩绘鹅卵石，大致上可以用于计数自愿进入Level 998的人数。目前仍然不知道Level 998云层的入口处堆积了多少鹅卵石，但根据最新上传的照片，已经有约38颗石子被粗略地堆成了一堆。\n在离开Level 998的最终房间后，便会进入一片平坦、空旷的云纹理平面，", "entrances": ["Level 998的入口多到需要列成一份清单，至今已经有208个层级可以进入该层级，且这一数字日后很有可能还会继续上涨。正如上文所述，进入该层级的方法非常简单。只需要在以下层级中找到一扇白色的铁门，其外观与电梯门相似，推开它们即可抵达Level 998的起始楼梯9。", "Level -998", "Level 1\n\nLevel 1.1\nLevel 1.5", "Level 1.1", "Level 1.5", "Level √2", "Level 2\n\nLevel 2.1", "Level 2.1", "Level 3\n\nLevel 3.1", "Level 3.1", "level-4\n\nLevel 4.2\nLevel 4.4", "Level 4.2", "Level 4.4", "Level 5", "Level 6.1", "Level 6.2", "Level 7\n\nLevel 7.9", "Level 7.9", "Level 8", "Level 10", "Level 11\n\nLevel 11.1", "Level 11.1", "Level 14", "Level 16", "Level 17"], "exits": ["直到今天，Level 998的出口依旧是一个谜。除了一些能够追溯到公元500年的参考文献12之外，没有任何人知晓Level 998的边界究竟通往何方。", "有许多理论详细地指出了Level 998可能通往的地点，但是相关的实证似乎永远不会出现，因此这些理论都并未归档。任何前往Level 998的个人都可以自行选择相信某种说法，也有自由追逐那些理论中出口的权利。但在付诸实践之前，最好能够先明白这个决定所蕴含的分量。", "对于那些选择离开之人，我们真诚地祝福他们能够在旅程的终点得偿所愿。"]}, "999": {"name": "Level 999", "class": "unknown", "summary": "自Level 999沙滩上所望见的虚空。\n\n\nLevel 999是一个悬浮热带岛屿，凌于一处繁星棋布，类似太空的虚空之上。其整体场景则被笼罩在一层色相渐褪的阴翳中，令其层级内的所有物质都黯然失色，呈现出一种灰度特效。该效应——即在离开层级之时便会消弭者——据信会向长期处在Level 999内的物品或是人类附加一种脱色效果，因为其中沙砾、泥土、树木、水体还有在本层级内自然出现的人造建材在被带出时无法恢复预计的原色已是既定的事实。\n此岛屿的地理学特征与一座颇具异域风情的热带岛屿相吻合，和人们在加勒比海岛及斐济群岛中温润茂盛的地点存在相似之处。但此等气候下酷热难耐的这一要素却并不适用于Level 999，因为岛屿所在之处较为高寒——但并不冰冷刺骨——温度处在13至16°C之间1。\n沙滩边缘则缀接着细若烟霾的沙子，它们游离开来，逾越岛屿自身的边界后便为虚空所托起。沙砾中时而夹杂着以同样方式滞留在虚空中的石子，飘浮在他者所不能及的失重而凝滞的寂静之中。\n这些沙砾时而会被灰色棕榈树及地上突兀而出且更为暗淡的石块所扰动。此类石块与Level 999更为蔚观的下部相比就是沧海一粟。而其下部即是形状不规", "entrances": [], "exits": []}};

function buildGraph() {
  const graph = {};
  for (const c of CONNECTIONS) {
    if (!graph[c.from]) graph[c.from] = [];
    if (!graph[c.to]) graph[c.to] = [];
    graph[c.from].push({ to:c.to, method:c.method, rare:!!c.rare });
  }
  return graph;
}
const GRAPH = buildGraph();

function classColor(cls) {
  if (typeof cls === 'number' || /^\d+$/.test(String(cls))) {
    const n = parseInt(cls);
    const m = {0:'#7ab87a',1:'#a8d08a',2:'#e0c060',3:'#e09040',4:'#d05050',5:'#901010'};
    return m[n] || '#901010';
  }
  return '#a070d0';
}
function classDisplay(cls) {
  if (typeof cls === 'number' || /^\d+$/.test(String(cls))) return 'Class ' + cls;
  return String(cls);
}

function getDanger(level) {
  const info = LEVEL_INFO[level];
  if (!info) return 3;
  const c = info.class;
  if (typeof c === 'number' || /^\d+$/.test(String(c))) return parseInt(c);
  const map = {'habitable':0,'宜居':0,'deadzone':5,'死区':5,'死區':5,'unknown':3,'未知':3,
    'pending':3,'等待分級':3,'等待分级':3,'n/a':4,'不適用':4,'amended':4,'修正':4,
    'omega':5,'終結':5,'终结':5};
  return map[c] !== undefined ? map[c] : 3;
}

function getAllMethods(from, to) {
  const methods = [];
  for (const c of CONNECTIONS) {
    if (c.from === from && c.to === to) methods.push(c.method);
  }
  return methods;
}

function bfs(from, to, avoidRare) {
  if (!GRAPH[from] || !GRAPH[to]) return null;
  if (from === to) return [{ level:from, method:null }];
  const visited = {}; visited[from] = true;
  const queue = [{ level:from, path:[{ level:from, method:null }] }];
  while (queue.length > 0) {
    const item = queue.shift();
    const level = item.level, path = item.path;
    for (const edge of (GRAPH[level]||[])) {
      if (visited[edge.to]) continue;
      if (avoidRare && edge.rare) continue;
      visited[edge.to] = true;
      const newPath = path.concat([{ level:edge.to, method:edge.method, rare:edge.rare }]);
      if (edge.to === to) return newPath;
      queue.push({ level:edge.to, path:newPath });
    }
  }
  return null;
}

function dijkstra(from, to, avoidRare) {
  if (!GRAPH[from] || !GRAPH[to]) return null;
  if (from === to) return [{ level:from, method:null }];
  const dist = {}; const prev = {};
  const pq = [{ level:from, cost:0 }];
  dist[from] = 0;
  while (pq.length > 0) {
    pq.sort((a,b) => a.cost - b.cost);
    const item = pq.shift();
    const level = item.level, cost = item.cost;
    if (level === to) break;
    if (cost > (dist[level] || Infinity)) continue;
    for (const edge of (GRAPH[level]||[])) {
      if (avoidRare && edge.rare) continue;
      const w = getDanger(edge.to) + 0.1;
      const newCost = cost + w;
      if (newCost < (dist[edge.to] || Infinity)) {
        dist[edge.to] = newCost;
        prev[edge.to] = { from:level, method:edge.method, rare:edge.rare };
        pq.push({ level:edge.to, cost:newCost });
      }
    }
  }
  if (dist[to] === undefined) return null;
  const path = [];
  let cur = to;
  while (cur) {
    const p = prev[cur];
    path.unshift({ level:cur, method: p ? p.method : null, rare: p ? p.rare : false });
    cur = p ? p.from : null;
  }
  return path;
}

function findPath() {
  var from = document.getElementById('from-level').value.trim();
  var to = document.getElementById('to-level').value.trim();
  var routeEl = document.querySelector('input[name="route-type"]:checked');
  var routeType = routeEl ? routeEl.value : 'fastest';
  var resultArea = document.getElementById('result-area');
  var resultTitle = document.getElementById('result-title');
  var pathSteps = document.getElementById('path-steps');

  if (!from || !to) { alert('請輸入當前層級和目標層級'); return; }
  if (!LEVEL_INFO[from]) { alert('Level ' + from + ' 尚未收錄'); return; }
  if (!LEVEL_INFO[to]) { alert('Level ' + to + ' 尚未收錄'); return; }

  var algo = routeType === 'safest' ? dijkstra : bfs;
  var normalPath = algo(from, to, true);
  var rarePath = algo(from, to, false);

  pathSteps.innerHTML = '';
  if (!normalPath && !rarePath) {
    resultTitle.textContent = '找不到路徑';
    pathSteps.innerHTML = '<div class="no-path">目前資料中沒有從 Level ' + from + ' 到 Level ' + to + ' 的已知路徑。</div>';
    resultArea.classList.add('show');
    return;
  }

  var routeLabel = routeType === 'safest' ? '最安全路線' : '最快路線';
  resultTitle.textContent = 'Level ' + from + ' → Level ' + to + '（' + routeLabel + '）';

  function renderPath(path, label, isRare) {
    var header = document.createElement('div');
    header.className = 'method-header' + (isRare ? ' rare' : '');
    var jumps = path.length - 1;
    var totalDanger = path.reduce(function(s,p){ return s + getDanger(p.level); }, 0);
    header.innerHTML = '<span class="method-tag">' + label + '</span> ' + jumps + ' 次跳轉，危險度 ' + totalDanger.toFixed(1) + (isRare ? '（含稀有通道）' : '');
    pathSteps.appendChild(header);

    path.forEach(function(step, i) {
      var info = LEVEL_INFO[step.level] || {name:'未知', class:'?'};
      var isLast = (i === path.length - 1);
      var nextLevel = isLast ? null : path[i + 1].level;
      var nextInfo = nextLevel ? (LEVEL_INFO[nextLevel] || {name:'未知'}) : null;
      var wikiUrl = 'https://backrooms-wiki-cn.wikidot.com/level-' + step.level;
      var color = classColor(info.class);

      var card = document.createElement('div');
      card.className = 'path-card';
      card.innerHTML =
        '<div class="path-card-header" onclick="openModal(\'' + step.level + '\')">' +
          '<div class="step-num">' + (i + 1) + '</div>' +
          '<div class="step-header-info">' +
            '<div class="step-level">' +
              '<span class="level-badge">Level ' + step.level + '</span>' +
              info.name +
              (step.rare ? ' <span class="rare-badge">稀有</span>' : '') +
              ' <span class="class-dot" style="background:' + color + ';box-shadow:0 0 6px ' + color + ';"></span>' +
            '</div>' +
            '<div class="step-name">生存難度 ' + classDisplay(info.class) + (isLast ? ' · 終點' : '') + '</div>' +
          '</div>' +
          '<a class="step-wiki-link" href="' + wikiUrl + '" target="_blank" onclick="event.stopPropagation()">維基</a>' +
        '</div>';
      pathSteps.appendChild(card);

      if (!isLast) {
        var allMethods = getAllMethods(step.level, nextLevel);
        var methodsHtml;
        if (allMethods.length > 0) {
          methodsHtml = '<ul class="method-list">' + allMethods.map(function(m){return '<li>'+m+'</li>';}).join('') + '</ul>';
        } else {
          methodsHtml = '<div class="transition-method">' + (step.method || '未知方式') + '</div>';
        }
        var intro = '從「' + info.name + '」前往「' + (nextInfo ? nextInfo.name : '') + '」：';
        var trans = document.createElement('div');
        trans.className = 'transition-connector';
        trans.innerHTML =
          '<div class="transition-arrow">▼ ▼</div>' +
          '<div class="transition-box">' +
            '<div class="transition-label">Level ' + step.level + ' → Level ' + nextLevel + (step.rare ? ' ⚠ 稀有通道' : '') + '</div>' +
            '<div class="transition-intro">' + intro + '</div>' +
            methodsHtml +
          '</div>';
        pathSteps.appendChild(trans);
      } else {
        var end = document.createElement('div');
        end.className = 'transition-connector';
        end.innerHTML = '<div class="transition-end">✓ 已到達目標 Level ' + step.level + '</div>';
        pathSteps.appendChild(end);
      }
    });
  }

  if (normalPath) renderPath(normalPath, '方法一：正常路線', false);
  if (rarePath) {
    var normalStr = normalPath ? normalPath.map(function(p){return p.level;}).join(',') : '';
    var rareStr = rarePath.map(function(p){return p.level;}).join(',');
    if (rareStr !== normalStr) {
      var divider = document.createElement('div');
      divider.className = 'path-divider';
      divider.textContent = '— 或 —';
      pathSteps.appendChild(divider);
      renderPath(rarePath, '方法二：困難路線（含稀有通道）', true);
    }
  }

  resultArea.classList.add('show');
  resultArea.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleConnLib() {
  var body = document.getElementById('conn-library-body');
  var arrow = document.getElementById('conn-lib-arrow');
  body.classList.toggle('show');
  arrow.textContent = body.classList.contains('show') ? '▲ 收起' : '▶ 展開';
  if (body.classList.contains('show') && !body.dataset.loaded) {
    renderConnLib();
    body.dataset.loaded = '1';
  }
}

function renderConnLib() {
  var body = document.getElementById('conn-library-body');
  var outgoing = {};
  var incoming = {};
  for (var i = 0; i < CONNECTIONS.length; i++) {
    var c = CONNECTIONS[i];
    if (!outgoing[c.from]) outgoing[c.from] = [];
    outgoing[c.from].push({to:c.to, method:c.method, rare:!!c.rare});
    if (!incoming[c.to]) incoming[c.to] = [];
    incoming[c.to].push({from:c.from, method:c.method, rare:!!c.rare});
  }
  var allLevels = Object.keys(LEVEL_INFO).sort(function(a,b){return parseInt(a)-parseInt(b);});
  var html = '';
  for (var j = 0; j < allLevels.length; j++) {
    var lv = allLevels[j];
    var out = outgoing[lv] || [];
    var inc = incoming[lv] || [];
    if (out.length === 0 && inc.length === 0) continue;
    var info = LEVEL_INFO[lv] || {};
    html += '<div class="conn-level-block">';
    html += '<div class="conn-level-title">Level ' + lv + ' — ' + (info.name || '') + '</div>';
    if (out.length > 0) {
      html += '<div class="conn-direction">→ 可抵達：</div>';
      out.sort(function(a,b){return parseInt(a.to)-parseInt(b.to);});
      for (var k = 0; k < out.length; k++) {
        var o = out[k];
        var tgt = LEVEL_INFO[o.to] || {};
        html += '<div class="conn-item' + (o.rare ? ' rare' : '') + '">' +
          '<span class="conn-level-num">Level ' + o.to + '</span>' + (tgt.name ? ' ' + tgt.name : '') +
          (o.rare ? ' <span style="color:#d49090;">[稀有]</span>' : '') +
          '：' + o.method + '</div>';
      }
    }
    if (inc.length > 0) {
      html += '<div class="conn-direction">← 可從此處進入：</div>';
      inc.sort(function(a,b){return parseInt(a.from)-parseInt(b.from);});
      for (var k2 = 0; k2 < inc.length; k2++) {
        var ic = inc[k2];
        var src = LEVEL_INFO[ic.from] || {};
        html += '<div class="conn-item' + (ic.rare ? ' rare' : '') + '">' +
          '<span class="conn-level-num">Level ' + ic.from + '</span>' + (src.name ? ' ' + src.name : '') +
          (ic.rare ? ' <span style="color:#d49090;">[稀有]</span>' : '') +
          '：' + ic.method + '</div>';
      }
    }
    html += '</div>';
  }
  body.innerHTML = html;
}

document.getElementById('to-level').addEventListener('keydown', function(e){ if (e.key === 'Enter') findPath(); });
document.getElementById('from-level').addEventListener('keydown', function(e){ if (e.key === 'Enter') findPath(); });
</script>
