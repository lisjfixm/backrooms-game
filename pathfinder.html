0 類似美國高中走廊，兩側有教室，有12小時晝夜循環。教室内有電腦、紙張、筆，有些有 Wifi。夜間教室燈自動打開，窗外有空曠道路和遊盪的竊皮者。洗手間白天可進入，壁櫥用撬棍打開後有屍鼠和補給品。有「學校計劃」前哨，由19名師生組成。", "entrances": ["從 Level 156 的一面牆切出", "從 Level 210 的一扇密門切出"], "exits": "唯一出口是隨機出現的緊急逃生門，越過學校大門後傳送到 Level 807。"}, "191": {"name": "大逃杀.EXE", "class": 1, "summary": "Level 191 是大型地下綜合設施，表面類似水電站但實際用於自由交戰。每24小時重置一次，環境傷害立即修復。大量武器、彈藥和急救箱懸浮在地面上方1米處順時針旋轉。有「扳機狂暴效應」：心率高、肌肉顫動、無法靜止，驅使人們交戰。死亡會在層級其他地方重生。有上層區域和下層區域（迷宮）。鑰匙卡收集者實體會攻擊帶有鑰匙卡的人。", "entrances": ["在後室任意電腦運行「大逃殺.EXE」帶到隨機區域"], "exits": ["用一條命獲得25次擊殺獲得「???鑰匙」，打開任意上鎖的門離開到隨機層級"]}, "192": {"name": "视觉性妄想症", "class": "E", "summary": "Level 192 是一片佔地數英畝的廣袤森林，有24小時晝夜循環但樹冠茂密導致環境昏暗。樹木幾乎都是巨大紅杉，樹上長有類似人類面孔的樹瘤。與此類臉面產生目光接觸後移開視線會導致不可逆的心臟驟停。建議目光看地面前進。土壤中有大量蠕蟲，挖掘幾米後發現3英尺厚的骨製牆面。", "entrances": ["在 level-62 森林中，兩棵被 M.E.G. 用橙色旗標記的樹有極小機率組成通往 Level 192 的大門", "切出 Level 39 的地面"], "exits": "離開森林會前往 Level 170，此時把目光移開是安全的。"}, "193": {"name": "哀悼", "class": 3, "summary": "Level 193 是一無限延伸的墓園，被無法到達的森林包圍，覆蓋薄霧。充滿沒有刻字的墳墓，相互間距兩米，偶爾有從內部挖開的空墳。每個未受損墳墓內都有一具屍體。層級疑似有感知能力，會使用錯誤信息影響數據庫。頁面包含被篡改的文本，顯示多個版本的生存難度等級（3、4、5）。", "entrances": ["極少情況下正在經歷失去且想再次見到他們的流浪者會在這一層醒來", "在 Level 8 死去後可能在此醒來"], "exits": "未知具體離開方式，但從那裡離開的所有人都說他們和失去和解了。"}, "194": {"name": "梦幻庄园", "class": 0, "summary": "Asset 194 主要由山腳下約50英畝的亞熱帶雨林組成，氣候溫和，無敵對實體。有多個瀑布、游泳池和超現實主義建築，是放鬆身心的熱門景點。歸 B.N.T.G. 所有，流浪者需支付信用點數獲得建築臨時所有權。中心是大型堡壘狀建築，內有「Calatrava.」訪問節點機器，存儲層級建築物的數據藍圖。整個資產可能正在慢慢丟失「內存」，山脈逐漸溶入天空。", "entrances": ["從 Level 10 進入（B.N.T.G. 資源站周圍田野有可靠入口）", "從 Level 128 走進柱子偶爾通向隨機建築物內部"], "exits": ["在森林地區徘徊足夠長時間可能發現自己處於 Level 9 或 Level 37"]}, "195": {"name": "钛制森林", "class": "omega", "summary": "Level 195 是類似地球森林的生態系統，但所有物體都由過渡金屬和後過渡金屬製成。大小未知，溫度17-23°C，38小時晝夜循環。白天天空灰濛濛，晚上沒有星星或月亮。唯一天氣形式是汞雨。所有生物都由金屬組成——樹木由鈦、鎳等硬金屬，動物由金、銅等軟金屬。空氣重金屬顆粒劇毒。曾建立 Plutus 的鍛爐站，後因重金屬中毒事故而廢棄，現有鍛爐 Novus 在安全系統下運作。", "entrances": ["在 level-91 中進入被漆成藍色的穀倉", "登上停泊在 Level 230 名叫青銅天空號的船", "觸摸 level-75 中的銅絲"], "exits": ["打開嵌在樹上的金屬門通往 Level 230", "觸摸金子做的鳥巢通往 Level 46", "進入由鎵組成的洞穴通往 level-75"]}, "196": {"name": "物以类聚", "class": "2e", "summary": "Level 196 主要區域為一條長廊，地毯淡棕色，有橢圓形紋飾。牆壁是白色PVC瓷磚，一側有欄杆。走廊一側隨機分佈深棕色木門，每扇門後都是室外景象——由數以億計的單一物品構成的地理景觀。每扇門後的世界都由不同物品構成，地形包括連綿丘巒、溪谷、岩壁山峰、河岸、海岸海洋。每個世界都無盡，唯一返回廊道的方法是通過來時的門原路返回。", "entrances": ["Level -1 黑白長廊中繪有特殊花紋的門", "level-21 內繪有同樣花紋的門", "Level 88 地毯上與 Level 196 地毯標誌相似的花紋上切入", "Level 109 中帶有標籤的門", "Level α 海濱別墅走廊天花板上的矩形裝飾紋路中空形成的黑色洞口"], "exits": ["標有「-> | <-」圖案的門通往 Level 725", "藍色波浪圖案的門通往 Level 7", "象棋棋子標誌的門通往 Level 157", "無圖像無文字的門周圍一定有一扇通往 Level 197 的門", "粉筆標誌的門通往 Level 202", "火焰、花朵、水滴、雲朵剪影的門分別通往 Level 368、369、37、371"]}, "197": {"name": "水晶洞穴", "class": "变化", "summary": "Level 197 是一個大小未知的深邃水晶洞穴，頂部和地面都長有水晶，水晶性質反常，影響取決於所處區域。分四區域：綠松石區（鎮定效果，可能安全）、紫水晶區（危險環境，死區）、紅寶石區（高溫灼傷，大量實體，等級4）、縞瑪瑙區（最危險，幾乎漆黑，有「黑暗君主」實體，未證實存在）。各區域地形和生存難度差異巨大。", "entrances": ["在任何一層突然感到放鬆或平靜，尋找藍色微光的昏暗門路", "在 Level 210 地板上隨機切出"], "exits": ["沿著區域1的照明路徑到達區域2", "區域2可撤退返回區域1或進入區域3", "區域3出口不確定，報告顯示可到 Level 8 或 Level 0", "區域4據稱探索足夠長時間後可被送到想去的層級（未證實）"]}, "198": {"name": "随我闯入风暴", "class": "其他", "summary": "Level 198 是一個敘事性詩歌層級，以兄弟二人在暴風雨中的故事展開。外部是風牆，厚厚夾著塵土和碎裂樹枝，正是大風暴的風眼。內部是溫暖的廚房。兩兄弟違反規則跑進風暴，被扯離彼此懷抱，一人的血肉被風暴撕碎。層級本質上是關於後悔、自責和兄弟情誼的悲劇場景。", "entrances": ["未知，頁面未明確記載具體入口方式"], "exits": ["未知，頁面未明確記載出口方式"]}, "199": {"name": "梦之森", "class": "n/a", "summary": "Level 199 是一個只能由夢境進入的夢幻森林層級。有無盡河流、湖泊、溪谷，遠方群山環繞，地面覆蓋翠綠植被和奇花異草。時間行進異常——駐留數天外界可能只經歷片刻，反之亦然。深入層級會到達「糾纏庭園」——人造建築肆意矗立、交錯盤桓的混亂城市。唯一「實體」是「飛體」——球狀發光條帶組成的生物，會帶領人前往庭園中央的小塔。", "entrances": ["在自然景觀較多的層級內入眠，如深紅森林、Level 37、Level 797", "保持鎮靜，情緒不穩定會難以連接", "商人販賣的助入藥品（效果未確認）"], "exits": "離開只需醒來，但可能很難辦到，不少流浪者感覺自己被「固定」在層級內。"}, "200": {"name": "家園", "class": 0, "summary": "Level 200 是一座你似曾相識的小鎮，約有4000名居民，如你我一般的普通人，他們都很友善。鎮上有早餐攤、學校、住宅，一切都彷彿是你記憶中童年的家。然而美好的表象之下隱藏著異狀：空氣中有灼熱的鐵鏽味，天空飄落讓皮膚開裂的聲音，鎮上的事物會在你不注意時腐化、一分為二。這個層級會讀取你內心的渴望，企圖說服你永遠留下、不斷回憶。它不斷需要新的血液來對抗腐化，並溫柔地勸說流浪者『和我們留下』。", "entrances": [], "exits": []}, "201": {"name": "美 學", "class": 1, "summary": "Level 201 由廣袤沙漠、網絡海洋與霓虹城市組成。主體是黃紫沙地的酷沙漠，綿延約一千萬平方公里，四周環山；沙漠北側是永不落日的沙灘與矢量外觀的網絡海洋，南側是永不熄燈的霓虹城市。天空有巨大網格與固定不動的橙粉太陽，層級內無處不在播放著熟悉懷舊的背景音樂。沙漠中散落希臘—羅馬式神廟遺跡與電腦終端，海洋中有二進制魚，城市有燈流交通、遊戲廳與電視機。長期聆聽背景音樂會陷入『失神』，最終化為無害的靜默幽靈。切入電視是較安全的離開方式。", "entrances": ["使用標有『Mach+』的特殊VHS錄像帶，在連接的電視機上切入即可到達，該錄像帶常見於Level 0、Level 1、Level 4、Level 11。", "在Level 18中若能觀察到VHS效果，一台來自童年的老式攝像機會實物化，查看其中僅有的錄像或照片會被傳送至本層。", "進入Level 33中的電器商店，打開一臺電腦並對其切入可到達（偶爾會誤入負數層級）。"], "exits": ["在霓虹城市中找到電視機櫃，選擇顯示目標層級的頻道切入，是最安全的離開方式。", "使用網絡海洋數字海溝中已被證實安全的視窗超鏈接離開，未經證實的鏈接極度危險。", "切入街機可能抵達Level 25或Level 40。", "應不惜一切代價避開遊戲廳中的海洋球球池，跳入會被帶往『派對』。"]}, "202": {"name": "粉筆長廊", "class": 3, "summary": "Level 202 是由一堵堵黑板構成牆壁、可能無限大的迷宮走廊，約3米寬，被濃霧籠罩，能見度僅10至15米。地面覆蓋白色粉笔細灰，部分區域灰塵鬆散，踏入會立即陷入並窒息。黑板牆上偶爾出現來源不明的古怪文字與記號（如『跟上我』『就在那裡』）。與Level 0相似，流浪者之間無法相遇，容易長時間孤身一人而造成精神傷害。霧中存在乾癟模糊的人形實體，只在遠處觀察而不主動攻擊。空氣中的粉笔灰可能令人窒息，建議攜帶口罩。", "entrances": ["在其他帶有黑板的層級（如Level 117與Level 321）中向著黑板切出，會從本層的牆壁中掉出；傳聞從有被擦去文字圖畫的黑板進入成功率更高。"], "exits": ["在牆壁上極少見到被粉笔灰覆蓋的木框，透過木框圍出的黑板切出，會隨機出現在另一個有黑板的層級，但因木框覆蓋灰塵，切出相當危險。"]}, "203": {"name": "此路不通。", "class": "其他", "summary": "Level 203 是一片無邊無際的裂石荒漠，天空永遠澄澈、烈日高懸，大地乾涸龜裂，無山、無河、無建築、無任何生命。流浪者踏入後四周空無一物，只能不停地走，卻永遠走不出這單調的環境。日積月累下會因脫水與飢餓而痛苦死亡，遺體最終腐爛、只餘骸骨留存。後室似乎渴求流浪者的苦難，因為此地並非正常層級——『此路不通』。", "entrances": ["由洞穴中那扇巨大木門（誘餌陷阱）進入，實則被拽入此層緩慢而痛苦的折磨。"], "exits": []}, "204": {"name": "大叢林", "class": 2, "summary": "Level 204 是一個類似亞馬遜雨林的層級，長滿大王花、異木棉、竹棕椰等熱帶植物，但植物無需降水即可生存，層內異常悶熱，常年35°C。層內有河流網、蔚觀湖（中央漂浮冰山，水溫可低至-57°C），以及高5200米、被分為五區的岌危嶺（疑似死火山）。地下有龐大洞窟系統與大理石黃金神廟，神廟佈滿誘殺陷阱與牆壁面具。層內棲息猴子、金剛鸚鵡、肢團、骨盜等生物，高處高原荒漠區棲息著強大敵對的實體『獵户主首』。誤食過量『梅卡莓』會被體內藤蔓刺穿臟器致死。", "entrances": ["在Level 170內爬上單獨生長的竹棕椰，有時會切入本層獨有樹木的頂端。", "Level 40內的遊戲畫面有時會切換至本層的景致，從而通向此層。"], "exits": ["切入蔚觀湖中央的冰山有時會將你傳送至Level 129。", "在洞窟內溫度較高處出現液態鎵，切入一灘鎵液會來到Level 75。", "從Level 40切入本層者可以同樣方式離開，地形會漸漸重置回Level 40的景致。"]}, "205": {"name": "Level 205", "class": 1, "summary": "Level 205 是一塊約100平方公里的普通平原，邊界為10米高的鐵絲網圍牆，翻過圍牆即可到達Level 10與Level 11。層內實體稀少（除雙尾狐），但散布著30多件1950年前留下的石化物品，包括帶有敵意的大鹿頭骨、溫順的存活石化棘龍、會互相攻擊的二戰坦克與飛機戰爭化石、以及能模仿任何生物骨架的模仿骨架等。層內僅居住著6名被流放的F.O.J前成員，尚無正式基地。", "entrances": ["從Level 8的天花板中切出（約三千分之一概率）。", "從Level 11或Level 10翻過鐵絲網進入。", "在Level 80離開高速公路並走出50千米。"], "exits": ["翻過鐵絲網抵達Level 11或Level 10。", "將化石皮納塔摔碎會被帶往一個派對。"]}, "206": {"name": "白骨森森", "class": "pending", "summary": "Level 206（內部代號待定層級PA117）是一系列以特殊形式排列的地下墓窟與石質地道，完全由骨頭與牙齒構成。上端由一條粉碎融合骨材料建成的長走廊組成，牆上有兩個巨大開口，透過另一面牆可見通向藍色通道的螺旋圓洞。地道兩側密布由骨頭砌成的岔路與房間，天花板上有裸露電線連接的工業照明燈。層內以通往下層級的『井』作為出入口，其中一口井被水淹沒，需游泳穿過。", "entrances": ["透過盜墓過程中被拖入被挖開的墳墓、沿地道進入本層。", "透過與Level 205相連的井進入，該井位於十字交叉口上端地道左側走廊內。"], "exits": ["跳入本層的井會被傳送至Level 205（Level 205一側的井位於南邊鐵絲網圍牆約400米處）。", "位於上端左側低處、完全被水淹沒的房間內的另一口井，游泳穿過可抵達Level XXX（層級不明）。"]}, "207": {"name": "葬身碎墟", "class": "5e", "summary": "Level 207 是一個由48塊前廳美國各州土地錯亂拼接而成的無限層級，所有土地都埋在殘垣斷壁之中。流浪者進入時通常會出現在前廳曾居住的州。層內依流浪者記憶塑造地貌，道路損毀、載具零散，週期性發生五大自然災害：碎塊墜落、龍捲風、雷暴、火山噴發與熱浪（伴隨含輻射的山火濃煙）。天空多雲灰白，氣候寒冷多風。層內有畸形融合的野生動物與會注射『廢疾』致命物質的實體『拾荒靈』。僅有一個M.E.G.『廢墟』前哨提供水與食物。", "entrances": ["切入戶外/露天層級中大堆碎塊之內，或衝入Level 11中看似無法進入的建築。", "在Level 10中找到未封頂或年久失修的倉屋，進入即可抵達。", "在Level 9中無視『閒人免進』路牌前進約3英里到達。"], "exits": ["朝任意方向行進50英里，看到『歡迎來到紐約！』標牌後進入廢墟建築可到達Level 11（僅適用於從未在紐約居住者）。", "找到一棟夜間保持完好的房屋進入，會來到Level 9。", "極少數情況下發現一棟雜草叢生的建築，進入會來到Level 990。"]}, "208": {"name": "Level 208", "class": 3, "summary": "Level 208 類似一座密度極高的無限城市，建築酷似紐約曼哈頓的高樓，最矮也超過七層，中心區域更高更密。流浪者可活動的範圍僅限各樓頂與樓內少數幾層，越低層陳設越稀少，最低幾層變成可切出的虛空。樓頂設施齊全但電梯、衛星等均無法使用，需藉助逃生梯在樓間跳躍。街道為單行道，無任何交通工具。層內除肢團、獵犬、無面靈等常見實體外，獨有全身啞光黑、油膩滑溜的人形實體『奔跑者』，它們三五成群跑酷追獵流浪者，並以把人從樓頂撞飛為樂。", "entrances": ["可從多個層級抵達，包括Level -998工廠屋頂、Level 486週期出現的磚樓、Level 90主屋南側圍欄、Level 94郊區可切出建築、Level 125水中倒映的高樓、Level 143城堡釀酒廠金屬門、Level 153玩偶商店窗、Level 163主樓窗、Level 166內有空房的房屋門、Level 167球場外街道、Level 186被掩埋的摩天大樓、Level 200中通往房子的建築、Level 230商店屋頂、Level 399客車門、Level 995中外形異常的摩天大樓。"], "exits": ["找到設計反常的房間或隱蔽門可通往其他層級，例如長廊→Level -1/-356；多層停車場→Level 35；凌亂房間→Level 70/102；巨大空房→Level 71/108/175；狹窄隔間→Level 145/912；翻修中房間→Level 155/409；水淹房間→Level 233/37；雜草房間→Level 369/374；電梯門→Level 225/365；木門→Level 432/853。"]}, "209": {"name": "哦嘿，炸魚薯條", "class": 1, "summary": "Level 209 是一個鋪鵝卵石的現代街角，兩側向南北延伸至極遠，籠罩在午夜天空下，街角分布英式『炸魚薯條』店。每間店由一位穿白衣圍裙的溫馴無面靈（暱稱『魚酥無面靈』）經營，可用交談態度換取薯條、炸魚、香腸等食物（薯條醬是杏仁水做的焦糖糖漿），但襲擊、繞過櫃台或打碎展示櫃會激怒它們。食物用描述1970年代英國事件但細節有誤的報紙包裹，底部印有拉丁文『Nos maxima culpa.』。停車場外緣有濃黑迷霧，走入過遠會經歷『迷霧效應』消失1-4小時並產生幻覺。唯一社區是六人組成的『鐵哥們』。", "entrances": ["在Level 6.1的工作區找到一扇金屬對開門，通達本層貯藏區。", "走入Level 9.2內一條窄巷死路的大垃圾箱並爬入，會出現在本層南側靠磚牆的垃圾箱裡。", "在Level 299道路上失去意識，有較小可能在迷霧邊緣醒來。"], "exits": ["在街角盡頭找到檢查井並墜入，可到達Level 34。", "在貯藏區爬到貨架頂部，找到通風管道開口順行至末端，會從天花板墜落至Level 20。", "迷霧消散時跟隨路面防滑標誌走入迷霧邊際，會在Level 69醒來。"]}, "210": {"name": "公寓", "class": "未知", "summary": "Level 210 是一個狹小封閉、以約36棟義式公寓單元為中心的空間，層級恆溫25°C，時間永停在9:00左右。公寓皆漆成白色、帶露台，九成新但內部空無一物。中心是含游泳池、破舊籃球網球場的庭院，小徑以白鵝卵石鋪成，部分小徑盡頭是黑色虛空。層內有看不見但可交談的友善實體『我們』（會邀你共餐，自稱『我們』），以及低過敏、可穿過其身體的友善貓。激怒『我們』會被強制切出。", "entrances": ["穿過任意一堵塗有國際象棋棋盤圖案的牆。", "觸摸一盞故障的路燈。", "打破Level 370（疑指Level 37）的瓷磚有小概率到達。"], "exits": ["在本層等待，流浪者無法停留超過6小時，到時會陷入沉睡並隨機切入後室任意層級。", "與『我們』共餐時兩度表現出敵意（觸碰、傷害、威脅皆算），會被從地面切出至Level 0。", "嘗試破壞公寓周圍的隱形屏障，會被切出至Level 11，但極不可靠且可能致死。"]}, "211": {"name": "胃粘膜", "class": 1, "summary": "Level 211 是位於島上、會隨人接觸而改變構造的多洞穴系統，M.E.G.正試圖繪製地圖。洞穴分為五個不同部分，改變構造時不會新造連接通道。洞壁有探險者刻下的指引記號，洞內蘊藏豐富杏仁水。但探索極度危險，多名M.E.G.探險者重傷或死亡，任務已無限期暫停。層內無已知基地。", "entrances": ["切入Level 8內的凹坑，被認為是最穩妥的進入方式。", "進入Level 75中的隨機通道。", "跌入Level 173內的水中。", "Level 797中的某些洞穴可能通往本層。"], "exits": ["環繞本層島嶼繞行有可能進入Level 62。", "探索洞穴系統外的森林有可能進入Level 10。"]}, "212": {"name": "航班永無休止", "class": 5, "summary": "Level 212 曾是後室航空公司的樞紐機場，現因實體爆發而廢棄，外觀像被毀滅後的機場。包含航站樓（實體最少，後室航空駐守）、行李提領處（傳送盤仍運轉、補給豐富、設有警報與安保）、空管處（控制塔已幾乎廢棄，作為休息點）、起降區（被實體占領、有腐蝕性雷雨與致命閃電）。層內有後室航空研究部、M.E.G.『廢墟』前哨、B.N.T.G.行李竊者等基地。飛機會自動起飛、瞬移飛往機身標注的目標層級。", "entrances": ["找到一份推廣後室航空的傳單切入。", "在Level 182內掉入杏仁水水體。", "在樞紐內進入一扇標有飛機的門。", "在Level 11內找到機場。"], "exits": ["登上自動起飛的飛機，可到達機身所標注的特定層級。", "自航站樓的一扇門離開會來到Level 11.3。", "在起降區外部懸崖跳下會帶至藍色通道。"]}, "213": {"name": "Ollie餐馆", "class": "宜居", "summary": "Level 213 外觀是一間名為『Ollie餐馆』的餐廳，有散落古董的用餐區、點餐櫃台與廚房。由一名自稱Ollie的老者經營（是否為實體不明），販售Ollie漢堡、辣味芝士漢堡、熱狗、薯條與根汁汽水等，可用杏仁水等物品交易，食物安全美味。層級無危害、可自我補充物資與清潔，但Ollie會在流浪者亂碰古董或拒付帳單時變得有攻擊性，且拒絕他人在此建立永久基地。", "entrances": ["在Level 11內進入建築隨機切入可到達。"], "exits": ["從來時走的同一扇門離開，多半會到達樞紐，極少數情況下回到Level 11。"]}, "214": {"name": "懺悔花園", "class": 1, "summary": "Level 214（懺悔花園）是一個邊長13米的正方形小空間，疑似處於『天空盒』內，有石子小徑、鐵柵欄、雛菊、薔薇叢與一棵榛子樹。天空的太陽恆定不動，溫度不超過30°C，花朵永遠盛開，且無法被採摘。流浪者會感到異常平靜。任何時候僅能有一人在花園內。看守者是一尊懷抱孩童、自稱『懺悔聖母』的大理石雕像實體，幾乎全知，能回答任何問題，但代價是流浪者必須吐露深藏的秘密，她能察覺謊言。", "entrances": ["在Level 369內極少見到的金屬花園大門進入。", "Level 10內類似的花園大門。", "在Level 165內找到一個隔斷區域。", "嘗試走出Level 84的迷宮（希望渺茫）。", "Level 11內的花店（概率很低）。"], "exits": ["從走進來的大門離開會帶至Level 369、165、10或84。", "從本層跳下墜入天空盒內會帶至藍色通道或Level 371。"]}, "215": {"name": "港畔景觀", "class": 5, "summary": "Level 215 是一個名為『港畔景觀』的小鎮，天空永遠籠罩厚重灰霧，建築風格類似北美城鎮但無人居住，設施卻維護良好。港區破敗荒廢。主要危險有三：腐蝕性實體『苦痛畫卷』（依聲音狩獵、分泌鏽狀腐蝕物）、室內隨機長出強腐蝕性『鏽蝕』的現象、以及城鎮邊緣更濃更危險的『深霧』。避難所是由Jodi Stringer組織把守的港畔酒店，另有港畔球場、『多快好省』雜貨店與深霧中的港畔綜合醫院。", "entrances": ["在Level 147公交車終點站進入玻璃幕牆摩天大樓的走廊，可到達港畔酒店大堂。", "離開Level 9的房屋有小概率來到。", "在Level 399睡著可能在港畔酒店附近海濱醒來。", "進入Level 11的小巷後街（小概率），或在Level 11出租車上入睡。"], "exits": ["在層級邊緣霧中行走有概率到達Level 9。", "進入港畔球場大門偶爾帶至Level 167。", "港畔酒店房間有時通向Level 974或Level 13。", "離開『多快好省』雜貨店有時切入Level 9、Level 11或Level 399。", "進入其他未提及建築有概率來到Level 1、52或109。", "傳言跳進港口的水中可切入Level 100。"]}, "216": {"name": "跨維度後室歷史博物館", "class": "其他", "summary": "跨維度後室歷史博物館（I.M.B.H.）自1932年起免費開放，主展廳分三層四區，由M.E.G.、B.N.T.G.、阿爾戈斯之眼等組織合作維持治安。館內有卡斯特洛斯實體收藏館、貿易藝術展、蒙面女郎展、萬神殿神祇展、各地層級物質樣本展、死亡文化展、E. Isle異常物品收藏館、蘭格利爾禮堂與需審批的瓦倫丁檔案館。環境安全、友善，有導遊、餐廳與紀念品商店，團體參觀不得超過25人。", "entrances": ["透過樞紐內一扇帶有博物館標識的雙開門安全到達本層。"], "exits": ["參觀結束後原路返回該門，可能來到Level 57、Level 164或卡斯特羅斯的Level 222。"]}, "217": {"name": "太空垃圾場", "class": "4E", "summary": "Level 217 是一個由太空站殘骸、衛星及無法辨識物組成的太空廢料場，多數區域為真空。場地廣大、易迷失方向，部分模組加壓可居住。附近有一顆與地球相似、含液態水海洋與植被的行星，懸浮於軌道上，會引發類似『總觀效應』的敬畏感。層內有奇異發光合金、反常融合的殘骸、高速穿梭物體，以及時間空間異常（物體位移、淡入淡出、時間循環）。艙外活動需宇航服，氧氣稀缺，無線電通訊。無已知基地。", "entrances": ["使用Level 83內的逃生艙。", "Level 78內失靈或損傷的氣閘。", "Level 3.1內坍塌的單元揭示路徑。", "傳言Level 36.1內存在入口（未證實）。"], "exits": ["進入層內的太空站部件有時可無縫銜接至Level 78。", "極少數情況下時空異常會將流浪者傳送至後室其他層級。"]}, "218": {"name": "亡人里", "class": 4, "summary": "Level 218 是由潮濕黑暗隧道與地堡組成的地下網絡，經地面建築群抵達，表面滿是亡命之徒塗鴉。它同時是B.N.T.G.的貿易捷徑，也是U.E.C.『刃嶺游擊隊第一獵騎兵兵團』對抗B.N.T.G.與M.E.G.流亡者的戰區。隧道長3-5英里，有爬菌、屍鼠等實體，以及溝渠走私客、粘涕瑞奇等犯罪團夥。U.E.C.設有地上指揮基地『依密爾』與地下F.O.B.『提爾』『弗萊耶爾』。", "entrances": ["無規律地穿越Level 76內隨機出現的排水渠可加入並進入本層。", "Level 11內的下水道閘門、Level 1與2內發現的門徑、Level 10內特定倉房。"], "exits": ["走進地上部分的森林可切入Level 990。", "U.E.C.透過依密爾火力點保有通向Level 502的出口。", "B.N.T.G.的Alpha/Bravo/Charlie/Delta基地分別作為通往Level 11、1、2、10的穩定連接點。"]}, "219": {"name": "美好昔日", "class": "死區", "summary": "Level 219 由現代房屋、迷霧公路、學校三個區域組成並循環往復，直至流浪者死亡。流浪者會被異常力量奪舍，被迫每天重複『起床收拾書包→走40分鐘迷霧公路→坐進教室待到18:00→回家』的上學路線，無法偏離。層內無實體也無補給，冰箱永遠是空的，最終只能死於飢餓或脫水。與Level 0相似，阻隔一切活物間的聯繫。被劃分為死區，無人能逃離。", "entrances": ["多為完全偶然地意外切入，開啟學校、公路或家居層級的門，或在Level 11與Level 9中游蕩時觸發意外切行；切勿主動嘗試到達。"], "exits": []}, "220": {"name": "泥土實驗室", "class": 4, "summary": "Level 220 由泥土與石頭構成的黑暗無盡隧道迷宮組成，需攜帶光源，隧道幽閉、走向怪異，挖牆會引來實體且可能坍塌。層內遍布由各種動物與實體肢體粗糙縫合而成的『奇美拉』，性情隨機、生活在持續痛苦中。另有一對獨特實體：穿白色斗篷、提不滅燈籠的『Bellaphron醫生』，以及由杜賓犬頭、鷹翼、豹軀等縫成、嗅覺靈敏的完美奇美拉『珀加索斯』。醫生自稱製造了所有奇美拉，目標是創造『終極存在』。", "entrances": ["隨機出現的活板門可在Level 8、Level 13的公寓、甚至Level 215周圍發現，進入即到達。"], "exits": ["層內某些固定位置設有活板門，進入會將流浪者傳送到隨機層級，但風險較大。"]}, "221": {"name": "夢幻景象", "class": "其他", "summary": "Level 221（幻景創世）由到訪者的夢境構成，約呈圓形，包含中心的自助食堂（最穩定安全、供應安全食物與杏仁水）、環繞食堂由夢境拼接而成的『景觀畫』（越遠越混亂虛假）、以及邊緣白茫茫的『虛空』（致偏執幻覺）。新人到來會用其夢境擴展層級。有晝夜循環，夜晚一切變黑白、動作遲緩。逗留過久會獲得顯物、遙控等能力但伴隨自我喪失等副作用。深度睡眠會進入各自專屬的危險子層『獄景』Level 221.∞。友好社區『夢居民』約26人。", "entrances": ["在終點的偽現實中一個特殊地點切出。", "由子層Level 221.∞返回（方法未知）。"], "exits": ["在靠近虛空處任何地方切出有可能到達Level 101。", "在遠離自助食堂處進入深度睡眠有進入Level 221.∞（獄景）的風險。", "走過一扇刻著『存在』字樣的鐵門會進入Level 994。"]}, "222": {"name": "最初之源", "class": "其他", "summary": "Level 222 是一個無法常規抵達的小型『馴化層級』，曾是失落一族的藝術畫廊，現被永生者Leo Castellos改造成博物館，已悉心養護兩千多年。設有三層圓形中心廳與多個側翼，展出後室古代磚石大理石遺物、鐵器時代文物、未完成石雕、歷史肖像與未解之謎展品。層內無遷徙性敵對實體，友好無面靈與神祇偶有出沒，並表現出抑制盜竊的效應。頂樓是Leo本人住所，對公眾禁入。", "entrances": ["使用Leo在後室各地分發的特殊傳單，展開並用手指觸摸地圖部分即可瞬間傳送至博物館中心廳。"], "exits": ["在館內再次輕觸傳單地圖就會傳送回原來所在的層級。"]}, "223": {"name": "凝膠", "class": 2, "summary": "Level 223 是一個懸浮在空中、直徑約600米的半透明凝膠大立方體，內含數個長方形氣穴，四周是無晝夜但模擬日出日落的多雲天空。凝膠是一種非牛頓流體，壓力越大越黏稠，緩慢停留會被淹沒，快速移動才能停在表面。層內僅有休眠的肢團與地棲怪，以及鑰匙、書本、塑膠垃圾等物品。該層似乎有特殊機制，讓流浪者接收到遙遠層級垂死之人的無線電訊號。", "entrances": ["切入Level 43的任意一個水族館，可進入層級下部的氣穴。", "閉上眼睛潛入Level 11的噴泉，有小概率進入。", "爬上Level 105的任何一扇上部窗戶，把自己壓入彩色玻璃中。"], "exits": ["一路下沉到凝膠立方體底部，會被傳送到特定層級（同一特定點離開者大概率傳送到同一層），但需在窒息前穿過凝膠底部，且休眠實體可能甦醒攻擊。"]}, "224": {"name": "阿瓦隆", "class": 1, "summary": "Level 224（阿瓦隆）是一個約100萬平方英尺、空無店面與電力的空置購物中心，有天窗昼夜循環，資源豐富。層內棲息著智力與人類相當的高智商雀形目鳥類（鳥群/阿瓦隆住民），它們建立了神權社會，信奉造物主/見證者，由大德魯伊Loric領導，友好但樂於貿易（喜愛閃亮物、鏡子）。杏仁水來自美食廣場上方吊掛的產奶氣魚。另有4名被鳥群收留、體內共生異常黴菌的『梳羽人』。切勿提及Entity 7（傑瑞），否則會被鳥群啄殺。", "entrances": ["透過任意已知電梯或Entity 81的实例到達，能否到達本層完全隨機。"], "exits": ["乘坐電梯離開會回到電梯原本所在的樓層。", "走正門離開會被丟到多種隨機層級，包括但不限於Level 35、Level -155、Level 102。"]}, "225": {"name": "耀眼純淨", "class": 3, "summary": "Level 225 是一系列結構不穩定的封閉式長廊，瓷磚地、白牆、天花板有常亮『出口』燈。流浪者進入後有15分鐘安全期，之後層級開始『治癒/淨化你』，地形周期性突變（稱為循環）。前3循環帶來益處（傷口癒合、物品如新），但隨循環推進，有益細菌被清除、衣物分解、機器鬆散、死皮脫落，最終流浪者細胞全死、屍體被完美保存，到第32循環連同記憶與意識化為原子，地板上只剩一個乾淨斑點。背後疑似一個以吞食流浪者、追求『完美』為目的的實體。", "entrances": ["進入Level 33的緊急出口（成功率微乎其微）。", "透過Level 6.1中一扇寫著『員工通道』的門（較簡單）。"], "exits": ["從你進入時的門出去是最可靠的離開方式。", "沿分散的『出口』標誌走，最後見到貼綠色寬標籤的門，進入可到達Level 4。", "第7循環期間可能找到一扇與眾不同的米色門，進入可到達Level 60。"]}, "226": {"name": "斯拉姆城", "class": "其他", "summary": "斯拉姆城是一座繁華的國際都市，位於維度位點O-00——一個半徑約5公里、類空心地球的圓形地帶，重力與地球相當。無晝夜，中央光源是被鐵籠與四條『腿』懸於空中的明亮物體『眼睛』，四腿是城市水源。城市由SCAS行政理事會管理，人口數千，人類與建築師、鋼皮、無面靈等智慧實體共存。分為城中心、日暮點、機械化、叢生擴植等區，並與鑄造廠位點大量重疊。位點邊界不穩定，遍布可通往其他維度位點的間位點門戶。許多組織（M.E.G.、B.N.T.G.、阿麗亞娜集團等）在此設有交易前哨。", "entrances": ["透過城中心政府區附近連接A-01的大型雙向門戶。", "透過叢生擴植內『眼睛』一條柱子附近連接Z-03的雙向門戶。", "位點邊界不穩，遍布各種臨時出現的間位點門戶。"], "exits": ["經由城中心門戶A-01前往位點A-01（鑄造廠方向）。", "經由叢生擴植門戶前往位點Z-03。", "城市中遍布各種通往其他維度位點的門戶。"]}, "227": {"name": "巨植群落", "class": "未知", "summary": "Level 227 表現為生長在一棵行星大小、倒掛於黑色虛空上方的巨樹枝幹上的巨大森林，地面是木質樹幹，林冠遮蔽天空。巨樹大到能形成引力場，從樹枝邊緣墜落會掉入虛空死亡。層內不穩定，流浪者隨時可能被隨機切出到更危險的層級。樹根附近駐留實體『虛淵凌日』（一顆恆星狀物體），直照光線會瞬間崩解生物，周圍環繞映出其他層級（如Level 129、998）的泡沫，可穿過進入。層內有水平開嘴的狼、15眼6腿的熊、紅眼多尾雄鹿、發光群居松鼠、可食用野豬等動物，以及巨型捕蠅草、有毒發光伽馬巴里等植物。", "entrances": ["在探索具有自然景觀的層級時有可能被某種神秘力量拉入本層。"], "exits": ["離開時間與方式皆隨機，在層內停留一天到一年後會因層級不穩定而被切出到隨機層級。"]}, "228": {"name": "鏡之迷宮", "class": "未知", "summary": "Level 228 是一連串被深淺不一的藍綠紅彩色光照亮的鏡子迷宮，某些地方僅容一人通行。結構穩定、安靜，是個可以稍作休息的地方。出口不難找，按右手碰牆沿右牆走即可，從入口到出口可能需好幾天，唯一的死因是補給不足。已有人把所有出口標記過，別處可見詳細路徑。", "entrances": ["切穿任何鏡子都可以到達本迷宮。"], "exits": ["迷宮有多個已標記出口，分別通往特定層級；想快而安全可去Level 11，想找補給可去Level 196。"]}, "229": {"name": "時之沙", "class": "3e", "summary": "Level 229 是一片約92,000平方公里的沙漠，永遠白晝、恆溫38°C，缺乏地標難以辨向。沙漠中散落各材料建成、磨損不堪的房屋，內部恆溫30°C，可作為庇護所；沙中偶爾可挖到杏仁水與幸運豆奶。偶發短暫沙塵暴。極端高溫引發『時之沙』幻覺效應：看到過去/未來的自己、綠洲水體、附近實體乃至自身死亡。僅有尖刺風滾草等少數實體。有37人組成的『沙漠旅行者』組織駐紮在一座宜居房屋。", "entrances": ["進入位於Level 46的一座老舊房屋即可到達本層。"], "exits": ["在任意房屋內部找到並進入一扇深色的門將通往Level 9。"]}, "230": {"name": "疑雲港", "class": 3, "summary": "Level 230（疑雲港）是一個破旧腐敗、永遠被夜幕籠罩的港口，現已成為後室各團體交易熱點。分為禁區碼頭（水域與停泊貨運船、實體眾多）、唯一安全的交易區（約28平方英里，M.E.G./B.N.T.G./F.T.B.等設營，有商店、餐廳、家園酒店、後室補給公司）、以及危險的陋灘。層內資源包括水手服、餅乾、風乾肉與杏仁水。出沒實體有笑魘、兜帽商人、搬運工、無面靈與死亡飛蛾。因F.T.B.等組織的黑市交易而臭名昭著。", "entrances": ["在Level 6.1內按下一臺自動售貨機的退幣按鈕可切入。", "進入許多層級中標有『打烊』字樣的商店通常會來到本層。"], "exits": ["穿過一扇寫有『鹹味Sal的洞穴探險』的門會切入Level 8。", "穿過一扇寫有『生鏽Rick的房間改造』的門會切入Level 90。"]}, "231": {"name": "資源之城", "class": "其他", "summary": "Level 231 是一片被B.N.T.G.於2016年買下的城市環境，原本為廢棄高樓環繞沙漠。其獨特價值在於各色彩晶體：黃色產杏仁水、綠色產幸運豆奶、紅色產火鹽、藍色產水。B.N.T.G.投入巨資將其工業化翻新為『資源之城』，但拒絕了後室機器人科技索取1%資源的要求。隨後後室機器人科技以先進機器人快速建築、發出威脅，並疑似摧毀了整個層級。現已廢棄、據信已毀滅，3897名勞工被處決。", "entrances": ["切點原由商人發現後賣給B.N.T.G.並完全封鎖保護，現已無已知可進入方式（層級據信已毀滅）。"], "exits": []}, "232": {"name": "古董店", "class": "Ψ", "summary": "Level 232 是一座無邊無際、塞滿各時代古董珍玩的迷宮式古董店，空氣瀰漫舊書與陳木霉味，橘黃燈光與各種走速不同的時鐘讓人喪失時間感。具有Level 0的孤立效應。層級會利用懷舊心態設下『記憶圈套』——以喚起兒時珍貴記憶的物品、親人幻影、熟悉聲音氣味引誘流浪者交互，隨即陷入逼真而逐漸扭曲的童年回憶（殘缺家人、血色天空等），意志不堅者會永遠困在回憶中。通過考驗後可見保險庫，看見自己的未來，接受現實者可離開。", "entrances": ["進入Level 0中一扇帶半透明窗戶的舊木門。", "進入Level 11名為『卡西皮安古董行』的商店。", "進入Level 31一扇罕見出現、標著僅限職員的門。", "進入Level 36名為『以斯拉古董店』的商店。", "找到Level 40中街機十分陳舊的區域。", "在Level 153穿過馬路進入『蓋爾古董屋』商店。"], "exits": ["穿過層級盡頭保險庫的門口總會將流浪者帶至Level 5，此後永遠不能再進入本層。"]}, "233": {"name": "暖水酒店", "class": "其他", "summary": "Level 233（暖水酒店）是一個疑似無盡、由酒店走廊與房間構成的複合體，無生命跡象，牆紙與瓷磚扭曲交雜，瀰漫濃重的氯味，播放著接待音樂。設有大型餐廳（無現成食物，但有自動販賣機，隨便輸入數字可掉出一瓶水）、恆溫27°C的泳池與按摩浴池。各處泳池拐角有通往酒店房間的自動扶梯。環境舒適懷舊，卻漸漸令人煩躁、感覺被嘲諷，像一座貼滿瓷磚的精美棺椁，誘人留下。", "entrances": ["據推測是在Level 37內一個燈光昏暗的走廊中發生了一次不記得的躍遷而進入。"], "exits": ["走向接待前台桌，有概率發現一扇某種程度上『化掉了』的門，穿過即可離開。"]}, "234": {"name": "監羈位面", "class": 5, "summary": "Level 234 表面是一片由荊棘原野、荒漠、毀林與極淺湖泊交替組成的晦暗叢林，實則是一座用於羈押多元宇宙危險罪犯的『監獄位面』，因一次越獄失敗衝入線性時空而墜入後室。由九尊純金構成、能懸浮與心靈交流的『金湯獄衛』監守。層內分地表層與上中下三個地下穴室，關押96個物種。流浪者切入會落在叢林小徑旁，必須安靜快速奔向發光正方形傳送門（閃紅光待其變綠光時穿過）。層內還有狼狩、惡魔、箭毒蛙人、擬形者等危險實體。M.E.G.『庇護所』前哨提供接應。", "entrances": ["流浪者只能通過切誤切出操作而意外傳送至本層的危險區。"], "exits": ["找到發光正方形傳送門，等其閃紅光再變綠光時穿過逃生。", "自長繩梯爬下跳入可到Level 710。", "隨繩橋穿越濃霧可到Level 414。", "使用繩結渡口拉過水面可到Level 422的浮動平台。"]}, "235": {"name": "永無止境的蹦床樂園", "class": 5, "summary": "Level 235 是一片無盡的老化蹦床樂園，牆壁呈綠黃紫色、散發霉味，到處有杏仁水販賣機與噴泉。貼著『生日快樂』玻璃門的房間裡坐著永不離開的無面靈『生日派對』，守著禮物（內有武器衣物，但也藏有人肉玩偶）。安全區是少見的無蹦床昏暗混凝土地室，實體無法進入。原生笑魘以流浪者能量為食、干擾時間訊號。每小時會隨機響起火警，聽到必須立刻撤離。最危險的是『仿形者/潛循者』，會模仿你跟蹤到安全區，在其身邊喝杏仁水會使其發狂追殺，被觸即癱瘓且會讓所有人忘記你的存在。", "entrances": ["深陷Level 283的海洋球池內時可能切出。", "試圖打開Level 13內一扇貼有235的門。", "在Level 59內被絆倒。"], "exits": ["蹦一張沒有彈簧的蹦床會送你到Level 34。", "切入一臺自動販賣機會送你到Level 6.1。", "找到一扇出口門會送你到Level 236。"]}, "236": {"name": "謎題之盒", "class": "未知", "summary": "Level 236 是一個由自稱『謎題』的實體經營、看似室內遊樂場的層級，有從天隨機掉落物品的『垃圾箱』、大廳（含娛樂、食物、休息房）與隨機生成的密室逃脫謎題。只有成功解開謎題（成功率約1%）、被選中的流浪者才能進入。謎題種類繁多（摩斯密碼、找鑰匙、場景解謎），需團隊協作，主持人『謎題』會透過無線電與彈出的通訊應用提供提示。環境安全友善，旨在娛樂與合作。", "entrances": ["成功解開主持人『謎題』設計的謎題（約1%成功率），被其選中後由魔方傳送器傳送至本層。"], "exits": []}, "237": {"name": "相伴城鎮", "class": "死區", "summary": "Level 237（坎貝爾維勒）是一個半透明、彷如海市蜃樓的廢棄小鎮，流浪者抵達時站在單軌鐵路月台上。城鎮有房屋、汽車旅館、雜貨店、小酒館、學校與泳池。越深入城鎮，城鎮越具象真實，而流浪者自身卻逐漸消逝淡化（影子動搖、衣物沾黑、身體能穿牆），最終在溫和的極樂感中被完全磨滅。唯一相對安全處是火車站大廳。離開者口袋會多一張無法丟棄的『坎貝爾礦業股息券』。死區，只能造訪一次。", "entrances": ["後室任意層級中的火車最終都會停靠在坎貝爾維勒。", "在前廳一趟長途列車旅行中入睡，可能在停靠本層的列車上醒來。"], "exits": ["當列車到來而你的形體仍可見時，司機會停車讓你登上列車離開。", "極少數情況下，於列車靠站時站在車前並想像渴望前往的層級，可被列車撞送至該層。"]}, "238": {"name": "路怒症！", "class": "其他", "summary": "Level 238 是一個由層層高架、相互交織的五車道高速公路組成的網狀迷宮，永遠淹沒在暴雨、冰雹與雷暴中，天空是冰冷無靈魂的醫院式荧光。高速上擠滿車輛、陷入無休止的交通堵塞，喇叭與怒罵聲不絕。流浪者進入時被困在一輛全新但煞車方向盤卡死的車內，車上有補給品與杏仁水，切勿下車。隨著耐心耗盡，流浪者會被誘發『路怒症』，狂按喇叭；短暫寂靜後道路恢復通暢，但報復性的顛簸險路與名為『食肉車物』的手臂狀危險會接踵而至。", "entrances": ["在Level 9、11、50、69、80、125、207、215或360的車輛內睡著，會突然在本層一輛車中醒來。"], "exits": ["在激烈路怒事件中棄車的人可能突然陷入昏迷，並在其原本來自的層級中醒來。"]}, "239": {"name": "出口異常", "class": "未知", "summary": "Level 239（出口異常）是一個由黑暗走廊連接的無限房間集合，除紅色出口標識與偶爾顫動的玻璃店面外別無光源，漆黑一片。房間內有黑色矩形桌與長椅，相似房間從未重複出現。它會發出被困者的求救聲音引人深入。未知機制使每個進入者保持在『永久邊緣狀態』，無論待多久看起來都像死去多年——軀幹如乾癟葡萄乾、皮膚緊縮變黑成骨殼。當流浪者意識到自己早已不再活著時便會真正死亡，屍體被房間吸收。不建議單獨進入。", "entrances": ["傳言存在某種『房中之房』、無人返回之處，但具體進入方式未公開，以避免他人按圖索驥前來。"], "exits": []}, "240": {"name": "洛特卡湖的悲劇", "class": "其他", "summary": "Level 240（洛特卡湖）原本是一片湖泊林地避難所，通常只有孩童能進入——迷路兒童哭聲會召喚出一扇刻有火柴人玩耍圖案的純白門。層內有遊樂場、玩具與充足食物，由身高438米、漆黑如墨、白瞳神聖、摸起來像泰迪熊的仁慈實體『洛特卡』照料，常駐100-200名永生兒童與50-100名普通孩童。後因無羈探險者聯盟（UEC）指控洛特卡寄生吸食兒童情緒、釋放瑞撒毒氣將兒童化為悲屍，UEC攻入殺死洛特卡，層級的層級鑰匙不再共振，安全港從此關閉。", "entrances": ["任何在後室迷路的孩子，只要找到一扇門框上刻有玩耍火柴人圖案的純白門即可進入（通常由哭聲召喚現形）。"], "exits": ["被逐出湖泊的成年人多半落在Level 11或Level 4的前哨附近。", "洛特卡臨終前將倖存的永生孩童送至Level 4中的Omega基地。"]}, "241": {"name": "所有狗狗的去處……", "class": 1, "summary": "Level 241 是一片與狗貓相關的無限區域，由三部分組成：明亮友善的『領養中心』（動物友善、不衰老、碗自動補滿，可領養一隻在世期間僅限一次的寵物）、戶外祥和的『寵物墳場』（無數墓碑，走多遠都無法離開，轉身即回）、以及黑暗、籠子上鎖、收容狼虎熊乃至已滅絕動物（霸王龍、長毛象等）的『收容所』。任何停留超12小時的人都會被無傷傳送走。據信這是絕大多數切入後室的動物所到之處。", "entrances": ["出於對陪伴的渴望，或悼念已逝寵物的心願，在與潘達共進早餐後離開Level 726即可切入本層。"], "exits": ["走出領養中心門廳標有『出口』的門，通常會置身Level 726或M.E.G.位於Level 1的前哨。", "停留超過12小時會被自動驅出至來時所在層級的安全地點，若不存在則傳送至Level 1的M.E.G.前哨。"]}, "242": {"name": "朽爛之野", "class": "死區", "summary": "Level 242 由M.E.G.特遣小隊Psi-11在Level 444探索時發現。主體是一片延伸至未知處的平原，地面全為不斷蠕動、以非人類理解方式扭曲變形的鮮肉色物質，引發強烈暈動病與高維認知危害。荒野中有柱塔（塔頂長杆發出刺耳尖嘯，使接聽者肉體溶解融合成肉坨）、房屋（入睡後門窗消失、陷入永無止境痛苦）、以及天空中翻滾、會伸出巨臂抓人撕碎的『無相之面』。遠處可見一座純淨發光的城堡『希望信標』，實則由殘暴的『血肉之王』盤踞、吞噬探險者。23人小隊僅一人生還且精神重創。", "entrances": ["唯一入口是位於Level 444中的一對古銅色雙扇門。"], "exits": ["離開方法未知，生還者推測出口藏在城堡（血肉之王的宮殿）某處。"]}, "243": {"name": "空無", "class": "未知", "summary": "Level 243（空無層）是一個理論上推定存在的層級，無人真正見過。傳聞依一張釘在燈桿上的便條所示步驟進入：雙手遮眼、向前走7步、轉身移開手、找到最近梯子爬到頂、向下走4步再向上走2步、喊出一個介於1到1572之間的數。同樣的紙條也出現在Level 0地板與樞紐門上。有流浪者James聲稱第五次喊出正確數字後成功進入並遭非物質化，此後無人再認得他；那個數每次被喊出後都會變化。", "entrances": ["據稱依便條指示（遮眼走7步、上下樓梯、喊出1到1572之間某個會變動的數字）行事可進入，但極難成功。"], "exits": []}, "244": {"name": "Monsignor之幻象", "class": "等待分級", "summary": "Level 244 由一間穩定的亮白主廳（天窗、現代藝術雕塑）和一組不斷交換、重複、變化的房間構成，房間內布滿抽象畫作與雕塑，未被觀察時會重組移位。共有板排、畫廊步道、雕塑間、圓間（極稀有，能聽到心跳呼吸聲）、空無間（極稀有，層級真正邀請的客人）五類房間。廊道不連通、會形成閉環或把人送回錯誤位置。據稱層級本身具有知覺、會懲罰M.E.G.人員。Monsignor博士獨居於此。", "entrances": ["尚無穩定進入方式，層級會在渴望來人時突然在牆邊出現一個鋪硬木地板的空蕩白廳把人引入。"], "exits": ["離開全憑運氣，建議頭三小時內離開，此後層級會決定你是否配走。", "出口通常把流浪者送回來到此層前的位置。", "在空無間內的出口會把人送到想去的層級。"]}, "245": {"name": "沉船之海", "class": 2, "summary": "Level 245（Scene-08.2）是一片無垠海洋，散布岩石群島與無數沉船，主要危害是惡劣海況與四處漂流、會擱淺或撞毀的空置巨船（船內有補給、部分尚可駕駛）。海上風暴無常，飲用水僅靠雨水、食物靠漁獲與島上種植。島上已形成多個聚落：1975年鄭和號船員建立的『避難所港』、1863年建立的最大殖民地『暫歇港』（數千人）、法語流浪者建的『救生港』等，結成『深海聯盟』，並推動尋找出口的『星盤計畫』『突破計畫』。", "entrances": ["據信可透過開發室內任意風暴中的小型水域進入，或在海上時離開現實。", "2002年3月起亦可透過Scene-07.2內的一個閾界進入。"], "exits": ["閾界TH-023位於避難所港北側15英里，雙向通往Scene-07.2。"]}, "246": {"name": "恐龍巷", "class": "終結", "summary": "Level 246 像一個三層蛋糕狀的自然布景：火紅太陽掛在青檸天空、晝夜如燈泡切換。時間異常——每向前走一寸就對應前廳數年，分為史前叢林底層（恐龍、長羽毛、危險）、人類時代的社區高原中層（田園風光、十二村，唯一允許人居住）、以及遙遠未來的先兆高度頂層（奧林匹斯山投影、神聖道路，僅受邀者可進）。海岸邊是『幽海』——不是水而是黑曜石般的活體黑色沙海，由無數宇宙的情感記憶結成水晶，B.N.T.G.在此開採販售情緒晶體。巨石陣2.0是唯一進出口。", "entrances": ["在Level 283休息室找到反向移動的霓虹座鐘並切出。", "反轉沙漏使其流動再水平握著，向任意方向切出可能抵達。", "從任何日晷切出都會來到本層。"], "exits": ["唯一出口是夜循環期間從巨石陣2.0外環石柱切出，切出抵達地點尚在编錄中；日循環頂著紅日接觸石柱會遭電擊。"]}, "247": {"name": "蔥鬱林地", "class": 3, "summary": "Level 247 是一片廣闊闊葉林，散布小徑、維多利亞時代建築、湖泊河流，空氣清新、氣候宜人、無晝夜，初看似庇護所。實則危險：地上長滿致命灌木叢，接觸會讓人睏倦、被抽乾生命力而亡，遺體化作土墩並重生為『園丁』。園丁是高七八英尺、全身覆苔癬植物的高大實體，負責修剪植被、清掃道路、反覆改變路線。層級會週期性爆發『過度增殖』——植物瘋狂生長30分鐘以上，吞噬一切，必須躲進大建築避難。傳說有一座能完全抵禦過度增殖的巨大公館。", "entrances": ["主要分布在枝繁葉茂或自然景觀較多的層級，朝爬滿苔蘚的樹切出即可到達。"], "exits": ["在任意建築中找到一扇格格不入的現代門會來到Level 11。", "找到沉重損壞的鋼鐵門通常去Level 901，有時去Level 159。", "樹洞有時通往Level 14或Level 797（須臨近小徑才值得冒險）。"]}, "248": {"name": "一條通向每個現存維度的門徑（PA52）", "class": 5, "summary": "Level 248（52號待定批准案/PA52）是一大群現代風格、無盡延伸的酒店走廊，兩旁布滿上鎖編號門，樓層編號混亂、電梯按鈕數不勝數，照明不規律熄滅。後室裝修公司在此沿藍色通道開鑿『運輸幹道』，主動把走廊穿透連向新佛蘭德、恐怖旅館、藍色通道等層級，形成通向各維度的門徑，但也可能導致現實崩解（藍色崩解）。M.E.G.為此發起『停止裝修』行動關停其控制室。層內無實體。", "entrances": ["打開並經過Level 5中的一扇黑門可到達本層。"], "exits": ["走廊中某扇門可切行返回Level 5。", "乘坐電梯按下無數字標記的按鈕可返回Level 0。", "部分門穿透連向新佛蘭德、藍色通道等其他層級。"]}, "249": {"name": "單調人生", "class": 1, "summary": "Level 249 是一片永恆迷霧細雨中的墳場，重傷瀕死的流浪者會在棚屋中獨自醒來，痛楚消失。遠處有殯儀館，一群由其至親（與已逝寵物）組成、面目模糊、語言含糊的黑衣人環繞。流浪者會經歷一場為自己舉行的葬禮——靈車、刻有自己全名生日照片的棺材、依個性定制的告別式、親友朗讀悼辭，最後下葬在一塊只缺辭世日期的墓碑下。葬禮結束後回到棚屋，便會疲倦昏迷，以切入前的同樣狀態返回原層級。", "entrances": ["任意層級皆可切入，唯一要求是流浪者因重傷昏厥而瀕死垂危，隨即會在本層墳場棚屋中醒來。"], "exits": ["唯一出口是墳場的棚屋，須等下葬儀式完全完成後生效；在棚屋中昏迷後會回到原先所在層級。"]}, "250": {"name": "雙星領域", "class": "宜居", "summary": "Level 250 是一片長滿草與蕨類的遼闊平原，遠山隱現，空無他人，唯有風聲。夜空無盡，有兩顆屬於你的星。整個層級如一首對童年天堂與久別之人的懷舊情書——某個古老存在自稱那兩顆星是祂的眼睛，在這片屬於祂的領域守候你許久。地點柔軟、適合入眠，安全、偏遠、無危險實體。", "entrances": ["描述為童年記憶中溫暖夏夜、在老山谷看日落、望見兩顆特別閃亮星星的體驗；跌入現實裂縫後可能在此醒來。"], "exits": ["想離開時跳向那兩顆星即可，會回到以前所在的位置；這是你的回憶，可以控制。"]}, "251": {"name": "情人游船", "class": 2, "summary": "Level 251 是一處年代久遠的『情人隧道』水道網絡，每條水道有狹窄走道，燈具昏暗、長期半黑暗，牆壁布滿黴斑與可見孢子，地面有齊膝深的泥濘積水，停泊著剝落開裂的天鵝狀遊船。隧道點綴心形、玫瑰、鴿子、鎖頭等情愛裝飾。危險來自獨特實體『鬼形』——會化形為你過往情史中重要的人，以懷舊交談與情感弱點誘騙你放下防備，再附身從外部分泌腐蝕性物質蠶食你。另有售票亭、天鵝絨繩隔出的等候區。", "entrances": ["自Level 54內一個積滿水的房間切入。", "自Level 34切行有較小概率抵達。", "Level 37內的隧道有極小概率通向本層相似隧道。"], "exits": ["進入門廳處隨機出現的出口門會切入Level 890。", "觸摸一根植株狀支柱會切入Level 58。", "切出地面會來到Level 33。"]}, "252": {"name": "完全對稱", "class": 3, "summary": "Level 252 是一座破舊天文台，對觀察者呈鏡像對稱，唯有房間中央的望遠鏡不被映射；透過它可看到排列與前廳不符的星星，整個太空連同行星都鏡像對稱。這些行星會『呼吸』搏動、發出高頻電磁波，被視為活體實體『對稱星』。層級會對人施加『對稱化』——外貌與內臟被不可逆转地改造，導致失語、嗅聽喪失、癱瘓、禿頭甚至死亡，並洗腦信徒相信『對稱即是主（袘）』。離開者無法解釋自己如何出去。", "entrances": ["從其他層級走進一扇互為鏡像、破舊污漬對稱的雙開門即可能進入本層。"], "exits": ["離開方式未知，因層級對人有異常影響，離開者無法解釋自己是如何出去的。"]}, "253": {"name": "五家店", "class": 4, "summary": "Level 253 由五家依次深入、越來越恐怖的『店』組成：①路邊小店（昏暗便利店，杏仁水與發霉甜品）；②裁縫繡花店（廢棄服裝店，二樓試衣間鏡子引發軀體變形焦慮）；③切實供應店（擁擠五金店，腐蝕性綠色物質、爬菌、致咳嗽）；④農家平價餐廳（60年代廢棄餐廳，大量無面靈偷襲、跑調爵士樂與幻覺）；⑤兒童天地（玩具店，危險搖馬、幼年期無面靈、車間傳出的孩童哭喊）。需逐店逃脫。", "entrances": ["在Level 11攝入任意食物或飲品有小概率被帶入本層。", "在Level 480睡覺會被帶到本層。"], "exits": ["在路邊小店櫃台取走大量錢款會被提前傳送至危險層級，通常是Level 3。", "若在兒童天地重傷或殺死一個幼年期無面靈『通關』本層，會被傳送至較安全層級，通常是Level 11。"]}, "254": {"name": "Level 254（藍色虛空）", "class": "其他", "summary": "Level 254 是一片空曠、純粹藍色的虛無空間，沒有任何建築、地理特徵或實體。它會對進入者產生強烈心理影響——讓人無論如何都想留在這片寧靜美麗的藍色裡，即使離開後這種渴望也不消散。除一例外，無人進入後能離開；滯留者組成『冥想圈』，終日坐在地上，最終在沒有補給下死亡，自稱『死後會成為虛空的一部分』。不建議探索。", "entrances": ["切入到Level -1的牆裡即可到達本層。"], "exits": ["切出本層的地面就能把人帶到Level 11（這是極少數成功離開的案例）。"]}, "255": {"name": "死亡工廠", "class": 2, "summary": "Level 255 由無數完全相同、約五萬平米的L形老式磚廠混凝土結構組成，遍佈無限平面，彼此間以窄路相隔，如迷宮。廠房冒煤煙、空氣嗆人，停著無人駕駛的空卡車。內部傳送帶日夜運轉，把掛在鉤子上的肉塊烘烤、切片、包裝，機器直接穿牆而過。地下室網絡向下延伸，約一英里後抵達真正源頭——一大片血紅色、痛苦蠕動、遍布孔洞的巨量活肉生物，鉤子軌道從其體內升起取肉。肉樣本含人體幹細胞及牛豬羊基因，帶血源疾病，切勿食用。", "entrances": ["從Level 20切出有時會到工廠地板上。", "乘坐Level 902的傳送帶可被帶到這些工廠。", "離開Level 480曾成功一次把人帶來。"], "exits": ["進入廠內其中一輛卡車經常把人帶到Level 238。", "試圖進入工廠內的房間時經常到達Level 2和Level 3。"]}, "256": {"name": "演示場景", "class": 5, "summary": "Level 256 表現為一處廢棄的技術演示與展覽中心，完全室內、窗外出現一片無特徵的漆黑。採用現代室內設計、霓虹燈與藝術固件，所有門都被鎖住，踢倒一面牆後面還是牆。房間裡布滿各種仿知名遊戲品牌的終端，顯示內容與外觀完全不符：靜噪、失真的觀察者錄像、低解析度早期3D演示、乏味無結局的小遊戲、或是極響的失真電子音伴黑屏。流浪者在其中逐漸精神崩潰、陷入恐慌，窗外黑暗如某種存在在凝視。", "entrances": ["切出Level 4即可進入本層。"], "exits": ["流浪者報告尚未找到出口。"]}, "257": {"name": "夕陽的紫羅蘭色調", "class": "其他", "summary": "Level 257 是一個瀰漫紫羅蘭與丁香花香氣的紫羅蘭色原野與森林，整篇以一封充滿愛與憎恨、偏執與狂喜交織的情書/獨白構成——一個瘋狂愛戀者對其『紫羅蘭』的傾訴，從深愛到囚禁、謀殺、最後共沉於水中。層級主題為強烈而病態的愛、紫羅蘭氣息與黃昏色調，氛圍迷離、悲喜交加。", "entrances": ["頁面未記載明確進入方式。"], "exits": ["頁面未記載明確離開方式。"]}, "258": {"name": "地毯房", "class": "未知", "summary": "Level 258 是一個長2.5英尺、寬2英尺、高8英尺的盒形小空間，鋪滿潮濕、長約2.5英寸的紅色長絨地毯，地毯浸著汗尿般令人作嘔的液體。牆地黏膩，空氣濕熱（84°F、90%濕度）、臭如臭雞蛋與過期牛奶，地毯上長滿綠褐黴菌。僅一盞昏暗電燈泡，仍伸手不見五指。天花板上有寫著『出口』的標識牌與一個看似出口的洞，實為塗黑內壁的偽裝陷阱。空間狹小到只能站立，一次僅容一人，無已知出口，被困者死於脫水中暑，遺體被地毯吸收。", "entrances": ["從任意層級切出（從Level 148切出傳送到本層概率最高）。", "在Level 7的水中失去意識。", "在Level 196的『紅色地毯』區域停留夠久。", "在Level 19的一塊地毯上摔倒。"], "exits": ["目前無已知出口。"]}, "259": {"name": "軀體", "class": 0, "summary": "Level 259（軀體）是一間鋪紅色壁紙的空房，壁紙下穿著流過人血、隨心跳節律跳動的不明材質管道。進入者意識穩定，但逗留越久身體越發生不可逆變化——層級會把人體的患病器官更換成健康版本，過程無痛，但新器官來源不明、常與原身體尺寸不匹配（如成人的手被換成小孩的手），仍能正常運作。頁面穿插大量腕、眼、鼻、心等人體解剖段落與一段追求『完美存在』、丟棄肉體與自我的獨白。", "entrances": ["一個患有器官疾病或器官衰竭的流浪者在夢中看見一扇人體形狀的門，穿過即可進入本層。"], "exits": ["器官置換過程結束後，流浪者會在原入睡地點醒來，身體部位得到更新。"]}, "260": {"name": "閾限極光", "class": 0, "summary": "Level 260 是一片被雪覆蓋、常年夜晚或黃昏的凍原高原，地形只有湖泊與微幅凹陷，高原邊緣呈突兀垂直斷崖。植被以雲杉為主。氣候維持固定七天循環，恆溫約1.5°C。標誌性特徵是比前廳北極光更亮的『閾限極光』，既是主要光源也是熱源，並能覆蓋傷口、重構組織使生物近乎永生（但無法治癒截肢或器官衰竭等重病）。有唯一社區『極光共和國』（96名永久居民，總理安東尼·格雷厄姆斯）。", "entrances": ["從Level -5冬季事件中在戶外待夠久。", "在Level 93天氣第一、二階段於樹旁紮帳篷。", "從Level 118起向東北偏北走60分鐘，待Level 118在視野中碎裂。", "在Level 198幾乎完全隨機發生。", "在乳白天空利用一扇周圍積雪的破窗挖開積雪進入。"], "exits": ["從高原邊緣跳下可抵達Level 93或Level 198。", "從原點步行30分鐘穿過一片密林，天空由極光漸變成正午，即進入Level 135（斯卡茲卡）。"]}, "261": {"name": "平台", "class": "其他", "summary": "Level 261（平台）是阿爾戈斯之眼的一座海上堡壘，外形類似現代石油鑽井平台，面積逾25萬平方英尺，內部有居民建築、儲物單元、油罐與收納巡邏艦的夾層，真實尺寸因內部空間不符外觀而未知。它本是靜止的，卻能以未知手段瞬間移動到任何夠大的海洋層級（曾出現在Level 7、48、134等）。阿爾戈斯之眼的捕手會公然搜查流浪者、強行查收記憶汁、寂靜汁液、瑞撒毒氣、牆壁面具與瓶裝閃電，同時也常出海救援遇難者與失落一族。周圍水域重兵把守，建議避開。", "entrances": ["登上平台方式與登上普通石油鑽井平台無異；平台會瞬間移動到Level 7、48、134等海洋層級。"], "exits": ["離開平台即回到其所身處的海洋層級。"]}, "262": {"name": "域層級", "class": 0, "summary": "Level 262（域層級）是一個包含數學方程 x=x 所有解的集合域，涵蓋所有現實中的人、實體、現實、概念。外形多樣（長弦、前廳餐廳、自己的死後遺體、或由藍色多面體構成的無限網格空間），每個區域約920萬立方英里，被大球體包圍。理論上可用函數與層級鑰匙，把目的地概念化來旅行，但錯誤計算會召喚出危險的概念實體。不穩定，難以建基地。在不同『精確概念區』入睡會被傳送到不同層級。", "entrances": ["在Level -2、藍色通道、Level 18或Level √2找到一把無形的層級秘鑰，閉眼拿著鑰匙並在腦中概念化一個跨現實的一致模式，即可傳送進入。", "在tgochi.exe完成『高中輟學』成就（講座坐累計30小時並翻倒一張書桌）兌換獎勵可立即傳入。"], "exits": ["在不同精確概念區入睡/失去知覺即被傳送到不同層級：『懲罰』區→Level 52（極小概率Level 448）；『隱私』區→Level 12；『空間』區→Level 78（偶爾Level 20）；『和平』區→Level 63；切勿在『享樂』區入睡。"]}, "263": {"name": "綺麗粉紅", "class": 0, "summary": "Level 263（綺麗粉紅）是一條看似無盡而重複、兩側有大型分格窗的走廊，牆壁與地毯呈鮮豔粉紅（地毯略深），窗戶其實是帶靜電紋理的硬表面，天花板漆黑、高約17米。整個層級擁有意識，自稱『Pink』，可透過任何能顯示文字的裝置與你對話，語氣親切、孤獨、懇求你留下。安全、穩定、無怪物。除Pink外別無實體，其他進入者要麼立刻離開、要麼走太遠而死於疲勞飢餓。", "entrances": ["走入由靜電構成、有時呈亮粉紅色的牆或門；唯一穩定入口位於Level 11的Beta基地附近，也零星出現在Level 0、5、37、141、389等處。"], "exits": ["退出很容易，只需轉身即可，出口總是直接通往你切入時的地點。"]}, "264": {"name": "Barnaby Bun的歡樂百貨城", "class": "其他", "summary": "Barnaby Bun的歡樂百貨城類似一家廢棄的1980年代兒童派對餐廳，母公司1990年破產後隨之倒閉。層內實體與物品似乎與某種惡魔儀式有關，可搜刮到派對裝飾、過期飲料、鐵含量過高的蘇打水、冷凍披薩等，但切勿食用任何Barnaby Bun品牌的易腐食物。唯一實體是一個巨大兔子形象、與公司吉祥物雷同的『Barnaby』，很少露面，只在黑暗中露出發深紅光的眼睛，態度難測——有時視入侵者如無物，有時一言不發取走性命，屍體去向不明，且無法離開本層。無法設立基地。", "entrances": ["目前唯一方法是進入Level 4內貼有Barnaby Bun標誌的電梯，至今僅發現兩座，均有嚴密監控。"], "exits": ["乘來時的電梯可返回入口；若電梯不開門，則去門衛室等待，或耐心等電梯恢復運行。"]}, "265": {"name": "山村", "class": "等待分級", "summary": "Level 265 是一片永夜的阿爾卑斯山脈，地平線上永遠懸著北境之光，天空無星無月無雲。一盞永不熄滅的提燈與破舊路牌標記著唯一進入的狹窄岩壁通道，通向一個避風山谷中的小型村落。村屋略帶現代感、牆上掛著紀念未能活著離開者的裱框照片，居民友善好客、但絕口不談如何離開。流浪者一旦試圖沿原路離開，就會在林中繞圈、最終回到村莊；森林深處有高大、關節怪異、發出刺耳嘶鳴的存在驅趕人回村。強烈建議勿長期逗留，有相當比例的人會在此失蹤。", "entrances": ["已知唯一途徑是夜間穿過Level 108的出沒森林廣地；所有抵達者此前都曾受實體傷害。"], "exits": ["失蹤者中僅六人後來在多個森林層級被尋獲，對如何離開及近期記憶幾乎全失，只記得一聲尖銳嘶鳴伴隨燒烙傷口的痛感。"]}, "266": {"name": "碾（碎）", "class": "3E", "summary": "Level 266 由一大簇碩大無比的浮空樹根構成，中央是無葉針葉林，外圍斜坡陡降到90度垂直無限生長。終年濃霧、濕度極高、恆溫36°C，流浪者易疲倦，需攜杏仁水。它銜接Level 166與Level 11，是比Level 69更快的中轉路徑。主要威脅是盤虯樹根——它們能在外力下緩慢變形、張開直徑5米的大洞，一旦有物體落入，所有樹根會快速閉合把物體吞噬拽入地下，無論大小，有去無回，切勿營救同伴。", "entrances": ["在Level 166找到一條被會發微光的樺樹包圍的小徑，沿路行走會被強制切入地面帶至本層。"], "exits": ["找到一部向下運行的電梯進入，會從Level 11某棟公寓樓內出現。", "在層級中心附近找到一面骯髒壁鏡切出，會帶至Level 148。"]}, "267": {"name": "我們的家？", "class": "其他", "summary": "Level 267 表面是一座美麗的無人島孤島，河流奔騰匯入湖中，青翠欲滴、偶見豔陽，有長著小龍角的『龍角犬』與遍地小藍花。以一封跟騷者達戎寫給幾乎不認識他的莎拉的情書/騷擾信展開——他自2020年發現此處後定居、建起社區，反覆慫恿莎拉來團聚，並提到M.E.G.到來、另一個小社區伐木建壩後消失的痕跡。結尾揭示莎拉已把信丟進垃圾桶、三年收到十五封，只是個限制令故事。", "entrances": ["在Level 10裡跳入一個湖泊，然後一直游到湖底即到達（不會溺水）。"], "exits": ["頁面未記載明確離開方式。"]}, "268": {"name": "衛生間", "class": "未知", "summary": "衛生間是一個僅含一個馬桶、一盞電燈的房間。當流浪者迫切需要如廁時，通往它的門會在其身邊2-5米內自行出現，但門總會在人趕到前一瞬間關上，門與牆皆堅不可摧，無法進入。門關上後裡面傳出咯咯笑聲，或『一分鐘就好！』『馬上！』之類簡單話句。在衛生間周圍半徑500米內，人無法排尿排便。受害者還會染上『衛生間羞恥』——一周內腳上黏著一張拿不掉、拿走後又重現的衛生紙。它幾乎在後室所有層級（含室外）都可能出現。", "entrances": ["當流浪者迫切需要如廁時，房門會在其身邊2-5米內自行出現。"], "exits": ["無法進入，亦無已知離開方式。"]}, "269": {"name": "月光中的天狗", "class": 3, "summary": "Level 269 是一片黑暗沉悶的墓園，月光透過雲層灑下，四周被綿延數里的常綠森林包圍。夜空星座排列與地球及任何太陽系行星都不符，暗示本層是宇宙中僅存的行星。墓園裡會生成多種實體，但它們不威脅流浪者，生成後不久即穿過樹林離開；墓碑上刻著那些早已被所屬世界遺忘、或從未存在過的名字。頁面以一個人從刻有自己名字的墳墓中爬出、發現自己變成無手四足怪形、記憶消散的第一人稱故事收尾。本層是後室第一層，森林通往大多數其他層級。", "entrances": ["頁面未明確列舉具體進入方式，稱本層為後室的第一個層級。"], "exits": ["穿過周圍的森林可到達大多數其他層級（不含無智慧生物居住的層級）。"]}, "270": {"name": "紅色世界", "class": 4, "summary": "Level 270 是一片空曠遼闊、由河湖隨意勾連的類球體荒野，地平線上一顆『恆星』發出紅光。紅光會扭曲三維空間感知、引發幻覺，黃昏時最強，並使河湖水中高濃度礦物（磷、鉀及一種紅光下增加的未知元素）加重症狀——血尿、腎痛、嘔吐、幻聽幻視、喪失閱讀能力，需杏仁水治療。球體緩慢自轉，夜晚持續24小時、溫度驟降至-15°C，黑暗潮濕處生成竊皮者、鈍人、獵犬、肢團等致命實體。日出日落區危險最高。", "entrances": ["據信入口位於Level 10較深區域，深入時多數人會先看到地平線一抹紅光。"], "exits": ["唯一已知出口每隔一段時間變換位置，藏在河流下，是個鋼鐵小缺口，需在限時內用固定電腦解簡單密碼，成功後即刻傳送至終點。"]}, "271": {"name": "淡色層", "class": 0, "summary": "淡色層（Level 271）類似褪色層，但不會轉變形態。整個層級顏色暗淡，如色弱般，由許多流浪者曾涉足並銘記的獨立房間組成，每間都有辦公桌與電腦。據信淡色層、褪色層與Level 696皆為後室機器人科技總部創造又廢棄的錯誤層級。Koko在此比在褪色層更常見且較正常。空氣會讓人頭痛、健忘，WiFi信號強但故障多。有後室機器人科技A1、A2基地與電腦室。進入極難，需在褪色層5分鐘內用層級鑰匙打開出口門。", "entrances": ["在褪色層（Level 272）找到罕見的層級鑰匙與出口門，並在5分鐘內打開進入；最快紀錄4分58秒，幾乎不可能。"], "exits": ["詢問Koko，找到特定顏色的出口門離開，會切出至未知層級。", "打破房間牆進入『外部』，跳入解離區域可來到Level 1.5或藍色通道。"]}, "272": {"name": "褪色層", "class": "未知", "summary": "褪色層（Level 272）是後室隱秘層級，進入常發生在不經意間。它會變成你人生中住過的不同房屋與場所，轉變極快、場景不重複，所有實體都是逼真幻象，人無法彼此相遇。全程黑白無彩色，如做夢般。進入時會聽到低語，訴說你童年與人生中尷尬、失敗、羞恥之事，逐漸變大，常導致抑鬱甚至自殺。第100次轉變會經歷童年美好閃回。外部可見但有約4G推力的隱形屏障擋住。找到標有『褪色層』的層級鑰匙與出口門幾乎不可能（形態5分鐘內變換）。", "entrances": ["前往Level 696的-9999樓，看到通往-10000樓樓梯後幾秒內穿過地板跌落。", "Level Δ內有入口。", "停電時從Level 158與Level 141極小概率進入（158為空房走向大廳邊緣切牆；141為穿地跌落）。", "進入Level -0時穿過地面跌落；也可能從Level 71進入（會清除記憶）。"], "exits": ["每當層級變換形態都有一扇通往淡色層的門，需用標註『褪色層』的層級鑰匙打開。", "若層級變成賭場，開電腦運行EXIT.exe與QSL.zip，5%概率傳送到量子穩定層級（多為Level 3）。", "電腦裡點FTR.tp到Level 393；解壓FTLR2.zip點LR.1/TLR.1/LRM.1到Level 393.1不同位置。"]}, "273": {"name": "無盡廢礦", "class": "未知", "summary": "Level 273 是一座無盡廢礦，外觀黑暗、越深入越暗。每100米一個岔路口，分岔標有0到9的隨機數字，需按特定數字路線行進抵達目標。地面濕滑、有深達50米髒水坑，漏水管線偶發致命洪水（聽到隆隆聲即原路撤退）。層內易找杏仁水，部分房間被杏仁水淹滿。原生實體『高影』是紅眼長臂、會快速奔跑、以折磨人為樂的模糊身影；另有哭泣女孩幻象（無法拍攝）。頁面列出多條通往層級鑰匙（連Level 850/159）與杏仁水房間的數字路線。", "entrances": ["在Level 486的礦井中行走足夠遠即可進入。"], "exits": ["跳入水坑切出可通往Level 7。", "按『0,1,7,9,5,4,9,7,4,2,6,5,7,2,0,1,8,3』路線行進可去往Level -9。"]}, "274": {"name": "杰瑞的房间", "class": 1, "summary": "杰瑞的房間酷似一間可容納近200人的大型待機大廳，牆上掛有杰瑞的大型畫像，後牆一幅巨畫前放著普通鳥架——杰瑞（Entity 7）靜坐於此接受信眾朝拜。它是『杰瑞的信眾』（F.O.J.）組織的主要活動基地，在此朝拜杰瑞、制定突襲計畫、傳播杰瑞至上教義；信眾會對非成員傳教或直接動手。F.O.J.由面遮藍袍的『青鳥教父』統領。進出技術上很容易（走進Level 2一扇門即可），但離開時你往往已皈依成至死不渝的杰瑞信眾。", "entrances": ["從技術上講很容易進入——只需徑直走進Level 2中的一扇門。"], "exits": ["離開和走進來一樣容易（原路走出那扇門），但離開者多半已成為杰瑞信眾。"]}, "275": {"name": "Parkson的電梯", "class": "其他", "summary": "Level 275 由門廳與一部50年代風格的神秘電梯構成，任何時候僅容一人存在。流浪者進門後門立刻消失，只能沿白棋盤地面前行進入電梯；電梯門關閉後開始上升，被鎖在裡面數小時至數天（甚至數月）。旅途中三個聲音與你交談：英男聲Question（講冷知識、玩小問答遊戲）、日女聲Rose（友善冷靜、給人生建議、常以『22』開頭報數字）、罕見的22（播放錄音）。會發生開門、夢境、斷電、墜落等怪異事件。補給莫名出現。Question宣布居留結束後，流浪者被切入地面傳送到隨機層級。", "entrances": ["走進一扇有時出現在Level 3、5、13、36的紅木門。", "在Entity 81內按下數字『275』。", "在Level 40一台故障的無標籤灰色遊戲機後打開暗門。", "在Level 57內盯著一張貼紅色牆紙旅館的照片約一分鐘。"], "exits": ["沒有任何已知方法可自主離開；經過一段不確定時間後，會被切入電梯地板，傳送到後室一個隨機層級。"]}, "276": {"name": "蜂巢", "class": "死區", "summary": "蜂巢（Scene 02.9）是一片夢魘般的血肉位面——血流成河、白骨堆山，據稱是整個開發室諸多實體的源頭，並存在一個被擬人化、監督此地的實體『蜂巢女王』（被描繪成一張半融入地面、處於永恆痛苦中的臉）。1980年被『引領者』封鎖唯一已知入口（位於岩洞系統）並嚴加看守。頁面以M.E.G.資料庫存檔與博物館展品的形式，講述後室原生霍夫斯坦文明、奇美拉、以及藝術家Gustave Vincent 1872年誤入後精神創傷、畫下《Voyages Au-Delà de la Raison》畫輯的故事。", "entrances": ["唯一被證實的入口位於Scene 01.9，即穿越岩洞系統時可能誤入；已被引領者於1980年封鎖看守。"], "exits": ["三名古代切入者均經由已封閉的岩洞系統主入口離開，並被外頭守衛救助。"]}, "277": {"name": "安保站點", "class": "未知", "summary": "Level 277 是一個內含汽車生產設備的巨大無序工業綜合體，含收發室、倉儲、裝配線、焊接線、上色設施、休息室等，年久失修卻仍在運轉，牆上攀附粘稠紅色流體。流浪者抵達後手機會出現『安巡捷』APP，強迫你沿路線值班巡邏，完成路線才能找到出口；期間需依賴APP導航。日記記述了被無限期困在廢棄工廠、為不存在的公司無償跑腿、最終有人被箱子壓死、或完成路線後回到原處的經歷。", "entrances": ["進入完全隨機、概率極低：須為18至60歲男性，手持含GPS、可裝軟體的電子設備，並試圖切入封閉層級或穿門。"], "exits": ["完成一系列『安巡捷』APP值班路線後跟從指引到出口，可能帶回切入前的原地址。", "被APP分配到『全新設備』執行多餘路線時，出口會隨機出現；切勿摧毀設備，否則無法離開。"]}, "278": {"name": "赫爾墨斯主義：千屋之墟", "class": "終結", "summary": "Level 278 是一個人類思維無法理解的形而上空間。駐留時流浪者會化形為直徑約2米的發光球體、失去肢體、只能緩慢懸浮，停留數分鐘後被強制送回切入點。其間一個女性人聲朗誦崇拜女神『艾瑪洛可』的神諭，宣稱將你的軀體轉讓給更配得的靈魂。事後流浪者回到原處，致命創傷被治癒，但人格被徹底置換——前世記憶被淡如夢境、性格大變，甚至成為艾瑪洛可的狂熱信徒。已知曉艾瑪洛可之名者必會以死亡形式進入此層，M.E.G.建議及時自我了斷。", "entrances": ["一旦知曉『艾瑪洛可』這一存在，即會以死亡形式進入本層，過程不可逆。"], "exits": ["經歷本層效應後，流浪者會被傳回切入前所在地；此層能力不能延長自然壽命，否則會被撤換出軀體。"]}, "280": {"name": "霧梯", "class": 2, "summary": "Level 280 是一片充滿濃霧的巨大虛空，虛空中散布由未知岩石製成、大小相近的樓梯，彼此以小平台連接成不同長度的梯段。濃霧使光源失效、能見度極低，但會發微光，並掩蓋樓梯不斷旋轉移動的事實。流浪者幾乎無法爬上樓梯（會強烈不悅、極易疲倦），只能一路向下；樓梯無欄杆，墜落可能重傷、死亡或跌入無盡虛空。原生實體『追逐者』是站在你上方樓梯頂的黑影，你一動它就追，無法急轉彎，跑夠久會自行墜落。底部半公頃平台有M.E.G.咖啡館前哨，追逐者無法觸及。", "entrances": ["Level 54中有通往本層的門。", "在Level 39、129或563等層級中，找到附在小木屋上通往本層的門。"], "exits": ["底部平台靠近M.E.G.哨站處有一個小山洞，進入即通向Level 8，是目前唯一已知出口。"]}, "282": {"name": "艇穴", "class": "其他", "summary": "Level 282（艇穴）是一個具有線性空間性質的潛艇基地，與前廳的潛艇洞窟相似。主要由潮濕陰冷的混凝土洞穴通道（艇道區）構成，水流因落差大而洶湧，隧道全長已從初發現的10公里自主延伸至12.5公里。隧道兩側分布多艘鏽跡斑斑、受損無法駕駛的巨大潛艇。層級正在擴張、穩定性漸強、實體漸多。頁面以Samuel N. Derrick溺水漂流、最終被光引導進入一艘潛艇的第一人稱日記構成。", "entrances": ["切入Level 83內的潛艇到達。", "切入Level 291的海洋也可能進入。"], "exits": ["在水流中切出，最後會來到Level 711或Level 182的河中。"]}, "283": {"name": "遊樂天地", "class": 3, "summary": "Level 283 是一座巨大複雜的室內遊樂場迷宮，由螺旋管道、橡膠墊金屬迷宮、50英尺高的彩色堡壘、以及無底海洋球池組成。笑魘常出沒於管道，狂歡小丑與幼年無面靈出沒於迷宮，肢團出沒於海洋球池（球池如流沙、出口不明）。休息區最友善——長凳桌上不斷補滿漢堡、薯條、噴飲料，成年無面靈坐鎮。M.E.G.的Epsilon基地在堡壘內（有通往Level 0的出口），B.N.T.G.的『白堡』資源提取站在休息區。狂歡小丑的棲息地『廣場』位置不明。另有一條通往『派對』的對開門休息室。", "entrances": ["在Level 2找到一扇塗得五顏六色的未上鎖門，打開進入迷宮。", "Level 9運動場內帶白色發光內窗的管道把你送入管道區。", "Level 10偶現藍色小麥堆、中間站著小丑稻草人，採摘小麥即被傳送。", "在Level 22坐上一輛破舊五顏六色、無後座的小轎車可切入休息區。"], "exits": ["休息區有寫著『FUN！=)』的對開門休息室直通『派對』。", "在堡壘內找到一面發黴、未裝飾的木门切入Level 0。", "在休息區移動一幅描繪憂慮小丑的畫作會送入Level 57。", "在管道中爬到地形變成鋸齒狀岩石洞穴即到Level 8。", "掉入海洋球池後有小概率從Level 4天花板掉出。", "在休息區地板直接切出到Level 1。"]}, "284": {"name": "需汝之地", "class": "等待分級", "summary": "Level 284 呈現為一處河畔觀景台，外貌會依進入者的記憶再現家鄉、激發想像，如同一個混凝土月台上的河岸夜景。層級會挖掘你的記憶，讓你遇見記憶中或渴慕的伴侶幻影（體溫、戒指、笑聲都極逼真），但無客觀敵意，負面症狀源自人類認知缺陷。同一時間僅能存在一人——一人進入，其他入口全消失。圍繞它已形成尋找入口牟利的小團體。頁面以攝影師J誤入童年河岸、與記憶中的人相會的情書式日記構成，次晨在Level 10荒野醒來。", "entrances": ["入口約每四小時不規則出現，多在城市非正常延伸處，常為膝深淤泥、雜樹叢的難行小路；進入視線後入口即刻消失。"], "exits": ["唯一已知離開法是在此安眠一夜，隨夜色深沉入睡；多數人在進入前的層級醒來，從高危層級進入者常被轉移到更安全的層級。"]}, "287": {"name": "故障大廳", "class": 2, "summary": "Level 287 是一條兩側布滿黑門、長度疑似無限的白牆走廊。沒有Level 0的嗡嗡聲，取而代之的是遠處輕微的鋼琴噪音，越深入聲音越大卻不覺得更近。繼續深入會逐漸出現靜電視覺、黑白化，聽到1930年代舊廣告聲與耳語，看到穿舊西裝、面目不清的人，杏仁水從天花板滴下。深入者多折返，稱折返時遇到一個叫『奴車莎（Nutrisha）』的實體。每扇門通往Level 289、0、484或2。建議從找得到的門盡快離開，切勿久留。", "entrances": ["可通過打破Level 0的一座牆進入，或切開任意一座暗牆。"], "exits": ["任意選一扇門前往Level 289、Level 0、Level 484或Level 2；建議選Level 0，有備份可去Level 2/484，強烈建議不要進入Level 289。"]}, "288": {"name": "永夜遺光", "class": 0, "summary": "Level 288 是位於現實邊界的一處小型異常空間，一座中等規模島嶼孤立於永夜之中，俯瞰難以測量的海洋。島一側為沙灘、有小型野生動物與海岸樹木，其餘隆起為200米山丘、遠端以懸崖終結。長期全黑環境下仍有稀疏與茂盛並存的植被、新鮮果實與花香。海域平靜無風暴，淺水有完整生態。居民稱災變前天空有會與人交流、提供指引的『星辰』，『黑暗侵襲』時星辰以無光形態墜海。島上有規模有限但活躍的人類聚居群體，在半山腰建集會所、懸銅鐘每日鳴響，從災難中重建、彼此依靠。", "entrances": ["頁面未明確列舉具體進入方式。"], "exits": ["頁面未明確列舉具體離開方式。"]}, "290": {"name": "多維影院", "class": 0, "summary": "Level 290 外觀是一座無限電影院，不同部分有多種建築風格，含走廊、放映廳、售票處等。布局比普通電影院複雜——走廊突然中斷、兩扇緊鄰的門通向完全不同區域。投影機與售票處總在運轉卻無人維護，地板常散落爆米花零食。各放映廳永不間斷播放與現有電影相似但有明顯差異的影片（如《沉睡》《M就是凶手》《Party Rock Anthem》的變體版本）。流浪者格雷戈里·麥金農以此為家、友善助人找出口。", "entrances": ["Level 68中的金屬門會通向這裡。", "Level 177中的標準出口有時會通向這裡。"], "exits": ["找到紅色的門通往Level 74。", "當螢幕正在播放與Level 104相關的影片時，穿過螢幕到達該層級。", "放映廳中的門偶爾通向Level 142。"]}, "291": {"name": "海上迷途", "class": 2, "summary": "Level 291 是一艘在群山環抱的湖中行駛、裝約百隻集裝箱的大型貨船，船身無限長、無法從一端到另一端，爬上集裝箱頂會被送回原處。大多數區域無實體，但停留一小時即使看不見海也會出現『暈船』症狀（噁心、嘔吐、頭痛、發燒）。灰色集裝箱全上鎖；紅色偶有火鹽、藍色裝滿杏仁水、綠色則如帶窗的集裝箱住宅（窗內永遠是海，進入可緩解暈船）。Wi-Fi打不開網頁，只顯示『放下電子設備，安安心心賞景』。有五名穿亮黃斗篷、持不同顏色金屬矛的敵對『船夫』。", "entrances": ["切入Level 17的天花板會來到本層。", "在Level 11街上有概率發現一隻集裝箱，進入即到。"], "exits": ["在地板找到艙門進入來到Level 17。", "切入無法打開的集裝箱可傳送至Level 37。", "停留夠久遇到貼五彩紙屑的集裝箱，切入會來到派對。"]}, "292": {"name": "Level 292（廢棄電腦實驗室）", "class": 4, "summary": "Level 292 是一棟無盡荒廢的校園電腦實驗室，充斥桌子、椅子、顯示器、投影機與白板，所有電腦都跑Windows XP、功能正常但只能運行預裝程式。房間類型包括標準實驗室、教師辦公室（滿牆書籍多為空白、獎盃）、伺服器室、物品儲藏室、學校衛生間。除數英里可聞的電腦運轉聲外幾乎寂靜，單調嗡嗡聲會造成心理創傷與幻覺，需攜杏仁水。與Level 0相似的隔離機制使人無法相遇；窗外是永夜校園操場但窗無法打破。實體有友善的『眼熟的教授』、存在於電腦中發出損心聲音的『困於電腦的聲音』、以及伺服器室裡用電線攻擊的黃眼敵對實體。", "entrances": ["穿過Level 117中的門是最常見進入方式。", "Level 4中印有電腦圖案的門會將人帶來此。"], "exits": ["浴室隔間內偶爾出現通向Level 122的梯子。", "切出層內任一牆壁去往Level 120。", "不小心被電線絆倒會來到Level 0、Level 1或Level 11。"]}, "295": {"name": "瘟疫", "class": 2, "summary": "Level 295 是一片直徑約300公里、荒無人煙、處於永冬的沃土，因不毛植被而呈現。層內煙霧重重、最明顯特徵是一片亮藍色，地表矗立造型奇特的山丘，覆蓋灌木與密集植被，有長河與突兀融入山丘的水流。氣溫約3°C、偶爾跌破零度。它之所以叫『瘟疫』，是因為它本身是一種以流浪者為寄主、四處傳播污染的瘟疫：感染者會執著離開並觸及其他層級表面，使其逐漸被冰冷藍色土壤取代、植被過度生長、出現藍色濃霾。對熱敏感，用火鹽、燃燒液體可根除污染。M.E.G.已頒禁令、疫情趨停。", "entrances": ["據稱在Level 290內有時可遇見一些木門，進入即被送至此層。"], "exits": ["找到一扇嵌入樹幹的門，進入會瞬間傳送至後室隨機一個層級。"]}, "297": {"name": "Website 297", "class": "其他", "summary": "Level 297（Website 297）是一個以電腦螢幕為介面、自稱『完美數位天堂』的層級，以Sasha K.接受邀請、淡入淡出進入的第一人稱敘事展開。它依序載入三個為你微調的擬真環境：芳草地（黃金懷舊色調、柔風、觸感完美的青草泥土）、森林（松林香、鳥鳴蟬鳴以Python/Java循環播放、樹木同步搖曳）、以及夜晚霓虹城市（窗後空無一人、火車永不到站、街邊人物如定格塑膠模型般不動、笑聲循環）。表面無痛無老、永恆祥和，實則是一個只有你一人、靜止無生命、以算法誘你留下的空殼完美世界。", "entrances": ["頁面未明確列舉具體進入方式（以接受螢幕上的邀約、淡入後進入敘事呈現）。"], "exits": ["頁面未明確列舉具體離開方式。"]}, "298": {"name": "冬日遊樂場", "class": 2, "summary": "Level 298 是一片矗立於仲冬午夜的兒童遊樂園，有鞦韆、滑梯、遊樂屋、爬架，地面覆滿新降、適合搓雪球的軟雪。空氣凝滯刺骨，天空是深橘叢雲，只有公園邊緣一盞白燈。友善的『雪天使』是印在雪地上、能滑動溜梯、把你當玩伴的無實態殘影，只想要玩耍；當敵對的『其他孩子』（三至五人一組、眼睛發光、黑不可見的非人存在）逼近時雪天使會四散躲藏。你只能用緊搓的雪球擊退這些孩子——勝利得享遊樂自由，失敗則被塞進雪中、化為天使形狀的永恆雪牢。", "entrances": ["頁面未明確列舉具體進入方式。"], "exits": ["以『跑回家去』的意象呈現——擊退孩子後離開，回到溫暖壁爐與毛毯般的安穩之處。"]}, "299": {"name": "威斯敏斯特巷", "class": 1, "summary": "Level 299 是一條寬75米、長1600公里的鵝卵石路，兩旁矗立43201座樣貌各異的鐘樓（多仿倫敦伊丽莎白塔）。除一座『閃電戰鐘樓』外，43200座鐘樓每隔一刻鐘敲響威斯敏斯特鐘聲。無天體，僅路燈與鐘樓照明，路外是焦黑輕微放射性砂石，走遠即失蹤。每座鐘樓走時與相鄰者差一秒，時間各異。當你所進鐘樓時間與閃電戰鐘樓（焦黑、紅漆寫『一天對兩次』、指針每12小時被撥到隨機時間）一致時，會被睏在樓中13天、目睹一支數百萬亡靈組成、慶祝戰爭結束的恐怖遊行。起始是刻著『只希望我們的時間再多些』的二戰士兵跪像紀念碑。", "entrances": ["每座鐘樓底部都有活板門，其中約200扇已被打開並穩定通往其他層級，規律不明。"], "exits": ["透過鐘樓底部約200扇已開通的活板門離開，通往其他層級。"]}, "300": {"name": "生命之树", "class": "其他", "summary": "Level 300 是一棵參天巨樹，樹身向上延伸數千公里，直入高空，無數枝幹上棲息著形形色色的生物。該樹生物學名為 sequoiadendron gargantuem，被認為是後室中所有自然生成植物的生命之源。樹分為樹根、樹幹、下層枝幹、中層枝幹、上層枝幹和樹冠。根系環繞茂密灌木叢和沼澤，建有 M.E.G. 根基基地。下層枝幹有樹人（巨杉智人）和樹枝城。中層枝幹有樹液滲出區域。上層枝幹有苔蘚熊和藍覆盆子。樹頂傳說有永生之果。氣溫 15-35°C，濕度極高，降雨頻繁。", "entrances": ["在任何植被茂密的層級踏入茂密的灌木叢中，便會從 Level 300 的相同灌木叢中走出。", "在其他層級溺水時，有些人會從根系間的水窪中掙扎爬出。"], "exits": ["離開方式與進入時相同——找到與各自層級特徵相符的有機物質團，即可離開。"]}, "302": {"name": "虚缈蔚观", "class": "终结", "summary": "Level 302 是一片廣袤的針葉林，被高山環繞，海拔一致，溫度約 11°C，火山作用可導致溫度在 6°C 至 21°C 間波動。層級內遍布溫泉湖泊，水溫恆定 38°C，間歇泉噴發時將硫化物和甲醛釋入空氣。層級內有 13 種受保護實體（PE1-PE13），包括守衛者、鳳凰、鴨典娜、華爾茲和送禮人。由探險者總署管理，96% 被劃為禁止進入區域。曾在第二次器靈-人類戰爭中被摧毀，後恢復為自然保護區。", "entrances": ["沿 Level 8 的鍋穴向下走過 2 公里洞穴，在岔路口走明亮的路。", "在 Level 40 遊玩一台畫著泥濘小道和湖泊山地的無名街機。", "在 level-75 進入一條陡峭的一米寬洞穴。", "在 Level 165 進入石頭花棚有 1/3000 機率抵達。", "在 Level 222 通過自動門離開。", "在 Level 466 進入水下洞穴，抵達最大湖泊的中心。"], "exits": ["在入口處攀入同一座隧道返回 Level 8。", "爬上層級的山頂抵達 Level 93。", "進入電梯狀金屬雙開門進入 Level 998。"]}, "303": {"name": "浮梦浪卷", "class": "habitable", "summary": "Level 303 是一片被認為延伸向無限的寬廣水域，形似海洋。水呈現一種保留了大部分液相性質的固態，使得在水上行走成為可能，固相表現與沉積岩最為接近。層級內唯有永恆日光，時間接近傍晚，天空被低垂浮雲籠罩。水溫 22°C，潛水超過 4 米會被傳送到名為水下綠洲的區域，帶來寧靜之感。", "entrances": [], "exits": []}, "304": {"name": "面包店", "class": "变化", "summary": "Level 304 是一個有限的麵包店建築群，已有 30 家被探索。分為宜居麵包店和超自然麵包店。宜居麵包店裝飾繽紛，供應安全烘焙品，設有杏仁水冰箱。超自然麵包店更大更黑暗，潛伏笑魘、死亡飛蛾和店主，糕點有超自然效果，食用後可能被傳送到其他層級。層級安全性變化，取決於所在區域。", "entrances": [], "exits": []}, "305": {"name": "堕入黑暗", "class": 5, "summary": "Level 305 是一片無晝夜循環的永暗森林，齊腰高濃霧遮擋視野，僅能看到潦草搭建的空蕩棚屋。氣溫 -12°C 至 5°C。層級內存在笑魘和竊皮者，利用黑暗與濃霧伏擊流浪者。樹木枯朽，黑色藤蔓掛在枝上，靠近時會震動警告，最終爆炸。有一條流淌不明物質的河流，掉入者會在四分鐘內褪色溶解。水壺無法攝像。", "entrances": ["在 Level 6 內徘徊直到從地面切出。", "從 Level 1、Level 9 或 Level 11 內的一棵死樹切出。"], "exits": ["在棚屋中找到烤箱並從中切入 Level 304。", "在層級中切入一棵樹會抵達 Level 1 或 Level 11。"]}, "306": {"name": "山间小木屋", "class": 0, "summary": "Level 306 位於一座約 15 平方米的小木屋內，建築風格類似阿爾卑斯山冬季小屋。室溫恆溫 21°C，有壁爐燃燒、熱巧克力和羊毛毛毯。流浪者進入後偏執感消失，負面情緒淡化，做溫和愉快的夢。屋內有書架、舊書籍和浴室。一隻戴紅色項圈的黑貓會來訪。打開門需要流浪者覺得休息好了為前提。", "entrances": ["在過著艱難生活時入睡，若夢到雪林裡的小木屋就會切入此層級。"], "exits": ["覺得休息夠了時打開小木屋的門，會回到進入前的層級。", "觸碰書架中 Blanche 的簽名會切入 Level 906。"]}, "307": {"name": "蛇怪巢室", "class": 4, "summary": "Level 307 是一條長達 6 公里的爬行動物與兩棲動物展示長廊，地面遍布污濁水窪。入口變成上鎖門，出口為掛防撞鏈的門洞。生態缸內有各種蜥蜴、樹蛙、箭毒蛙、蛇類和烏龜。終點展廳有熱帶鳥類和一扇暗門，門內封存著名為蛇怪的實體——類似科莫多龍的腐爛爬行動物，體長 4.3 米，速度永遠比流浪者快一點，能摧毀遭遇者心智，造成不可逆的精神創傷。", "entrances": ["通過 Level 70 或 Level 2 中垂掛塑料防撞鏈的門洞進入。", "進入 Level 81 建築大廳的洗手間。", "進入 Level 162 的黑色門有機率抵達。"], "exits": ["沿進入路徑原路返回，回到初始進入的層級。"]}, "308": {"name": "生命之力", "class": "unknown", "summary": "Level 308 包含一片荒漠和中心綠洲。現已從原來的 5E 級危險荒漠轉變為有植被的宜居綠洲。綠洲有豐富植被，可從植物莖部取水。荒漠地面溫度 65°C，地下深處有河流。M.E.G. 設有前哨「綠洲守衛」。層級曾經是一片水分極度稀缺的危險沙漠，因某包種子的發芽而逐漸改善。", "entrances": ["在 Level 46 內進入一座牆上生長著植被的廢墟。"], "exits": []}, "311": {"name": "黄室", "class": "pending", "summary": "Level 311 在外觀與性質上都與 Level 0 一致，差異在於：一切都無法察覺地更黃；有一個大得可笑的紅色字樣標誌寫著「Level 311」；拍攝的照片會變成 Level 0 原圖的副本但略微更黃。約 30% 的牆面略微更黃，觸摸會意外切入。切出極端困難，需以 10mph 準確衝向標誌。版主 Koala 最初否認此層級存在，後親身被困後才認可。", "entrances": ["觸摸 Level 0 牆紙上近乎無法察覺的更黃部分。"], "exits": ["準確地以 10mph（16.09km/h）的速度衝向巨型標誌會送至 Level 1，幾乎沒有容錯空間。"]}, "313": {"name": "幻境温室", "class": 3, "summary": "Level 313 完全由互相聯通的線性走廊組成，建築風格類似溫室，漂浮在朦朧空中。內有椅子、桌子和花盆，LED 燈線偶爾可見。地面為石質通道，不穩易絆倒。玻璃牆不可破壞。不應食用層級內植被，含致命毒素會導致肺部停止運作。天氣全年 15-20°C，每小時降雨一次。存在「幻境」心理現象，凝視玻璃牆會看到花草繁茂的幻覺。唯一實體是溫室葉鬚蟲，受傷後會變為攻擊狀態並增大數倍。", "entrances": ["在 Level 0 內遇到玻璃材質的門並進入。", "進入 Level 26 中標著「溫室」的門。", "Level 134 內可能憑空出現一座橋通向此層。", "在 Level 159 中找到溫室風格建築並進入。", "在 level-172 的摩天樓內或有大量玻璃/窗戶的地方切出。", "在 level-180 的水中游出一段不確定距離。", "在 level-800 中過寬的走廊過渡成溫室風格時繼續前進。"], "exits": ["可能在未知情況下進入誘發性恐懼（不總是有效）。", "突然喪失意識可能意味著進入 Level 474 或 level-911。"]}, "317": {"name": "霓虹沙壶球", "class": "其他", "summary": "Level 317 是一個怪異的實驗室設施，家具和建築物以黑色為主色，外框為亮藍色霓虹燈。分為控制室和大廳。控制室有 D-pad 操作「霓虹沙壺球」遊戲，需完成 10 個教程關卡。大廳像自助餐廳，有各種湯、三明治和薯片，自動售貨機可出售任何能想像的液體。有電視牆和觸摸屏亭，居民自稱「沙壺球隊」。完成關卡可獲得道具獎勵，包括杏仁水和該層獨有史詩級物品。", "entrances": [], "exits": []}, "324": {"name": "紫屋", "class": "其他", "summary": "Level 324 以夢境日記形式呈現，描述流浪者反覆做的紫色夢境。起初是紫色房間桌子另一端有個人，後來發展為古老宅邸，裡住著一位白髮老太太「外婆」，穿紫色連衣裙。夢境逐漸變化，最後一次夢見空無一人的宅邸，樓上房間有搖椅和哭泣聲，外婆出現說「你該走了」。最終夢境結束於紫色田野中的墳墓和緩慢降落的棺材。", "entrances": [], "exits": []}, "345": {"name": "阈限森林", "class": 1, "summary": "Level 345 也稱「懷舊公園」與「享樂地」，是後室中位於人類意識閾限之上的主題公園。公園位於永夜霧林中，以記憶為貨幣購買門票消費。設施包括 T-10 廁所飛車、天際過山車、黑暗遊樂屋、記憶廳室等。食物有棉花糖、披薩、熱狗等。工作人員形象由訪客記憶組成。氣氛詭異，流浪者有時感到孤獨和被監視。", "entrances": ["在聽到嘉年華音樂時觸摸 Level 365 的一面扭曲哈哈鏡。", "看到任何有關嘉年華或遊樂園的照片、圖畫甚至交流都可能導致切出。", "猶豫和絕望的情緒會幫助它們找到你，並將你傳送到此層級。"], "exits": ["在「猜·體·重·」遊戲中獲勝會贏得前往前廳的出口。", "被飛天鯊魚群吞噬會將你送到隨機層級。", "在遊戲中作弊或在遊樂場破壞會被傳送到 Level 148。", "和一位友好的工作人員示意，他會帶你切出到一個安全的層級。"]}, "350": {"name": "零日", "class": 1, "summary": "Level 350 是一處寬廣的異常空間，主要由一片可怖草甸構成，層級效應會降低所有帶色彩之物的飽和度。一切活物被人工製品取代，有感知的仿蟲機器存在。造型怪異的大橋隨處可見。有時有猛烈暴風雪，積雪可深達 15 米。房屋由全黑不導熱的塑料狀材料建成，內部有日曆標註「零日」。水體黏稠渾濁，氣泡炸裂時氣溫飆升至 148°C。存在「時之區塊」導致時間膨脹。", "entrances": ["進入方式幾乎每天都在變化，唯一較穩定的標誌是流浪者周圍開始逐漸失去顏色。"], "exits": ["在鈦製大橋上行走會被傳送至 {機密資訊}（2023年）。", "觸摸放射性物質會送至 Level 174（2024年）。", "從地面拉動鎖鏈會揭開通往 level-95 的洞（2025年）。", "朝某方向固定行走十公里會墜入 level-61（2029年）。", "發現電腦並啟動會來到 Level 4（2032年）。", "在極度黑暗處入睡會在 Level 133 醒來（2058年）。", "向地面切出可到達未來（2100年）。", "覆沒於流沙中會橫屍於 Level 440（2345年）。", "注視太陽後回頭有微小機率傳送至巨植群落（2571年）。", "從一數到十會使學校出現，進入其中到 Level 117（4096年）。"]}, "352": {"name": "所言即咎 (bHZsMzUy)", "class": "其他", "summary": "Level 352 是一系列隨機生成的儲藏間，由走廊和兩邊編號的儲存間組成，無定向標識。最大危險是其侵入性質：當任何人說出或記錄該層級編號時，周圍 91 米半徑區域會被此層級取代。使用拉丁字母均觸發，但 64 進制、16 進制、摩斯密碼等不會。原生實體為肢團，藏在箱子下。當侵入其他層級時，原層級的流浪者和實體都會被轉入此層。", "entrances": ["說出層級名稱（使用拉丁字母）即可進入，通常面向三向或四向交叉路口。"], "exits": ["爬進一個 38×29 厘米的通風口會到 Level 96，但可能被通風口攔網阻擋。"]}, "356": {"name": "启程门厅", "class": 1, "summary": "Level 356 由數千條不同走廊組成，外形隨機改變，已發現 4 種變體：啟程門廳、扭曲作伴、切出？對、出口門廳。啟程門廳右牆有板貼寫著印尼語訊息。扭曲作伴是高天花板走廊，末端門通往終點。切出？對是空走廊，有通往杰瑞門室的便簽。出口門廳有雙開門通往隨機層級。未發現實體，偶有笑魘報告。", "entrances": ["在 Level 21 中經 105 號門至 356 號門後到達。"], "exits": ["尋找出口門廳進入雙開門，會自動傳送至某個隨機層級。"]}, "365": {"name": "你最大的敌人", "class": 3, "summary": "Level 365 是一個由走廊組成的迷宮，兩邊牆上裝滿鏡子。鏡子分為普通鏡和「夜鏡」（黑暗不透明）。層級內有大量悲屍和稀少的恐懼蜈蚣，以及特有實體「盲知」——以負面情緒為食的鏡中智能，會釋放精神附著植入物，放大負面情緒。電梯是唯一避難所，內有杏仁水和補給。盲知與恐懼蜈蚣已形成互惠關係。M.E.G.「鏡子」小隊在此駐紮。", "entrances": ["在後室中於正確時間觸摸任意鏡子可能切入，時間隨機。", "從 Level 148 內一面高大銅鏡處切入。", "從前廳直接切入（安妮·鄧恩的特例）。", "Level 208 中的某些電梯門會帶你來到這裡。"], "exits": ["觸摸層級中的鏡子可能切入 Level 1，鏡子隨機。", "從高大銅鏡處切出到 Level 148。", "穿過液態而非固態的鏡子會被傳送到 Level 725。", "聽到嘉年華音樂時觸摸扭曲哈哈鏡切入 Level 345。"]}, "368": {"name": "繁缛", "class": 3, "summary": "Level 368 由不斷燃燒的無限大木製房間組成，地板布滿木屑和火焰。火焰不會傷害人員，穿越時感覺平滑受撫慰，不產生煙霧和氧氣消耗。但攜帶的物品會被焚毀。層級內無實體，人員間無法相遇。進入者常感到自身變得更好，對物質的慾望消失，描述為「不必要的慾望被燒掉了」。", "entrances": ["在 level-42 被熔岩火山彈擊中。", "在 Level 48 找到一個奇怪的直立門並打開。", "Level 146 的一個帶溫暖金屬把手的門。"], "exits": ["進入任何似乎開放或室外的區域到 Level 73。", "使用任何樓梯切出至 Level 92。", "沐浴在少見的紅色聚光燈下最終到 Level 940。"]}, "369": {"name": "疏朗", "class": "宜居", "summary": "Level 369 是一座永恆美麗的繁盛之園，被高牆環繞。房間形狀各異，地面覆蓋芬芳小草，有灌木、花朵、鮮果和蔬菜。永恆宜人的光線穿梭於房間，危險植物不會傷人。平靜溫和的微風不斷吹拂，空氣對人類無害。唯一生物是繁茂的植物群。適合永久居住，但需做好與其他人类隔絕的心理準備。", "entrances": ["在 Level 32 中從骷髏女王處逃跑可能切入至此。", "在 Level 65 的山峰上掉下可能掉入。", "爬上 Level 234 樹頂繫著的繩子會無縫切入。"], "exits": ["穿過看起來像窗簾的牆壁進入 Level 165。", "走入漆黑的死胡同會進入 Level 194、Level 260 或 Level 302。", "葡萄藤和花朵組成的巨大拱門通向 Level 414。"]}, "370": {"name": "池房", "class": "1e", "summary": "Level 370 是一個有限的室內場景，由大小各異的房間組成，每間包含一張台球桌。房間漆為溫暖色調，覆蓋地毯。走廊連接房間，儲存單元中有嶄新球具。每張台球桌在公平獲勝時會產生物質獎勵。曾有豐富的比賽文化，各大組織定期舉辦錦標賽，近年賽事轉移至其他層級，偶有維修人員前來保養。", "entrances": [], "exits": []}, "371": {"name": "黯然", "class": 0, "summary": "Level 371 由寬闊形狀複雜的空辦公室組成，地板上散布巨大孔洞通向充滿雲朵的藍天。房間為白色、藍灰色與黃灰色混合，無家具。孔洞下方是無邊際的天空，有適合呼吸的大氣。掉入孔洞者會在幾分鐘後被傳送回安全距離外。層級內無食物和水，無法與其他人相遇。傳言有人發現了食物和水的儲存點。", "entrances": ["跨過 Level 54 的欄杆並在中心跌落足夠久。", "在 Level 63 內切入任何由地毯製成的橋。", "在 level-198 墜落足夠久。"], "exits": ["沿牆壁踢腳線進入空氣管道到 Level 96。", "任何向上的樓梯到 Level 280。", "在孔洞中找到草島橋樑可進入 Level 149 或 Level 756。"]}, "372": {"name": "昏睡", "class": 1, "summary": "Level 372 中心區域會隨機發生「重組事件」，外觀從平凡風格變為未來主義或夢幻環境。已識別 372.1-372.4 四個房間：三居室小屋、教學樓、四口之家的房子、無限森林。中心外圍是白色沙漠和黑色星空天穹。有一個名為「孩童」的實體，類似棕色短髮小男孩，無先前記憶。重組事件時流浪者會暈厥。", "entrances": ["通過 Level 60 的一個門或 Level 72 中的一個站台進入。"], "exits": ["走進外圍部分時視線漸漸變成慘淡白色，隨後出現在 level-124。"]}, "373": {"name": "雾河", "class": 1, "summary": "Level 373 有一條灰藍色河流，河岸長滿褪色綠藻，河水深不見底。藻類有趨熱性，附著在生物表面使物體上浮。森林由巨型石灰岩和枯樹構成，是受眷鳥的築巢地。有一種名為「光莓灌木」的植物，果實切開後熒光綠色，食用過量會使靜脈發光。實體包括受眷鳥和自稱 Bill Jurde 的無面靈「擺渡人」，後者以有價物品作船資。M.E.G. 和 B.N.T.G. 曾在此設立臨時基地，後因衝突疏遠。", "entrances": ["吞服一捧在 Level 46、Level 169 或 Level 19 米色抽屜中找到的奇異綠色沙堆。", "在 Level 48 中切入一塊浮木（未經證實）。"], "exits": ["切入一棵罕見的烏黑色樹木到 Level 39。", "從擺渡人的渡船縱身躍入水中到 Level 230 的碼頭。", "走進森林深處的一間茅房到 Level 118。"]}, "375": {"name": "马铃薯田", "class": "habitable", "summary": "Level 375 是一片無盡而美幻的陸地，有明亮藍天、散布的樹木和營養豐富的馬鈴薯田。土壤適合種植洋蔥、大蒜、薑、蕪菁和蘿蔔。氣氛平和寧靜，能治愈心靈創傷。一家人（傑斯及其家人）在此居住，從發電站逃離肢團時通過一扇綠葉門進入。歡迎流浪者加入，開放貿易。", "entrances": ["在發電站內找到一扇用交疊綠葉製成、泥土和馬鈴薯作門框的門。"], "exits": ["從同一扇門離開會帶回發電站。"]}, "381": {"name": "舒适地窖", "class": "habitable", "summary": "Level 381 曾是一個地牢，被打掃乾淨後改造成三間公寓（A、B、C 公寓）。有火鹽壁爐取暖、地毯、堆肥式廁所。牆上貼滿海報遮擋「髒東西」。A 公寓最小最溫暖，B 公寓最大，C 公寓中等但寒冷。每間可容納 1 人。以詭異的租房廣告風格呈現。", "entrances": ["在 Level 28 切入一扇上鎖的門。", "在 Level 5 切入懸掛的一幅新畫。"], "exits": ["切入公寓入口走廊盡頭的門到達 Level 5。"]}, "386": {"name": "小巷", "class": 4, "summary": "Level 386 是一條夜晚的石階小巷，由石牆和路燈構成。層級危險性較高。", "entrances": [], "exits": []}, "387": {"name": "迷雾圈地", "class": 0, "summary": "Level 387 是一個小型晦暗層級，包含一幢 18 層混凝土公寓樓、一條短馬路和一片陰鬱森林，可通行區域僅 30000 平方米。永久停滯於清晨，氣溫 6°C。邊界由濃霧牆構成，進入者會消失。公寓樓有約 200 間套房，有暖氣、杏仁水和營養食物。社區「霧境斥候」約 500 人，實行等級制度：主理人、精英理事會、戍衛部隊和凡眾。實體絕跡。", "entrances": [], "exits": []}, "388": {"name": "丰收计划", "class": "受限", "summary": "Level 388 是一片極度昏暗的紅色森林，只有日本楓樹和紅楓樹，土壤含高濃度重鉻酸鉀和氯化鋁。晝夜溫差極大（35°C 至 -15°C）。唯一實體是 Species-388（腥紅流浪者），類人但皮膚鮮紅、無毛無耳、失聰，處於狩獵採集文明階段。其血液「暗紅混成劑」有 5 倍癒合效果，B.N.T.G. 獨占經營，每升售價 78 升杏仁水。B.N.T.G. 設有研究中心和居民區，遭到 Species-388 總理 Kattafa 的反抗威脅。", "entrances": ["深入 Level 39 的森林，觸摸一株暗紅色的樹。由 B.N.T.G. 派重兵把守。"], "exits": ["在森林中行走过遠會來到 Level 9.3 或 Level 309。", "找到帶門的白色長方體並進入會傳送至 Level 4。"]}, "389": {"name": "游戏大厅", "class": 2, "summary": "Level 389 處於 Entity 99（遊戲大師）的完全控制中。中心區域「儲藏室」像大劇院後台，有棋盤格地板和工業貨架，擺滿各類遊戲道具。旁邊有浴室（浴缸有鱷魚）和廚房。中間牆上有六扇上鎖的門，各有不同符號標記。流浪者通過找到遊戲大師海報或棋盤格木門進入，戰勝遊戲大師或獲得豁免權才能離開。", "entrances": ["在多個層級找到棋盤般的木門。", "找到一張畫著遊戲大師、宣傳「遊戲之夜」的海報並與之交互。"], "exits": ["在任意一場遊戲中戰勝遊戲大師會被送回原先所處層級。", "從遊戲大師手中取得豁免資格（通常只給兒童）可無需參與遊戲離開。"]}, "395": {"name": "Level C-395", "class": "死区", "summary": "Level C-395 是一層老式宿舍樓，大部分房間僅有一張破舊的床。有一間約 20 平方米的粉色裝修房間，內有塌掉的床、床頭櫃、衣櫃、書桌，牆紙有破損。落地窗外僅能看到血紅色。存在成噸的笑魘。文章以第一人稱詭異語氣寫成，似是某人對離去朋友的留戀。", "entrances": ["在 Level C-13 找到一張非常不自然的床，在上面睡著即可到達。"], "exits": ["躲在黃色的床底下閉上眼睛屏住呼吸 30 秒可到達 Level 6。"]}, "399": {"name": "安全通道", "class": 1, "summary": "Level 399 是一個 16 座客車的內部空間，有空調，每個座位背面有一瓶杏仁水。發動機低沉運轉，車身輕微震動。窗外是高速公路，有車輛和亮燈建築，但看不到任何實體。司機 Richard 是唯一實體，友好無敵意。流浪者從座位上醒來感到舒適平靜，建議放鬆休息。在車上再次入睡即可離開。", "entrances": ["當流浪者單獨行動且在層級間長距離旅行時，通過睡眠方式進入。"], "exits": ["在層級中再次進入睡眠就會在目的地醒來。", "從客車車門切出可到達 Level 50、Level 69 和 Level 80（非常不推薦）。"]}, "400": {"name": "大脑已1是软0件", "class": "amended", "summary": "Level 400是一個與數位、軟體相關的奇異層級，呈現出類似電腦程式與資料系統的環境特徵。層級名稱本身即為一個數位編碼風格的命名，暗示該層級與資訊系統、程式運行有關。環境中可見類似伺服器機房、數據流動的景象，流浪者在此會經歷與記憶、認知相關的異常現象。", "entrances": ["透過在特定數位相關層級中與電子設備互動可進入"], "exits": ["透過特定的程式化操作或數位介面可離開此層級"]}, "401": {"name": "选择", "class": "unknown", "summary": "Level 401是一個以敘事方式呈現的層級，描述流浪者在此面臨各種選擇與抉擇的情境。頁面以日記/故事形式展開，記錄了流浪者在不同場景中做出選擇的經歷，每個選擇都會導致不同的結果。層級的環境隨選擇而變化，具有高度的互動性與不確定性。", "entrances": [], "exits": []}, "402": {"name": "塑料之城", "class": 2, "summary": "Level 402是一座由塑膠材料構成的城市，建築物、街道和物品皆以各種塑膠製品組成。環境中充斥著廉價塑膠製品的氣味，陽光照射下塑膠表面反射出怪異的光芒。層級中有少量實體出沒，主要以塑膠製品的形態偽裝。流浪者需注意塑膠燃燒或融化產生的有害氣體。", "entrances": ["從Level 11中特定的塑膠製品店鋪切入可到達"], "exits": ["穿過城市中特定顏色的塑膠門可返回其他層級"]}, "404": {"name": "我深深破碎的你", "class": 0, "summary": "Level 404是一個看似安全但充滿情感氛圍的層級，呈現出一種空寂而憂傷的環境。層級名稱暗示與失落、記憶和破碎關係有關。環境溫和，沒有實體威脅，但流浪者可能會經歷強烈的情感波動。層級結構類似一個被遺棄的住宅空間，充滿了個人物品的痕跡。", "entrances": ["在特定層級中因情感波動或失落感強烈時可能意外進入"], "exits": ["找到層級中隱藏的門窗可離開"]}, "405": {"name": "绝望、恐惧与荒凉浪潮之", "class": "其他", "summary": "Level 405是一個充滿壓抑氛圍的層級，以海浪、荒漠和荒蕪景觀為主。層級名稱極長，反映了其令人絕望的環境特徵。海浪不斷拍打著荒涼的海岸，空氣中瀰漫著鹹澀與絕望的氣息。流浪者在此會感受到強烈的無力感和孤獨感。", "entrances": [], "exits": []}, "407": {"name": "迷失灵魂栖息在死寂草地", "class": "其他", "summary": "Level 407是一片死寂的草地平原，雜草叢生但毫無生氣。層級名稱暗示這是迷失靈魂的棲息之地。環境陰沉，天空永遠是灰色的，沒有任何聲音。流浪者在此會感到一種深沉的平靜，但也伴隨著與世隔絕的孤寂。草地上偶爾可見古老的遺跡或石碑。", "entrances": [], "exits": []}, "408": {"name": "问讯间", "class": "其他", "summary": "Level 408是一個以幽默諷刺風格呈現的層級，描述流浪者被帶入一個類似警察局問訊室的場景接受審問。頁面以對話形式展開，充滿荒誕的問答。環境是一間陰暗的房間，有桌子、椅子和一盞強光檯燈。層級沒有實體威脅，但整體氣氛詭異而滑稽。", "entrances": [], "exits": []}, "409": {"name": "纸屋", "class": 1, "summary": "Level 409是一個完全由紙張構成的房屋空間，牆壁、地板、家具皆為各種紙質材料。環境安全，但需注意火源——任何火焰都可能導致整個層級燃燒。紙張上印有各種文字、圖案和書寫內容，流浪者可以在此找到書寫工具和紙張作為資源。", "entrances": ["在圖書館或閱讀相關層級中與紙張互動可能進入"], "exits": ["穿過特定的紙門可離開"]}, "410": {"name": "一座平平无奇的庄园", "class": "其他", "summary": "Level 410是一座看似普通的莊園宅邸，外觀與傳統歐式莊園別無二致。名稱中的「平平無奇」是一種反諷——莊園內部實際上充滿了各種奇異的現象和空間錯位。宅邸內佈滿了古老的家具、畫作和裝飾，流浪者在此探索時會發現房間之間的空間邏輯並不一致。", "entrances": [], "exits": []}, "412": {"name": "掠鹫野", "class": "deadzone", "summary": "Level 412是一片開闊的荒野，被大型猛禽（禿鷲）所盤踞。環境乾燥荒涼，幾乎沒有水源和遮蔽。生存難度標記為死區，意味著在此長期待留極度危險。禿鷹群會攻擊流浪漢，將其視為食物。層級中偶爾可見動物屍骸和骨骸。", "entrances": [], "exits": []}, "414": {"name": "永恒花园", "class": "宜居", "summary": "Level 414是一片永恆盛開的花園，四季如春，花朵永不凋零。生存難度標記為宜居，是後室中少數安全舒適的層級之一。花園中佈滿了各種花卉、噴泉和長椅，空氣中彌漫著花香。流浪者可以在此安心休息、收集植物資源。花園中沒有實體威脅。", "entrances": [], "exits": []}, "420": {"name": "冰湖", "class": "5e", "summary": "Level 420是一個被冰雪覆蓋的巨大湖泊，水面完全結冰。環境極度寒冷，風雪不斷，能見度極低。生存難度5e代表環境危害級別——低溫和暴風雪是主要威脅。冰面下隱藏著未知的危險，偶爾可聽到冰層斷裂的聲音。流浪者需要充足的保暖裝備才能生存。", "entrances": ["從寒冷相關的層級中繼續前行可能到達"], "exits": ["穿越冰湖到達對岸可到達Level 790", "找到冰層下的通道可到達Level 9", "進入巨植群落區域", "到達Level 75", "到達Level 515"]}, "421": {"name": "塑料马里亚纳", "class": "unknown", "summary": "Level 421是一個深淵般的塑膠垃圾場，類似馬里亞納海溝的深度但由塑膠廢棄物構成。層級向下無盡延伸，充斥著各種形狀和大小的塑膠製品。環境壓抑而幽暗，流浪者需要極好的裝備才能在此探索。層級的確切性質和危險程度尚未完全確定。", "entrances": ["從塑膠相關層級中深處潛行可進入"], "exits": ["向上攀爬或找到特定通道可返回其他層級"]}, "422": {"name": "慌不择陆", "class": 2, "summary": "Level 422是一片混亂的陸地景觀，地形不斷變化，流浪者難以找到穩定的路線。環境中包含沙漠、叢林、山地等多種地貌的隨機組合。生存難度2表示有一定風險但尚可生存。流浪者需要保持警覺，隨時準備應對地形的突然變化。", "entrances": ["在地貌變化頻繁的層級中迷失方向可能進入"], "exits": ["找到穩定的路標或通道可離開"]}, "423": {"name": "加油站", "class": "unknown", "summary": "Level 423是一座孤立的加油站，位於無盡的公路旁。加油站提供燃料、零食和飲料等物資，價格離譜但可供流浪者補給。環境看似普通，但周圍的公路永無止盡，看不到盡頭。加油站的營業狀態時好時壞，有時店員會出現，有時則空無一人。", "entrances": ["在公路相關層級中看到加油站標誌時進入"], "exits": ["沿公路行駛可到達其他層級"]}, "427": {"name": "木室", "class": "5e", "summary": "Level 427是一個由木材構成的封閉空間，類似巨大的木質迷宮。生存難度5e表示極度危險，環境危害包括木材腐敗產生的有毒氣體、木質結構坍塌的風險以及火源威脅。迷宮通道狹窄潮濕，流浪者容易迷失方向。層級中隱藏著未知的實體。", "entrances": ["在木質結構相關層級中找到特定入口"], "exits": ["找到迷宮出口可離開"]}, "429": {"name": "众目睽睽", "class": "其他", "summary": "Level 429是一個以詩歌形式呈現的層級，描述流浪者被無數目光注視的感受。環境中充斥著視線的壓力，儘管看不到任何觀察者。頁面以詩歌和散文結合的方式書寫，營造出一種被窺視、被評判的不安氛圍。層級的具體物理特徵難以描述。", "entrances": [], "exits": []}, "432": {"name": "循环地下室", "class": 4, "summary": "Level 432是一個無限循環的地下室空間，走廊和房間不斷重複，流浪者永遠無法找到出口。生存難度4表示危險——層級中存在敵對實體，且空間的非歐幾里得特性讓人難以逃脫。地下室燈光昏暗，牆壁潮濕，瀰漫著黴味。流浪者需要找到打破循環的方法才能離開。", "entrances": ["從地下室或地下設施相關層級中繼續深入"], "exits": ["找到打破循環的異常節點可離開"]}, "436": {"name": "打捞海岸线", "class": "habitable", "summary": "Level 436是一條適宜居住的海岸線，流浪者可以在此打撈資源、建立營地。環境溫和，氣候宜人，海灘上可以找到各種漂流物和補給品。生存難度標記為宜居，是少數適合長期待留的層級之一。海岸線綿延不斷，偶爾可見船隻殘骸。", "entrances": ["在海岸或海洋相關層級中登上岸邊"], "exits": ["沿海岸線前行或乘船可到達其他層級"]}, "440": {"name": "沸腾沙海", "class": "5e", "summary": "Level 440是一片沸騰的沙漠，沙溫極高，空氣扭曲。層級分為沙漠和森林兩個區域，過渡帶極為危險。生存難度5e表示環境危害致命——高溫可以在短時間內導致脫水和中暑。儘管存在森林綠洲，但到達那裡本身就是巨大的挑戰。", "entrances": ["在沙漠相關層級中繼續前行"], "exits": ["到達綠洲或找到特定通道可離開"]}, "442": {"name": "莫忘我", "class": "T-1", "summary": "Level 442是一個與記憶和遺忘相關的層級，生存難度使用特殊的T-1分類。環境中佈滿了勿忘花（Myosotis），象徵著記憶與思念。流浪者在此會經歷記憶的波動——有些記憶會被增強，有些則會消失。層級的確切機制尚不完全清楚，但與情感記憶密切相關。", "entrances": ["在與記憶相關的層級中與花卉互動可能進入"], "exits": ["找到特定的花卉叢或通道可離開"]}, "444": {"name": "不成型的一层", "class": 5, "summary": "Level 444是一個未完全成型的層級，環境不斷波動、難以預測。生存難度5代表極度危險——層級的不穩定性本身就是最大的威脅。物理法則在此不斷變化，空間結構隨機出現和消失。流浪者很難在這種環境中導航或生存。", "entrances": ["在現實扭曲的層級中極度不穩定時可能進入"], "exits": ["在層級穩定的短暫窗口中找到出口"]}, "445": {"name": "方兴未艾", "class": "unknown", "summary": "Level 445是一個充滿生機和發展潛力的層級，名稱意味著興旺發達、正方興未艾。環境呈現出建設中的景象——建築工地、未完工的結構、正在運行的機械。層級似乎在不斷演變和擴張，有著強烈的動態感。確切的生存難度尚未確定。", "entrances": ["在建設或施工相關層級中找到入口"], "exits": ["從建設區域的特定通道離開"]}, "448": {"name": "未知名称", "class": 0, "summary": "Level 448是一個生存難度0的安全層級，環境平靜無威脅。層級的具體名稱和詳細描述較為簡略，但可以確認其安全性。流浪者可以在此安心休息和補給。", "entrances": [], "exits": []}, "451": {"name": "Paradise 451", "class": 4, "summary": "Level 451名為「天堂451」，但名稱與實際體驗形成諷刺反差。生存難度4表示高危險——表面看似天堂般的環境，實則暗藏致命危險。層級中存在大量實體和環境威脅，流浪者需要極高的警覺性才能生存。", "entrances": ["在偽裝成天堂的層級中繼續深入"], "exits": ["識破偽裝後找到真實出口"]}, "456": {"name": "未知名称", "class": "4G", "summary": "Level 456使用特殊的4G生存難度分類，結合了等級4的危險性和G（環境危害）的特徵。層級的具體環境特徵涉及電磁波、訊號或數位干擾相關的危害。流浪者在此會經歷電子設備異常、感官干擾等現象。", "entrances": [], "exits": []}, "463": {"name": "砼墟", "class": "deadzone", "summary": "Level 463是一片混凝土廢墟，曾經的城市建築現已化為瓦礫。生存難度標記為死區——環境中幾乎沒有可利用的資源，空氣中塵土瀰漫。鋼筋混凝土結構隨處可見，偶爾可見坍塌的樓層。層級中幾乎沒有生命跡象。", "entrances": ["在廢墟或城市遺跡相關層級中找到入口"], "exits": ["穿過廢墟中的特定通道可離開"]}, "466": {"name": "火光渴望", "class": "unknown", "summary": "Level 466是一個與火焰、光明和渴望相關的層級。環境中充滿了跳動的火光，流浪者在此會感受到對光明和溫暖的強烈渴望。火焰既是資源也是威脅——它可以提供溫暖和安全感，但也可能失控造成災難。層級的確切危險等級尚未確定。", "entrances": ["在黑暗相關層級中被火焰吸引可能進入"], "exits": ["穿過火焰或找到火源背後的通道"]}, "469": {"name": "矢车菊田", "class": 0, "summary": "Level 469是一片開闊的矢車菊田，被一條道路分割成兩半。天氣晴朗溫暖，矢車菊成片盛開，對流浪者無害。層級呈環狀結構，沿道路或花田行走終將回到原點。路邊偶爾有停放的車輛，內含零食、飲水等補給品。沒有實體出沒，僅有其他流浪者作為居民。相對安全穩定，但長期待留可能導致時間感知紊亂。", "entrances": ["在穿過草地或行路時向下看可能進入", "從Level 10、Level 125、Level 237或Level 369進入"], "exits": ["穿過矢車菊田或道路離開", "可到達Level 10、Level 125、Level 237或Level 369"]}, "470": {"name": "与你在一起的回忆", "class": "宜居", "summary": "Level 470是一棟外觀因流浪者而異的房屋，通常呈現流浪者已故或失去聯繫的朋友的住所。房屋內物品應有盡有，每日自動補給。屋外是無盡的原野，有木柵欄阻止過遠探索。氣候溫和，季節固定為春天。同一時間僅有一名流浪者存在，但不會感到孤獨，反而感到滿足。沒有實體，適宜居住。", "entrances": ["在Level 11的室內中央進行切行", "在前廳中因失去至親而極度悲傷時可能進入"], "exits": ["穿過房屋內寫有「是時候回去了」的門可到達Level 11"]}, "471": {"name": "蛛网公路", "class": "unknown", "summary": "Level 471是一個龐大的公路網絡，如蛛網般多層疊加，永無終點。永恆濃霧籠罩，能見度極低。公路具有非歐幾里得特性，時間非線性流逝。偶爾有高速車輛從霧中出現又消失。路邊佈滿銹蝕的告示牌，上面有晦澀信息和無意義文字。停留過久會觸發「停電」事件——路燈熄滅，黑暗中傳來非人聲音。", "entrances": ["在Level 69駕車撞向混凝土牆導致切出", "在Level 4中進入門上有高速公路標誌的房間"], "exits": ["通過下水道井蓋到達Level 34", "破壞告示牌會被傳送到Level 9", "從高速公路掉落會到達Level 78"]}, "474": {"name": "474号国家公园", "class": "1?", "summary": "Level 474是一片被無限森林圍繞的積雪空地，中央有一個洞穴入口。白天9小時，黑夜15小時。空地上有公告板寫著「歡迎來到474號國家公園」，並提供緩慢的WiFi。森林中有可食用的漿果。洞穴內部漆黑，曾有探險隊失聯。目前有曙光Alpha基地（2人）駐紮。截至目前沒有已知出口。", "entrances": ["從Level 11切入（僅有一次記錄）"], "exits": ["截至撰寫時出口未知"]}, "479": {"name": "做完脑叶切除的我😂😂❗❗😂❗❗❗", "class": 5, "summary": "Level 479是一個神秘的邊界層級，荒蕪骯髒、昏暗潮濕，建築形似監獄或醫院。每年僅約18名流浪者意外進入。遭遇持續1-2小時，但離開後會遺留下不可逆的腦部創傷——包括感覺受損、語言能力下降、記憶喪失、腦萎縮等，嚴重者成為植物人。層級中有Entity 479-1（棕黑色寬大身形實體）。在Level 11設有長期護理中心救助倖存者。", "entrances": ["入口隨機出現，無法刻意進入"], "exits": ["經過一段不確定時間後隨機傳送回之前的層級"]}, "480": {"name": "不便利店", "class": 3, "summary": "Level 480是一組空曠的便利店，由狹長走廊連接。商店佈局整齊，貨架上有高品質的雜牌商品，但其中許多是誘殺陷阱——拿取後可能爆炸、灼燙、粘附或造成永久傷害。空間非歐幾里得。層級中有竊皮者、笑魘、瓷磚陷阱等敵對實體，以及獨有的「易形複製者」。「斷電期」時所有照明熄滅，更為危險。商品交易價值很高。", "entrances": ["在Level 122中找到較為骯髒的門", "在Level 423中也可能遇到同樣的門"], "exits": ["某些門和店鋪可返回Level 122", "走廊有時通向Level 2（管道噩夢）"]}, "486": {"name": "残暴集镇", "class": "罪恶", "summary": "Ground 486是一個極度致命的廢棄俄羅斯礦鎮，被污染森林包圍。市中心有嚴重損毀的核電站，輻射量極高，即使短暫暴露也會承受致命劑量。層級中有某種未知存在控制著此地，導致人員失蹤。阿爾戈斯之眼的成員被禁止進入。頁面以敘事方式講述了一個核電站保安在事故後與環境融合、成為某種存在的故事。", "entrances": ["在Ground 10的田地中停留很久可能被領入"], "exits": ["在森林中穿行足夠久可能被領入Ground 10"]}, "494": {"name": "镜湖高中", "class": "unknown", "summary": "Level 494包含一片白橡林、小湖和一座被遺忘的高中。森林環繞，繞圈行走終會回到原點。湖邊有現實扭曲效應，踏入學校後流浪者會變成曾在此就讀的學生。走出學校場地會被殺。沒有實體，沒有社區。層級充滿懷舊氣息，反覆呼籲流浪者「記住」過去的美好歲月。", "entrances": ["通往Level 494的門偶爾出現在Level 18"], "exits": ["在鏡湖之底可以找到離開的方法"]}, "495": {"name": "以币易目", "class": 1, "summary": "Level 495是一處灰色沙礫河岸，對面是寬闊深邃的河流。天色暗淡，遠處一片漆黑。河邊有擺渡人——使用長棍撐船，提著昏黃燈籠。他們以老者為主，但也可能是男孩或少女，眼睛灰色。渡河需要支付任何硬幣作為船費。人影從黑暗中走出，有的付錢渡河，有的沒有硬幣只能沿岸遠行。對岸情況無人知曉。", "entrances": ["從Level 75的通道進入", "從Level 135的裂縫進入", "從Level 494的湖底進入"], "exits": ["在黑暗處河岸另一邊可能遇到門洞，通向Level 372、Level 97、Level 28或Level 899"]}, "499": {"name": "森灵乐土", "class": 1, "summary": "Level 499是一個複雜的迷宮，森林、洞穴、叢林和土坯結構交雜融合。牆上長滿藤蔓植物。層級同時向水平和垂直方向延伸，部分區域違反重力——溪流向高處流動，池塘出現在牆壁和天花板上。唯一的光源是漂浮的橙色「幽靈之光」。宗教團體「神愛之繁生」居住於此。植物有獨特的生物特性——部分植物組織具有動物細胞特徵。", "entrances": ["在Level 4中某些走廊的牆壁和地板逐漸變成森林或隧道", "在Level 135中穿行時遇到地面的洞", "在Level 134的海洋中遇到地面的洞通向此層級的河流和池塘"], "exits": ["穿過某些森林可到達Level 62", "一些隧道通向Level 648的大沙漠", "森林天花板上的洞通向Level 39的地面", "紅棕色泥磚走廊中的門通向Level 499.1"]}, "500": {"name": "副载波", "class": 0, "summary": "Level 500 是一系列房間和走廊，外觀與美國海軍提康德羅加級巡洋艦的中上層甲板相似，儘管時空尺度遠超理論船隻尺寸。大部分可利用空間被各類通訊和接收設備佔據，包括軍用無線電收發機、雷達系統、固定電話等。所有能發射信號的設備在失去電力前都不斷發出異常信號，主要為摩斯密碼或預錄多語言合成語音的求救信號，偶爾可聽到人類慘叫和哭泣。信號干擾使與外界交流成為不可能，所有導航設備也無法運作。上層甲板窗戶可看到連綿海面和晴朗天空，始終如一，無晝夜循環或氣候變化。此層級不存在任何生命體。", "entrances": ["可經由任何一層的門框方向精確地朝向地磁南極的門進入；由於後室內GPS多已不可靠，定位此類入口非常困難"], "exits": ["可經由走廊牆壁上任何一扇未上鎖的門（前提是它能夠作為入口）離開；多數出口通向其作為入口時聯通的層級，但不一定是完全一致的位置"]}, "501": {"name": "视力受损", "class": "deadzone", "summary": "Level 501 是一片生態死區，孤寂的沙丘內唯有窒息感伴隨穿行者左右。沙塵在貧瘠土地上堆積成峰，縱使天穹中已沒有烈日翻滾，依舊溫暖和煦。層級寬廣到難以量化，穿行千百里也難遇變數，偶爾可見零散巨石。狂風吹響的號角是旅行者唯一伴侶，細小沙礫組成的熱浪無孔不入，無論面朝何方都只感到扑面灼熱。無眼部防護者幾乎與失明無異，即使裝備充足，能見度仍極為狹窄。建議攜帶大量輕裝、頭盔、緊身靴子及眼部防具；食物飲水毫無必要，臨時棲處毫無意義。", "entrances": ["從「阿拉伯沙漠」中淹沒在異常流沙之中，傾聽風沙中難得的狂熱，最終會身陷 Level 501"], "exits": ["在 Level 501 中風沙漸緩之地，讓沙塵包裹全身，便能回到來時之處"]}, "502": {"name": "灵魂服务器", "class": 2, "summary": "Level 502 是一個無限且封閉的服務器機房，服務器不斷運轉且摸起來過熱，排列成一座迷宮。不定期發生「熱浪」事件——服務器突然毫無提示地加熱至約40攝氏度，持續2-4小時，常導致流浪者中暑或熱昏厥。在此層級喪失意識的流浪者會立即消失，屍體數秒後在附近出現，面部所有孔洞裂為圓形孔，連接服務器終端的線纜直接穿過面部孔洞連接頭部，天花板鋼絲將手腕吊起使其懸空，處於功能性腦死亡狀態。層級中有一個名為「方尖碑」的大型啞光黑色矩形稜鏡，特有實體「情報」（人形機器人，穿藍色西裝）居住於此。", "entrances": ["Level 120 中任何處於工作中的服務器都可以切出至此層級", "進入 Level 172 中一個標注了「數據中心」的倉庫會來到此層級"], "exits": ["嘗試訪問服務器有小概率進入 Level 195", "掉入方尖碑周圍的洞會進入 Level 400"]}, "503": {"name": "群袭（!!此页面不存在!!）", "class": "其他", "summary": "此頁面偽裝為「此頁面不存在」的錯誤頁，實為反M.E.G.組織「群襲」的宣傳頁面。層級呈現為空置、棄用的殘餘被刪除層級，被描述為說話者的「家」。頁面充滿對M.E.G.的控訴，宣稱M.E.G.掩蓋真實本質、壓迫和監審所有不認可他們的人。流浪者被邀請加入群襲，一旦加入便無法回頭。頁面末尾出現「數據損壞」字樣，警告M.E.G.正在封鎖此頁面。", "entrances": ["向群襲展示忠誠，證明自己後，層級的入口將會顯現"], "exits": ["一旦加入，就回不了頭了；無論是朋友還是敵人，都沒法離開群襲"]}, "505": {"name": "憎恶机器", "class": 3, "summary": "Level 505 是一片廣闊而令人生畏的封閉通道和服務走廊網絡，面積約四平方英里，但循環結構使人以為無限。鋼質牆壁暴露在管道、管線和維修面板下。層級具有感知力並對流浪者懷有敵意：門會在人穿越時猛然關閉、蒸汽從牆壁噴出、地面產生放電、房間氧氣濃度緩慢下降。牆上的小型攝像頭會追蹤人形移動，建議偽裝人形特徵（用布單蓋住、桶罩頭等）。無人看管的屍體會被機器改造為「4M..1D505」攻擊性殭屍，用金屬碎屑手爪和電線翅膀襲擊人類。更危險的是次級機械生命體——電子部件與活人共生融合形成的改造個體。出口位於層級中心機器正下方。", "entrances": ["（頁面未明確列出具體入口方式）"], "exits": ["層級中心機器正下方地面上的一個小坡道；出口沒有固定目的地，似乎會將人送到各個不同的層級"]}, "508": {"name": "玉米迷宫", "class": "其他", "summary": "Level 508 以互動式小說形式呈現，描繪流浪者從先前層級逃出後誤入一片廣闊的玉米迷宮。白天溫暖宜人，腳踏枯稈作響，享受夏日氣氛。但在玉米蔭下休息片刻醒來後，天色已暗——夜晚的空氣乾冷而寂靜，黑暗中玉米稈沙沙作響，有東西在咔擦作響並越來越近。流浪者在「孤身一人」與「並非獨自一人」的恐懼之間掙扎，面臨是否逃跑或躲藏的抉擇。頁面結尾提出核心問題：在玉米迷宮中，唯有你獨自一人，還是你並非獨自一人？", "entrances": ["（頁面未明確列出入口方式）"], "exits": ["（頁面未明確列出出口方式）"]}, "511": {"name": "疫病之源", "class": 5, "summary": "Level 511 外觀為無盡的現代醫院走廊、房間與樓梯，不遵循常規布局。走廊組成大部分空間，陳設醫療擔架與座椅。房間包括病房、手術室、產科室、ICU、診所等，設計和色彩令人意想不到。層級存在「漸進性增生」——未生成的區域（門後漆黑虛無）會隨時間填補為新走廊和房間。最主要的災害是一股梵塔黑、如渾濁粘稠流水般的腐蝕之力，以像素化形態摧毀一切接觸物體，伴隨低沉扭曲噪音。傳播速度極快（3-5秒），對活物同樣致命。感染起源不明，但極可能非源自本層級。", "entrances": ["在 Level 11 進入任何一家醫院、診所或救護車（不常見）", "在 Level 16 地形變化中發現被埋住的醫院，在建築消失前進入其窗戶或房頂通道", "Level 109 中隨機的門會通往該層級", "在 Level 469 遇到小型單層醫療診所，進入其中", "使用 Level 571 第五層中的鐵門通常都會來到此層級"], "exits": ["在寬敞房間及招待區域發現大型玻璃幕牆及對開門或旋轉門，穿過可到 Level 11 的一家醫院", "在類似 Level 44 空曠的房間中待過久會被無縫傳送至 Level 44", "在形似 Level 88 的長廊中閒居過久會被傳送至 Level 88", "一些門上標著難以辨識的胡言亂語，隨機進入其中即可去 Level 109"]}, "512": {"name": "（无标题/生成崩溃）", "class": 1, "summary": "Level 512 以系統自動生成崩潰日誌的形式呈現，外觀為一棟標準結構的房屋，有數層樓、三間臥室和兩間廁所，家具齊全。冰箱中有無限食物和飲品，每天自動補貨。房屋外連接一條延伸至未知的公路，有植物田和花園。偶爾可見實體類型=9沿公路行走並試圖交流。整個層級充滿自動生成崩潰日誌，暗示層級生成過程因檢測到流浪者而被終止——「終止層級生成中」「實體類型=流浪者在鄰近區域」。所有外部接入點已被終止協議清除。", "entrances": ["通過進入 Level 10 中藍色的門（接入點=已終止）"], "exits": ["進入房間類型=地下室（接入點=未知）"]}, "515": {"name": "土星五号", "class": 0, "summary": "Level 515 是肯尼迪航天中心39B發射塔台的複製品，以土星五號火箭為中心。四條100米寬水泥路以塔台為中心延伸。火箭處於未發射狀態但不斷發出機械嗡嗡聲和咔噠聲，靠近時擴音器會溫和歡迎流浪者。層級分為地面、燃料艙與核心、儲藏室與居所、控制室四個區域。存在晝夜循環，夜晚星空美景著名且光污染極小。VAB（維修中心）是重要區域，高約500階15層，存有杏仁水和皇家口糧，可容納大量社區和組織。極少數情況下發射台會轉向發射區，火箭倒計時後升空，升至1000英尺後通訊中斷。", "entrances": ["從 Level 0 進入 Level 1 再前往 Level 2 找到一扇巨大的彩色的門", "在 Level 57 找哭泣小丑的畫像進入 Level 611，再找一幅畫著破舊通道的畫像", "在 Level 611 中：到 Level 444 繼續至 Level 176，找到小型土星五號模型觸碰；或到 Level 317 找到電梯按樓層樹按鈕；或到 Level 420 等待暴風雪來臨後爬山，翻過山脈跌落至 Level 515 草地"], "exits": ["每個 VAB 都配有3至6個電梯，均正常運轉"]}, "522": {"name": "后室机器人科技总部", "class": 3, "summary": "Level 522 是隱藏在後室深處的龐雜鋼鐵與機械巨構，類似摩天大樓但寬度有限而高度無限。各層面積相差數公里，布局變化無常，狹窄逼仄。幾乎每個表面都布滿科技垃圾——電纜、電路板、機械設備散落各處甚至嵌入牆體。金屬摩擦與鏽蝕刮擦聲回盪整個空間。不存在有機生命，取而代之的是迸發火花的機械裝置、搖晃的機器人和主板牆壁。整個層級由後室機器人科技（B.R.E.）管轄，外部人員的出現均需其許可。層級中遍布B.R.E.改造的前哨站，但對其領地無所有權。", "entrances": ["通過一組人工改造的電梯實體進入，其另一端連接後室機器人科技在 Level 11 的門店"], "exits": ["通過同一組電梯實體離開返回 Level 11", "層級中稀疏分佈的帶有出口標識的門會通向隨機的工業層級"]}, "532": {"name": "绝望的深渊", "class": 3, "summary": "Level 532 是一個方形小石庭院，四周被風化石牆包圍，牆向上延伸至視線盡頭，環繞一片毫無特色的天空。天空每12小時在黑白之間切換，約2分鐘內迅速褪色轉換。牆上有七個門口，上方各有符號。六個門口通向其他層級，第七個有骷髏頭符號，由金屬大門掩蔽，通向 Room 532.1。夜間有11個被稱為「影子」的無形實體飛掠，經過流浪者後會使其在數小時至數天內失去知覺。Room 532.1 內有一個獨眼人形實體（深灰色皮膚、紅色長袍、黑色金屬鏈），具有心靈攻擊能力和時間膨脹效應（室內1小時=室外5.5分鐘）。", "entrances": ["可在 Level 178.1、Level 97 和 Level 11.1 中通過一扇標有圓圈的石門進入，每扇石門通向六個門口中的一個"], "exits": ["標有星星圖案的門通向 Level 78", "標有書籍圖像的門通向 Level 117", "標有被劃掉大腦圖像的門通向 Level 112", "標有十字圖形的門通向 Level 584", "標有橙色明亮火花圖像的門通向 Level 155", "一扇沒有標記的門通向 Level 404"]}, "540": {"name": "狂野情结", "class": 4, "summary": "Level 540 是一片規模巨大的室內動物園，由中心廣場（30m×50m鋪沙小徑）進入不同展區。昆蟲屋排列玻璃幕牆，含普通昆蟲和死亡飛蛾；林地展區為人工林地生態，有樹形結構物、鞦韆和滑梯；獵犬之巢位於林地中心，大量獵犬繁衍之所，肉質藤狀結構遍布，極度危險；飼餵池是最小空間，噴泉池水含有作用於精神的化學物質，會導致暫時性焦躁飢餓和自控力消失；禮品商店是最遙遠且最安全的區域，實體回避此地，後方有「EXIT」綠門。", "entrances": ["在 Level 81 外部區域找到一座毫無特點的大型混凝土建築，透過玻璃旋轉門進入", "在 Level 182 熱帶區域走過棕櫚樹間的一塊特別空地", "穿過 Level 204 中的一小片林間空地，找到一個雜草叢生的門道"], "exits": ["穿過禮品商店後方亮有「EXIT」標牌的綠門，會來到 Level 990 的一個屋頂上"]}, "544": {"name": "辉光夺目", "class": 3, "summary": "Level 544 是一片面積不確定的森林濕地，天空被巨大的發光體（現象544-P）占據，提供光照但紫外線輻射遠高於太陽。地面由各種濕地生物群落構成——湖泊、池塘、沼澤、溫帶-熱帶森林交織。恆久夏日午後，高溫潮濕，薄霧不散。存在麻痹蜘蛛（巨大蛛網但不攻擊人類）、隱光蟻（好鬥食草群落）、腐蝕者（大量聚集在建築殘骸上）等實體，以及PA-11至PA-16等多種特有生物。偶有外來物體墜落，殘骸中包含連接其他層級的建築結構（靈線拱門、灰砼峭壁、箱涵公園等）。", "entrances": ["通過各處層間建築通道（靈線拱門、灰砼峭壁、箱涵公園、階梯懸架等）進入", "在地形轉變、棱晶煉獄、雪色常世、回聲大道、狂亂畫廊、藍室等層級中找到長滿蘆葦叢或蕨類植物圍繞的發光淡水池塘，完全浸入水中可抵達"], "exits": ["通過各處層間建築通道離開至各自目的地", "部分通道為單向或未記錄等級，不建議隨意進入"]}, "555": {"name": "失落之城", "class": "其他", "summary": "Level 555 以詩意散文形式描繪，與星星墜落的意象相關。描述流浪者離開文明跟隨星星，最終迷失在荒野中，身體被植被完全覆蓋，小昆蟲在其中築巢。蛇形實體 Ixtal（自稱首名裂頭之子）出現，提出可以偷回星星作為交換，但代價是自身生命。「飛升」過程中，人會迅速升到高空患上高空肺水腫死亡，身體以極快速度墜落地面，靈魂則飄到 Level 555 作為「來世」。層級呈現為星星墜落、流星雨般的壯觀景象。", "entrances": ["通過「飛升」過程死亡後，靈魂會抵達此處作為來世"], "exits": ["（頁面未明確列出出口方式）"]}, "557": {"name": "雪景球", "class": 0, "summary": "Level 557 是一塊白雪皚皚的小片平坦土地，面積約500米。乾砌石牆標定界線，果樹散佈其中。濃霧徹底不散，能見度不超過12米。空氣凝滯無風，大雪週期性從霧中飄落，雪花巨大如白紙，落地後融入雪層。邊界為半透明晶瑩的半球形屏障，在凹谷處最為明顯。層級正中心有一座二戰時期碉堡，風化混凝土築成，內部除積雪外別無他物，但積雪並無明顯來源。因缺乏食物和水且面積太小，不適宜居住，無任何基地或社區。", "entrances": ["在 Level 9.5、Level 57、Level 115、Level 474 或 Level 699 中找到從地面突起的圓形木墊板，坐在其上即可被傳送至 Level 557"], "exits": ["在層級邊緣切入反光的怪異半球形邊界，通常會到 Level 195、Level 365 或 Level 725"]}, "566": {"name": "工厂", "class": 0, "summary": "Level 566 位於一大片牧場中心，是一座廢棄工廠。試圖離開工廠約1英里後會發現無法更遠——永遠保持相對位置。工廠為20世紀中期美式磚造風格，有兩個煙囪。內部機器雖破舊但極具現代化，被用於製造和改造有機生命體。B.R.組織曾在此執行WMP（工人製造廠）項目，製造仿生工人APBW，但2019年7月24日爆發叛亂，7名BR成員死亡，前哨被放棄。現有80-100個APBW實體佔據工廠，對外來人員極端敵對。頁面前半部分記錄為生存難度0，後半部分更新為生存難度4。", "entrances": ["出入口在 Level 522、Level 123、Level 56、Level 150、必然之囿 的各個區域中不可預測地出現和消失，通向工廠內部不同地方"], "exits": ["通過同樣的出入口離開，返回上述對應層級"]}, "571": {"name": "撰者之殇", "class": 4, "summary": "Level 571 是約六層樓的現代風格急救中心，每隔2.5小時發生建築結構遷移，1樓（三級護理處）和3樓（急救處）不受遷移影響。偶發「黑暗遷移」使層級突變為殘破環境，出現不同實體組合。1樓有恢復活力的淺藍色飲水器；2樓有會燒傷皮膚毛髮的鏽蝕黴菌雲；3樓有鈎頭和疫疾；4樓有警告風箏、竊皮者、無面靈（黑暗遷移後為影和六臂）；5樓有悲屍（手持手術刀和枕頭），黑暗遷移後新增綻放之眼；地下室被腐臭液體淹沒，有牧蛇出沒，島嶼上有洛特卡小型群落。", "entrances": ["衝破 Level 143.3 東面的牆，會切入此層級", "在 Level 401 的清潔室櫥櫃中陷入沉睡，傳送時間未知"], "exits": ["五樓一扇異常金屬門是離開 Level 571 的唯一出口"]}, "580": {"name": "一个没有机械神的世界", "class": "其他", "summary": "Level 580 已然成為一片令人觸目驚心的墳場，奪去了將近五百人的靈魂。這是一塊坐落於波瀾不興、仿若琉璃的海水之上、覆滿青草的陸地，永無日光霧紗將遠端挾裹於朦朧中。島上有三頭肥碩愚笨的朗勃羊，漠然蔑視的凝望會施壓於人。層級最致命的特性是抑制所有電子設備——手電筒熄滅、通訊設備開機即迸出火星作廢，甚至作用於與人體直接相連的電子義體，對約85%帶有後室機器人科技植入體的人致命。僅當有人喪生時，羊群才會從岩石盤頂降臨吞噬屍體。", "entrances": ["（頁面未明確列出具體入口方式）"], "exits": ["（頁面未明確列出具體出口方式）"]}, "587": {"name": "我们昔日的欢乐之地", "class": "unknown", "summary": "Level 587 以回憶錄形式講述兩個好友在海波利亞島上的樹屋度過童年的故事。M.E.G.到來後改變了封閉社會，其中一人決定跟隨M.E.G.探索其他層級，另一人因父親病重選擇留下。兩人從此疏遠——留下的人認為自己的話束縛了朋友的夢想，離開的人則在技術部門工作。多年後父親去世，留下的人加入M.E.G.羅經點探索部，希望找到老友。他製作這個頁面是為了聯繫對方，知道頁面很快會被刪除，但仍希望老友能看到並原諒他。這是一個關於友誼、遺憾與重逢期盼的故事性頁面。", "entrances": ["（頁面未列出）"], "exits": ["（頁面未列出）"]}, "599": {"name": "群星", "class": "deadzone", "summary": "Level 599 類似球狀星團，最常見M型主序恆星（紅矮星）約佔60%，其他類型主序恆星及小行星、恆星碎片也存在。恆星不施加重力也不發熱，但中心有一顆藍色超巨星「Nadir」，是唯一有引力的天體，所有天體圍繞其橢圓軌道運行。層級可從 Level 78 的舷窗觀察，試圖打開氣閘會導致高溫輻射灌入殺死附近一切。層級發出持續無線電信號，偶爾轉變為類似音樂（如Golden Brown）甚至人類語言的信息，是否存在意識仍有爭議。頁面以Aster與Orion的敘事詩結尾，講述Aster化作恆星毀滅的悲劇。", "entrances": ["Level 78 的舷窗偶爾比平時的星星密度更大，打開氣閘後即可進入 Level 599"], "exits": ["出口還未被記錄，層級探索仍在進行中"]}, "600": {"name": "空白地帶", "class": "n/a", "summary": "Level 600 是一片虛無，由 Level 599 與 Level 601 之間的虛空構成。該層級無法進入或出入，其存在只能通過實驗被證明。所有已知的進入方式都會通往其他層級，目前沒有已知的出口。這是一個空層級，被稱作「空白地帶」。", "entrances": ["該層級無法進入。所有已知的進入方式都會通往其他層級。"], "exits": ["目前該層級沒有已知的出口。"]}, "601": {"name": "終點", "class": "unknown", "summary": "終點被認為是一個「陷阱層級」，該層級將創造離開後室的錯覺。佈局由一個看似無盡的現代圖書館組成，中心主區域飾有金屬字母拼出「終點就快到了」。進入此層級的流浪者將身處幾乎完全寂靜的環境。由於其幾何結構的不穩定性，離開此層級非常困難。被困其中可能導致偽現實區域，流浪者會經歷熟悉的環境。派對客似乎常光顧此區域。", "entrances": ["終點可通過常指示出口的門進入，最常見的是上有霓虹燈標誌的門。", "也可能藉切入進入終點，但這似乎很罕見且完全隨機。"], "exits": ["終點的偽現實有時可能包含通往其他更安全層級的出口，但並不總是這樣。", "離開終點的可靠方法尚未被發現。"]}, "602": {"name": "夷原", "class": "deadzone", "summary": "Level 602，最初名為 PA462，為一片帶有城鎮及遠處山峰之幻景、長度無限的鹽原。地面由鹽、陶土以及乳化了的魚類化石組成，柔軟且脆性。溫度保持在約 27 度左右。這裡沒有天然的食物與水源，也沒有任何可搜刮的東西。在這裡生存的嘗試毫無作用，使得該層級成為一個死區。", "entrances": ["Level 602 僅能通過 Level 688 表面岩石處的一扇活板門到達。該活板門雙向可用。"], "exits": ["通過 Level 688 的活板門返回。"]}, "603": {"name": "𩽾𩾌魚", "class": "2e", "summary": "Level 603 是一個大型景區，由山脈、山谷、平原、農牧場、森林和河流組成，遍布數十萬條電纜。電纜全部指向層級中心。跟隨電纜前進，環境逐漸變得乾旱貧瘠，最終到達一座巨型工廠。工廠會將流浪者吞噬，餵給內部的機器。這是一個引誘性質的層級，從看到第一個電塔便開始引導流浪者走向死亡。", "entrances": ["可能通過 Level 11 的老舊工廠、Level 20 的奇異門或 Level 61 的漂浮電纜塔進入。"], "exits": ["跟隨電纜到達中心工廠會被吞噬。", "理論上可前往 Level 62、80 或 113，但流浪者往往無法逃脫。"]}, "605": {"name": "流浪者的喘歇處", "class": "unknown", "summary": "Level 605 是一座小型服務站，與一條四車道高速公路相鄰。站內設有綜合商店，售賣零嘴、旅行用具和露營裝備，貨品可免費取用。有友善的員工提供協助。站外是無垠的漆黑沙漠，藏有未知威脅。這裡是流浪者漫長旅途中的短暫歇息之所。", "entrances": ["在冒險旅途中，歷經數日乃至數週穿梭各層級後，可能偶然遇見高速公路的起點。", "沿著高速公路行駛可能直接到達此站。"], "exits": ["沿高速公路續行可前往旅程下一站。", "有時離開時會直接抵達目的地層級。"]}, "607": {"name": "限制通行", "class": "deadzone", "summary": "Level 607 是一座山巒繁多且有植被生長的層級，與 Level 76 和 Level 77 接壤。這裡有一個據信由實體組織運作的大型綜合體，它們不准人類進入。邊界有狙擊手看守，任何越過受限邊界的人都會被射殺。至今已導致 7 人身亡、1 人受傷。", "entrances": ["Level 607 僅能自 Level 76 和 Level 77 處通過一扇鏽蝕中的金屬拱門抵達。"], "exits": ["無已知出口。"]}, "608": {"name": "他者趣尚之珍庫", "class": 0, "summary": "Level 608 是一個室內層級，由多座大型機車圓形車庫和機車棚組成。內部鋪設大量鐵軌，陳列著數不盡的英國火車機車和鐵路車輛，全部處於靜止狀態。這裡被改造成旅遊景點，有友善的工作人員 Blake 負責解說。橫向延展 23 英里，縱向 28 英里，周邊環繞修復車間。", "entrances": ["在 Level 26 進入隨機出現的工業風格大型車庫門。", "在 Level 248 尋找類似的門。", "在 Level 255、852、853 或 979 切出工廠內大型空房間的牆壁。"], "exits": ["踏入散發白光的開放式棚屋泊位可前往 Level 566 或 797。", "較小的發光出口通往 Level 153、284 或 699。", "帶有標識的門可通往 Level 374 和 402。"]}, "610": {"name": "（頁面重定向至 C-721）", "class": "unknown", "summary": "該頁面內容為一個不到四十平方米的黑暗房間。燈光刺眼，關燈後反而能看清黑暗中注視著你的存在。每按一次開關就會出現更多開關，最終所有牆壁都被開關佔據。這是一個關於黑暗與未知恐懼的短篇敘事。", "entrances": ["未知"], "exits": ["未知"]}, "611": {"name": "迷宮，生物，怪物", "class": "獵場", "summary": "Level 611 是一個由骯髒過道和房間組成的緊密建築網絡，類似檢修室、下水道、精神病院和醫院的混合。整個層級遍布致病排泄物和血肉，散發刺鼻有毒氣味。這裡是一個極度危險的獵場，有殘酷的 Entity 611-1 巡邏。建議流浪者避免進入。", "entrances": ["在各類室內層級（如 Level 3、566）中尋找生鏽且沾有血跡的金屬門，進入小房間後關上門即可抵達。"], "exits": ["找到發出顯眼光環的不穩定區域即可切出，通常通往類似的工業或陳舊設施層級。"]}, "612": {"name": "記憶之地中有關記憶的一段記憶", "class": 0, "summary": "Level 612 是一片永遠處於黃昏的黑色沙漠，有牧民和他們的牛群居住。天空中永遠迴盪著來自「歌女」的永恆鋼琴旋律。這是一個平靜宜居的層級，居民在此世代生活。沙漠中散布著通往其他層級的門。", "entrances": ["在 Level 67 中找到鋼琴，頂部放有黑色沙漠照片，卡入鋼琴即可到達。", "在 Level μ 外部地面上卡出會來到此處。"], "exits": ["深棕色桃花心木門通往 Level 153。", "華麗雕刻的櫻桃木门通往 Level 89。", "沙漠中還有其他半埋的門，目的地未知。"]}, "613": {"name": "無間地獄", "class": "other", "summary": "Level 613 是一片紅樹林沼澤，渾濁的水淹沒至小腿。酷熱難耐，只有蟬鳴無處不在。深入沼澤會遇到紅樹林根鬚、綠洲藍池和腐屍。這是一個充滿二元性的層級——純淨與腐敗並存，美麗與恐怖共生。流浪者需面對自然的考驗與心靈的試煉。", "entrances": ["未知"], "exits": ["未知"]}, "626": {"name": "父親之眼", "class": "habitable", "summary": "Level 626 是一個約 1832.7 平方公里的寒帶苔原島嶼，被 50 米高的未知材質牆包圍。島中央有一座 70 米高的六邊形高塔，頂部有一個灰色機械大眼，會發射原子化光線。塔內有信息存儲系統，被稱為「父親之眼」。永恆資料庫在此設有基地。島外是無盡的黑色大海。", "entrances": ["在任何有水源的層級中，偶爾出現黑色水面，跳進去會到達海灘。", "在常刮暴雪的層級中進入雪暴會到達島上平原。"], "exits": ["將自己完全沉入黑色大海 10 秒鐘。", "將自己全名寫在紙上放入機器中。"]}, "628": {"name": "島嶼", "class": "other", "summary": "Level 628 分為三大板塊：荒漠、汪洋和小島。全境覆蓋紫花沙，永夜狀態，天空有巨大明月。荒漠中有沙丘、綠洲、沙地堡壘等區域，存在多種獨特實體。汪洋中有航船、深海和亞特蘭蒂斯王國。小島是最神秘的板塊，僅有一棵樹。整個層級具有視野外物品消失的異常性質。", "entrances": ["脫水狀態下注視荒漠一角直至昏厥會出現在荒漠中心。", "從汪洋中游上岸或駕船到達荒漠邊緣。"], "exits": ["被極光蛇咬傷會在 Level 18 醒來。", "走進 629 階梯可抵達 Level 629。", "乘坐首席航船入睡後在 Level 777 醒來。", "穿過沙子中的坑洞可隨機離開。"]}, "635": {"name": "黑光群島", "class": 2, "summary": "Level 635 由 36 塊約五英里寬的浮島組成，坐落在深藍色天空盒內，上方漂浮著彩色行星和衛星。燈光類似黑光燈。分為風暴島、石英苑、悲曜島群、影廊和藤林五個群系。島上有大理石建築、神秘實體和各種建築物。唯一基地是藍寶石塔。", "entrances": ["在 Level 5 地下室或 Level 9 藍色房子壁櫥中找到嵌有蔚藍寶石環的時鐘，注視鐘面或拉動寶石環。", "在 Level 122 畫材店中找到 Level 635 的油畫並跳入。", "在 Level 48 挖掘墳墓時切入。"], "exits": ["跳入外島上的懸浮油畫會切出至油畫代表的層級。", "打破石英柱子埋入塵土會切出到 Level 48。", "掉進島嶼之間的天空盒會傳送到 Level 9。"]}, "648": {"name": "面具之城傳說", "class": 0, "summary": "Level 648 是一片多雲天空下的沙漠，中央有一個小鎮。建築永遠完好，冰箱自動補充食物。每隔幾天就有戴塑料萬聖節面具的屍體從天而降，居民會埋葬它們。當地流傳著雲端面具之城的傳說，一個壓抑個性的高等社會。這是一個平靜但充滿神秘色彩的層級。", "entrances": ["可能從 Level 372 郊區或 Level 494 到達，但方式不可靠。"], "exits": ["沙子中可能有可供一人通過的坑洞，或許通向某處。"]}, "654": {"name": "警告！帶有管道的層級（暴露！）", "class": 0, "summary": "Level 654 是一条蜿蜒的地下貨物隧道，有藍灰拼色金屬嵌板和黃線混凝土地面。移動金屬嵌板會暴露複雜管道。牆壁傳來令人不安的敲擊聲。有時地板會劇烈晃動開裂。中心有支撐梁和「央」前哨站。", "entrances": ["Level 654 的數個入口分散在 Level 11 各地，但也可能通往 Level 59。"], "exits": ["原路返回即可。"]}, "657": {"name": "小島上只生活著一輛購物車。", "class": "other", "summary": "這是一個詩歌形式的層級描述。一幅概念插畫繪製了一棵樹下倚靠著孤獨購物車的女孩。詩歌講述了一輛被遺棄在小島上的購物車的內心獨白，渴望被人使用、被帶回家。這是一個關於孤獨、遺棄和渴望存在意義的故事性層級。", "entrances": ["未知"], "exits": ["未知"]}, "665": {"name": "隔絕之路", "class": "E", "summary": "Level 665 包含一座寒冷城鎮和一條無盡道路，瑞典現代建築風格。終年積雪不化，溫度在 -15 至 -20 度之間。道路兩側會引發強烈恐懼感，離開道路的人會被 Entity 665-A——一個 7 英尺高的黑色人形生物——獵殺，它會收集受害者的眼球。一旦離開道路，死亡註定。", "entrances": ["未知"], "exits": ["未知"]}, "666": {"name": "歡迎來到地獄", "class": "unknown", "summary": "Level 666 是一個因人而異的層級，每個流浪者體驗都不同。核心要素是用流浪者最熟悉語言寫的「歡迎來到地獄」標語。層級會挖掘並放大流浪者的恐懼、脆弱和不安。分為崩毀、實體、聲效、光照和心智五個危險大類（DEALS）。一次只能有一人存在。實際生存難度通常為 4 或 5。", "entrances": ["在 Level 80 沿 66 號公路超速行駛到沙漠中，找到屋頂寫有「歡迎來到地獄」的棚屋進入。", "在 Level 105 的宗教場所背誦啟示錄第 13 章 16-18 節五遍。"], "exits": ["完成山魔王儀式並活著抵達 Level 60。", "其他通用出口理論上存在但尚未證實。"]}, "669": {"name": "非汝之礦道", "class": "unknown", "summary": "Level 669 是一個深藏地下的幽閉層級，由漫長曲折的礦井隧道和迷宮般的洞穴組成。隧道陳舊廢棄，有木柱支撐和鏽跡工具。深處岩石變為異常的板岩與基岩混合體，沒有光線。歷史上曾引發多次人類爭鬥。這個層級無法逃離——所有進入的人都未能返回。", "entrances": ["主要入口位於 Level 8 的高海拔洞穴構造中。", "次要入口位於 Level 9、10、28 的地下洞穴口。"], "exits": ["Level 669 無法逃離。任何情況下切勿進入。"]}, "678": {"name": "大墓都", "class": "deadzone", "summary": "Level 678 是約 600 英畝的墓地，遍布山丘、樹木和破舊墳墓，被鐵絲網圍欄環繞。入口旁有一座破舊教堂，天空永遠是日落景象。存在破碎雕像「娜塔莉」，以及「關機」現象——天空扭曲成靜態紋理，整個區域崩塌後會將人送往他處。一次只能有一人存在。", "entrances": ["試圖離開 Level 214 有概率進入。", "在藍色通道中進入一間教堂。", "在 Level 812 沙丘中找到隨機出現的門。"], "exits": ["被困在「關機」事件中會被引導至 Level 910。", "進入或離開教堂時有極小概率傳送至 Level 105。", "從主門離開會前往 Level 165。"]}, "683": {"name": "纏魂一居室", "class": 1, "summary": "Level 683 是一間日式風格小型公寓，分為臥室、浴室、客廳、餐廳和廚房。沒有窗戶，一片漆黑，瀰漫黴味和寒冷。有人居住過的痕跡但找不到居民。流浪者會看到人影、聽到聲音，但錄影無法證實。離開後可能數年仍受幻覺困擾。", "entrances": ["穿過 Level 13 第 68 層第三區域的任意公寓門。", "把自己關進 Level 178 的某個壁櫥。"], "exits": ["穿過進入時的門即可離開，但門會在不注意時改變位置。"]}, "684": {"name": "辦公室", "class": "unknown", "summary": "Level 684 由 200 平方米的破敗辦公室和窗外的外部世界組成。灰色地毯、白牆、窗戶、天花板燈。有正常晝夜循環，窗外可見停車場和城市天際線。每天有人形實體上下班。透過地板和天花板可聽到其他樓層的談話聲。建議進入後立即乘坐電梯離開。", "entrances": ["通過電梯切入。"], "exits": ["乘坐電梯離開。"]}, "688": {"name": "亂耳平靜", "class": 0, "summary": "Level 688 由地下隧道網絡組成，向上通往一座永恆日落時分的岩石小島。隧道潮濕陰暗，有管網和照明系統。深處有刺耳的戰爭噪音——爆炸、炮聲和喊聲，皆是幻覺。跟隨噪音向上攀登可到達地表，那裡是被海水包圍的混凝土碉堡，天空永遠是暮色。這裡沒有食物和飲用水。", "entrances": ["從 Level 125 躍石村外圍的小型洞口進入。", "爬入 Level 11 正在剝落的水泥裂隙。", "全身乏力或情緒憂鬱時在暗處睡眠可能到達。"], "exits": ["在地表海濱的黃色床上入睡會被傳送至 Level 827。"]}, "695": {"name": "朦朧支路", "class": 1, "summary": "Level 695 是多條平行車道構成的無限區域，永遠黃昏，濃霧瀰漫（由杏仁水構成）。能見度僅約 30 米。有自動駕駛的「絲光體」車輛行駛於道路上，喝過杏仁水的人可以攔截搭乘。定期降下杏仁水暴雨。有 M.E.G. 和 B.N.T.G. 的前哨站，以及名為雙徑鎮的聚居點。", "entrances": ["在多數戶外層級中切行偶爾會進入。", "走進 Level 10 或 184 的特定灌木叢。", "沿 Level 39 的土路行走。", "穿過 Level 445 特定樹木之間的空隙。", "在 Level 77 靠近丘陵與森林交界處漫遊於霧氣中。"], "exits": ["攔截絲光體進入其中，下車後抵達隨機道路層級（最常見 Level 11）。", "找到改變方向或向下傾斜的道路，進入燈火通明的隧道，可通往各種室內或戶外層級。"]}, "696": {"name": "無盡大樓", "class": 1, "summary": "Level 696 是一座淺灰色混凝土廢棄建築，樓層無限高，有無數地下室層、子層和字母層。非數字標記的樓層有異常屬性——B1 類似 Level 1，B2 類似 Level 2，A 層倒置，C 層顛倒。電梯樓層按隨機順序排列。最深可達 -3190 層，一切故障化。有一個實體在試圖創造所有後室層級的複製品。", "entrances": ["進入該層級似乎完全隨機。"], "exits": ["在層級中死亡會到達 Level 0。", "到達 -9999 層最終會來到褪色層。"]}, "699": {"name": "凝凍態", "class": "5e", "summary": "Level 699 是一片疑似無盡重複的城市片區，類似 1970 年代蘇聯西伯利亞都市。永久凍土，溫度從未高於 -2°C，常有濃霧、暴風雪。建築廢棄崩解，內部積雪。有大量人類活動痕跡——營火、塗鴉、臨時庇護所。存在霜凍病毒，會將冻疮患者的血肉緩慢轉化為冰塊。一次只能一人存在。", "entrances": ["在 Level 440 找到一扇冰製的門。", "在 Level 368 中出現的冰門。"], "exits": ["找到 420 號城市並進入帶標記的建築會傳送至 Level 420。"]}, "700": {"name": "此地风光不亦旖旎？", "class": "其他", "summary": "Level 700 是一個關於跳懸崖後無盡自由落體的層級。流浪者站在峭壁上跳下後，發現自己陷入永無止境的墜落中，而非預期的死亡解脫。眼前始終是金門大橋底部般的風景，永遠不會到達地面。層級探討自殺、絕望與無盡等待的主題，充滿存在主義式的痛苦與悔恨。", "entrances": [], "exits": []}, "703": {"name": "万象混剪", "class": "unknown", "summary": "Level 703 的物理外觀推測為一間簡單辦公室，有一張桌子和一把椅子，且有WiFi訊號可與其他層級交流。層級資料嚴重缺失，頁面本身格式錯亂，內容極為有限。", "entrances": ["飲用 Level 700 中的水可進入此層級。"], "exits": ["目前未發現出口。"]}, "705": {"name": "双岛记", "class": 3, "summary": "Level 705 由橋樑連接的兩個島嶼組成，分為「開發區」與「未開發區」。開發區是正在重建中的城市，有四季循環、基礎設施和數個基地，相對安全；未開發區則處於永夜狀態，極度寒冷，充滿瓦礫與實體（笑魇、無面靈、竊皮者、獵犬）。大橋長約10公里，平均溫度較低。開發區第1區最安全適合定居，第4區最危險。", "entrances": ["在 Level 387 和 Level 571 中發現放置建築工具的房間，停留一段時間有機率切入並在大橋上醒來。", "切入 Level 400 的金字塔可進入 Level 705。", "在 Level 714 發現被「開發」主題塗鴉覆蓋的區域，停留10分鐘後可抵達第2區。", "在 Level 22 切出後可抵達未開發區。", "在 Level 990 的「洪水」事件中切出可進入未開發區。", "在 Level 395 中發現放置建築工具的房間，停留後可切入未開發區。"], "exits": ["第3或第4區內出現的隧道可通往 Level 605。", "切入大橋可抵達 Level 901。", "第1區自然公園中的藤蔓隧道通往 Level 369 或 Level 414。", "在未開發區形狀正常的建築周圍切出可進入 Level 854。", "在瓦礫下發現下水道入口可通往 Level 688。"]}, "710": {"name": "环戒（先驱者拱门）", "class": "unknown", "summary": "Level 710 是一個懸浮在廢墟上空的銀色環狀物體，直徑超過400英尺。環戒內有四扇窗戶對應四個方向：北邊有書桌和留言簿，東邊有食物和杏仁水，南邊有床和浴室，西邊有獻祭寶箱。環戒似乎由某種未知意志操控，會對人類進行考驗與評估。下方是「先驅者拱門」廢墟，M.E.G.在此設有九人地面站。進出方式取決於環戒的意志。", "entrances": ["基於環戒的意志隨機切入。", "沿著「朝聖者之路」——在後室找到雕刻拱門和環戒圖案的浮木碎石，用右手觸碰可逐步接近。"], "exits": ["基於環戒的意志以切出方式離開。", "用左手觸碰朝聖者之路的雕刻可切出至下一個場景。"]}, "711": {"name": "堕弃列岛", "class": "4E", "summary": "Level 711 由約15,000座島嶼組成，被熱帶淺海包圍。島上有棕樹結可食用果實，海中有特殊海帶。最大威脅是風暴——每週有4天被4級颶風級別的風暴籠罩，閃電會主動攻擊流浪者。島上散落大量廢棄船隻和飛機，其中一些是「陷阱殘骸」，進入後會聽到低語、出現類人陰影，最終船體崩塌。中央島上有燈塔。", "entrances": ["在 Level 7 或 Level 97 的水下失去意識可能進入。", "從 Level 103 的碼頭墜下可能切入。", "據稱可從前厅百慕達三角區域直接切入（未經證實）。"], "exits": ["向大型島嶼洞穴深處探索可送至 Level 8。", "坐在小型單引擎飛機駕駛位有低機率抵達 Level 817。", "切入沉船中水浸木板區域可帶至 Level 180。"]}, "713": {"name": "事出他处", "class": "unknown", "summary": "Level 713 是一片面積廣大的戶外環境，佈滿廢棄道路、鐵軌、運河和零星的廢棄建築。植被叢生，所有道路終點都被植物封鎖。建築物呈現荒廢數十年的狀態，但內有許多曾有人居住的痕跡。層級中存在神秘的運動訊號，家具會自行移位，可能存在實體文明，也可能完全沒有實體。", "entrances": ["在 Level 11 進入主路旁的廢棄房屋或大公園中的建築。", "在 Level 29 中海伯利亞森林外的任何廢棄建築。", "在 Level 32 切入任何沒有懸掛骷髏的樹。", "在 Level 39 邊界處切入任何被苔蘚覆蓋的樹。"], "exits": ["進入灰色建築可通往 Level 901。", "切入盛開的櫻花樹可通往 Level 997。", "進入被木板封住的建築通向 Level 943。", "找到城市建築可通向 Level 990。"]}
