<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後室 — Backrooms</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:ital,wght@0,400;0,600;0,700;1,600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --text-primary: #e8e0d0;
    --text-dim: #9a9080;
    --accent: #c9a84c;
  }

  html, body {
    width:100%; height:100%;
    background:#0a0a08;
    color:var(--text-primary);
    font-family:'Noto Sans TC', sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
    user-select:none;
  }

  #game {
    position:relative;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
  }

  /* === BACKGROUND === */
  #bg {
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    transition: opacity 1.5s ease, filter 1.5s ease;
    z-index:0;
  }
  #bg.level0 {
    background-image:url('https://backrooms-wiki.wdfiles.com/local--files/level-0/OGLevel0.jpg');
    filter: sepia(0.25) brightness(0.6) contrast(1.1) saturate(0.85);
  }
  #bg.level1 {
    background-image:url('https://lite.imagebed.pro/artistlivesinme.jpg');
    filter: brightness(0.55) contrast(1.05) saturate(0.9);
  }

  #bg.level2 {
    background: url("https://backrooms-wiki.wdfiles.com/local--files/level-2/2first.jpg") center/cover no-repeat;
  }
  #bg.level2::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(60,45,30,0.15) 80px, rgba(60,45,30,0.15) 82px);
  }

  /* === OVERLAYS === */
  #vignette {
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.75) 100%);
    z-index:1;
    pointer-events:none;
  }
  #flicker {
    position:absolute; inset:0;
    background:rgba(255,255,220,0.03);
    z-index:2;
    pointer-events:none;
    opacity:0;
  }
  @keyframes flicker-anim {
    0%,100% { opacity:0; }
    45% { opacity:0; }
    47% { opacity:0.18; }
    48% { opacity:0; }
    50% { opacity:0.12; }
    52% { opacity:0; }
    70% { opacity:0; }
    71% { opacity:0.08; }
    72% { opacity:0; }
  }
  .flickering #flicker { animation: flicker-anim 5s infinite; }

  #grain {
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
    opacity:0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* === HUD === */
  #hud {
    position:relative;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 24px;
    background:linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%);
    flex-shrink:0;
  }
  .stat-group { display:flex; gap:18px; align-items:center; }
  .stat {
    display:flex; align-items:center; gap:6px;
    font-size:13px;
  }
  .stat-icon { font-size:14px; width:18px; text-align:center; }
  .stat-bar {
    width:72px; height:8px;
    background:rgba(0,0,0,0.5);
    border-radius:4px;
    overflow-x:hidden;
    overflow-y:auto;
    border:1px solid rgba(255,255,255,0.1);
  }
  .stat-fill {
    height:100%;
    transition:width 0.5s ease;
    border-radius:3px;
  }
  .stat-fill.hp { background:linear-gradient(90deg, #8a2222, #d44); }
  .stat-fill.sanity { background:linear-gradient(90deg, #2a5a8a, #7ab8e8); }
  .stat-fill.hunger { background:linear-gradient(90deg, #8a6a22, #d8a848); }
  .stat-fill.thirst { background:linear-gradient(90deg, #226a8a, #48a8d8); }
  .stat-val { font-size:11px; color:var(--text-dim); min-width:28px; }

  #level-badge {
    font-family:'Noto Serif TC', serif;
    font-size:14px;
    letter-spacing:3px;
    color:var(--text-dim);
    border:1px solid rgba(255,255,255,0.15);
    padding:5px 16px;
    border-radius:2px;
    background:rgba(0,0,0,0.4);
  }

  /* === CENTER CONTENT === */
  #center {
    position:relative;
    z-index:5;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
  }

  #level-title {
    font-family:'Noto Serif TC', serif;
    font-size:clamp(24px, 4vw, 40px);
    letter-spacing:6px;
    color:var(--accent);
    text-shadow:0 0 30px rgba(201,168,76,0.3), 0 2px 8px rgba(0,0,0,0.8);
    margin-bottom:8px;
    opacity:0;
    transition:opacity 1s ease;
  }
  #level-title.show { opacity:1; }

  #level-subtitle {
    font-size:14px;
    color:var(--text-dim);
    letter-spacing:3px;
    margin-bottom:40px;
    opacity:0;
    transition:opacity 1s ease 0.3s;
  }
  #level-subtitle.show { opacity:1; }

  /* === SURVIVAL DIFFICULTY (sd-class — 原版源碼移植) === */
  .sd-container {
    --hex-shape: polygon(0 25%, 50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%);
    --sd-font: "Poppins", "Noto Sans TC", sans-serif;
    --sd-font-size: 10px;
    --sd-background: 245, 240, 232;
    --sd-border: 74, 55, 40;
    --sd-text: 74, 55, 40;
    --sd-bullets: 74, 55, 40;
    --sd-symbol: 74, 55, 40;
    --sd-text-secondary: 255, 255, 255;
    --class-1: 255, 201, 14;
    --sd-symbol-1: url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjcxIiBoZWlnaHQ9IjI3NiIgdmlld0JveD0iMCAwIDI3MSAyNzYiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGNsaXAtcGF0aD0idXJsKCNjbGlwMF80MDNfMykiPgo8cGF0aCBkPSJNNzAuOTk5IDAuMDA3ODEyNUwtMC4wMDA5NzY1NjIgNDFWMTIzLjg0NEw1MC40OTkgMTUzVjEyNC4zMDdMMjMuOTg2OCAxMDlWNTdMNzAuOTk5IDI5Ljg1NzVMMTc5LjQ5OSA5Mi41VjEzMi44NUwyMDQuMzUzIDExOC41Vjc3TDcwLjk5OSAwLjAwNzgxMjVaIiBmaWxsPSIjRURFOURFIi8+CjxwYXRoIGQ9Ik02NC4zMDQ3IDIzNS4wNThMMTM1LjM1MSAyNzUuOTdMMjA3LjA0OSAyMzQuNDY5TDIwNi45ODUgMTc2LjE1NkwxODIuMTUxIDE5MC41MzFMMTgyLjE4NSAyMjEuMTQ0TDEzNy4xODEgMjQ3LjE5NEw5MC4xMzg3IDIyMC4xMDRMODkuOTk5NSA5NC44MTkxTDEyNC45MjEgNzQuNjA1NEwxMDAuMDUxIDYwLjI4MzNMNjQuMTMzNiA4MS4wNzMzTDY0LjMwNDcgMjM1LjA1OFoiIGZpbGw9IiNFREU5REUiLz4KPHBhdGggZD0iTTI3MS4xNzEgMTIzLjk4NEwyNzEuMTcxIDQyTDE5OS40MjYgMC41NzgxMDlMMTQ4LjkyNiAyOS43MzQzTDE3My43NzUgNDQuMDgwOUwyMDAuMjg3IDI4Ljc3NDFMMjQ1LjMyIDU0Ljc3NDFMMjQ1LjMyIDEwOS4wNTlMMTM2LjgyIDE3MS43MDJMMTAxLjg3NiAxNTEuNTI3TDEwMS44NzYgMTgwLjIyNkwxMzcuODE3IDIwMC45NzZMMjcxLjE3MSAxMjMuOTg0WiIgZmlsbD0iI0VERTlERSIvPgo8cGF0aCBkPSJNMTQ5IDkxVjE1MEgxMzYuMjA5VjEwMi44NEgxMzUuODU0TDEyMiAxMTEuMzFWMTAwLjI0OEwxMzYuOTc3IDkxSDE0OVoiIGZpbGw9IiNFREU5REUiLz4KPC9nPgo8ZGVmcz4KPGNsaXBQYXRoIGlkPSJjbGlwMF80MDNfMyI+CjxyZWN0IHdpZHRoPSIyNzEiIGhlaWdodD0iMjc2IiBmaWxsPSJ3aGl0ZSIvPgo8L2NsaXBQYXRoPgo8L2RlZnM+Cjwvc3ZnPgo=);

    display: block;
    padding: 2em;
    font-family: var(--sd-font);
    font-size: var(--sd-font-size);
    line-height: 1;
    opacity: 0;
    transition: opacity 1s ease 0.4s;
    margin: 8px auto 20px;
    width: 380px;
    max-width: 95vw;
    background: rgba(var(--sd-background), 0.95);
    border-radius: 2px;
  }
  .sd-container.show { opacity: 1; }

  /* Top Box */
  .sd-container .top-box {
    --sd-final-color: var(--class-1);
    --sd-final-symbol: var(--sd-symbol-1);
    display: block;
    position: relative;
    background: rgba(var(--sd-background));
    color: rgba(var(--sd-text));
    box-sizing: border-box;
    border: rgba(var(--sd-border)) 0.5em solid;
    border-left: none;
    margin-left: 2.5em;
    margin-right: 6.5em;
    padding: 0.5em 0;
    z-index: 1;
  }

  /* Left chevron layers */
  .sd-container .top-box::before {
    content: "";
    display: block;
    position: absolute;
    background: rgba(var(--sd-border));
    width: 5em;
    height: calc(100% + 1em);
    top: -0.5em;
    left: -2.5em;
    clip-path: polygon(100% 0%, 50% 50%, 100% 100%, 50% 100%, 0% 50%, 50% 0%);
    z-index: 2;
  }
  .sd-container .top-box::after {
    content: "";
    display: block;
    position: absolute;
    background: rgba(var(--sd-border));
    width: 3.25em;
    height: calc(100% + 1em);
    top: -0.5em;
    left: 0.75em;
    clip-path: polygon(100% 0%, 0.75em 50%, 100% 100%, calc(100% - 0.75em) 100%, 0% 50%, calc(100% - 0.75em) 0%);
    z-index: 2;
  }

  /* Gradient banner */
  .sd-container .top-box .gradient-box {
    background: rgba(var(--sd-final-color));
    display: flex;
    flex-direction: column;
    gap: 0.125em;
    padding: 0.125em 0 0.125em 0.5em;
    position: relative;
    z-index: 0;
    line-height: 1.15;
  }
  .sd-container .top-box .gradient-box .top-text {
    font-weight: 400;
    font-size: 1.375em;
  }
  .sd-container .top-box .gradient-box .bottom-text {
    --altered-text: "等級 ";
    font-weight: 600;
    font-size: 2em;
    font-style: italic;
  }
  .sd-container .top-box .gradient-box .bottom-text::before {
    content: var(--altered-text);
  }

  /* Right hexagon icon */
  .sd-container .top-box .header-diamond {
    position: absolute;
    clip-path: var(--hex-shape);
    width: 12.7735em;
    height: 14.75em;
    top: -1.5em;
    right: -8.5em;
    background: rgba(var(--sd-border));
    z-index: 1;
  }
  .sd-container .top-box .header-diamond::before {
    content: "";
    display: block;
    position: absolute;
    background: rgba(var(--sd-background));
    clip-path: var(--hex-shape);
    width: calc(12.7735em - (0.5em / 1.732 * 2) * 2);
    height: calc(14.75em - (0.5em / 1.732 * 2) * 2);
    top: calc(0.5em / 1.732 * 2);
    left: calc(0.5em / 1.732 * 2);
    z-index: 1;
  }
  .sd-container .top-box .header-diamond::after {
    content: "";
    display: block;
    position: absolute;
    background: rgba(var(--sd-final-color));
    clip-path: var(--hex-shape);
    width: calc(12.7735em - (0.5em / 1.732 * 2) * 4);
    height: calc(14.75em - (0.5em / 1.732 * 2) * 4);
    top: calc(0.5em / 1.732 * 4);
    left: calc(0.5em / 1.732 * 4);
    z-index: 2;
  }
  .sd-container .top-box .header-diamond .diamond-image {
    display: block;
    position: absolute;
    background-color: rgba(var(--sd-symbol));
    -webkit-mask-image: var(--sd-final-symbol);
    -webkit-mask-size: 85%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: 50% 68%;
    mask-image: var(--sd-final-symbol);
    mask-size: 85%;
    mask-repeat: no-repeat;
    mask-position: 50% 68%;
    clip-path: var(--hex-shape);
    width: calc(12.7735em - (0.5em / 1.732 * 2) * 4);
    height: calc(14.75em - (0.5em / 1.732 * 2) * 4);
    top: calc(0.5em / 1.732 * 4);
    left: calc(0.5em / 1.732 * 4);
    z-index: 3;
  }

  /* Bottom bullets */
  .sd-container .bottom-box {
    display: flex;
    flex-direction: column;
    gap: 0.75em;
    margin: 1em 0 0 2.5em;
    font-weight: 600;
    color: rgba(var(--sd-bullets));
  }
  .sd-container .bottom-box ul {
    display: contents;
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .sd-container .bottom-box ul li {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    font-size: 1.5em;
    gap: calc(var(--sd-font-size) * 0.5);
  }
  .sd-container .bottom-box ul li::before {
    content: "";
    display: block;
    flex: none;
    width: calc(var(--sd-font-size) * 1.0825);
    height: calc(var(--sd-font-size) * 1.25);
    background: rgba(var(--sd-bullets));
    clip-path: var(--hex-shape);
  }

  #nav-buttons {
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    transition:opacity 1s ease 0.6s;
  }
  #nav-buttons.show { opacity:1; }

  .nav-btn {
    background:rgba(10,10,8,0.7);
    border:1px solid rgba(255,255,255,0.2);
    color:var(--text-primary);
    padding:14px 32px;
    border-radius:3px;
    cursor:pointer;
    font-size:15px;
    font-family:inherit;
    letter-spacing:2px;
    transition:all 0.3s;
    backdrop-filter:blur(2px);
  }
  .nav-btn:hover {
    background:rgba(40,35,20,0.85);
    border-color:var(--accent);
    color:var(--accent);
  }
  .nav-btn:disabled {
    opacity:0.3;
    cursor:not-allowed;
  }
  .nav-btn:disabled:hover {
    background:rgba(10,10,8,0.7);
    border-color:rgba(255,255,255,0.2);
    color:var(--text-primary);
  }

  /* === WALK AREA === */
  #walk-area {
    margin-top: 24px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.8s ease 0.7s;
  }
  #walk-area.show { opacity: 1; }

  #walk-btn {
    background: rgba(10,10,8,0.7);
    border: 1px solid rgba(201,168,76,0.4);
    color: var(--text-primary);
    padding: 14px 48px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 3px;
    transition: all 0.3s;
    backdrop-filter: blur(2px);
  }
  #walk-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(40,35,20,0.85);
  }
  #walk-btn:active { transform: scale(0.97); }
  #walk-btn:disabled { opacity:0.5; cursor:wait; border-style:dashed; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:0.8; } }

  #walk-log {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
    font-style: italic;
    letter-spacing: 1px;
  }

  /* === ENCOUNTER PANEL === */
  #encounter-panel {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    background: rgba(8,8,6,0.9);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 4px;
    padding: 20px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  #encounter-panel.show { display: flex; }
  #encounter-img {
    max-width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 3px;
    margin-bottom: 14px;
  }
  #encounter-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  #encounter-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    text-align: center;
    margin-bottom: 16px;
  }
  #encounter-choices {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .encounter-choice {
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.4);
    color: var(--text-primary);
    padding: 10px 24px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .encounter-choice:hover {
    background: rgba(201,168,76,0.25);
    border-color: var(--accent);
  }

  /* === IMAGE VIEWER === */
  #image-viewer {
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.92);
    padding:30px;
  }
  #image-viewer.show { display:flex; }
  #image-viewer img {
    max-width:90%;
    max-height:70vh;
    object-fit:contain;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:4px;
    box-shadow:0 0 60px rgba(0,0,0,0.8);
  }
  #viewer-title {
    font-family:'Noto Serif TC', serif;
    font-size:20px;
    color:var(--accent);
    letter-spacing:3px;
    margin-bottom:12px;
    margin-top:20px;
  }
  #viewer-desc {
    font-size:14px;
    color:var(--text-dim);
    max-width:600px;
    text-align:center;
    line-height:1.8;
    margin-bottom:20px;
  }
  #viewer-close {
    position:absolute;
    top:20px; right:30px;
    background:transparent;
    border:1px solid rgba(255,255,255,0.2);
    color:var(--text-primary);
    width:40px; height:40px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.3s;
  }
  #viewer-close:hover {
    border-color:var(--danger, #d44);
    color:#d44;
  }

  /* === TITLE SCREEN === */
  #title-screen {
    position:absolute; inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(5,5,3,0.92);
    text-align:center;
  }
  #title-screen h1 {
    font-family:'Noto Serif TC', serif;
    font-size:clamp(36px,7vw,64px);
    color:var(--accent);
    letter-spacing:12px;
    margin-bottom:10px;
    text-shadow:0 0 40px rgba(201,168,76,0.25);
  }
  #title-screen .subtitle {
    font-size:16px;
    color:var(--text-dim);
    letter-spacing:6px;
    margin-bottom:50px;
  }
  #start-btn {
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
    padding:16px 56px;
    font-size:18px;
    font-family:inherit;
    letter-spacing:6px;
    cursor:pointer;
    transition:all 0.3s;
    border-radius:2px;
  }
  #start-btn:hover {
    background:var(--accent);
    color:#1a1a0a;
    box-shadow:0 0 40px rgba(201,168,76,0.35);
  }
  #title-screen .wiki-credit {
    position:absolute;
    bottom:24px;
    font-size:11px;
    color:rgba(255,255,255,0.15);
    letter-spacing:1px;
  }

  /* === TOAST === */
  #toast {
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    z-index:50;
    background:rgba(0,0,0,0.8);
    border:1px solid rgba(255,255,255,0.15);
    padding:10px 28px;
    border-radius:3px;
    font-size:14px;
    opacity:0;
    transition:opacity 0.4s;
    pointer-events:none;
    letter-spacing:1px;
  }
  #toast.show { opacity:1; }

  @media (max-width:600px) {
    #hud { padding:10px 14px; flex-wrap:wrap; gap:8px; }
    .stat-group { gap:10px; }
    .stat-bar { width:50px; }
    .nav-btn { padding:12px 22px; font-size:14px; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="bg" class="level0"></div>
  <div id="vignette"></div>
  <div id="flicker"></div>
  <div id="grain"></div>

  <div id="hud">
    <div class="stat-group">
      <div class="stat">
        <span class="stat-icon">❤</span>

// ============================================================
//  後室 — 框架（暫無劇情）
//  Level 0「教學關卡」／Level 1「宜居地帶」
// ============================================================

const state = {
  hp: 100,
  sanity: 100,
  hunger: 100,
  thirst: 100,
  level: 0,
};

// === AUDIO ===
let audioCtx = null, humOsc = null, humGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function startHum() {
  if (!audioCtx || humOsc) return;
  humOsc = audioCtx.createOscillator();
  humGain = audioCtx.createGain();
  humOsc.type = 'sine';
  humOsc.frequency.value = 60;
  humGain.gain.value = 0.035;
  humOsc.connect(humGain);
  humGain.connect(audioCtx.destination);
  humOsc.start();
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.5;
  lfoGain.gain.value = 3;
  lfo.connect(lfoGain);
  lfoGain.connect(humOsc.frequency);
  lfo.start();
}

function playTone(freq, dur, type='sine', vol=0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

// === HUD ===
function updateHUD() {
  ['hp','sanity','hunger','thirst'].forEach(s => {
    document.getElementById(s+'-bar').style.width = state[s] + '%';
    document.getElementById(s+'-val').textContent = Math.round(state[s]);
  });
}

// === LEVEL SWITCH ===
const LEVELS = {
  0: { title:'Level 0', subtitle:'教學關卡', badge:'LEVEL 0' },
  1: { title:'Level 1', subtitle:'宜居地帶', badge:'LEVEL 1' },
  2: { title:'Level 2', subtitle:'廢棄公共帶', badge:'LEVEL 2' },
};

function switchLevel(n) {
  if (n === state.level) return;
  state.level = n;
  const lv = LEVELS[n];

  // Fade out
  document.getElementById('level-title').classList.remove('show');
  document.getElementById('level-subtitle').classList.remove('show');
  document.getElementById('nav-buttons').classList.remove('show');
  document.getElementById('sd-box').classList.remove('show');
  document.getElementById('walk-area').classList.remove('show');

  setTimeout(() => {
    document.getElementById('bg').className = 'level' + n;
    document.getElementById('level-badge').textContent = lv.badge;
    document.getElementById('level-title').textContent = lv.title;
    document.getElementById('level-subtitle').textContent = lv.subtitle;
    updateSDBox(n);

    // Update button states
    document.getElementById('btn-l0').disabled = (n === 0);
    document.getElementById('btn-l1').disabled = (n === 1);
    document.getElementById('btn-l2').disabled = (n === 2);

    // Fade in
    setTimeout(() => {
      document.getElementById('level-title').classList.add('show');
      document.getElementById('level-subtitle').classList.add('show');
      document.getElementById('sd-box').classList.add('show');
      document.getElementById('nav-buttons').classList.add('show');
      showWalkArea();
    }, 300);
  }, 600);

  playTone(n === 0 ? 220 : (n === 1 ? 180 : 140), 0.4, 'sine', 0.06);
}

// === SURVIVAL DIFFICULTY ===
const SD_DATA = {
  0: { class:1, bullets:['安全','穩定','極少量實體'] },
  1: { class:1, bullets:['安全穩定','存在異常資源','極少量實體'] },
  2: { class:3, bullets:['不安全','不穩定','中量實體'] },
};

function updateSDBox(level) {
  const sd = SD_DATA[level];
  const box = document.getElementById('sd-box');
  const topBox = box.querySelector('.top-box');
  const bottomBox = box.querySelector('.bottom-box');
  // Swap class on both top-box and bottom-box
  topBox.classList.remove('class-0','class-1','class-2','class-3','class-4','class-5');
  bottomBox.classList.remove('class-0','class-1','class-2','class-3','class-4','class-5');
  topBox.classList.add('class-' + sd.class);
  bottomBox.classList.add('class-' + sd.class);
  // Update number in bottom-text (「等級 」前綴由 CSS ::before 提供)
  box.querySelector('.bottom-text').textContent = sd.class;
  // Update bullets
  document.getElementById('sd-bullets').innerHTML =
    sd.bullets.map(b => '<li>'+b+'</li>').join('');
}

function showWalkArea() {
  const locations = LOCATIONS[state.level] || [];
  const walkArea = document.getElementById('walk-area');
  if (locations.length > 0) {
    walkArea.classList.add('show');
  } else {
    walkArea.classList.remove('show');
  }
  document.getElementById('encounter-panel').classList.remove('show');
  document.getElementById('walk-log').textContent = '';
}

let walkTimer = null;
function walk() {
  const locations = LOCATIONS[state.level] || [];
  if (locations.length === 0) return;
  const btn = document.getElementById('walk-btn');
  const log = document.getElementById('walk-log');
  
  // Start auto-walking
  btn.disabled = true;
  btn.textContent = '自動行走中…';
  log.textContent = '';
  document.getElementById('encounter-panel').classList.remove('show');
  playTone(200 + Math.random() * 100, 0.15, 'sine', 0.03);
  
  // Random delay 1-10 seconds
  const delay = 500 + Math.random() * 4500;
  walkTimer = setTimeout(() => {
    btn.disabled = false;
    btn.textContent = '繼續行走';
    
    // 100% encounter - 10% portal location, 90% normal
    const portalIds = { 0:'flickering_wall', 1:'long_corridor' };
    const portalId = portalIds[state.level];
    const normalLocs = locations.filter(l => l.id !== portalId);
    let loc;
    if (normalLocs.length > 0 && Math.random() < 0.1 && portalId && locations.some(l => l.id === portalId)) {
      loc = locations.find(l => l.id === portalId);
    } else if (normalLocs.length > 0) {
      loc = normalLocs[Math.floor(Math.random() * normalLocs.length)];
    } else {
      loc = locations[Math.floor(Math.random() * locations.length)];
    }
    showEncounter(loc);
  }, delay);
}

function showEncounter(loc) {
  const imgEl = document.getElementById('encounter-img');
  if (loc.img) {
    imgEl.src = loc.img;
    imgEl.style.display = '';
  } else {
    imgEl.style.display = 'none';
  }
  document.getElementById('encounter-title').textContent = loc.name;
  document.getElementById('encounter-desc').textContent = loc.desc;
  const cc = document.getElementById('encounter-choices');
  cc.innerHTML = '';
  (loc.choices || []).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'encounter-choice';
    btn.textContent = c.text;
    btn.onclick = () => {
      document.getElementById('walk-log').textContent = c.result;
      document.getElementById('encounter-panel').classList.remove('show');
      playTone(330, 0.3, 'sine', 0.05);
      if (c.action === 'to_level1') {
        setTimeout(() => switchLevel(1), 1200);
      }
      if (c.action === 'to_level2') {
        setTimeout(() => switchLevel(2), 1200);
      }
    };
    cc.appendChild(btn);
  });
  document.getElementById('encounter-panel').classList.add('show');
  document.getElementById('walk-log').textContent = '';
  playTone(440, 0.2, 'sine', 0.04);
}

function openViewer(loc) {
  document.getElementById('viewer-img').src = loc.img;
  document.getElementById('viewer-title').textContent = loc.name;
  document.getElementById('viewer-desc').textContent = loc.desc;
  document.getElementById('image-viewer').classList.add('show');
  playTone(330, 0.3, 'sine', 0.05);
}

function closeViewer() {
  document.getElementById('image-viewer').classList.remove('show');
  document.getElementById('viewer-img').src = '';
}

// === TOAST ===
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// === START ===
function startGame() {
  initAudio();
  startHum();
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game').classList.add('flickering');

  state.level = 0;
  document.getElementById('bg').className = 'level0';
  document.getElementById('level-badge').textContent = 'LEVEL 0';
  document.getElementById('level-title').textContent = 'Level 0';
  document.getElementById('level-subtitle').textContent = '教學關卡';
  document.getElementById('btn-l0').disabled = true;
  document.getElementById('btn-l1').disabled = false;
  updateSDBox(0);

  updateHUD();

  setTimeout(() => {
    document.getElementById('level-title').classList.add('show');
    document.getElementById('level-subtitle').classList.add('show');
    document.getElementById('sd-box').classList.add('show');
    document.getElementById('nav-buttons').classList.add('show');
    showWalkArea();
  }, 400);
}

// === EVENTS ===
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('btn-l0').addEventListener('click', () => switchLevel(0));
document.getElementById('btn-l1').addEventListener('click', () => switchLevel(1));
document.getElementById('btn-l2').addEventListener('click', () => switchLevel(2));
document.getElementById('walk-btn').addEventListener('click', walk);
document.getElementById('viewer-close').addEventListener('click', closeViewer);
document.getElementById('image-viewer').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeViewer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeViewer();
});

updateHUD();
</script>
</body>
</html>
